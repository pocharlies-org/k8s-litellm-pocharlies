name: Release Production

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional explicit image tag, for example v1.2.3
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-prod-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci:
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-ci.yml@main
    with:
      runner: arc-k8s
      run_node: false
      run_docker_build: false
      kustomize_paths: ". k8s"
    secrets: inherit

  contract-tests:
    name: LiteLLM 1.85.1 contract tests
    runs-on: arc-k8s
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned proxy test dependencies
        run: python -m pip install --requirement requirements-test.txt
      - name: Run controller, fallback, context and HA contracts
        run: python -m pytest -q

  release:
    needs: [ci, contract-tests]
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-manifest-release.yml@main
    with:
      runner: arc-k8s
      source_path: k8s
      artifact_name: k8s-litellm-pocharlies
      version: ${{ github.event.inputs.image_tag || github.ref_name }}
    secrets: inherit
