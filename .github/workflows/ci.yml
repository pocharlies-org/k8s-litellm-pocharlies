name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-ci.yml@main
    with:
      runner: arc-k8s
      run_node: false
      run_docker_build: false
      kustomize_paths: ". k8s"
    secrets: inherit

  # 2026-08-10: este job corria UN solo fichero de tests (el contrato de red, que es
  # unittest puro y solo necesitaba PyYAML). Todo lo que usa fixtures de pytest
  # quedaba fuera, o sea todos los demas contratos. Resultado: tres contratos rojos
  # desde el corte a DeepSeek sin que nadie se enterara, incluido uno que asertaba
  # que habia 4 backends cuando ya habia 5. Ahora corre la suite entera.
  litellm-contracts:
    name: LiteLLM contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Require x86_64 runner
        run: test "$(uname -m)" = "x86_64"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r .github/requirements/litellm-contracts.txt
      - name: Run the whole contract suite
        run: python -m pytest tests/ -q
