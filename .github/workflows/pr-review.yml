# PRUEBA INFRA-332 (piloto F1 de INFRA-298) · NO MERGEAR: apunta a la rama del workflow v2
# (pocharlies-org/k8s-gitops-pocharlies#457) con engine pr-agent. Se cierra al medir.
name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  review:
    # Los mismos permisos que la plantilla de los 108 repos: el piloto mide que
    # `pull-requests: write` basta (comentarios, inline y etiquetas).
    permissions:
      contents: read
      pull-requests: write
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-pr-review.yml@INFRA-332-reusable-pr-review-v2
    with:
      engine: pr-agent
    # Criterio 6: key invalida -> 401 de LiteLLM -> el run debe cerrar failure.
    secrets:
      PR_AGENT_LITELLM_KEY: sk-prueba-invalida-infra-332
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
