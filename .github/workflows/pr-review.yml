# PRUEBA INFRA-332 (piloto F1 de INFRA-298) · NO MERGEAR: apunta a la rama del workflow v2
# (pocharlies-org/k8s-gitops-pocharlies#457) con engine pr-agent. Se cierra al medir.
name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  review:
    # Los mismos permisos que la plantilla de los 108 repos: el piloto mide que
    # `pull-requests: write` basta (comentarios, inline y etiquetas).
    permissions:
      contents: read
      pull-requests: write
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-pr-review.yml@INFRA-332-inline-suggestions
    with:
      engine: pr-agent
    secrets: inherit
