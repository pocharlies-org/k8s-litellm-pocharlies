# Vigilante de LiteLLM. Avisa por Telegram al privado del humano cuando deja de
# servir, y avisa TAMBIEN cuando se recupera.
#
# POR QUE EXISTE (2026-08-14)
# ---------------------------
# LiteLLM se cayo dos veces esta tarde (OOMKilled, exit 137, limite de 3Gi) y NADIE
# aviso: se entero el humano por su cuenta. Y LiteLLM no es un servicio mas — por el
# pasan Codex, OpenClaw, el brain, el panel y los MCP. Si muere de madrugada, muere
# todo lo que habla con un modelo.
#
# La cadena de aquel día fue una salida externa inestable, reintentos acumulados
# y dos OOMKilled. Esa salida ya está retirada; el watchdog sigue siendo necesario
# para detectar fallos propios de LiteLLM y de los backends locales.
#
# NO se avisa por el webhook de synapse. Comprobado el mismo dia:
# https://synapse.e-dani.com/webhooks/brain-audit devuelve 404, y su propio contrato
# (webhook.brain_audit.received) dice "NO workflow triggers on it today". O sea que
# ningun aviso mandado por ahi ha llegado NUNCA — tampoco los del audit diario del
# brain, que sigue apuntando alli. Telegram directo al bot es lo unico demostrado.
#
# QUE COMPRUEBA, Y POR QUE ASI
# ----------------------------
# Una INFERENCIA REAL, no /health. En esta casa hay precedentes de sobra de
# servicios con el semaforo en verde y la funcion rota: el pool bge con cero
# endpoints y el brain devolviendo 200 sin fuentes, o el propio LiteLLM sirviendo
# 16 modelos mientras su ConfigMap declaraba 27. Un /health que solo dice que el
# proceso esta vivo no distingue "sirve" de "esta ahi".
#
# Se pide una suma y se comprueba el RESULTADO. Una respuesta vacia con HTTP 200 es
# un fallo, no un exito, y esto lo trata como tal.
#
# LA MEMORIA VA EN UN CONFIGMAP (2026-08-15)
# ------------------------------------------
# La primera version guardaba el estado previo en /tmp, dentro del pod del Job, que
# muere en cada corrida. O sea que `antes` valia SIEMPRE None y la rama verde, que
# exige `antes is True`, no se ejecuto nunca: el aviso de RECUPERADO estaba escrito
# y era inalcanzable. Se vio el 15-08, con el rojo repitiendose cada 10 min.
# Ahora el estado vive en el ConfigMap litellm-watchdog-estado, que el propio Job
# crea la primera vez. NO se versiona aqui a proposito: la app tiene selfHeal, y un
# objeto en git cuyo contenido cambia cada 10 min seria drift permanente.
#
# CUOTA AGOTADA NO ES "CAIDO"
# ---------------------------
# El 15-08 el aviso decia CAIDO y LiteLLM estaba perfectamente: 4 pods 2/2 y 46
# modelos en el catalogo. Lo agotado era el limite semanal del plan de arriba, que
# responde 429 usage_limit_reached con el `resets_at` dentro. Son dos incidentes
# distintos: uno se arregla en el cluster y el otro solo se espera. El upstream ya
# dice cuando vuelve — decirlo tambien es gratis.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-watchdog
  namespace: litellm
  labels: { app: litellm-watchdog }
spec:
  # Cada 10 min. Es el compromiso entre enterarse pronto y no hacer ruido: peor caso
  # 10 min de caida sin avisar, y 6 comprobaciones/hora que le cuestan a LiteLLM una
  # inferencia de 20 tokens.
  schedule: "*/10 * * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      # 3600, no 86400. ArgoCD agrega los Jobs hijos de un CronJob a la salud de
      # la Application, asi que un Job fallido deja la app —y la tarjeta— en
      # Degraded mientras el objeto exista. Con 24 h, un corte de inferencia de
      # VEINTE MINUTOS pintaba LiteLLM en rojo durante todo el dia siguiente,
      # mucho despues de haberse recuperado.
      #
      # Paso el 21-08-2026 a las 22:06 UTC: el cluster cambio a perfil `creative`
      # y qwen38-27b (quien sirve `tooling` ahi) tardo 21 min en escalar; el
      # watchdog fallo dos veces, aviso por Telegram —que es el canal de verdad—
      # y a las 22:45 ya volvia a dar `ok`. La app seguia Degraded.
      #
      # 1 h deja evidencia suficiente para mirar el fallo y no miente el resto
      # del dia. Mismo valor y misma razon que los crons del brain.
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: { app: litellm-watchdog }
        spec:
          # 2026-08-21: todo litellm corre EXCLUSIVAMENTE en `ubuntu` (el x86 de la
          # RTX). Estos Jobs no tenian restriccion y caian en cualquier ks5. Aqui no se
          # pierde HA: son tareas puntuales, no servicio. Se tolera el taint blando
          # pool=dev:PreferNoSchedule del nodo para no penalizarlo en la puntuacion.
          tolerations:
            - { key: pool, operator: Equal, value: dev, effect: PreferNoSchedule }
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [ubuntu]
          restartPolicy: Never
          serviceAccountName: litellm-watchdog
          containers:
            - name: watchdog
              image: python:3.12-slim
              command:
                - python3
                - -I
                - -c
                - |
                  import json, os, ssl, sys, time, urllib.error, urllib.parse, urllib.request

                  BASE = "http://litellm.litellm.svc.cluster.local:4000"
                  KEY = os.environ.get("LITELLM_MASTER_KEY", "")
                  # L1: el Service de POOL del residente (llm), no LiteLLM. Ver el
                  # comentario de capas arriba: el catalogo de LiteLLM sale aunque el
                  # residente este a 0 replicas; aqui solo contesta quien sirve.
                  RESIDENTE = "http://tooling.llm.svc.cluster.local:8000"

                  # --- memoria entre corridas: un ConfigMap del namespace ------------
                  SA = "/var/run/secrets/kubernetes.io/serviceaccount"
                  NS = open(SA + "/namespace").read().strip()
                  CM = "litellm-watchdog-estado"
                  RUTA = "/api/v1/namespaces/%s/configmaps" % NS
                  CTX = ssl.create_default_context(cafile=SA + "/ca.crt")

                  def k8s(metodo, path, cuerpo=None, tipo="application/json"):
                      tok = open(SA + "/token").read().strip()
                      d = json.dumps(cuerpo).encode() if cuerpo is not None else None
                      r = urllib.request.Request(
                          "https://kubernetes.default.svc" + path, data=d,
                          method=metodo,
                          headers={"authorization": "Bearer " + tok,
                                   "content-type": tipo, "accept": "application/json"})
                      with urllib.request.urlopen(r, timeout=15, context=CTX) as resp:
                          return json.loads(resp.read())

                  def lee_estado():
                      try:
                          d = k8s("GET", RUTA + "/" + CM)
                          return json.loads(d.get("data", {}).get("estado", "{}"))
                      except urllib.error.HTTPError as exc:
                          if exc.code != 404:
                              print("[litellm-watchdog] leer estado:", exc.code)
                          return {}
                      except Exception as exc:
                          print("[litellm-watchdog] leer estado:", str(exc)[:110])
                          return {}

                  def guarda_estado(e):
                      cuerpo = {"data": {"estado": json.dumps(e)}}
                      try:
                          k8s("PATCH", RUTA + "/" + CM, cuerpo,
                              "application/merge-patch+json")
                          return
                      except urllib.error.HTTPError as exc:
                          if exc.code != 404:
                              print("[litellm-watchdog] guardar estado:", exc.code)
                              return
                      except Exception as exc:
                          print("[litellm-watchdog] guardar estado:", str(exc)[:110])
                          return
                      # No existia: lo crea. Sin tracking-id de Argo a proposito —
                      # es estado vivo, no un objeto declarado en git.
                      try:
                          k8s("POST", RUTA, {"metadata": {"name": CM, "namespace": NS,
                                                          "labels": {"app": "litellm-watchdog"}},
                                             "data": {"estado": json.dumps(e)}})
                      except Exception as exc:
                          print("[litellm-watchdog] crear estado:", str(exc)[:110])

                  # --- comprobaciones ------------------------------------------------
                  def pide(path, payload=None, timeout=45, base=BASE, auth=True):
                      d = json.dumps(payload).encode() if payload else None
                      cabecera = {"content-type": "application/json"}
                      if auth:
                          cabecera["authorization"] = "Bearer " + KEY
                      r = urllib.request.Request(base + path, data=d, headers=cabecera)
                      t = time.time()
                      with urllib.request.urlopen(r, timeout=timeout) as resp:
                          return json.loads(resp.read()), (time.time() - t) * 1000

                  def cuerpo_error(exc):
                      try:
                          return exc.read().decode("utf-8", "replace")
                      except Exception:
                          return ""

                  # EL CONTRATO DE SALIDA. `caido` es la unica clase que pone el Job
                  # en Failed. Todo lo que termina el script pasa por aqui, SIEMPRE:
                  # ver el bloque "salida" al final del fichero para el bug que esto
                  # cierra (Job Failed con clase caido y el proceso saliendo con 0).
                  #
                  # `SALIDA` es la UNICA fuente del exit code. `SIN_CLASE` es el valor
                  # con el que termina el script si muere antes de poder clasificar:
                  # vale 1 a proposito, porque un watchdog que no sabe decir que pasa
                  # no puede decir que todo va bien. Si alguien anade un final corto,
                  # sale con SALIDA — nunca con un literal.
                  SALIDA = 0
                  SIN_CLASE = 1
                  try:
                      fallos = []
                      modelos = None
                      latencia = None
                      vuelve = None      # epoch de reset si el upstream lo dice
                      capa = "L0"        # donde se rompio, para el aviso

                      # ── L0. ¿Vive el proxy? 0 tokens ────────────────────────────────
                      # /health/liveliness: 200 mientras el bucle del servidor esta vivo,
                      # sin tocar el LLM ni postgres. ES LA UNICA CONDENATORIA de esta
                      # capa. /health/readiness NO condena: hace un round-trip de DB y
                      # el proxy sirve con postgres caido a proposito
                      # (allow_requests_on_db_unavailable); pintarlo de rojo fue justo el
                      # error del 20-07, cuando readiness dejo a LiteLLM fuera del
                      # Service 9 h con la inferencia intacta. Aqui se lee y se reporta
                      # en el log, pero un fallo suyo es informativo.
                      listo = ""
                      try:
                          r = urllib.request.Request(BASE + "/health/readiness")
                          with urllib.request.urlopen(r, timeout=10) as resp:
                              listo = str(json.loads(resp.read()).get("db", ""))[:24]
                      except Exception as exc:
                          listo = "readiness-fallida"
                      try:
                          r = urllib.request.Request(BASE + "/health/liveliness")
                          with urllib.request.urlopen(r, timeout=10) as resp:
                              # 200 con "I'm alive!"; NO se parsea como JSON: la respuesta
                              # real es una cadena JSON, no un objeto.
                              resp.read()
                      except Exception as exc:
                          capa = "L0 liveliness"
                          fallos.append("liveliness: %s" % str(exc)[:110])

                      # ── L1. ¿El residente tooling contesta? 0 tokens ───────────────
                      # Directo al Service del residente. El 503 "tooling profile target
                      # is unavailable" del incidente que abrio STA-7 moraba aqui: era
                      # enrutado, no inferencia, y se ve sin gastar un token.
                      if not fallos:
                          capa = "L1 residente"
                          try:
                              d, _ = pide("/v1/models", timeout=15,
                                          base=RESIDENTE, auth=False)
                              modelos = len(d.get("data", []))
                              if modelos == 0:
                                  fallos.append("residente tooling publica CERO modelos")
                          except urllib.error.HTTPError as exc:
                              # El cuerpo dice el porque (503 sin endpoints, 401,
                              # ...) y `str(exc)` no lo lleva: mismo criterio que en
                              # L2. Un "HTTP Error 503" a secas no dice si el
                              # residente no existe o si lo estamos bloqueando
                              # nosotros.
                              fallos.append("residente tooling /v1/models: HTTP %d %s"
                                            % (exc.code, cuerpo_error(exc)[:90]))
                          except Exception as exc:
                              fallos.append("residente tooling /v1/models: %s"
                                            % str(exc)[:110])

                      # ── L2. La UNICA comprobacion que gasta tokens ─────────────────
                      # Solo si L0 y L1 estan verdes. max_tokens generoso a proposito:
                      # con un modelo de razonamiento, un limite corto se lo come el
                      # pensamiento y devuelve content vacio con HTTP 200. Eso paso de
                      # verdad y parecia un fallo del servidor cuando era del test — y
                      # es EXACTAMENTE lo que el health-check de fondo de LiteLLM sigue
                      # haciendo con su max_tokens de 16 (por eso los residentes locales
                      # llevan disable_background_health_check en el config, STA-9).
                      if not fallos:
                          capa = "L2 inferencia"
                          try:
                              d, latencia = pide("/v1/chat/completions", {
                                  "model": "tooling",
                                  "messages": [{"role": "user",
                                                "content": "Responde SOLO el numero: 17*23"}],
                                  "max_tokens": 400,
                              }, timeout=120)
                              txt = (d["choices"][0]["message"].get("content") or "").strip()
                              if not txt:
                                  fallos.append("inferencia: HTTP 200 con contenido VACIO")
                              elif "391" not in txt:
                                  fallos.append("inferencia: respuesta incorrecta %r"
                                                % txt[:40])
                          except urllib.error.HTTPError as exc:
                              # El cuerpo del 429 trae el motivo y el reset; sin leerlo,
                              # "Too Many Requests" no distingue cuota agotada de
                              # rate-limit por rafaga.
                              crudo = cuerpo_error(exc)
                              if exc.code == 429 and "usage_limit_reached" in crudo:
                                  for trozo in crudo.split("resets_at"):
                                      digitos = "".join(
                                          c for c in trozo[:24] if c.isdigit())
                                      if len(digitos) >= 10:
                                          vuelve = int(digitos[:10])
                                          break
                                  fallos.append("cuota del plan agotada (429 "
                                                "usage_limit_reached)")
                              else:
                                  fallos.append("inferencia: HTTP %d %s"
                                                % (exc.code, crudo[:90]))
                          except Exception as exc:
                              fallos.append("inferencia: %s" % str(exc)[:110])

                      # 3. El DIAL GLOBAL de abliteracion. Anadido 19-08 tras una auditoria.
                      #
                      # POR QUE ESTA AQUI Y NO EN UNA NETPOL. `/admin/refusal_lambda` cambia
                      # el comportamiento del modelo en caliente, NO tiene autenticacion, y
                      # las NetworkPolicies de este cluster NO se aplican: se comprobo el
                      # 19-08 contra cuatro namespaces con `default-deny-ingress` y los
                      # cuatro conectaban. O sea que cualquier pod puede moverlo y no hay
                      # nada que lo impida. Si no se puede PREVENIR, al menos se DETECTA.
                      #
                      # Paso de verdad: el dial quedo en 2.5 durante horas afectando a TODO
                      # el trafico. Lo unico que lo devolvio a 0 fue un reinicio del pod
                      # (VLLM_REFUSAL_LAMBDA_INIT=0.0), o sea suerte estructural.
                      #
                      # Un head que NO contesta aqui NO es un fallo: los dos perfiles de
                      # computo son exclusivos, asi que uno de los dos backends esta siempre
                      # a 0 replicas. Solo se reporta un lambda LEIDO y distinto de 0.
                      DIALES = {
                          "deepseek-v4-flash-0731":
                              "http://deepseek-v4-flash-0731.llm.svc.cluster.local:8000",
                          "qwen38-27b":
                              "http://vllm-qwen38-27b-uncensored.llm.svc.cluster.local:8000",
                      }
                      dial_alto = []
                      dial_leido = {}
                      for nombre, base in DIALES.items():
                          try:
                              r = urllib.request.Request(base + "/admin/refusal_lambda")
                              with urllib.request.urlopen(r, timeout=8) as resp:
                                  lam = json.loads(resp.read()).get("lambda")
                          except Exception:
                              continue          # residente del otro perfil: normal
                          if lam is None:
                              continue
                          dial_leido[nombre] = lam
                          if abs(float(lam)) > 1e-9:
                              dial_alto.append("%s sirve con lambda=%s (abliteracion GLOBAL "
                                               "activa para todo el trafico)" % (nombre, lam))

                      # --- clase del incidente -------------------------------------------
                      # "cuota" no es "caido": el cluster esta bien y no hay nada que tocar,
                      # solo esperar. Mezclarlos fue el error del aviso del 15-08.
                      #
                      # "abliterado" tampoco es "caido": sirve perfectamente, y eso es justo
                      # el problema — no se nota. Va DESPUES de caido/cuota porque si no
                      # sirve, el dial es lo de menos.
                      if fallos:
                          clase = ("cuota" if (vuelve or any("cuota del plan" in f for f in fallos))
                                   else "caido")
                      elif dial_alto:
                          clase = "abliterado"
                      else:
                          clase = "ok"

                      ahora = int(time.time())
                      antes = lee_estado()
                      clase_antes = antes.get("clase")
                      ultimo = antes.get("ultimo_aviso", 0)

                      print("[litellm-watchdog]", json.dumps(
                          {"clase": clase, "antes": clase_antes, "capa": capa,
                           "modelos": modelos, "listo": listo,
                           "latencia_ms": round(latencia or 0), "fallos": fallos,
                           "vuelve": vuelve, "dial": dial_leido}))

                      # Se avisa al CAMBIAR de clase. Si sigue caido, se insiste cada hora
                      # (no cada 10 min: 6 mensajes/hora de lo mismo se ignoran solos). Si
                      # es cuota, ni se insiste — ya sabes la hora a la que vuelve.
                      RECORDAR = 3600
                      if clase == clase_antes:
                          # `abliterado` insiste como `caido`: el fallo de este aviso es
                          # precisamente que pasen horas sin que nadie se entere, y a
                          # diferencia de la cuota aqui no hay una hora de reset que
                          # esperar — hay algo que alguien tiene que devolver a 0.
                          avisar = clase in ("caido", "abliterado") and (ahora - ultimo) >= RECORDAR
                      else:
                          avisar = clase != "ok" or clase_antes in ("caido", "cuota", "abliterado")

                      # Solo "caido" hace fallar el Job. Con la cuota agotada el Job
                      # correría a rojo cada 10 min durante dias y dejaria la Application
                      # de Argo en Degraded — justo mientras el aviso dice que el cluster
                      # esta bien, y tapando un Degraded de verdad. El aviso es la señal.
                      # `abliterado` NO hace fallar el Job: LiteLLM sirve, y dejar la
                      # Application en Degraded cada 10 min taparia un Degraded de verdad.
                      # Mismo razonamiento que con la cuota. El aviso es la señal.
                      SALIDA = 1 if clase == "caido" else 0
                      desde = antes.get("desde", ahora) if clase == clase_antes else ahora

                      def apunta(enviado):
                          # ultimo_aviso solo se mueve si el mensaje SALIO. Si Telegram
                          # falla, la proxima corrida vuelve a intentarlo en vez de dar
                          # el aviso por dado.
                          guarda_estado({"clase": clase, "desde": desde,
                                         "ultimo_aviso": ahora if enviado else ultimo,
                                         "vuelve": vuelve})

                      if not avisar:
                          apunta(False)
                          raise SystemExit(SALIDA)

                      if clase == "caido":
                          titulo = "\U0001F534 <b>LiteLLM CAIDO</b>"
                          intro = "No esta sirviendo."
                          cuerpo = ["· " + f for f in fallos]
                          quehacer = ("Lo usa TODO: Codex, OpenClaw, el brain, el panel.\n"
                                      "Mira <code>kubectl get pods -n litellm</code>.\n"
                                      "Si pone OOMKilled, el limite esta en el manifiesto.\n"
                                      "Si un pod reinicia en bucle, mira SUS logs antes de\n"
                                      "culpar a nadie — el aviso no sabe quien es.")
                      elif clase == "cuota":
                          cuando = (time.strftime("%a %d-%m a las %H:%M",
                                                  time.localtime(vuelve))
                                    if vuelve else "sin fecha en la respuesta")
                          titulo = "\U0001F7E0 <b>LiteLLM SIN CUOTA</b>"
                          intro = "El cluster esta bien; el plan de arriba agoto el limite."
                          cuerpo = ["· %d modelos publicados, el catalogo sirve" % (modelos or 0),
                                    "· la inferencia da 429 usage_limit_reached",
                                    "· vuelve: <b>%s</b>" % cuando]
                          quehacer = ("Nada en el cluster. No hay fallback local desde el\n"
                                      "10-08, asi que ningun alias contesta hasta el reset.")
                      elif clase == "abliterado":
                          titulo = "\U0001F7E1 <b>LiteLLM SIN CENSURA (dial global)</b>"
                          intro = ("Sirve bien, y por eso no se nota: el dial de abliteracion "
                                   "esta activo para TODO el trafico, no solo para los alias "
                                   "-uncensored.")
                          cuerpo = ["· " + d for d in dial_alto] + [
                              "· %d modelos · inferencia en %d ms" % (
                                  modelos or 0, round(latencia or 0))]
                          quehacer = ("Devuelvelo a 0 si no lo pusiste tu:\n"
                                      "<code>POST /admin/refusal_lambda {\"lambda\": 0}</code>\n"
                                      "contra el head del residente vivo.\n"
                                      "Un reinicio del pod tambien lo devuelve a 0\n"
                                      "(VLLM_REFUSAL_LAMBDA_INIT=0.0), pero eso es suerte,\n"
                                      "no un control.\n"
                                      "Para pedir SIN censura por peticion existe el alias\n"
                                      "<code>tooling-uncensored</code>, que no toca a nadie mas.\n"
                                      "OJO con lambda>1: no libera mas, EMPUJA el estado\n"
                                      "fuera de donde el modelo aprendio.")
                      else:
                          titulo = "\U0001F7E2 <b>LiteLLM RECUPERADO</b>"
                          intro = "Vuelve a servir."
                          cuerpo = ["· %d modelos · inferencia en %d ms" % (
                              modelos or 0, round(latencia or 0))]
                          quehacer = "Nada. El aviso anterior queda desmentido."

                      texto = "\n".join([titulo, "", intro, ""] + cuerpo +
                                        ["", "<b>Qué hacer</b>", quehacer])
                      tok = os.environ.get("TELEGRAM_BOT_TOKEN", "")
                      chat = os.environ.get("TELEGRAM_CHAT_ID", "")
                      if not tok or not chat:
                          print("[litellm-watchdog] sin token/chat: no puedo avisar")
                          apunta(False)
                          raise SystemExit(SALIDA)
                      enviado = False
                      try:
                          body = urllib.parse.urlencode({
                              "chat_id": chat, "parse_mode": "HTML",
                              "disable_web_page_preview": "true", "text": texto}).encode()
                          req = urllib.request.Request(
                              "https://api.telegram.org/bot%s/sendMessage" % tok,
                              data=body, method="POST")
                          with urllib.request.urlopen(req, timeout=20) as r:
                              enviado = bool(json.loads(r.read()).get("ok"))
                              print("[litellm-watchdog] telegram:", enviado)
                      except Exception as exc:
                          print("[litellm-watchdog] telegram fallo:", str(exc)[:150])
                      apunta(enviado)
                  # ── SALIDA: el unico final del script, para TODAS las ramas ──────
                  #
                  # EL BUG QUE CIERRA ESTE BLOQUE (STA-9, 02-09-2026). Antes, el
                  # `raise SystemExit(SALIDA)` del final estaba DENTRO de la rama de
                  # aviso: con `not avisar` salia por el suyo, y cualquier excepcion
                  # del propio script (el k8s API caido, una KeyError, el Telegram
                  # roto) se iba por la pila por defecto — exit 1 por accidente, sin
                  # escribir el estado, y con `activeDeadlineSeconds: 300` superado
                  # como en el Job litellm-watchdog-29805960 (Failed, 53 min). El
                  # exit code del Job no era el de la clase: era lo que tocara.
                  # Ahora:
                  #   - excepcion no prevista -> exit 1 y ADEMAS se intenta escribir
                  #     el estado, porque un watchdog que muere sin avisar es peor
                  #     que uno que miente;
                  #   - `SystemExit` sale con SALIDA, que vale 1 solo si la clase es
                  #     `caido`.
                  # El Job solo falla si LiteLLM esta CAIDO, para que quede en los
                  # Jobs fallidos del namespace aunque Telegram no llegue.
                  except SystemExit:
                      raise
                  except BaseException as exc:
                      print("[litellm-watchdog] ERROR del propio watchdog: %r" % exc)
                      try:
                          guarda_estado({"clase": "error-watchdog",
                                         "desde": int(time.time()),
                                         "ultimo_aviso": 0, "vuelve": None})
                      except Exception as exc2:
                          print("[litellm-watchdog] ni el estado pude escribir: %r"
                                % exc2)
                      raise SystemExit(SIN_CLASE)
                  raise SystemExit(SALIDA)
              env:
                - name: LITELLM_MASTER_KEY
                  valueFrom:
                    secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY }
                # Chat PRIVADO con @paxanguero. Los ids negativos son grupos; este es
                # positivo porque es una persona. Mismo destino que el vigilante del
                # re-embebido del brain.
                - name: TELEGRAM_CHAT_ID
                  value: "33285833"
                # La imagen es UTC. Sin esto, "vuelve el jueves a las 03:30" seria
                # dos horas antes de la verdad y el humano miraria cuando no toca.
                - name: TZ
                  value: Europe/Madrid
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef: { name: litellm-watchdog-telegram, key: bot_token }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
---
# Permiso minimo para la memoria del vigilante. `create` no admite resourceNames
# (el objeto aun no existe cuando se pide), asi que ese verbo si es de namespace;
# get y patch van clavados al unico ConfigMap que toca. Nada mas: ni secretos, ni
# pods, ni el resto del namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-watchdog
  namespace: litellm
  labels: { app: litellm-watchdog }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-watchdog-estado
  namespace: litellm
  labels: { app: litellm-watchdog }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["litellm-watchdog-estado"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-watchdog-estado
  namespace: litellm
  labels: { app: litellm-watchdog }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-watchdog-estado
subjects:
  - kind: ServiceAccount
    name: litellm-watchdog
    namespace: litellm
---
# Token de @oppocharliesllmbot, el bot con el que el humano habla en privado.
# Se lee de Vault, del mismo sitio del que lo saca el telegram-router de
# openclaw-qwen36, para que rote a la vez que el original.
#
# OJO: ese bot tiene un WEBHOOK activo (el router). No llamar a getUpdates ni a
# deleteWebhook contra el o se queda el router de OpenClaw sin recibir nada.
# sendMessage no le molesta.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-watchdog-telegram
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: litellm-watchdog-telegram
  data:
    - secretKey: bot_token
      remoteRef:
        key: openclaw-qwen36/social
        property: TELEGRAM_BOT_TOKEN
