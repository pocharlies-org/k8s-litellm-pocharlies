---
# Puente OpenAI-compatible sobre la suscripción ChatGPT (Codex OAuth).
#
# POR QUÉ EXISTE
#
# La cuenta ChatGPT Pro del usuario puede servir modelos GPT-5.6 por el mismo endpoint
# que usa el CLI de Codex (chatgpt.com/backend-api/codex/responses), sin API key
# de pago por token. Ese endpoint NO habla el dialecto OpenAI clásico: exige el
# Responses API con streaming obligatorio y cabeceras propias. Este puente hace
# la traducción para que LiteLLM lo consuma como un backend `openai/` normal, y
# así cualquier cliente del gateway (Aurora incluida) pueda usarlo sin cambios.
#
# LÍMITES CONOCIDOS (verificados contra el endpoint real el 2026-08-05)
#
#   - La cuenta sirve varios modelos, no uno: `gpt-5.6-sol`, `gpt-5.6-terra`,
#     `gpt-5.6-luna`, `gpt-5.3-codex-spark`, `gpt-5.5` y `gpt-5.4-mini`. Los
#     sufijos de la familia 5.6 son variantes reales, no adornos. Y `gpt-5.5` /
#     `gpt-5.4-mini` SÍ ven (text+image, 272k), a diferencia de spark. En cambio
#     `gpt-5.6` a secas
#     y los sufijos -codex, -pro y -high devuelven 400 "not supported when
#     using Codex with a ChatGPT account", igual que gpt-5.2 y o3. El puente
#     enruta por el modelo que pida el cliente si está en ALLOWED_MODELS.
#   - NO HAY QUE ADIVINAR QUÉ SIRVE LA CUENTA: hay un catálogo autoritativo,
#     y es por cuenta (el plan manda). Con las mismas credenciales del puente:
#
#       GET https://chatgpt.com/backend-api/codex/models?client_version=0.144.0
#           Authorization: Bearer <access_token>
#           chatgpt-account-id: <account_id>
#
#     Sin `client_version` devuelve 400. Da `slug`, `input_modalities`,
#     `context_window` y `visibility` de cada modelo. Ahí se vio (2026-08-12)
#     que el slug bueno es `gpt-5.3-codex-spark` y no `gpt-5.3-codex`, que era
#     el que se probó en su día y por eso salía el 400.
#   - `gpt-5.3-codex-spark` declara `supported_in_api: false` y AUN ASÍ responde
#     200 por este endpoint (probado el 2026-08-12): ese flag es la vía API key,
#     no la de suscripción. Es SOLO TEXTO (`input_modalities: [text]`) y su
#     ventana son 128k, no 272k como la familia 5.6 — no puede ser destino del
#     desvío de visión.
#   - `stream:false` devuelve 400: aguas arriba SIEMPRE se pide streaming y el
#     modo no-stream del cliente se sirve agregando la respuesta.
#   - La cuota es la MISMA que la del Codex interactivo del usuario, y OpenAI
#     estrangula por cliente: cargas masivas (p.ej. los RCA de Aurora) pueden
#     dejar sin Codex al usuario. Pensado para chat manual, no para RCA.
#
# DOS INSTANCIAS, UNA POR CUENTA (2026-08-12) — Y MASTER/REPLICA (2026-08-14)
#
# Una CREDENCIAL = un Secret = un Deployment. Desde el 14-08 cada Deployment
# corre DOS pods: servir trafico es de cualquiera, pero REFRESCAR es de uno solo
# — el refresh consume el refresh_token y OpenAI lo rota, asi que dos refrescos
# concurrentes se matan la sesion. La exclusion la da un Lease de Kubernetes
# (`codex-bridge[-edani]-refresh`): quien no lo consigue NO toca OpenAI, relee
# el Secret por API y adopta lo del holder. El CronJob de rotacion toma el mismo
# Lease, asi que cron y emergencia tampoco pueden cruzarse.
#
# Para servir dos cuentas hay dos Deployments del MISMO ConfigMap de codigo,
# que se diferencian solo en el env:
#
#   codex-bridge         -> daniel.ibanez@cloudblue.com  (Secret codex-bridge-auth)
#   codex-bridge-edani   -> me@e-dani.com                (Secret codex-bridge-edani-auth)
#
# QUIÉN DISTINGUE LA CUENTA ES EL `api_base`. En manifest.yaml los IDs publicos
# tienen forma `cloudblue/gpt-5.6-sol` o `e-dani/gpt-5.6-sol`, mientras que
# `litellm_params.model` lleva el slug DESNUDO (`openai/gpt-5.6-sol`). Es
# obligatorio: `resolve_model()` manda al UPSTREAM_MODEL todo lo que no esté en
# ALLOWED_MODELS, así que enviar el prefijo local aguas arriba contestaría con sol
# SIN ERROR NINGUNO. Si dudas de si hubo sustitución, el testigo es el log
# ("modelo no soportado por la cuenta"), no el campo `model` de la respuesta:
# LiteLLM ese lo normaliza al alias que pidió el cliente.
#
# CUOTA: la cuenta cloudblue es la que aguanta lo automático (desvío de visión,
# último eslabón de `agent`, Aurora). La de me@e-dani.com es la MISMA cuota que
# el Codex interactivo del usuario, así que sus alias son opt-in por nombre y no
# están en ninguna cadena de fallback. No meterlos.
#
# CREDENCIALES
#
# Cuenta: daniel.ibanez@cloudblue.com (account c3edf899-f6be-4c82-b58d-7a16f5f8dd4d).
# Es una cuenta DISTINTA de la personal del usuario, a propósito: la cuota de
# ChatGPT es por cuenta, y con la personal cualquier carga de Aurora se comía el
# cupo del Codex interactivo. Al separarlas ya no compiten — y por eso mismo el
# segundo puente existe para uso manual, no para carga automática.
#
# El Secret `codex-bridge-auth` NO está en git. La credencial es una sesión OAuth
# PROPIA del puente, creada con `codex login --device-auth`: no la comparte con
# nadie, ni con el Codex del usuario ni con los perfiles de OpenClaw. Eso importa
# porque cada refresh ROTA el refresh_token, así que dos consumidores de la misma
# credencial acaban expulsándose el uno al otro.
#
# El puente refresca el access token cuando le queda menos de una hora y persiste
# el resultado en este mismo Secret (de ahí el Role de abajo).
#
# PARA REHACERLA (si el refresh empieza a devolver 401) — no es evidente: el CLI
# oficial de Codex no está en el Mac, pero sí dentro del pod de OpenClaw, y el
# flujo de dispositivo evita depender de un callback local (el puerto 1455 lo
# ocupa VS Code en el Mac):
#
#   kubectl -n openclaw-qwen36 exec deploy/openclaw-qwen36-openclaw -c openclaw -- \
#     sh -c 'mkdir -p /data/.codex-bridge && CODEX_HOME=/data/.codex-bridge codex login --device-auth'
#
# Imprime una URL y un código: se abre en el navegador, se entra con la cuenta
# daniel.ibanez@cloudblue.com y se autoriza. Después se vuelca ese auth.json al
# Secret y SE BORRA /data/.codex-bridge, o queda una credencial huérfana viva en
# el volumen de OpenClaw que nadie recordará revocar.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-bridge
  namespace: litellm
---
# Solo su propio Secret, y solo para poder guardar los tokens ya rotados.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-bridge
  namespace: litellm
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["codex-bridge-auth"]
    verbs: ["get", "patch"]
  # Master/replica (2026-08-14): refrescar exige ser holder del Lease. `create`
  # no admite resourceNames (el nombre no existe hasta crearlo); get/update si.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["codex-bridge-refresh"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-bridge
  namespace: litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-bridge
subjects:
  - kind: ServiceAccount
    name: codex-bridge
    namespace: litellm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-bridge-code
  namespace: litellm
data:
  bridge.py: |
    """Puente OpenAI-compatible sobre la cuenta ChatGPT/Codex.

    Habla con chatgpt.com/backend-api/codex/responses, que es el endpoint que usa
    el CLI de Codex con credenciales OAuth de suscripción (no API key de pago).
    LiteLLM lo consume como un backend `openai/` cualquiera. Dos rutas:

      /v1/chat/completions  traduce chat -> responses. Es la que usa todo el
                            gateway (Aurora, el desvío de visión, `agent`).
      /v1/responses         casi passthrough, con el SSE relegado verbatim. La
                            necesita el Codex CLI: desde 0.143 `wire_api="chat"`
                            es un error duro y LiteLLM no traduce Responses para
                            un backend `openai/` — reenvía a {api_base}/responses.

    Restricciones del upstream, verificadas contra el endpoint real (2026-08-05):
      - `stream: false` devuelve 400 "Stream must be set to true". SIEMPRE se pide
        streaming aguas arriba; el modo no-stream del cliente se sirve agregando.
      - La cuenta ChatGPT no sirve cualquier modelo. Responden `gpt-5.6-sol`,
        `gpt-5.6-terra`, `gpt-5.6-luna`, `gpt-5.3-codex-spark`, `gpt-5.5` y
        `gpt-5.4-mini` (los dos ultimos probados contra la cuenta cloudblue el
        2026-08-13, HTTP 200);
        devuelven 400 "not supported when using Codex with a ChatGPT account" el
        `gpt-5.6` a secas y los sufijos -codex, -pro y -high, además de gpt-5.2 y
        o3. Los sufijos de la familia 5.6 son variantes reales (sol/terra/luna),
        no adornos, así que la lista se mantiene explícita en ALLOWED_MODELS: lo
        que no esté ahí cae al modelo por defecto en vez de provocar un 400 del
        upstream. Ese fallback es COMODO Y TRAICIONERO: contesta 200 con otro
        modelo. Cada vez que se añade un alias en manifest.yaml hay que añadir su
        slug aquí, y la única señal de que no se hizo es la línea de log de
        resolve_model(). El catálogo real de la cuenta se lista con
        GET /backend-api/codex/models?client_version=… (ver cabecera del yaml).
      - Emite items `reasoning` que no son texto de respuesta y se descartan.
      - SÍ acepta imágenes (2026-08-11), y es lo único del gateway que ve mientras
        el residente del DGX sea DeepSeek. Van como `input_image` con `image_url`
        STRING — el objeto `{"url": ...}` de chat/completions da 400. Ver
        to_input_parts().

    Solo stdlib: la imagen es un python:3.x-slim sin pip install en el arranque.
    """

    import json
    import os
    import base64
    import calendar
    from collections import deque
    import threading
    import time
    import urllib.error
    import urllib.request
    import uuid
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM_URL = "https://chatgpt.com/backend-api/codex/responses"
    TOKEN_URL = "https://auth.openai.com/oauth/token"
    # client_id de la app Codex CLI, leído del claim `aud` del id_token de ~/.codex/auth.json
    CLIENT_ID = os.environ.get("CODEX_CLIENT_ID", "app_EMoamEEZ73f0CkXaXp7hrann")
    ALLOWED_MODELS = [m.strip() for m in os.environ.get(
        "ALLOWED_MODELS",
        "gpt-5.6-sol,gpt-5.6-terra,gpt-5.6-luna,gpt-5.3-codex-spark,gpt-5.5,gpt-5.4-mini",
    ).split(",") if m.strip()]
    UPSTREAM_MODEL = os.environ.get("UPSTREAM_MODEL", ALLOWED_MODELS[0])
    BRIDGE_API_KEY = os.environ.get("BRIDGE_API_KEY", "")
    AUTH_FILE = os.environ.get("AUTH_FILE", "/auth/auth.json")
    SECRET_NAME = os.environ.get("SECRET_NAME", "codex-bridge-auth")
    NAMESPACE = os.environ.get("POD_NAMESPACE", "litellm")
    REFRESH_MARGIN = int(os.environ.get("REFRESH_MARGIN_SECONDS", "3600"))
    # Master/replica (2026-08-14): servir es de todos, refrescar es de UNO.
    # El refresh de emergencia consume el refresh_token, y OpenAI lo ROTA:
    # dos replicas refrescando a la vez se matan la sesion entre ellas. La
    # exclusion la da un Lease de Kubernetes -- CAS del apiserver, un 409
    # significa "perdiste: adopta lo del ganador y no toques OpenAI".
    POD_NAME = os.environ.get("POD_NAME", os.uname().nodename)
    LEASE_NAME = os.environ.get("LEASE_NAME", "codex-bridge-refresh")
    LEASE_TTL = int(os.environ.get("LEASE_TTL_SECONDS", "120"))
    # Admission del tráfico de inferencia. El upstream de ChatGPT devuelve 429
    # por ráfaga/concurrencia, no por la cuota semanal. Cada cuenta tiene dos
    # pods, así que dos slots por pod dejan como máximo cuatro streams por
    # cuenta y ocho peticiones pendientes entre los hilos de un pod. La cola es
    # FIFO y acotada: una ráfaga no puede convertir el ThreadingHTTPServer en
    # cientos de hilos retenidos durante el timeout de 600 s.
    MAX_INFLIGHT = int(os.environ.get("MAX_INFLIGHT", "2"))
    MAX_QUEUE = int(os.environ.get("MAX_QUEUE", "8"))
    ADMISSION_TIMEOUT_SECONDS = float(
        os.environ.get("ADMISSION_TIMEOUT_SECONDS", "600")
    )
    ADMISSION_RETRY_AFTER_SECONDS = int(
        os.environ.get("ADMISSION_RETRY_AFTER_SECONDS", "5")
    )
    API = "https://kubernetes.default.svc"
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"

    _lock = threading.Lock()
    _tokens = {}
    _earliest_refresh = 0
    _last_emergency_at = 0.0


    class AdmissionBusy(Exception):
        """La cola acotada esta llena; no se ha leido el body del cliente."""


    class AdmissionTimeout(Exception):
        """El cliente espero el maximo permitido sin slot libre."""


    class _AdmissionLease:
        def __init__(self, gate):
            self._gate = gate
            self._released = False

        def release(self):
            if self._released:
                return
            self._released = True
            self._gate._release()

        def __enter__(self):
            return self

        def __exit__(self, exc_type, exc, tb):
            self.release()


    class AdmissionGate:
        """Slots y espera FIFO para las dos rutas de inferencia del puente.

        No es un limite de conexiones TCP: el servidor puede aceptar una
        conexion antes de que el handler entre aqui. Si la cola esta llena se
        responde 503 y se cierra esa conexion; dentro del gate siempre quedan
        como maximo ``max_inflight + max_queue`` handlers esperando.
        """

        def __init__(self, max_inflight, max_queue, timeout_seconds):
            if max_inflight < 1 or max_queue < 0 or timeout_seconds <= 0:
                raise ValueError("admission limits must be positive")
            self.max_inflight = max_inflight
            self.max_queue = max_queue
            self.timeout_seconds = timeout_seconds
            self._condition = threading.Condition()
            self._active = 0
            self._waiters = deque()
            self._blocked_until = 0.0

        def _remove_waiter(self, token):
            try:
                self._waiters.remove(token)
            except ValueError:
                return
            self._condition.notify_all()

        def acquire(self, timeout=None):
            timeout = self.timeout_seconds if timeout is None else timeout
            deadline = time.monotonic() + timeout
            token = object()
            queued = False
            with self._condition:
                now = time.monotonic()
                if (
                    self._active < self.max_inflight
                    and not self._waiters
                    and now >= self._blocked_until
                ):
                    self._active += 1
                    return _AdmissionLease(self)
                if len(self._waiters) >= self.max_queue:
                    raise AdmissionBusy()
                self._waiters.append(token)
                queued = True
                try:
                    while True:
                        now = time.monotonic()
                        remaining = deadline - now
                        if remaining <= 0:
                            raise AdmissionTimeout()
                        if (
                            self._waiters
                            and self._waiters[0] is token
                            and self._active < self.max_inflight
                            and now >= self._blocked_until
                        ):
                            self._waiters.popleft()
                            queued = False
                            self._active += 1
                            return _AdmissionLease(self)
                        cooldown = max(0.0, self._blocked_until - now)
                        self._condition.wait(min(remaining, cooldown) if cooldown else remaining)
                except BaseException:
                    if queued:
                        self._remove_waiter(token)
                    raise

        def _release(self):
            with self._condition:
                if self._active <= 0:
                    raise RuntimeError("admission lease released without an active slot")
                self._active -= 1
                self._condition.notify_all()

        def block_for(self, seconds):
            """Pausa nuevas admisiones tras un 429 sin cancelar las activas."""
            if seconds <= 0:
                return
            with self._condition:
                self._blocked_until = max(
                    self._blocked_until, time.monotonic() + seconds
                )
                self._condition.notify_all()

        @property
        def active(self):
            with self._condition:
                return self._active

        @property
        def waiting(self):
            with self._condition:
                return len(self._waiters)


    ADMISSION_GATE = AdmissionGate(
        MAX_INFLIGHT, MAX_QUEUE, ADMISSION_TIMEOUT_SECONDS
    )


    def log(msg):
        print(f"[codex-bridge] {msg}", flush=True)


    # --------------------------------------------------------------------------
    # Credenciales
    # --------------------------------------------------------------------------

    def _jwt_claim(token, key, default=None):
        """Lee un claim del JWT sin verificar firma: sólo se usa para datos
        informativos (exp, email), nunca para autorizar nada."""
        try:
            payload = token.split(".")[1]
            payload += "=" * (-len(payload) % 4)
            return json.loads(base64.urlsafe_b64decode(payload)).get(key, default)
        except Exception:
            return default


    def _jwt_exp(token):
        return _jwt_claim(token, "exp", 0) or 0


    def account_email():
        """Email de la cuenta, con dos fuentes.

        `codex login --device-auth` no siempre escribe `account_email` en el
        auth.json — la credencial de me@e-dani.com salió sin él — pero el
        id_token SIEMPRE lleva el claim `email`. Sin este fallback, el panel no
        sabe de quién es la cuota que está enseñando.
        """
        try:
            data = read_auth_file()
        except Exception:
            data = {}
        email = data.get("account_email")
        if email:
            return email
        tokens = data.get("tokens") or _tokens or {}
        return _jwt_claim(tokens.get("id_token", ""), "email")


    def read_auth_file():
        with open(AUTH_FILE) as fh:
            return json.load(fh)


    def _k8s(method, path, body=None, content_type="application/merge-patch+json"):
        """Llamada minima al apiserver con el token de la SA.

        Devuelve (status, json|None). Los 4xx NO levantan: el 409 del Lease es
        una respuesta, no un error -- significa que otro escribio primero.
        """
        with open(f"{SA_DIR}/token") as fh:
            sa = fh.read()
        headers = {"Authorization": "Bearer " + sa}
        if body is not None:
            headers["Content-Type"] = content_type
        req = urllib.request.Request(API + path, data=body, method=method, headers=headers)
        ctx = __import__("ssl").create_default_context(cafile=f"{SA_DIR}/ca.crt")
        try:
            with urllib.request.urlopen(req, timeout=15, context=ctx) as resp:
                return resp.status, json.loads(resp.read() or b"null")
        except urllib.error.HTTPError as exc:
            return exc.code, None


    def read_secret_auth():
        """El auth.json del Secret LEIDO POR API, no del volumen.

        El kubelet tarda ~1 min en propagar el Secret al volumen; en la ventana
        de una emergencia ese minuto es exactamente la carrera que hay que
        cerrar. Devuelve None si no se puede leer (RBAC, red): el que llama ya
        tiene los tokens de disco como plan B.
        """
        status, secret = _k8s("GET", f"/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}")
        if status != 200 or not secret:
            return None
        try:
            return json.loads(base64.b64decode(secret["data"]["auth.json"]))
        except Exception:
            return None


    def _lease_now():
        return time.strftime("%Y-%m-%dT%H:%M:%S.000000Z", time.gmtime())


    def _lease_parse(stamp):
        # calendar.timegm y NO mktime-timezone: mktime interpreta hora LOCAL y
        # con DST se desplaza una hora, con lo que un lease VIVO pareceria
        # expirado y las dos replicas podrian robarselo a la vez -- la carrera
        # exacta que este lease existe para impedir. timegm interpreta UTC
        # siempre, corra donde corra el proceso.
        try:
            return float(calendar.timegm(
                time.strptime(stamp.split(".")[0], "%Y-%m-%dT%H:%M:%S")))
        except Exception:
            return 0.0


    def acquire_refresh_lease():
        """True solo si ESTE pod es ahora el holder del Lease de refresh.

        Toda escritura pasa por el CAS del apiserver (resourceVersion en el
        update, colision de nombre en el create): perder la carrera devuelve
        409/False, nunca un holder duplicado. Un Lease expirado (holder muerto
        a mitad de refresh) se puede robar pasado LEASE_TTL.
        """
        path = f"/apis/coordination.k8s.io/v1/namespaces/{NAMESPACE}/leases/{LEASE_NAME}"
        status, lease = _k8s("GET", path)
        if status == 404:
            body = json.dumps({
                "apiVersion": "coordination.k8s.io/v1", "kind": "Lease",
                "metadata": {"name": LEASE_NAME, "namespace": NAMESPACE},
                "spec": {"holderIdentity": POD_NAME,
                         "leaseDurationSeconds": LEASE_TTL,
                         "acquireTime": _lease_now(), "renewTime": _lease_now()},
            }).encode()
            status, _ = _k8s(
                "POST",
                f"/apis/coordination.k8s.io/v1/namespaces/{NAMESPACE}/leases",
                body, content_type="application/json")
            return status in (200, 201)
        if status != 200 or not lease:
            return False
        spec = lease.get("spec") or {}
        holder = spec.get("holderIdentity") or ""
        renew = _lease_parse(spec.get("renewTime") or "")
        expired = (time.time() - renew) > LEASE_TTL
        if holder and holder != POD_NAME and not expired:
            return False
        lease["spec"] = {"holderIdentity": POD_NAME,
                         "leaseDurationSeconds": LEASE_TTL,
                         "acquireTime": _lease_now(), "renewTime": _lease_now()}
        status, _ = _k8s("PUT", path, json.dumps(lease).encode(),
                         content_type="application/json")
        return status == 200


    def release_refresh_lease():
        """Suelta el Lease sin esperar al TTL. Best-effort: si falla, expira solo."""
        path = f"/apis/coordination.k8s.io/v1/namespaces/{NAMESPACE}/leases/{LEASE_NAME}"
        status, lease = _k8s("GET", path)
        if status != 200 or not lease:
            return
        if (lease.get("spec") or {}).get("holderIdentity") != POD_NAME:
            return
        lease["spec"]["holderIdentity"] = ""
        _k8s("PUT", path, json.dumps(lease).encode(), content_type="application/json")


    def load_tokens():
        global _tokens, _earliest_refresh
        data = read_auth_file()
        _tokens = data["tokens"] if "tokens" in data else data
        _earliest_refresh = data.get("earliest_refresh_at", 0)
        log(f"credenciales cargadas, access_token exp={_jwt_exp(_tokens['access_token'])}")


    def persist_tokens():
        """Guarda los tokens rotados en el Secret. Sin esto, cada reinicio del pod
        volvería al refresh_token viejo, que el rotado puede haber invalidado."""
        try:
            with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as fh:
                sa = fh.read()
            current = read_auth_file()
            current["tokens"] = _tokens
            if _earliest_refresh:
                current["earliest_refresh_at"] = _earliest_refresh
            payload = json.dumps(current, indent=2).encode()
            body = json.dumps({
                "data": {"auth.json": base64.b64encode(payload).decode()}
            }).encode()
            req = urllib.request.Request(
                f"https://kubernetes.default.svc/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}",
                data=body, method="PATCH",
                headers={"Authorization": "Bearer " + sa,
                         "Content-Type": "application/merge-patch+json"})
            ctx = __import__("ssl").create_default_context(
                cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
            urllib.request.urlopen(req, timeout=15, context=ctx).read()
            log("tokens rotados persistidos en el Secret")
        except Exception as exc:  # no es fatal: el token en memoria sigue sirviendo
            log(f"AVISO: no pude persistir los tokens rotados: {exc!r}")


    def backfill_account_email():
        """Escribe `account_email` en el Secret si falta.

        Con el fallback de arriba el panel ya sabe de quién es la cuota, pero el
        Secret se queda sin decir a qué cuenta pertenece y hay que decodificar un
        JWT a mano para averiguarlo — justo lo que costó identificar la
        credencial de e-dani. Se escribe una vez, al arrancar, y sólo si falta.
        Es aditivo: no toca los tokens.
        """
        try:
            data = read_auth_file()
            if data.get("account_email"):
                return
            email = _jwt_claim((data.get("tokens") or {}).get("id_token", ""), "email")
            if not email:
                return
            with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as fh:
                sa = fh.read()
            data["account_email"] = email
            body = json.dumps({"data": {
                "auth.json": base64.b64encode(
                    json.dumps(data, indent=2).encode()).decode()}}).encode()
            req = urllib.request.Request(
                f"https://kubernetes.default.svc/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}",
                data=body, method="PATCH",
                headers={"Authorization": "Bearer " + sa,
                         "Content-Type": "application/merge-patch+json"})
            ctx = __import__("ssl").create_default_context(
                cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
            urllib.request.urlopen(req, timeout=15, context=ctx).read()
            log(f"account_email escrito en el Secret: {email}")
        except Exception as exc:  # informativo: el fallback ya cubre el panel
            log(f"AVISO: no pude escribir account_email: {exc!r}")


    def refresh_if_needed():
        """Asegura un access token vivo, refrescando lo menos posible.

        Quien rota de forma normal es el CronJob `codex-token-rotate`, que deja las
        credenciales nuevas en el Secret; el kubelet las propaga a este volumen en
        ~1 min. Por eso el orden es: (1) mirar si las de disco ya son más nuevas y
        adoptarlas, y solo (2) refrescar aquí si tampoco sirven. Refrescar por
        nuestra cuenta ROTA el refresh_token y deja fuera a los demás
        consumidores de la misma credencial, así que es el último recurso.
        """
        global _earliest_refresh, _last_emergency_at
        with _lock:
            exp = _jwt_exp(_tokens.get("access_token", ""))
            if exp - time.time() > REFRESH_MARGIN:
                return
            try:
                disk = read_auth_file()
                disk_tokens = disk.get("tokens", disk)
                if _jwt_exp(disk_tokens.get("access_token", "")) > exp:
                    _tokens.update(disk_tokens)
                    _earliest_refresh = disk.get("earliest_refresh_at", _earliest_refresh)
                    exp = _jwt_exp(_tokens["access_token"])
                    log("credenciales recargadas del Secret (rotadas por el CronJob)")
                    if exp - time.time() > REFRESH_MARGIN:
                        return
            except Exception as exc:
                log(f"AVISO: no pude releer el Secret: {exc!r}")
            # El volumen va ~1 min por detras del Secret: antes de tocar OpenAI,
            # mirar la version por API -- si la otra replica (o el cron) ya
            # refresco, esto lo adopta y aqui se acaba.
            fresh_auth = read_secret_auth()
            if fresh_auth:
                api_tokens = fresh_auth.get("tokens", fresh_auth)
                if _jwt_exp(api_tokens.get("access_token", "")) > exp:
                    _tokens.update(api_tokens)
                    _earliest_refresh = fresh_auth.get("earliest_refresh_at", _earliest_refresh)
                    exp = _jwt_exp(_tokens["access_token"])
                    log("credenciales adoptadas del Secret via API (otro escritor refresco)")
                    if exp - time.time() > REFRESH_MARGIN:
                        return
            # Amortiguador: si acabamos de perder el lease, no martillear el
            # apiserver en cada peticion -- el token sigue vivo REFRESH_MARGIN.
            if time.time() - _last_emergency_at < 30:
                return
            _last_emergency_at = time.time()
            if not acquire_refresh_lease():
                log("refresh de emergencia NECESARIO pero el Lease lo tiene otro: "
                    "no toco OpenAI; adoptare su resultado del Secret")
                return
            log("access token cerca de caducar y el Secret no trae uno mejor: "
                "refrescando (holder del Lease)")
            body = json.dumps({
                "client_id": CLIENT_ID,
                "grant_type": "refresh_token",
                "refresh_token": _tokens["refresh_token"],
                "scope": "openid profile email",
            }).encode()
            req = urllib.request.Request(
                TOKEN_URL, data=body, method="POST",
                headers={"Content-Type": "application/json"})
            try:
                data = json.loads(urllib.request.urlopen(req, timeout=30).read())
            except urllib.error.HTTPError as exc:
                release_refresh_lease()
                log(f"ERROR refrescando ({exc.code}): hay que resembrar el Secret "
                    f"con un `codex login` nuevo")
                raise
            _tokens["access_token"] = data["access_token"]
            if data.get("refresh_token"):
                rotated = data["refresh_token"] != _tokens.get("refresh_token")
                _tokens["refresh_token"] = data["refresh_token"]
                log(f"refresh OK (refresh_token {'ROTADO' if rotated else 'estable'})")
            if data.get("id_token"):
                _tokens["id_token"] = data["id_token"]
            if data.get("earliest_refresh_at"):
                _earliest_refresh = data["earliest_refresh_at"]
            persist_tokens()
            release_refresh_lease()


    # --------------------------------------------------------------------------
    # Traducción chat/completions -> responses
    # --------------------------------------------------------------------------

    def resolve_model(requested):
        """Traduce lo que pide el cliente a un modelo que el upstream acepte.

        LiteLLM manda el id sin su prefijo de provider, pero aquí llegan también
        nombres del selector de Aurora, así que se normaliza y se comprueba contra
        la allowlist. Un modelo desconocido cae al por defecto: es preferible
        responder con otro modelo que devolver el 400 del upstream.
        """
        if not requested:
            return UPSTREAM_MODEL
        name = str(requested).split("/")[-1]
        if name.endswith("-oauth"):
            name = name[: -len("-oauth")]
        if name in ALLOWED_MODELS:
            return name
        log(f"modelo no soportado por la cuenta ({requested!r}); uso {UPSTREAM_MODEL}")
        return UPSTREAM_MODEL


    def flatten_text(content):
        """Las partes de texto de un content, concatenadas. El resto se descarta."""
        if isinstance(content, list):
            return "".join(p.get("text", "") for p in content
                           if isinstance(p, dict) and p.get("type") in ("text", "input_text"))
        return content


    def image_url_of(part):
        """La URL de una parte de imagen, o None si no lo es.

        Acepta las dos formas que llegan por LiteLLM: la de chat/completions
        (`image_url` como objeto {"url": ...}) y la de la Responses API
        (`image_url` como string). Una `data:` URI vale igual que una http.
        """
        if not isinstance(part, dict) or part.get("type") not in ("image_url", "input_image", "image"):
            return None
        url = part.get("image_url")
        if isinstance(url, dict):
            url = url.get("url")
        return url or None


    def to_input_parts(content):
        """content de chat/completions -> partes de la Responses API, EN ORDEN.

        LAS IMAGENES VAN COMO STRING. Verificado contra el upstream real
        (2026-08-11): `{"type": "input_image", "image_url": "data:image/png;base64,..."}`
        se responde bien; la forma de chat/completions con el objeto
        `{"url": ...}` devuelve 400 «expected an image URL, but got an object
        instead». Traducirlo es justo el trabajo de este puente.

        Hasta hoy esto aplanaba a texto y las imagenes SE PERDIAN sin un solo log:
        el modelo contestaba a ciegas sobre lo que dijera el texto, que es peor que
        un error.
        """
        if not isinstance(content, list):
            return [{"type": "input_text", "text": content or ""}]
        parts = []
        for p in content:
            if not isinstance(p, dict):
                continue
            url = image_url_of(p)
            if url:
                part = {"type": "input_image", "image_url": url}
                src = p.get("image_url")
                detail = p.get("detail") or (src.get("detail") if isinstance(src, dict) else None)
                if detail:
                    part["detail"] = detail
                parts.append(part)
            elif p.get("type") in ("text", "input_text"):
                parts.append({"type": "input_text", "text": p.get("text", "")})
        return parts or [{"type": "input_text", "text": ""}]


    def to_responses_payload(req):
        instructions = []
        items = []
        for msg in req.get("messages", []):
            role = msg.get("role")
            raw_content = msg.get("content")
            # `instructions` es un string y los roles no-usuario no llevan imagen:
            # para todo lo que no sea el turno de usuario se aplana a texto, igual
            # que antes.
            content = flatten_text(raw_content)
            if role in ("system", "developer"):
                if content:
                    instructions.append(content)
            elif role == "tool":
                items.append({
                    "type": "function_call_output",
                    "call_id": msg.get("tool_call_id", ""),
                    "output": content if isinstance(content, str) else json.dumps(content),
                })
            elif role == "assistant":
                for call in msg.get("tool_calls") or []:
                    fn = call.get("function", {})
                    items.append({
                        "type": "function_call",
                        "call_id": call.get("id", ""),
                        "name": fn.get("name", ""),
                        "arguments": fn.get("arguments", "") or "{}",
                    })
                if content:
                    items.append({"type": "message", "role": "assistant",
                                  "content": [{"type": "output_text", "text": content}]})
            else:
                items.append({"type": "message", "role": "user",
                              "content": to_input_parts(raw_content)})

        payload = {
            "model": resolve_model(req.get("model")),
            "instructions": "\n\n".join(instructions) or "You are a helpful assistant.",
            "input": items,
            "stream": True,   # el upstream rechaza cualquier otra cosa
            "store": False,
        }
        tools = []
        for tool in req.get("tools") or []:
            fn = tool.get("function", tool)
            tools.append({
                "type": "function",
                "name": fn.get("name"),
                "description": fn.get("description", ""),
                "parameters": fn.get("parameters", {"type": "object", "properties": {}}),
                "strict": False,
            })
        if tools:
            payload["tools"] = tools
            choice = req.get("tool_choice")
            if choice in ("auto", "none", "required"):
                payload["tool_choice"] = choice
        return payload


    # Claves que NO se reenvian tal cual en /v1/responses. `model`, `stream` y
    # `store` se imponen aparte (el upstream exige stream y rechaza store); el
    # resto son metadatos que mete LiteLLM y que el endpoint de Codex no conoce.
    # Todo lo demas SI pasa: el cliente de esta ruta es el propio Codex CLI, o
    # sea que lo que manda es exactamente lo que este upstream espera
    # (`reasoning`, `include`, `text.verbosity`, `tool_choice`...). Filtrar por
    # allowlist romperia justo eso.
    # `max_output_tokens` NO es un metadato: es un parametro legitimo de la
    # Responses API que ESTE upstream rechaza en duro.
    #   [codex-bridge] error 400: upstream: {"detail":"Unsupported parameter: max_output_tokens"}
    # chatgpt.com/backend-api/codex/responses no es la API publica de OpenAI: es
    # el endpoint interno del CLI de Codex, y acepta menos cosas. Misma familia
    # que `stream: false` y `store`, ya impuestos arriba.
    #
    # Aparecio el 2026-08-13 al pasar opencode al proveedor autodescubierto: el
    # plugin publica `limit.output` desde `max_output_tokens` de /model/info y el
    # SDK lo manda; el proveedor declarado a mano no lo hacia. Descartar el
    # parametro no pierde nada — el upstream nunca lo iba a respetar, y el
    # recorte real de salida lo hace el cliente.
    #
    # OJO al reproducirlo: por LiteLLM directamente NO falla (lo filtra antes de
    # llegar aqui). Solo se ve entrando por la ruta que usa opencode. Y solo lo
    # da la cuenta `cloudblue`; `codex-bridge-edani` no lo reporta.
    RESPONSES_DROP = ("metadata", "user", "service_tier", "previous_response_id",
                      "litellm_metadata", "litellm_session_id",
                      "max_output_tokens")


    # El upstream exige `content` VACIO en los items `reasoning`:
    #   Invalid 'input[15].content': array too long. Expected an array with
    #   maximum length 0, but got an array with length 1 instead.
    # Codex reenvia el historial completo (aqui `store` es False y
    # `previous_response_id` se descarta), asi que en cuanto un turno lleva
    # razonamiento la conversacion ENTERA muere en 400 y no vuelve a arrancar.
    # Medido el 2026-08-13 contra `gpt-5.6-sol`: mismo payload con `content` ->
    # 400, con `content` vacio -> 200.
    #
    # Se vacia en vez de borrar el item: `encrypted_content` y `summary` son lo
    # que el upstream necesita para encadenar el razonamiento entre turnos.
    def vaciar_content_de_reasoning(items):
        if not isinstance(items, list):
            return items
        salida = []
        for item in items:
            if isinstance(item, dict) and item.get("type") == "reasoning" and item.get("content"):
                item = dict(item, content=[])
            salida.append(item)
        return salida


    def to_upstream_responses(req):
        """Payload de /v1/responses -> payload del upstream, casi tal cual.

        Es el camino de MENOS traduccion que existe aqui: Codex habla Responses y
        chatgpt.com/backend-api/codex/responses habla Responses. Lo unico que hace
        falta es imponer los invariantes del upstream y resolver el modelo contra
        la allowlist de la cuenta.
        """
        payload = {k: v for k, v in req.items() if k not in RESPONSES_DROP}
        payload["model"] = resolve_model(req.get("model"))
        payload["input"] = vaciar_content_de_reasoning(payload.get("input"))
        payload["stream"] = True    # el upstream devuelve 400 con cualquier otra cosa
        payload["store"] = False
        if not payload.get("input"):
            payload["input"] = [{"type": "message", "role": "user",
                                 "content": [{"type": "input_text", "text": ""}]}]
        if isinstance(payload.get("input"), str):
            payload["input"] = [{"type": "message", "role": "user",
                                 "content": [{"type": "input_text", "text": payload["input"]}]}]
        return payload


    # ── Cuota del plan, capturada AL VUELO ──────────────────────────────────
    # chatgpt.com devuelve el consumo en cabeceras de CADA respuesta; no hay
    # endpoint que preguntar. Se guardan aquí y se sirven en /quota, así que
    # saber cuánto queda NO gasta cuota: la gastaría un sondeo, y sería del
    # mismo contador que el Codex interactivo del usuario.
    #
    # El precio de ser pasivo es que el dato envejece si nadie usa la cuenta.
    # Por eso se guarda `captured_at` y quien lo pinte dice la antigüedad, en
    # vez de dar por fresco un porcentaje de hace horas.
    _quota = {"captured_at": None}
    _quota_lock = threading.Lock()

    _QUOTA_HEADERS = {
        "x-codex-plan-type": ("plan_type", str),
        "x-codex-primary-used-percent": ("primary_used_percent", float),
        "x-codex-primary-window-minutes": ("primary_window_minutes", int),
        "x-codex-primary-reset-after-seconds": ("primary_reset_after_s", int),
        "x-codex-primary-reset-at": ("primary_reset_at", int),
        "x-codex-secondary-used-percent": ("secondary_used_percent", float),
        "x-codex-secondary-window-minutes": ("secondary_window_minutes", int),
        "x-codex-secondary-reset-after-seconds": ("secondary_reset_after_s", int),
        "x-codex-secondary-reset-at": ("secondary_reset_at", int),
        "x-codex-credits-unlimited": ("credits_unlimited", lambda v: str(v).lower() == "true"),
        "x-codex-primary-over-secondary-limit-percent": ("primary_over_secondary_percent", float),
    }


    def capture_quota(headers):
        """Extrae las cabeceras x-codex-* de una respuesta. Nunca lanza."""
        if headers is None:
            return
        found = {}
        for header, (key, cast) in _QUOTA_HEADERS.items():
            raw = headers.get(header)
            if raw is None or raw == "":
                continue
            try:
                found[key] = cast(raw)
            except (TypeError, ValueError):
                continue
        if not found:
            return
        found["captured_at"] = time.time()
        # account_email() cae al claim `email` del id_token si el auth.json no
        # lo trae, que es el caso de las credenciales de --device-auth.
        found["account_email"] = account_email()
        with _quota_lock:
            _quota.clear()
            _quota.update(found)


    def open_upstream(payload):
        refresh_if_needed()
        req = urllib.request.Request(
            UPSTREAM_URL, data=json.dumps(payload).encode(), method="POST",
            headers={
                "Authorization": "Bearer " + _tokens["access_token"],
                "chatgpt-account-id": _tokens["account_id"],
                "OpenAI-Beta": "responses=experimental",
                "originator": "codex_cli_rs",
                "Content-Type": "application/json",
                "Accept": "text/event-stream",
                "session_id": str(uuid.uuid4()),
            })
        try:
            resp = urllib.request.urlopen(req, timeout=600)
        except urllib.error.HTTPError as exc:
            # Un 429 trae la cuota igual que un 200 — y es justo cuando importa.
            capture_quota(getattr(exc, "headers", None))
            raise
        capture_quota(resp.headers)
        return resp


    def upstream_error_headers(exc):
        """Propaga Retry-After y activa un cooldown local ante un 429.

        Un 429 llega casi instantaneo. Sin la pausa, liberar el slot hace que
        los ocho waiters golpeen el mismo limite uno detras de otro. El header
        del upstream manda cuando es numerico; si no existe (caso observado en
        ChatGPT), cinco segundos frenan la rafaga sin comerse el timeout de 600.
        """
        headers = getattr(exc, "headers", None)
        raw = headers.get("Retry-After") if headers is not None else None
        seconds = ADMISSION_RETRY_AFTER_SECONDS
        if raw is not None:
            try:
                seconds = max(1, min(int(float(raw)), int(ADMISSION_TIMEOUT_SECONDS)))
            except (TypeError, ValueError):
                pass
        if getattr(exc, "code", None) == 429:
            ADMISSION_GATE.block_for(seconds)
            return {"Retry-After": str(seconds)}
        return {"Retry-After": str(raw)} if raw is not None else None


    def iter_events(stream):
        """Trocea el SSE del upstream en (evento, data) sin cargarlo entero."""
        buf = b""
        for raw in stream:
            buf += raw
            while b"\n\n" in buf:
                block, buf = buf.split(b"\n\n", 1)
                event, data = None, None
                for line in block.decode(errors="replace").splitlines():
                    if line.startswith("event: "):
                        event = line[7:]
                    elif line.startswith("data: "):
                        data = line[6:]
                if event and data:
                    try:
                        yield event, json.loads(data)
                    except json.JSONDecodeError:
                        continue


    def collect(stream):
        """Consume el SSE y devuelve (texto, tool_calls, usage)."""
        text, calls, usage = [], [], {}
        for event, data in iter_events(stream):
            if event == "response.output_text.delta":
                text.append(data.get("delta", ""))
            elif event == "response.output_item.done":
                item = data.get("item", {})
                if item.get("type") == "function_call":
                    calls.append({
                        "id": item.get("call_id"),
                        "type": "function",
                        "function": {"name": item.get("name"),
                                     "arguments": item.get("arguments", "{}")},
                    })
            elif event == "response.completed":
                usage = (data.get("response") or {}).get("usage", {}) or {}
        return "".join(text), calls, usage


    def usage_block(usage):
        return {
            "prompt_tokens": usage.get("input_tokens", 0),
            "completion_tokens": usage.get("output_tokens", 0),
            "total_tokens": usage.get("total_tokens", 0),
        }


    # --------------------------------------------------------------------------
    # HTTP
    # --------------------------------------------------------------------------

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def log_message(self, fmt, *args):  # silencia el log por petición de stdlib
            pass

        def _json(self, code, obj, extra_headers=None):
            body = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            for name, value in (extra_headers or {}).items():
                self.send_header(name, str(value))
            self.end_headers()
            self.wfile.write(body)

        def _error(self, code, message, extra_headers=None):
            log(f"error {code}: {message}")
            self._json(code, {"error": {"message": message, "type": "bridge_error",
                                        "code": code}}, extra_headers)

        def _authorized(self):
            if not BRIDGE_API_KEY:
                return True
            return self.headers.get("Authorization", "") == "Bearer " + BRIDGE_API_KEY

        def _acquire_admission(self):
            try:
                return ADMISSION_GATE.acquire()
            except AdmissionBusy:
                reason = "bridge ocupado: cola de admision llena"
            except AdmissionTimeout:
                reason = "bridge ocupado: timeout esperando un slot de admision"
            # El body sigue sin leer. Cerrar la conexion evita que los bytes que
            # ya envio el cliente se interpreten como la siguiente peticion de
            # este HTTP/1.1 keep-alive.
            self.close_connection = True
            self._error(503, reason, {
                "Retry-After": ADMISSION_RETRY_AFTER_SECONDS,
                "Connection": "close",
            })
            return None

        def do_GET(self):
            if self.path == "/health":
                exp = _jwt_exp(_tokens.get("access_token", ""))
                return self._json(200, {"status": "ok", "models": ALLOWED_MODELS,
                                        "default": UPSTREAM_MODEL,
                                        "token_expires_in_s": int(exp - time.time())})
            if self.path.rstrip("/") == "/quota":
                with _quota_lock:
                    snapshot = dict(_quota)
                captured = snapshot.get("captured_at")
                snapshot["age_s"] = (int(time.time() - captured)
                                     if isinstance(captured, (int, float)) else None)
                snapshot["upstream_model"] = UPSTREAM_MODEL
                return self._json(200, snapshot)
            if self.path.rstrip("/") in ("/v1/models", "/models"):
                return self._json(200, {"object": "list", "data": [
                    {"id": m, "object": "model", "owned_by": "chatgpt-codex"}
                    for m in ALLOWED_MODELS]})
            return self._error(404, f"not found: {self.path}")

        def do_POST(self):
            route = self.path.rstrip("/")
            if route in ("/v1/responses", "/responses"):
                return self._do_responses()
            if route not in ("/v1/chat/completions", "/chat/completions"):
                return self._error(404, f"not found: {self.path}")
            if not self._authorized():
                return self._error(401, "invalid bridge api key")
            admission = self._acquire_admission()
            if admission is None:
                return
            with admission:
                return self._do_chat_completions_admitted()

        def _do_chat_completions_admitted(self):
            try:
                length = int(self.headers.get("Content-Length", 0))
                req = json.loads(self.rfile.read(length) or b"{}")
            except (ValueError, json.JSONDecodeError) as exc:
                return self._error(400, f"cuerpo ilegible: {exc}")

            payload = to_responses_payload(req)
            used_model = payload["model"]
            want_stream = bool(req.get("stream"))
            try:
                upstream = open_upstream(payload)
            except urllib.error.HTTPError as exc:
                extra_headers = upstream_error_headers(exc)
                try:
                    detail = exc.read()[:500].decode(errors="replace")
                finally:
                    exc.close()
                return self._error(exc.code, f"upstream: {detail}", extra_headers)
            except Exception as exc:
                return self._error(502, f"upstream inalcanzable: {exc!r}")

            try:
                created, rid = int(time.time()), "chatcmpl-" + uuid.uuid4().hex[:24]
                if want_stream:
                    return self._stream_out(upstream, rid, created, used_model)
                text, calls, usage = collect(upstream)
                message = {"role": "assistant", "content": text or None}
                if calls:
                    message["tool_calls"] = calls
                return self._json(200, {
                    "id": rid, "object": "chat.completion", "created": created,
                    "model": used_model,
                    "choices": [{"index": 0, "message": message,
                                 "finish_reason": "tool_calls" if calls else "stop"}],
                    "usage": usage_block(usage),
                })
            except (BrokenPipeError, ConnectionResetError):
                log("cliente cerro /v1/chat/completions")
            except Exception as exc:
                if want_stream:
                    # Ya se envio HTTP 200 + cabeceras SSE: una segunda respuesta
                    # JSON corromperia el stream. Cerrar es el unico wire valido.
                    self.close_connection = True
                    log(f"stream upstream interrumpido tras abrir SSE: {exc!r}")
                    return
                return self._error(502, f"stream upstream interrumpido: {exc!r}")
            finally:
                upstream.close()

        def _stream_out(self, upstream, rid, created, used_model):
            self.send_response(200)
            self.send_header("Content-Type", "text/event-stream")
            self.send_header("Cache-Control", "no-cache")
            self.send_header("Connection", "close")
            self.end_headers()

            def send(chunk):
                self.wfile.write(b"data: " + json.dumps(chunk).encode() + b"\n\n")
                self.wfile.flush()

            def envelope(delta, finish=None):
                return {"id": rid, "object": "chat.completion.chunk", "created": created,
                        "model": used_model,
                        "choices": [{"index": 0, "delta": delta, "finish_reason": finish}]}

            try:
                send(envelope({"role": "assistant", "content": ""}))
                calls, usage = [], {}
                for event, data in iter_events(upstream):
                    if event == "response.output_text.delta":
                        send(envelope({"content": data.get("delta", "")}))
                    elif event == "response.output_item.done":
                        item = data.get("item", {})
                        if item.get("type") == "function_call":
                            idx = len(calls)
                            calls.append(item)
                            send(envelope({"tool_calls": [{
                                "index": idx, "id": item.get("call_id"), "type": "function",
                                "function": {"name": item.get("name"),
                                             "arguments": item.get("arguments", "{}")}}]}))
                    elif event == "response.completed":
                        usage = (data.get("response") or {}).get("usage", {}) or {}
                final = envelope({}, "tool_calls" if calls else "stop")
                final["usage"] = usage_block(usage)
                send(final)
                self.wfile.write(b"data: [DONE]\n\n")
                self.wfile.flush()
            except (BrokenPipeError, ConnectionResetError, TimeoutError, OSError) as exc:
                log(f"stream de chat interrumpido: {exc!r}")

        # ── /v1/responses ──────────────────────────────────────────────────────
        #
        # POR QUE EXISTE (2026-08-12). Codex >= 0.143 BORRO `wire_api = "chat"`:
        # arrancar con el valor viejo es un error duro ("no longer supported, set
        # wire_api = responses"). O sea que para que el Codex del usuario hable
        # con LiteLLM hay una sola via, la Responses API, y LiteLLM NO la traduce
        # para un backend `openai/`: reenvia el POST a {api_base}/responses tal
        # cual. Sin esta ruta ese reenvio era un 404 del puente y el 404 se veia
        # como "no deployments available" tras los reintentos.
        #
        # Es la ruta de MENOS traduccion del fichero: el cliente habla Responses y
        # el upstream habla Responses. Se imponen los invariantes del upstream
        # (stream, store, modelo de la allowlist) y se relega el SSE VERBATIM, que
        # es lo que deja intactos los items de reasoning y de tool que Codex
        # necesita -- convertir a chat/completions y volver los destruye.
        def _do_responses(self):
            if not self._authorized():
                return self._error(401, "invalid bridge api key")
            admission = self._acquire_admission()
            if admission is None:
                return
            with admission:
                return self._do_responses_admitted()

        def _do_responses_admitted(self):
            try:
                length = int(self.headers.get("Content-Length", 0))
                req = json.loads(self.rfile.read(length) or b"{}")
            except (ValueError, json.JSONDecodeError) as exc:
                return self._error(400, f"cuerpo ilegible: {exc}")

            want_stream = bool(req.get("stream"))
            payload = to_upstream_responses(req)
            try:
                upstream = open_upstream(payload)
            except urllib.error.HTTPError as exc:
                extra_headers = upstream_error_headers(exc)
                try:
                    detail = exc.read()[:500].decode(errors="replace")
                finally:
                    exc.close()
                return self._error(exc.code, f"upstream: {detail}", extra_headers)
            except Exception as exc:
                return self._error(502, f"upstream inalcanzable: {exc!r}")

            try:
                if want_stream:
                    return self._relay_sse(upstream)
                # Cliente en modo no-stream: se agrega. El objeto final lo da el
                # propio upstream en `response.completed`... pero VIENE CON
                # `output: []` (verificado 2026-08-12): los items se emiten por
                # `response.output_item.done` y el objeto final NO los repite. Sin
                # recogerlos, un cliente no-stream recibe 200 con cero texto -- el
                # peor fallo posible, porque parece que el modelo no dijo nada.
                final, items = None, []
                for event, data in iter_events(upstream):
                    if event == "response.output_item.done":
                        item = data.get("item")
                        if item:
                            items.append(item)
                    elif event in (
                        "response.completed", "response.incomplete", "response.failed"
                    ):
                        final = data.get("response") or data
                if final is None:
                    return self._error(502, "el upstream cerro sin response.completed")
                if not final.get("output") and items:
                    final["output"] = items
                return self._json(200, final)
            except (BrokenPipeError, ConnectionResetError):
                log("cliente cerro /v1/responses")
            except Exception as exc:
                if want_stream:
                    self.close_connection = True
                    log(f"stream responses interrumpido tras abrir SSE: {exc!r}")
                    return
                return self._error(502, f"stream upstream interrumpido: {exc!r}")
            finally:
                upstream.close()

        def _relay_sse(self, upstream):
            """Reenvia el SSE del upstream sin tocarlo, trozo a trozo."""
            self.send_response(200)
            self.send_header("Content-Type", "text/event-stream")
            self.send_header("Cache-Control", "no-cache")
            self.send_header("Connection", "close")
            self.end_headers()
            try:
                for raw in upstream:
                    self.wfile.write(raw)
                    if raw.endswith(b"\n\n") or raw == b"\n":
                        self.wfile.flush()
                self.wfile.flush()
            except (BrokenPipeError, ConnectionResetError, TimeoutError, OSError) as exc:
                log(f"stream de /v1/responses interrumpido: {exc!r}")


    def main():
        load_tokens()
        # Aditivo y de una sola vez: deja el Secret auto-descriptivo. Si falla,
        # el fallback al claim del id_token sigue cubriendo al panel.
        backfill_account_email()
        port = int(os.environ.get("PORT", "8080"))
        log(f"escuchando en :{port} | modelos={ALLOWED_MODELS} | por defecto={UPSTREAM_MODEL}")
        ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()


    if __name__ == "__main__":
        main()
  rotate.py: |
    """Rotador del token OAuth de Codex. Lo ejecuta un CronJob cada 6 h.

    Es el ÚNICO que rota en condiciones normales: el bridge solo lo hace como
    último recurso, porque cada refresh invalida el refresh_token anterior y deja
    fuera a cualquier otro consumidor de la misma credencial.

    Cuándo refresca — OpenAI dicta el calendario, no nosotros. La respuesta del
    refresh trae `earliest_refresh_at` (~9 días) junto a un access_token que vive
    10, así que hay una ventana de ~1 día para rotar. Con el cron cada 6 h se
    entra en esa ventana 4 veces antes de que caduque nada. Pedirlo antes de
    `earliest_refresh_at` es tirar cuota contra un endpoint que va a decir que no.
    """

    import base64
    import calendar
    import json
    import os
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.request

    TOKEN_URL = "https://auth.openai.com/oauth/token"
    CLIENT_ID = os.environ.get("CODEX_CLIENT_ID", "app_EMoamEEZ73f0CkXaXp7hrann")
    NAMESPACE = os.environ.get("POD_NAMESPACE", "litellm")
    SECRET_NAME = os.environ.get("SECRET_NAME", "codex-bridge-auth")
    SECRET_KEY = os.environ.get("SECRET_KEY", "auth.json")
    # Sin `earliest_refresh_at` guardado (primer arranque), este es el criterio.
    FALLBACK_MARGIN = int(os.environ.get("FALLBACK_MARGIN_SECONDS", str(48 * 3600)))

    API = "https://kubernetes.default.svc"
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    # Master/replica (2026-08-14): el mismo Lease que gatea el refresh de
    # emergencia de los bridges. Este cron es el rotador NORMAL, asi que si el
    # Lease esta cogido (una emergencia en vuelo), espera y reintenta -- y si
    # sigue cogido, se va: la emergencia ya rota, y el proximo cron es en 6 h.
    POD_NAME = os.environ.get("POD_NAME", "codex-rotate-job")
    LEASE_NAME = os.environ.get("LEASE_NAME", "codex-bridge-refresh")
    LEASE_TTL = int(os.environ.get("LEASE_TTL_SECONDS", "120"))


    def log(msg):
        print(f"[codex-rotate] {msg}", flush=True)


    def k8s(method, path, body=None, content_type="application/merge-patch+json"):
        with open(f"{SA_DIR}/token") as fh:
            token = fh.read()
        headers = {"Authorization": "Bearer " + token}
        if body is not None:
            headers["Content-Type"] = content_type
        req = urllib.request.Request(API + path, data=body, method=method, headers=headers)
        ctx = ssl.create_default_context(cafile=f"{SA_DIR}/ca.crt")
        return json.loads(urllib.request.urlopen(req, timeout=30, context=ctx).read())


    def _lease_now():
        return time.strftime("%Y-%m-%dT%H:%M:%S.000000Z", time.gmtime())


    def acquire_lease():
        path = f"/apis/coordination.k8s.io/v1/namespaces/{NAMESPACE}/leases/{LEASE_NAME}"
        try:
            lease = k8s("GET", path)
        except urllib.error.HTTPError as exc:
            if exc.code != 404:
                raise
            body = json.dumps({
                "apiVersion": "coordination.k8s.io/v1", "kind": "Lease",
                "metadata": {"name": LEASE_NAME, "namespace": NAMESPACE},
                "spec": {"holderIdentity": POD_NAME,
                         "leaseDurationSeconds": LEASE_TTL,
                         "acquireTime": _lease_now(), "renewTime": _lease_now()},
            }).encode()
            try:
                k8s("POST",
                    f"/apis/coordination.k8s.io/v1/namespaces/{NAMESPACE}/leases",
                    body, content_type="application/json")
                return True
            except urllib.error.HTTPError:
                return False
        spec = lease.get("spec") or {}
        holder = spec.get("holderIdentity") or ""
        try:
            renew = float(calendar.timegm(time.strptime(
                (spec.get("renewTime") or "").split(".")[0],
                "%Y-%m-%dT%H:%M:%S")))
        except Exception:
            renew = 0.0
        if holder and holder != POD_NAME and (time.time() - renew) <= LEASE_TTL:
            return False
        lease["spec"] = {"holderIdentity": POD_NAME,
                         "leaseDurationSeconds": LEASE_TTL,
                         "acquireTime": _lease_now(), "renewTime": _lease_now()}
        try:
            k8s("PUT", path, json.dumps(lease).encode(), content_type="application/json")
            return True
        except urllib.error.HTTPError:
            return False


    def release_lease():
        path = f"/apis/coordination.k8s.io/v1/namespaces/{NAMESPACE}/leases/{LEASE_NAME}"
        try:
            lease = k8s("GET", path)
            if (lease.get("spec") or {}).get("holderIdentity") != POD_NAME:
                return
            lease["spec"]["holderIdentity"] = ""
            k8s("PUT", path, json.dumps(lease).encode(), content_type="application/json")
        except Exception:
            pass  # expira solo en LEASE_TTL


    def jwt_exp(token):
        try:
            payload = token.split(".")[1]
            payload += "=" * (-len(payload) % 4)
            return json.loads(base64.urlsafe_b64decode(payload)).get("exp", 0)
        except Exception:
            return 0


    def main():
        secret = k8s("GET", f"/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}")
        auth = json.loads(base64.b64decode(secret["data"][SECRET_KEY]))
        tokens = auth.get("tokens", auth)

        now = time.time()
        exp = jwt_exp(tokens.get("access_token", ""))
        earliest = auth.get("earliest_refresh_at", 0)
        left_h = (exp - now) / 3600
        log(f"access token caduca en {left_h:.1f} h")

        if earliest:
            if now < earliest:
                log(f"OpenAI no admite refresh hasta dentro de "
                    f"{(earliest - now) / 3600:.1f} h: no toco nada")
                return 0
            log("dentro de la ventana que marca earliest_refresh_at: rotando")
        elif exp - now > FALLBACK_MARGIN:
            log("sin earliest_refresh_at y queda margen de sobra: no toco nada")
            return 0

        got = False
        for intento in range(3):
            got = acquire_lease()
            if got:
                break
            log(f"Lease {LEASE_NAME} cogido (refresh de emergencia en vuelo); "
                f"espero 20 s ({intento + 1}/3)")
            time.sleep(20)
        if not got:
            log("el Lease sigue cogido: la emergencia ya esta rotando por mi. "
                "Me voy; el proximo cron entra en 6 h.")
            return 0

        body = json.dumps({
            "client_id": CLIENT_ID,
            "grant_type": "refresh_token",
            "refresh_token": tokens["refresh_token"],
            "scope": "openid profile email",
        }).encode()
        req = urllib.request.Request(TOKEN_URL, data=body, method="POST",
                                     headers={"Content-Type": "application/json"})
        try:
            fresh = json.loads(urllib.request.urlopen(req, timeout=30).read())
        except urllib.error.HTTPError as exc:
            release_lease()
            detail = exc.read()[:300].decode(errors="replace")
            log(f"ERROR: el refresh devolvió {exc.code}: {detail}")
            log("La credencial ya no sirve. Resiembra el Secret desde un "
                "`codex login` reciente (ver cabecera de codex-bridge.yaml).")
            return 1

        tokens["access_token"] = fresh["access_token"]
        if fresh.get("refresh_token"):
            rotated = fresh["refresh_token"] != tokens.get("refresh_token")
            tokens["refresh_token"] = fresh["refresh_token"]
            log(f"refresh OK (refresh_token {'ROTADO' if rotated else 'estable'})")
        if fresh.get("id_token"):
            tokens["id_token"] = fresh["id_token"]
        auth["tokens"] = tokens
        if fresh.get("earliest_refresh_at"):
            auth["earliest_refresh_at"] = fresh["earliest_refresh_at"]
        auth["last_refresh"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

        payload = base64.b64encode(json.dumps(auth, indent=2).encode()).decode()
        k8s("PATCH", f"/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}",
            json.dumps({"data": {SECRET_KEY: payload}}).encode())
        log(f"Secret actualizado; nuevo access token vive "
            f"{(jwt_exp(tokens['access_token']) - time.time()) / 3600:.1f} h")
        release_lease()
        log("El bridge lo recoge solo del volumen; el Mac, con codex-auth-sync.")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
