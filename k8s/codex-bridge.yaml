  namespace: litellm
spec:
  # Master/replica (2026-08-14): dos pods sirven, refrescar exige el Lease
  # `codex-bridge-refresh`.
  replicas: 2
  selector: { matchLabels: { app: codex-bridge } }
  template:
    metadata:
      labels: { app: codex-bridge }
      annotations:
        # El codigo del puente vive en un ConfigMap y se lee al arrancar: sin esto
        # un cambio en bridge.py se sincroniza y NO rota el pod.
        config.k8s.e-dani.com/revision: bridge-7a828a27b1a5
    spec:
      serviceAccountName: codex-bridge
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
        node-pool: ks5-nvme
      # HA real: una replica por nodo. `required`, no `preferred` -- dos copias
      # en el mismo ks5 no sobreviven a su reinicio de Ansible.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: { matchLabels: { app: codex-bridge } }
      containers:
        - name: bridge
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/code/bridge.py"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
            - { name: AUTH_FILE, value: /auth/auth.json }
            - { name: ALLOWED_MODELS, value: "gpt-5.6-sol,gpt-5.6-sol-wm,gpt-5.6-terra,gpt-5.6-luna,gpt-5.3-codex-spark,gpt-5.5,gpt-5.4,gpt-5.4-mini,codex-auto-review" }
            - { name: UPSTREAM_MODEL, value: gpt-5.6-sol }
            - { name: SECRET_NAME, value: codex-bridge-auth }
            - { name: LEASE_NAME, value: codex-bridge-refresh }
            - { name: MAX_INFLIGHT, value: "2" }
            - { name: MAX_QUEUE, value: "8" }
            - { name: ADMISSION_TIMEOUT_SECONDS, value: "600" }
            - { name: ADMISSION_RETRY_AFTER_SECONDS, value: "5" }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            # Mismo motivo que en `codex-bridge-edani`, donde esta la medicion
            # entera. El gate limita a 2 activos + 8 waiters, pero el servidor
            # aun crea hilos efimeros para rechazar con 503 una rafaga que ya
            # lleno la cola. Mantener dos arenas sigue acotando ese churn.
            - { name: MALLOC_ARENA_MAX, value: "2" }
            - { name: MALLOC_TRIM_THRESHOLD_, value: "131072" }
          volumeMounts:
            - { name: code, mountPath: /code, readOnly: true }
            - { name: auth, mountPath: /auth, readOnly: true }
