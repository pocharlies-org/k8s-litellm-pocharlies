  namespace: litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-bridge-edani
subjects:
  - kind: ServiceAccount
    name: codex-bridge-edani
    namespace: litellm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-bridge-edani
  namespace: litellm
spec:
  # La credencial `codex-bridge-edani-auth` se crea fuera de Git antes de
  # publicar este cambio. Un DEPLOYMENT por cuenta mantiene separados los
  # refresh tokens; desde 2026-08-14 cada cuenta corre master/replica: dos pods
  # sirven y refrescar exige el Lease `codex-bridge-edani-refresh`.
  # Temporalmente desactivado: la sesión OAuth de e-dani está invalidada.
  replicas: 0
  selector: { matchLabels: { app: codex-bridge-edani } }
  template:
    metadata:
      labels: { app: codex-bridge-edani }
      annotations:
        # Igual que el otro: el codigo se lee al arrancar, asi que un cambio en
        # bridge.py NO rota el pod sin tocar esto.
        config.k8s.e-dani.com/revision: bridge-7a828a27b1a5
    spec:
      serviceAccountName: codex-bridge-edani
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
        node-pool: ks5-nvme
      # HA real: una replica por nodo. `required`, no `preferred` -- dos copias
      # en el mismo ks5 no sobreviven a su reinicio de Ansible.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: { matchLabels: { app: codex-bridge-edani } }
      containers:
        - name: bridge
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/code/bridge.py"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
            - { name: AUTH_FILE, value: /auth/auth.json }
            - { name: ALLOWED_MODELS, value: "gpt-5.6-sol,gpt-5.6-sol-wm,gpt-5.6-terra,gpt-5.6-luna,gpt-daybreak-blue-latest,gpt-5.3-codex-spark,gpt-5.5,gpt-5.4,gpt-5.4-mini,codex-auto-review" }
            - { name: UPSTREAM_MODEL, value: gpt-5.6-sol }
            - { name: SECRET_NAME, value: codex-bridge-edani-auth }
            - { name: LEASE_NAME, value: codex-bridge-edani-refresh }
            - { name: MAX_INFLIGHT, value: "2" }
            - { name: MAX_QUEUE, value: "8" }
            - { name: ADMISSION_TIMEOUT_SECONDS, value: "600" }
            - { name: ADMISSION_RETRY_AFTER_SECONDS, value: "5" }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            # Arenas de glibc (2026-08-15). Este puente moria por OOM cada 1-2 h
            # contra el limite de 1Gi -- 5 reinicios en 7 h -- y NO era una fuga
            # de objetos de Python: los unicos globales del bridge son _tokens,
            # _quota, _earliest_refresh y _last_emergency_at, y ninguno guarda
            # peticiones.
            #
            # Lo que hay es fragmentacion de malloc. En /proc/1/smaps una arena
            # de glibc se ve como DOS regiones adyacentes -- la parte
            # comprometida `rw-p` y el resto `---p` -- que suman exactamente
            # 64MB (HEAP_MAX_SIZE). Contando parejas en un pod vivo:
            #     41 arenas, 636MB usados de 645MB de RSS anonima total.
            # O sea el 98,6% de la memoria del proceso metida en arenas.
            #
            # Antes del gate de admision del 2026-08-20, el puente era un
            # ThreadingHTTPServer SIN tope (se contaron entre 4 y 35 hilos vivos,
            # y HTTP/1.1 los mantenia con keep-alive). Ahora solo retiene 2
            # activos + 8 waiters por pod; puede crear hilos efimeros para
            # rechazar el exceso. glibc da una arena a cada hilo y, con nproc=8,
            # el techo por defecto sigue siendo 8*nproc = 64 arenas de 64MB.
            #
            # PRECISION SOBRE EL MECANISMO (auditoria adversarial del 15-08, que
            # corrigio la primera version de este comentario). Es FALSO que "las
            # arenas no se devuelven al SO" a secas. Reproducido en
            # python:3.12-slim con la MISMA cadena de glibc que el pod
            # (Debian GLIBC 2.41-12+deb13u3), tres ejecuciones por configuracion:
            #   sin superviviente:  13332-13344 kB retenidos, 11 arenas
            #   con superviviente:  418588-418704 kB retenidos, 20 arenas
            # O sea que la arena se devuelve BIEN mientras no sobreviva nada
            # dentro. Basta UNA asignacion pequena viva en lo alto del heap --4KB
            # por hilo en el laboratorio-- para fijar la arena entera. La
            # condicion es "arena + superviviente", no "arena". Cual es el
            # superviviente concreto dentro del bridge NO esta demostrado: se
            # sospecha de las cadenas que cada peticion deja en _quota/_tokens,
            # pero es inferencia, no medicion.
            #
            # COMO SE DESCARTO que fuera una fuga de Python, por si vuelve:
            #   - La memoria sube con el pod OCIOSO: a las 01:54 habia 4 hilos
            #     (nada en vuelo) y paso de 503 a 548Mi igual.
            #   - Sube proporcional a los bytes recibidos: 0,68-0,75 Mi por MB.
            #   - El numero de arenas sube monotono (34 -> 37 -> 40 -> 41)
            #     mientras los hilos vivos oscilan (13 -> 35 -> 26): siguen al
            #     churn ACUMULADO de hilos, no a los que hay.
            #   - Un bajon de 775 a 142Mi en kubectl top NO era memoria
            #     liberada, era el OOMKill numero 5. Mirar restartCount antes de
            #     concluir que el proceso libera.
            #
            # El gemelo `codex-bridge` no reventaba porque su cuenta tiene la
            # cuota agotada y contesta 429 sin procesar cuerpo. NO es un control
            # limpio, y la primera version de este comentario lo daba por tal:
            # cuando la carga la tenia EL, murio 8 veces entre las 11:16 y las
            # 13:16 UTC del 14-08. Muere el que tiene la carga -- que es una
            # PREDICCION de este mecanismo, no una explicacion rival. Por eso
            # lleva las mismas variables.
            #
            # DOS CORRECCIONES A NUMEROS DE APOYO, para que nadie los reutilice:
            #   - "cuerpos de peticion de 30-40MB" era INFERIDO del mapa de
            #     memoria y es FALSO. Medido: media ~71,9 KB y maximo ~1,05 MB
            #     (Langfuse tapa el input observado en 983.439 B en 12h). El
            #     mecanismo no necesita cuerpos grandes: 1MB de JSON construye un
            #     grafo de objetos varias veces mayor.
            #   - "5,3 GB en 53 min" no se reproduce. Medicion independiente:
            #     ~1,1 GiB/h por pod.
            #
            # De las dos variables la que carga el peso es MALLOC_ARENA_MAX.
            # MALLOC_TRIM_THRESHOLD_ salio INDISTINGUIBLE de no poner nada en el
            # laboratorio (418572-418644 kB con trim solo, contra 418588-418704
            # kB sin env), y no aporta nada encima de ARENA_MAX. Se deja porque
            # quitarlo cuesta un rollout y no molesta, pero no le atribuyas el
            # arreglo.
            #
            # NO bajar a MALLOC_ARENA_MAX=1 pese a que retiene menos (7252 kB en
            # el laboratorio): con 19-28 hilos serializa todo malloc contra la
            # arena principal.
            #
            # RESULTADO EN PRODUCCION, 45 min de A/B con 25% MAS trafico por
            # minuto que la linea base: pendiente de 0,797 Mi/MB a 0,0115 Mi/MB
            # (46-69x), y 1 arena donde antes se contaban 41. 608 MB recibidos
            # habrian predicho +484 Mi a la pendiente vieja; se midieron +7,0 Mi.
            - { name: MALLOC_ARENA_MAX, value: "2" }
            - { name: MALLOC_TRIM_THRESHOLD_, value: "131072" }
          volumeMounts:
            - { name: code, mountPath: /code, readOnly: true }
            - { name: auth, mountPath: /auth, readOnly: true }
          resources:
            # 2026-08-14: los dos bridges vivian a 195-223Mi contra un limite de
            # 256Mi y murieron por OOM 8 y 15 veces -- cada muerte es "Cannot
            # connect to host codex-bridge*" en todo el trafico de ChatGPT.
            # NO se replica: cada refresh ROTA el refresh_token (ver cabecera),
            # dos replicas se invalidarian la sesion mutuamente. HA real =
            # separar el refresco a un lider unico; mientras, aire de memoria.
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: code
          configMap: { name: codex-bridge-code }
        - name: auth
          secret: { secretName: codex-bridge-edani-auth }
---
apiVersion: v1
kind: Service
metadata:
  name: codex-bridge-edani
  namespace: litellm
spec:
  selector: { app: codex-bridge-edani }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
# Su propio rotador. Desplazado media hora del de la otra cuenta: comparten el
# ConfigMap de código y el mismo endpoint de OpenAI, y no hay motivo para que
# coincidan.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: codex-token-rotate-edani
  namespace: litellm
spec:
  schedule: "47 */6 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: codex-bridge-edani
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/arch: amd64
            node-pool: ks5-nvme
          containers:
            - name: rotate
              image: python:3.12-slim
              imagePullPolicy: IfNotPresent
              command: ["python", "-u", "/code/rotate.py"]
              env:
                - { name: SECRET_NAME, value: codex-bridge-edani-auth }
                - { name: LEASE_NAME, value: codex-bridge-edani-refresh }
                - name: POD_NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
              volumeMounts:
                - { name: code, mountPath: /code, readOnly: true }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
          volumes:
            - name: code
              configMap: { name: codex-bridge-code }
