---
# Puente OpenAI-compatible sobre la suscripción ChatGPT (Codex OAuth).
#
# POR QUÉ EXISTE
#
# La cuenta ChatGPT Pro del usuario puede servir modelos GPT-5.6 por el mismo endpoint
# que usa el CLI de Codex (chatgpt.com/backend-api/codex/responses), sin API key
# de pago por token. Ese endpoint NO habla el dialecto OpenAI clásico: exige el
# Responses API con streaming obligatorio y cabeceras propias. Este puente hace
# la traducción para que LiteLLM lo consuma como un backend `openai/` normal, y
# así cualquier cliente del gateway (Aurora incluida) pueda usarlo sin cambios.
#
# LÍMITES CONOCIDOS (verificados contra el endpoint real el 2026-08-05)
#
#   - La cuenta sirve varios modelos, no uno: `gpt-5.6-sol`, `gpt-5.6-terra`,
#     `gpt-5.6-luna` y `gpt-5.5`. Los sufijos de la familia 5.6 son variantes
#     reales, no adornos. En cambio `gpt-5.6` a secas y los sufijos -codex,
#     -pro y -high devuelven 400 "not supported when using Codex with a
#     ChatGPT account", igual que gpt-5.2 y o3. El puente enruta por el modelo
#     que pida el cliente si está en ALLOWED_MODELS.
#   - `stream:false` devuelve 400: aguas arriba SIEMPRE se pide streaming y el
#     modo no-stream del cliente se sirve agregando la respuesta.
#   - La cuota es la MISMA que la del Codex interactivo del usuario, y OpenAI
#     estrangula por cliente: cargas masivas (p.ej. los RCA de Aurora) pueden
#     dejar sin Codex al usuario. Pensado para chat manual, no para RCA.
#
# CREDENCIALES
#
# Cuenta: daniel.ibanez@cloudblue.com (account c3edf899-f6be-4c82-b58d-7a16f5f8dd4d).
# Es una cuenta DISTINTA de la personal del usuario, a propósito: la cuota de
# ChatGPT es por cuenta, y con la personal cualquier carga de Aurora se comía el
# cupo del Codex interactivo. Al separarlas ya no compiten.
#
# El Secret `codex-bridge-auth` NO está en git. La credencial es una sesión OAuth
# PROPIA del puente, creada con `codex login --device-auth`: no la comparte con
# nadie, ni con el Codex del usuario ni con los perfiles de OpenClaw. Eso importa
# porque cada refresh ROTA el refresh_token, así que dos consumidores de la misma
# credencial acaban expulsándose el uno al otro.
#
# El puente refresca el access token cuando le queda menos de una hora y persiste
# el resultado en este mismo Secret (de ahí el Role de abajo).
#
# PARA REHACERLA (si el refresh empieza a devolver 401) — no es evidente: el CLI
# oficial de Codex no está en el Mac, pero sí dentro del pod de OpenClaw, y el
# flujo de dispositivo evita depender de un callback local (el puerto 1455 lo
# ocupa VS Code en el Mac):
#
#   kubectl -n openclaw-qwen36 exec deploy/openclaw-qwen36-openclaw -c openclaw -- \
#     sh -c 'mkdir -p /data/.codex-bridge && CODEX_HOME=/data/.codex-bridge codex login --device-auth'
#
# Imprime una URL y un código: se abre en el navegador, se entra con la cuenta
# daniel.ibanez@cloudblue.com y se autoriza. Después se vuelca ese auth.json al
# Secret y SE BORRA /data/.codex-bridge, o queda una credencial huérfana viva en
# el volumen de OpenClaw que nadie recordará revocar.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-bridge
  namespace: litellm
---
# Solo su propio Secret, y solo para poder guardar los tokens ya rotados.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-bridge
  namespace: litellm
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["codex-bridge-auth"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-bridge
  namespace: litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-bridge
subjects:
  - kind: ServiceAccount
    name: codex-bridge
    namespace: litellm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-bridge-code
  namespace: litellm
data:
  bridge.py: |
    """Puente OpenAI-compatible sobre la cuenta ChatGPT/Codex.

    Expone /v1/chat/completions y traduce a chatgpt.com/backend-api/codex/responses,
    que es el endpoint que usa el CLI de Codex con credenciales OAuth de suscripción
    (no API key de pago). LiteLLM lo consume como un backend `openai/` cualquiera.

    Restricciones del upstream, verificadas contra el endpoint real (2026-08-05):
      - `stream: false` devuelve 400 "Stream must be set to true". SIEMPRE se pide
        streaming aguas arriba; el modo no-stream del cliente se sirve agregando.
      - La cuenta ChatGPT no sirve cualquier modelo. Responden `gpt-5.6-sol`,
        `gpt-5.6-terra`, `gpt-5.6-luna` y `gpt-5.5`; devuelven 400 "not supported
        when using Codex with a ChatGPT account" el `gpt-5.6` a secas y los
        sufijos -codex, -pro y -high, además de gpt-5.2 y o3. Los sufijos de la
        familia 5.6 son variantes reales (sol/terra/luna), no adornos, así que la
        lista se mantiene explícita en ALLOWED_MODELS: lo que no esté ahí cae al
        modelo por defecto en vez de provocar un 400 del upstream.
      - Emite items `reasoning` que no son texto de respuesta y se descartan.
      - SÍ acepta imágenes (2026-08-11), y es lo único del gateway que ve mientras
        el residente del DGX sea DeepSeek. Van como `input_image` con `image_url`
        STRING — el objeto `{"url": ...}` de chat/completions da 400. Ver
        to_input_parts().

    Solo stdlib: la imagen es un python:3.x-slim sin pip install en el arranque.
    """

    import json
    import os
    import base64
    import threading
    import time
    import urllib.error
    import urllib.request
    import uuid
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM_URL = "https://chatgpt.com/backend-api/codex/responses"
    TOKEN_URL = "https://auth.openai.com/oauth/token"
    # client_id de la app Codex CLI, leído del claim `aud` del id_token de ~/.codex/auth.json
    CLIENT_ID = os.environ.get("CODEX_CLIENT_ID", "app_EMoamEEZ73f0CkXaXp7hrann")
    ALLOWED_MODELS = [m.strip() for m in os.environ.get(
        "ALLOWED_MODELS", "gpt-5.6-sol,gpt-5.6-terra,gpt-5.6-luna,gpt-5.5").split(",") if m.strip()]
    UPSTREAM_MODEL = os.environ.get("UPSTREAM_MODEL", ALLOWED_MODELS[0])
    BRIDGE_API_KEY = os.environ.get("BRIDGE_API_KEY", "")
    AUTH_FILE = os.environ.get("AUTH_FILE", "/auth/auth.json")
    SECRET_NAME = os.environ.get("SECRET_NAME", "codex-bridge-auth")
    NAMESPACE = os.environ.get("POD_NAMESPACE", "litellm")
    REFRESH_MARGIN = int(os.environ.get("REFRESH_MARGIN_SECONDS", "3600"))

    _lock = threading.Lock()
    _tokens = {}
    _earliest_refresh = 0


    def log(msg):
        print(f"[codex-bridge] {msg}", flush=True)


    # --------------------------------------------------------------------------
    # Credenciales
    # --------------------------------------------------------------------------

    def _jwt_exp(token):
        try:
            payload = token.split(".")[1]
            payload += "=" * (-len(payload) % 4)
            return json.loads(base64.urlsafe_b64decode(payload)).get("exp", 0)
        except Exception:
            return 0


    def read_auth_file():
        with open(AUTH_FILE) as fh:
            return json.load(fh)


    def load_tokens():
        global _tokens, _earliest_refresh
        data = read_auth_file()
        _tokens = data["tokens"] if "tokens" in data else data
        _earliest_refresh = data.get("earliest_refresh_at", 0)
        log(f"credenciales cargadas, access_token exp={_jwt_exp(_tokens['access_token'])}")


    def persist_tokens():
        """Guarda los tokens rotados en el Secret. Sin esto, cada reinicio del pod
        volvería al refresh_token viejo, que el rotado puede haber invalidado."""
        try:
            with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as fh:
                sa = fh.read()
            current = read_auth_file()
            current["tokens"] = _tokens
            if _earliest_refresh:
                current["earliest_refresh_at"] = _earliest_refresh
            payload = json.dumps(current, indent=2).encode()
            body = json.dumps({
                "data": {"auth.json": base64.b64encode(payload).decode()}
            }).encode()
            req = urllib.request.Request(
                f"https://kubernetes.default.svc/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}",
                data=body, method="PATCH",
                headers={"Authorization": "Bearer " + sa,
                         "Content-Type": "application/merge-patch+json"})
            ctx = __import__("ssl").create_default_context(
                cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
            urllib.request.urlopen(req, timeout=15, context=ctx).read()
            log("tokens rotados persistidos en el Secret")
        except Exception as exc:  # no es fatal: el token en memoria sigue sirviendo
            log(f"AVISO: no pude persistir los tokens rotados: {exc!r}")


    def refresh_if_needed():
        """Asegura un access token vivo, refrescando lo menos posible.

        Quien rota de forma normal es el CronJob `codex-token-rotate`, que deja las
        credenciales nuevas en el Secret; el kubelet las propaga a este volumen en
        ~1 min. Por eso el orden es: (1) mirar si las de disco ya son más nuevas y
        adoptarlas, y solo (2) refrescar aquí si tampoco sirven. Refrescar por
        nuestra cuenta ROTA el refresh_token y deja fuera a los demás
        consumidores de la misma credencial, así que es el último recurso.
        """
        global _earliest_refresh
        with _lock:
            exp = _jwt_exp(_tokens.get("access_token", ""))
            if exp - time.time() > REFRESH_MARGIN:
                return
            try:
                disk = read_auth_file()
                disk_tokens = disk.get("tokens", disk)
                if _jwt_exp(disk_tokens.get("access_token", "")) > exp:
                    _tokens.update(disk_tokens)
                    _earliest_refresh = disk.get("earliest_refresh_at", _earliest_refresh)
                    exp = _jwt_exp(_tokens["access_token"])
                    log("credenciales recargadas del Secret (rotadas por el CronJob)")
                    if exp - time.time() > REFRESH_MARGIN:
                        return
            except Exception as exc:
                log(f"AVISO: no pude releer el Secret: {exc!r}")
            log("access token cerca de caducar y el Secret no trae uno mejor: refrescando")
            body = json.dumps({
                "client_id": CLIENT_ID,
                "grant_type": "refresh_token",
                "refresh_token": _tokens["refresh_token"],
                "scope": "openid profile email",
            }).encode()
            req = urllib.request.Request(
                TOKEN_URL, data=body, method="POST",
                headers={"Content-Type": "application/json"})
            try:
                data = json.loads(urllib.request.urlopen(req, timeout=30).read())
            except urllib.error.HTTPError as exc:
                log(f"ERROR refrescando ({exc.code}): hay que resembrar el Secret "
                    f"con un `codex login` nuevo")
                raise
            _tokens["access_token"] = data["access_token"]
            if data.get("refresh_token"):
                rotated = data["refresh_token"] != _tokens.get("refresh_token")
                _tokens["refresh_token"] = data["refresh_token"]
                log(f"refresh OK (refresh_token {'ROTADO' if rotated else 'estable'})")
            if data.get("id_token"):
                _tokens["id_token"] = data["id_token"]
            if data.get("earliest_refresh_at"):
                _earliest_refresh = data["earliest_refresh_at"]
            persist_tokens()


    # --------------------------------------------------------------------------
    # Traducción chat/completions -> responses
    # --------------------------------------------------------------------------

    def resolve_model(requested):
        """Traduce lo que pide el cliente a un modelo que el upstream acepte.

        LiteLLM manda el id sin su prefijo de provider, pero aquí llegan también
        nombres del selector de Aurora, así que se normaliza y se comprueba contra
        la allowlist. Un modelo desconocido cae al por defecto: es preferible
        responder con otro modelo que devolver el 400 del upstream.
        """
        if not requested:
            return UPSTREAM_MODEL
        name = str(requested).split("/")[-1]
        if name.endswith("-oauth"):
            name = name[: -len("-oauth")]
        if name in ALLOWED_MODELS:
            return name
        log(f"modelo no soportado por la cuenta ({requested!r}); uso {UPSTREAM_MODEL}")
        return UPSTREAM_MODEL


    def flatten_text(content):
        """Las partes de texto de un content, concatenadas. El resto se descarta."""
        if isinstance(content, list):
            return "".join(p.get("text", "") for p in content
                           if isinstance(p, dict) and p.get("type") in ("text", "input_text"))
        return content


    def image_url_of(part):
        """La URL de una parte de imagen, o None si no lo es.

        Acepta las dos formas que llegan por LiteLLM: la de chat/completions
        (`image_url` como objeto {"url": ...}) y la de la Responses API
        (`image_url` como string). Una `data:` URI vale igual que una http.
        """
        if not isinstance(part, dict) or part.get("type") not in ("image_url", "input_image", "image"):
            return None
        url = part.get("image_url")
        if isinstance(url, dict):
            url = url.get("url")
        return url or None


    def to_input_parts(content):
        """content de chat/completions -> partes de la Responses API, EN ORDEN.

        LAS IMAGENES VAN COMO STRING. Verificado contra el upstream real
        (2026-08-11): `{"type": "input_image", "image_url": "data:image/png;base64,..."}`
        se responde bien; la forma de chat/completions con el objeto
        `{"url": ...}` devuelve 400 «expected an image URL, but got an object
        instead». Traducirlo es justo el trabajo de este puente.

        Hasta hoy esto aplanaba a texto y las imagenes SE PERDIAN sin un solo log:
        el modelo contestaba a ciegas sobre lo que dijera el texto, que es peor que
        un error.
        """
        if not isinstance(content, list):
            return [{"type": "input_text", "text": content or ""}]
        parts = []
        for p in content:
            if not isinstance(p, dict):
                continue
            url = image_url_of(p)
            if url:
                part = {"type": "input_image", "image_url": url}
                src = p.get("image_url")
                detail = p.get("detail") or (src.get("detail") if isinstance(src, dict) else None)
                if detail:
                    part["detail"] = detail
                parts.append(part)
            elif p.get("type") in ("text", "input_text"):
                parts.append({"type": "input_text", "text": p.get("text", "")})
        return parts or [{"type": "input_text", "text": ""}]


    def to_responses_payload(req):
        instructions = []
        items = []
        for msg in req.get("messages", []):
            role = msg.get("role")
            raw_content = msg.get("content")
            # `instructions` es un string y los roles no-usuario no llevan imagen:
            # para todo lo que no sea el turno de usuario se aplana a texto, igual
            # que antes.
            content = flatten_text(raw_content)
            if role in ("system", "developer"):
                if content:
                    instructions.append(content)
            elif role == "tool":
                items.append({
                    "type": "function_call_output",
                    "call_id": msg.get("tool_call_id", ""),
                    "output": content if isinstance(content, str) else json.dumps(content),
                })
            elif role == "assistant":
                for call in msg.get("tool_calls") or []:
                    fn = call.get("function", {})
                    items.append({
                        "type": "function_call",
                        "call_id": call.get("id", ""),
                        "name": fn.get("name", ""),
                        "arguments": fn.get("arguments", "") or "{}",
                    })
                if content:
                    items.append({"type": "message", "role": "assistant",
                                  "content": [{"type": "output_text", "text": content}]})
            else:
                items.append({"type": "message", "role": "user",
                              "content": to_input_parts(raw_content)})

        payload = {
            "model": resolve_model(req.get("model")),
            "instructions": "\n\n".join(instructions) or "You are a helpful assistant.",
            "input": items,
            "stream": True,   # el upstream rechaza cualquier otra cosa
            "store": False,
        }
        tools = []
        for tool in req.get("tools") or []:
            fn = tool.get("function", tool)
            tools.append({
                "type": "function",
                "name": fn.get("name"),
                "description": fn.get("description", ""),
                "parameters": fn.get("parameters", {"type": "object", "properties": {}}),
                "strict": False,
            })
        if tools:
            payload["tools"] = tools
            choice = req.get("tool_choice")
            if choice in ("auto", "none", "required"):
                payload["tool_choice"] = choice
        return payload


    def open_upstream(payload):
        refresh_if_needed()
        req = urllib.request.Request(
            UPSTREAM_URL, data=json.dumps(payload).encode(), method="POST",
            headers={
                "Authorization": "Bearer " + _tokens["access_token"],
                "chatgpt-account-id": _tokens["account_id"],
                "OpenAI-Beta": "responses=experimental",
                "originator": "codex_cli_rs",
                "Content-Type": "application/json",
                "Accept": "text/event-stream",
                "session_id": str(uuid.uuid4()),
            })
        return urllib.request.urlopen(req, timeout=600)


    def iter_events(stream):
        """Trocea el SSE del upstream en (evento, data) sin cargarlo entero."""
        buf = b""
        for raw in stream:
            buf += raw
            while b"\n\n" in buf:
                block, buf = buf.split(b"\n\n", 1)
                event, data = None, None
                for line in block.decode(errors="replace").splitlines():
                    if line.startswith("event: "):
                        event = line[7:]
                    elif line.startswith("data: "):
                        data = line[6:]
                if event and data:
                    try:
                        yield event, json.loads(data)
                    except json.JSONDecodeError:
                        continue


    def collect(stream):
        """Consume el SSE y devuelve (texto, tool_calls, usage)."""
        text, calls, usage = [], [], {}
        for event, data in iter_events(stream):
            if event == "response.output_text.delta":
                text.append(data.get("delta", ""))
            elif event == "response.output_item.done":
                item = data.get("item", {})
                if item.get("type") == "function_call":
                    calls.append({
                        "id": item.get("call_id"),
                        "type": "function",
                        "function": {"name": item.get("name"),
                                     "arguments": item.get("arguments", "{}")},
                    })
            elif event == "response.completed":
                usage = (data.get("response") or {}).get("usage", {}) or {}
        return "".join(text), calls, usage


    def usage_block(usage):
        return {
            "prompt_tokens": usage.get("input_tokens", 0),
            "completion_tokens": usage.get("output_tokens", 0),
            "total_tokens": usage.get("total_tokens", 0),
        }


    # --------------------------------------------------------------------------
    # HTTP
    # --------------------------------------------------------------------------

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def log_message(self, fmt, *args):  # silencia el log por petición de stdlib
            pass

        def _json(self, code, obj):
            body = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def _error(self, code, message):
            log(f"error {code}: {message}")
            self._json(code, {"error": {"message": message, "type": "bridge_error",
                                        "code": code}})

        def _authorized(self):
            if not BRIDGE_API_KEY:
                return True
            return self.headers.get("Authorization", "") == "Bearer " + BRIDGE_API_KEY

        def do_GET(self):
            if self.path == "/health":
                exp = _jwt_exp(_tokens.get("access_token", ""))
                return self._json(200, {"status": "ok", "models": ALLOWED_MODELS,
                                        "default": UPSTREAM_MODEL,
                                        "token_expires_in_s": int(exp - time.time())})
            if self.path.rstrip("/") in ("/v1/models", "/models"):
                return self._json(200, {"object": "list", "data": [
                    {"id": m, "object": "model", "owned_by": "chatgpt-codex"}
                    for m in ALLOWED_MODELS]})
            return self._error(404, f"not found: {self.path}")

        def do_POST(self):
            if self.path.rstrip("/") not in ("/v1/chat/completions", "/chat/completions"):
                return self._error(404, f"not found: {self.path}")
            if not self._authorized():
                return self._error(401, "invalid bridge api key")
            try:
                length = int(self.headers.get("Content-Length", 0))
                req = json.loads(self.rfile.read(length) or b"{}")
            except (ValueError, json.JSONDecodeError) as exc:
                return self._error(400, f"cuerpo ilegible: {exc}")

            payload = to_responses_payload(req)
            used_model = payload["model"]
            want_stream = bool(req.get("stream"))
            try:
                upstream = open_upstream(payload)
            except urllib.error.HTTPError as exc:
                detail = exc.read()[:500].decode(errors="replace")
                return self._error(exc.code, f"upstream: {detail}")
            except Exception as exc:
                return self._error(502, f"upstream inalcanzable: {exc!r}")

            created, rid = int(time.time()), "chatcmpl-" + uuid.uuid4().hex[:24]
            if want_stream:
                self._stream_out(upstream, rid, created, used_model)
            else:
                text, calls, usage = collect(upstream)
                message = {"role": "assistant", "content": text or None}
                if calls:
                    message["tool_calls"] = calls
                self._json(200, {
                    "id": rid, "object": "chat.completion", "created": created,
                    "model": used_model,
                    "choices": [{"index": 0, "message": message,
                                 "finish_reason": "tool_calls" if calls else "stop"}],
                    "usage": usage_block(usage),
                })

        def _stream_out(self, upstream, rid, created, used_model):
            self.send_response(200)
            self.send_header("Content-Type", "text/event-stream")
            self.send_header("Cache-Control", "no-cache")
            self.send_header("Connection", "close")
            self.end_headers()

            def send(chunk):
                self.wfile.write(b"data: " + json.dumps(chunk).encode() + b"\n\n")
                self.wfile.flush()

            def envelope(delta, finish=None):
                return {"id": rid, "object": "chat.completion.chunk", "created": created,
                        "model": used_model,
                        "choices": [{"index": 0, "delta": delta, "finish_reason": finish}]}

            try:
                send(envelope({"role": "assistant", "content": ""}))
                calls, usage = [], {}
                for event, data in iter_events(upstream):
                    if event == "response.output_text.delta":
                        send(envelope({"content": data.get("delta", "")}))
                    elif event == "response.output_item.done":
                        item = data.get("item", {})
                        if item.get("type") == "function_call":
                            idx = len(calls)
                            calls.append(item)
                            send(envelope({"tool_calls": [{
                                "index": idx, "id": item.get("call_id"), "type": "function",
                                "function": {"name": item.get("name"),
                                             "arguments": item.get("arguments", "{}")}}]}))
                    elif event == "response.completed":
                        usage = (data.get("response") or {}).get("usage", {}) or {}
                final = envelope({}, "tool_calls" if calls else "stop")
                final["usage"] = usage_block(usage)
                send(final)
                self.wfile.write(b"data: [DONE]\n\n")
                self.wfile.flush()
            except (BrokenPipeError, ConnectionResetError):
                log("cliente cerró el stream")


    def main():
        load_tokens()
        port = int(os.environ.get("PORT", "8080"))
        log(f"escuchando en :{port} | modelos={ALLOWED_MODELS} | por defecto={UPSTREAM_MODEL}")
        ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()


    if __name__ == "__main__":
        main()
  rotate.py: |
    """Rotador del token OAuth de Codex. Lo ejecuta un CronJob cada 6 h.

    Es el ÚNICO que rota en condiciones normales: el bridge solo lo hace como
    último recurso, porque cada refresh invalida el refresh_token anterior y deja
    fuera a cualquier otro consumidor de la misma credencial.

    Cuándo refresca — OpenAI dicta el calendario, no nosotros. La respuesta del
    refresh trae `earliest_refresh_at` (~9 días) junto a un access_token que vive
    10, así que hay una ventana de ~1 día para rotar. Con el cron cada 6 h se
    entra en esa ventana 4 veces antes de que caduque nada. Pedirlo antes de
    `earliest_refresh_at` es tirar cuota contra un endpoint que va a decir que no.
    """

    import base64
    import json
    import os
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.request

    TOKEN_URL = "https://auth.openai.com/oauth/token"
    CLIENT_ID = os.environ.get("CODEX_CLIENT_ID", "app_EMoamEEZ73f0CkXaXp7hrann")
    NAMESPACE = os.environ.get("POD_NAMESPACE", "litellm")
    SECRET_NAME = os.environ.get("SECRET_NAME", "codex-bridge-auth")
    SECRET_KEY = os.environ.get("SECRET_KEY", "auth.json")
    # Sin `earliest_refresh_at` guardado (primer arranque), este es el criterio.
    FALLBACK_MARGIN = int(os.environ.get("FALLBACK_MARGIN_SECONDS", str(48 * 3600)))

    API = "https://kubernetes.default.svc"
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"


    def log(msg):
        print(f"[codex-rotate] {msg}", flush=True)


    def k8s(method, path, body=None):
        with open(f"{SA_DIR}/token") as fh:
            token = fh.read()
        headers = {"Authorization": "Bearer " + token}
        if body is not None:
            headers["Content-Type"] = "application/merge-patch+json"
        req = urllib.request.Request(API + path, data=body, method=method, headers=headers)
        ctx = ssl.create_default_context(cafile=f"{SA_DIR}/ca.crt")
        return json.loads(urllib.request.urlopen(req, timeout=30, context=ctx).read())


    def jwt_exp(token):
        try:
            payload = token.split(".")[1]
            payload += "=" * (-len(payload) % 4)
            return json.loads(base64.urlsafe_b64decode(payload)).get("exp", 0)
        except Exception:
            return 0


    def main():
        secret = k8s("GET", f"/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}")
        auth = json.loads(base64.b64decode(secret["data"][SECRET_KEY]))
        tokens = auth.get("tokens", auth)

        now = time.time()
        exp = jwt_exp(tokens.get("access_token", ""))
        earliest = auth.get("earliest_refresh_at", 0)
        left_h = (exp - now) / 3600
        log(f"access token caduca en {left_h:.1f} h")

        if earliest:
            if now < earliest:
                log(f"OpenAI no admite refresh hasta dentro de "
                    f"{(earliest - now) / 3600:.1f} h: no toco nada")
                return 0
            log("dentro de la ventana que marca earliest_refresh_at: rotando")
        elif exp - now > FALLBACK_MARGIN:
            log("sin earliest_refresh_at y queda margen de sobra: no toco nada")
            return 0

        body = json.dumps({
            "client_id": CLIENT_ID,
            "grant_type": "refresh_token",
            "refresh_token": tokens["refresh_token"],
            "scope": "openid profile email",
        }).encode()
        req = urllib.request.Request(TOKEN_URL, data=body, method="POST",
                                     headers={"Content-Type": "application/json"})
        try:
            fresh = json.loads(urllib.request.urlopen(req, timeout=30).read())
        except urllib.error.HTTPError as exc:
            detail = exc.read()[:300].decode(errors="replace")
            log(f"ERROR: el refresh devolvió {exc.code}: {detail}")
            log("La credencial ya no sirve. Resiembra el Secret desde un "
                "`codex login` reciente (ver cabecera de codex-bridge.yaml).")
            return 1

        tokens["access_token"] = fresh["access_token"]
        if fresh.get("refresh_token"):
            rotated = fresh["refresh_token"] != tokens.get("refresh_token")
            tokens["refresh_token"] = fresh["refresh_token"]
            log(f"refresh OK (refresh_token {'ROTADO' if rotated else 'estable'})")
        if fresh.get("id_token"):
            tokens["id_token"] = fresh["id_token"]
        auth["tokens"] = tokens
        if fresh.get("earliest_refresh_at"):
            auth["earliest_refresh_at"] = fresh["earliest_refresh_at"]
        auth["last_refresh"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

        payload = base64.b64encode(json.dumps(auth, indent=2).encode()).decode()
        k8s("PATCH", f"/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}",
            json.dumps({"data": {SECRET_KEY: payload}}).encode())
        log(f"Secret actualizado; nuevo access token vive "
            f"{(jwt_exp(tokens['access_token']) - time.time()) / 3600:.1f} h")
        log("El bridge lo recoge solo del volumen; el Mac, con codex-auth-sync.")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
