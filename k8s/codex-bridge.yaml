# Rotador del token. Sin esto la credencial caduca a los 10 días y el modelo
# los modelos gpt-5.6-* dejan de responder.
#
# Cada 6 h porque la ventana de rotación que concede OpenAI
# (earliest_refresh_at → expiración) es de ~1 día: cuatro intentos dentro de la
# ventana bastan y no se malgasta cuota fuera de ella. El script decide; el
# cron solo le da oportunidades.
#
# Lee el Secret por API en vez de montarlo: un volumen de Secret llega con
# hasta ~1 min de retraso y aquí se escribe justo lo que se acaba de leer.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: codex-token-rotate
  namespace: litellm
spec:
  schedule: "17 */6 * * *"
  # Forbid: dos rotaciones a la vez se pisarían el refresh_token entre ellas.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: codex-bridge
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/arch: amd64
            node-pool: ks5-nvme
          containers:
            - name: rotate
              image: python:3.12-slim
              imagePullPolicy: IfNotPresent
              command: ["python", "-u", "/code/rotate.py"]
              env:
                - { name: SECRET_NAME, value: codex-bridge-auth }
                - { name: LEASE_NAME, value: codex-bridge-refresh }
                - name: POD_NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
              volumeMounts:
                - { name: code, mountPath: /code, readOnly: true }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
          volumes:
            - name: code
              configMap: { name: codex-bridge-code }
