apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-bridge
  namespace: litellm
spec:
  replicas: 1
  selector: { matchLabels: { app: codex-bridge } }
  template:
    metadata:
      labels: { app: codex-bridge }
      annotations:
        # El codigo del puente vive en un ConfigMap y se lee al arrancar: sin esto
        # un cambio en bridge.py se sincroniza y NO rota el pod.
        config.k8s.e-dani.com/revision: image-passthrough-20260811
    spec:
      serviceAccountName: codex-bridge
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
        node-pool: ks5-nvme
      containers:
        - name: bridge
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/code/bridge.py"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
            - { name: AUTH_FILE, value: /auth/auth.json }
            - { name: ALLOWED_MODELS, value: "gpt-5.6-sol,gpt-5.6-terra,gpt-5.6-luna,gpt-5.5" }
            - { name: UPSTREAM_MODEL, value: gpt-5.6-sol }
            - { name: SECRET_NAME, value: codex-bridge-auth }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          volumeMounts:
            - { name: code, mountPath: /code, readOnly: true }
            - { name: auth, mountPath: /auth, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: code
          configMap: { name: codex-bridge-code }
        - name: auth
          secret: { secretName: codex-bridge-auth }
---
apiVersion: v1
kind: Service
metadata:
  name: codex-bridge
  namespace: litellm
spec:
  selector: { app: codex-bridge }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
# Rotador del token. Sin esto la credencial caduca a los 10 días y el modelo
# los modelos gpt-5.6-* dejan de responder.
#
# Cada 6 h porque la ventana de rotación que concede OpenAI
# (earliest_refresh_at → expiración) es de ~1 día: cuatro intentos dentro de la
# ventana bastan y no se malgasta cuota fuera de ella. El script decide; el
# cron solo le da oportunidades.
#
# Lee el Secret por API en vez de montarlo: un volumen de Secret llega con
# hasta ~1 min de retraso y aquí se escribe justo lo que se acaba de leer.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: codex-token-rotate
  namespace: litellm
spec:
  schedule: "17 */6 * * *"
  # Forbid: dos rotaciones a la vez se pisarían el refresh_token entre ellas.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: codex-bridge
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/arch: amd64
            node-pool: ks5-nvme
          containers:
            - name: rotate
              image: python:3.12-slim
              imagePullPolicy: IfNotPresent
              command: ["python", "-u", "/code/rotate.py"]
              env:
                - { name: SECRET_NAME, value: codex-bridge-auth }
                - name: POD_NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
              volumeMounts:
                - { name: code, mountPath: /code, readOnly: true }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
          volumes:
            - name: code
              configMap: { name: codex-bridge-code }
