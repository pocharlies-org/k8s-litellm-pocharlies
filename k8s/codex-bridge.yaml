            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: code
          configMap: { name: codex-bridge-code }
        - name: auth
          secret: { secretName: codex-bridge-auth }
