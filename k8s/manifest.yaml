# Secrets via ExternalSecret (Vault path: secret/litellm)
# vault kv put secret/litellm \
#   LITELLM_MASTER_KEY=<random-32-char> \
#   DATABASE_URL="postgresql://litellm:<pwd>@postgres-shared-rw.databases.svc.cluster.local:5432/litellm"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef: { key: secret/litellm, property: LITELLM_MASTER_KEY }
    - secretKey: DATABASE_URL
      remoteRef: { key: secret/litellm, property: DATABASE_URL }
    # Langfuse project keys (pk-lf-/sk-lf-) — the SAME pair Langfuse bootstraps
    # head-lessly (secret/langfuse INIT_PROJECT_*). Add to Vault: vault kv patch
    # secret/litellm LANGFUSE_PUBLIC_KEY=pk-lf-... LANGFUSE_SECRET_KEY=sk-lf-...
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef: { key: secret/litellm, property: LANGFUSE_PUBLIC_KEY }
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef: { key: secret/litellm, property: LANGFUSE_SECRET_KEY }
    # Credencial con la que ESTE gateway habla con el puente `litellm-codex`
    # (codex-bridge.yaml). Es la master key de ese proxy interno, no una key de
    # cliente, y no tiene nada que ver con la cuenta ChatGPT: el OAuth de la cuenta
    # vive en el auth.json del hostPath del puente y no pasa por Vault.
    # Añadir con `vault kv patch`, NUNCA `kv put`: en secret/litellm vive tambien
    # LITELLM_MASTER_KEY y un put la borraria, tumbando a todos los consumidores.
    #   vault kv patch secret/litellm LITELLM_CODEX_BRIDGE_KEY=sk-...
    - secretKey: LITELLM_CODEX_BRIDGE_KEY
      remoteRef: { key: secret/litellm, property: LITELLM_CODEX_BRIDGE_KEY }
    # Key de la cuenta de OpenRouter (sk-or-...). Mismo aviso que arriba, y aqui
    # importa el ORDEN: si esta entrada llega al cluster ANTES de que la propiedad
    # exista en Vault, el ExternalSecret entero pasa a SecretSyncedError y deja de
    # refrescar el resto — incluida LITELLM_MASTER_KEY. Primero el patch, despues
    # el merge.
    #   vault kv patch secret/litellm OPENROUTER_API_KEY=sk-or-...
    - secretKey: OPENROUTER_API_KEY
      remoteRef: { key: secret/litellm, property: OPENROUTER_API_KEY }
