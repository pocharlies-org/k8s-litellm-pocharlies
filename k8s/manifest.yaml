    # ── RESIDENTES LOCALES: ESTATICOS DESDE 2026-08-18 ──────────────────────────
    #
    # Hasta hoy estos alias NO estaban aqui: los registraba en runtime el
    # controlador `litellm-dgx-backend-sync` por HTTP contra /model/new. Ese
    # controlador es el que producia el desmadre de nombres, y por tres motivos
    # que se combinan:
    #   - /model/new es create-only (ver managed_model_contract),
    #   - store_model_in_db: true guardaba lo registrado en postgres,
    #   - /model/delete borraba el alias en cuanto el Service pasaba a NotReady.
    # Resultado medido: alias que aparecian y desaparecian solos (18-08 11:43
    # desregistro los nueve de DeepSeek, 12:37 los volvio a crear), CINCO
    # workarounds en este mismo fichero, y cuatro listas de alias que no
    # coincidian entre si (panel, OpenClaw, opencode y el allowlist del equipo).
    #
    # Ahora hay UNA fuente de la verdad: este YAML. Y "quien esta arriba" lo
    # contesta Kubernetes por el Service de pool `tooling` (k8s-ai-pocharlies,
    # selector llm.dgx-infra/pool=tooling-resident), que es su competencia — no
    # la de un controlador que escribe en una base de datos.
    #
    # DOS CLASES DE NOMBRE, y la diferencia importa:
    #
    #  1. NOMBRE DIRECTO (deepseek-v4-flash-0731, qwen38-27b, qwen35-4b y sus
    #     `-uncensored`): apunta al Service PROPIO del backend. Si ese backend no
    #     esta, el alias da 400 «Invalid model name» — visible y correcto: quien
    #     nombra un modelo concreto debe recibir ese modelo o un error, nunca otro.
    #
    #  2. NOMBRE DE CAPACIDAD (tooling, router, auto, litellmrouter, agent, high,
    #     max): apunta al Service de POOL. El hook los reescribe por peticion al
    #     nombre directo del residente vivo (_resolve_tooling_profile), que es lo
    #     que mantiene correctos el sampling por familia (FAMILY_SAMPLING), el
    #     sello de lambda y la ventana real. La entrada al pool es la red de
    #     seguridad: si el hook se desactivara, el alias sigue siendo servible
    #     porque los DOS backends declaran `tooling` como segundo
    #     --served-model-name. Lo unico que se perderia en ese camino es el
    #     repetition_penalty de Qwen, que va en las entradas directas.
    #
    # NO SE DECLARA DOS VECES `tooling` (una por backend) a proposito. Medido el
    # 18-08 con dos deployments bajo un alias, uno con api_base muerto: 11 de 12
    # peticiones OK y UNA 500. Con routing_strategy simple-shuffle, allowed_fails
    # 3 y cooldown_time 120 el muerto se come peticiones hasta acumular 3 fallos y
    # vuelve a salir cada 2 minutos a fallar otras tres. El Service de pool no
    # tiene ese agujero: el backend caido no esta en los EndpointSlice.
    #
    # La ventana de los alias de capacidad es 262144 (la del residente MENOR), no
    # 393216: es el suelo de los dos, y el techo de contexto que se pidio. Un
    # cliente que declare 384k y aterrice en qwen38 se pasaria de ventana; al
    # contrario solo desaprovecha.
    # 2026-08-20: max_parallel_requests 6 -> 32 en los dos alias directos de
    # DeepSeek, y 4 -> 32 en el pool de capacidad de mas abajo. ESTE era el 429.
    #
    # max_parallel_requests NO ENCOLA. Cuando el contador en vuelo de la
    # deployment pasa del tope, LiteLLM levanta RateLimitError (HTTP 429) en el
    # acto. vLLM si encola: mas alla de MAX_NUM_SEQS las peticiones esperan en su
    # waiting queue, no se rechazan. Poner el tope del proxy a la altura de los
    # slots de EJECUCION del motor convertia "espera dos segundos" en "429 too
    # many requests", y el cliente lo remata con "exceeded retry limit".
    #
    # Por que tumbaba a Codex Y a DeepSeek A LA VEZ: comparten la salida. Con
    # num_retries 1 el unico reintento cae casi siempre por encima del mismo
    # tope, y entonces dispara la red de fallbacks -- donde `tooling` y
    # `deepseek-v4-flash-0731` caen LOS DOS a cloudblue/e-dani gpt-5.6-luna. Si
    # el plan de ChatGPT esta gastado, eso devuelve OTRO 429
    # (`usage_limit_reached`): las dos ramas mueren con el mismo codigo y parece
    # culpa del upstream cuando el 429 lo genera ESTE fichero.
    #
    # La aritmetica, con numeros ya medidos en este repo (ver el comentario de
    # `replicas` del Deployment: sweep-line sobre 89.672 peticiones de 48 h):
    # concurrencia media 6,68 / p99 37 / pico 77. Con 2 replicas el p99 son ~19
    # por proceso contra un tope de 4-6. Esto no recortaba picos raros: rechazaba
    # trafico NORMAL, porque la media ya estaba por encima del tope de 4. Medido
    # hoy en el proxy vivo: litellm_deployment_failure_responses_total 281 sobre
    # 2.811, y litellm_deployment_successful_fallbacks_total = 2 -- la red no
    # salvaba nada porque todos los caminos acaban en un tope o en una cuota
    # agotada.
    #
    # 32 por proceso (64 entre las 2 replicas) cubre el p99 con margen y sigue
    # acotando una fuga. Quien debe decidir la saturacion es el motor con su
    # cola, el unico que sabe cuanta KV le queda; el proxy no tiene esa
    # informacion y no deberia estar decidiendo con ella.
    - model_name: deepseek-v4-flash-0731
      litellm_params:
        model: openai/deepseek-v4-flash-0731
        api_base: http://deepseek-v4-flash-0731.llm.svc.cluster.local:8000/v1
        api_key: not-used
        timeout: 600
        max_parallel_requests: 32
      model_info:
        mode: chat
        backend: dgx1+dgx2
        max_input_tokens: 393216
        max_output_tokens: 16384
        supports_function_calling: true
        supports_vision: true
        supports_reasoning: true
        # 2026-08-19: FUERA `low` (y `medium` donde estaba). Solo se declara lo que
        # el hook HONRA, que es la misma regla por la que `ultra` nunca se declaro.
        #
        # `low` era inerte y ademas daninno. CLIENT_EFFORT_TIERS no lo traduce a
        # proposito -- un `low` de un cliente agente significa "no he tocado nada",
        # no "quiero low" -- asi que un effort low se descarta y decide el tier del
        # alias. Anunciarlo hacia que OpenClaw se quedara con `low` como nivel de
        # sesion (thinkingDefault=low) y creyera estar pensando mientras `tooling`
        # entraba en thinking_mode "chat": sin canal `<think>`, DeepSeek deliberaba
        # en el canal VISIBLE y el monologo salia como respuesta. Medido en las
        # sesiones vivas: 56 fugas en 421 mensajes de `tooling`, cero tags y cero
        # bloques de thinking, mientras gpt-5.6 (Responses API) daba 0 en 1125.
        #
        # Con la lista honesta, OpenClaw no puede almacenar un nivel que el modelo
        # no declara: lo recorta al mas cercano y el effort que llega ya es
        # DELIBERADO, asi que el razonamiento vuelve a `reasoning_content`.
        supported_reasoning_efforts: [none, high, max]
    # Mismo head, misma GPU, mismo checkpoint. Lo unico que cambia es que este
    # alias sella cada peticion con `cache_salt: refusal:1.5`, que vLLM expande a
    # lambda por token. COSTE: cache_salt entra en la clave de bloque del prefix
    # cache, asi que este alias tiene su propio espacio de KV.
    - model_name: deepseek-v4-flash-0731-uncensored
      litellm_params:
        model: openai/deepseek-v4-flash-0731
        api_base: http://deepseek-v4-flash-0731.llm.svc.cluster.local:8000/v1
        api_key: not-used
        timeout: 600
        max_parallel_requests: 32
        extra_body: { cache_salt: "refusal:1.5" }
      model_info:
        mode: chat
        backend: dgx1+dgx2
        max_input_tokens: 393216
        max_output_tokens: 16384
        supports_function_calling: true
        supports_vision: true
        supports_reasoning: true
        # Mismo checkpoint que el alias de arriba: mismos tiers honrados.
        supported_reasoning_efforts: [none, high, max]
    # NUEVO como nombre directo. El controlador solo registraba `tooling` y
    # `qwen38-27b-uncensored` sobre este backend, asi que el residente de
    # `creative` no tenia nombre propio servible. Ahora lo tiene, y es el destino
    # al que el hook reescribe `tooling` cuando el perfil vivo es `creative`.
    #
    # repetition_penalty 1.08 va en litellm_params porque Qwen documenta que sin
    # ese guard degrada el tool-calling. Lo ponia extra_litellm_params del
    # controlador con un startswith("openai/qwen38-") que ya se apago en silencio
    # una vez (15-08) al renombrar el base_model. Escrito aqui no puede apagarse.
    - model_name: qwen38-27b
      litellm_params:
        model: openai/qwen38-27b
        api_base: http://vllm-qwen38-27b-uncensored.llm.svc.cluster.local:8000/v1
        api_key: not-used
        timeout: 600
        max_parallel_requests: 4
        repetition_penalty: 1.08
      model_info:
        mode: chat
        backend: dgx1
        max_input_tokens: 262144
        max_output_tokens: 16384
        supports_function_calling: true
        supports_vision: true
        supports_reasoning: true
        # `low` y `medium` fuera por lo mismo que en DeepSeek, y aqui ya estaba
        # MEDIDO en el comentario del BACKENDS: none/low/medium -> reasoning_content
        # 0 chars; solo high y max piensan de verdad. Se declaraban igualmente.
        supported_reasoning_efforts: [none, high, max]
    - model_name: qwen38-27b-uncensored
      litellm_params:
        model: openai/qwen38-27b
        api_base: http://vllm-qwen38-27b-uncensored.llm.svc.cluster.local:8000/v1
        api_key: not-used
        timeout: 600
        max_parallel_requests: 4
        repetition_penalty: 1.08
        extra_body: { cache_salt: "refusal:1.0" }
      model_info:
        mode: chat
        backend: dgx1
        max_input_tokens: 262144
        max_output_tokens: 16384
        supports_function_calling: true
        supports_vision: true
        supports_reasoning: true
        # Mismo backend que el alias de arriba: mismos tiers honrados.
        supported_reasoning_efforts: [none, high, max]
    # Independiente del perfil: vive en la RTX del x86, no en los Sparks, asi que
    # esta arriba en los dos modos. Los dos nombres son el mismo backend.
    - model_name: qwen35-4b
      litellm_params: &qwen35_4b_params
        model: openai/qwen3.5-4b
        api_base: http://qwen35-4b-int4.llm.svc.cluster.local:8000/v1
        api_key: not-used
        timeout: 600
        max_parallel_requests: 1
      model_info: &qwen35_4b_info
        mode: chat
        backend: rtx
        max_input_tokens: 32768
        max_output_tokens: 8192
        supports_function_calling: true
        supports_vision: false
        supports_reasoning: true
        # Igual que los otros locales: none/low/medium daban reasoning_content 0.
        supported_reasoning_efforts: [none, high, max]
    - model_name: qwen3.5-4b
      litellm_params: *qwen35_4b_params
      model_info: *qwen35_4b_info
    # ── ALIAS DE CAPACIDAD: al Service de POOL ───────────────────────────────────
    # `tooling` significa «el residente del perfil vivo, sin pensar»; agent/high/
    # max son el MISMO backend con otro nivel de pensamiento (lo pone
    # THINKING_TIERS en el hook, no un modelo distinto); router/auto/litellmrouter
    # eligen uno de los cuatro por forma de la peticion (AUTO_ROUTED_MODELS).
    - model_name: tooling
      litellm_params: &tooling_pool_params
        model: openai/tooling
        api_base: http://tooling.llm.svc.cluster.local:8000/v1
        api_key: not-used
        timeout: 600
        max_parallel_requests: 32
      model_info: &tooling_pool_info
        mode: chat
        backend: profile-resident
        max_input_tokens: 262144
        max_output_tokens: 16384
        supports_function_calling: true
        supports_vision: true
        supports_reasoning: true
        # ESTA es la lista que lee OpenClaw para pintar el menu de `/effort` del
        # residente (plugin litellm-thinking-profile, derivado de /model/info).
        # Sin `low` el cliente ya no puede quedarse en el nivel que el servidor
        # descarta: cualquier nivel guardado que no este aqui se recorta al mas
        # cercano y el effort que llega es DELIBERADO. Ver el alias directo de
        # DeepSeek para el fallo que arregla.
        supported_reasoning_efforts: [none, high, max]
    - model_name: router
      litellm_params: *tooling_pool_params
      model_info: *tooling_pool_info
    - model_name: auto
      litellm_params: *tooling_pool_params
      model_info: *tooling_pool_info
    - model_name: litellmrouter
      litellm_params: *tooling_pool_params
      model_info: *tooling_pool_info
    - model_name: agent
      litellm_params: *tooling_pool_params
      model_info: *tooling_pool_info
    - model_name: high
      litellm_params: *tooling_pool_params
      model_info: *tooling_pool_info
    - model_name: max
      litellm_params: *tooling_pool_params
      model_info: *tooling_pool_info
    # ── `tooling-uncensored`: el residente del perfil, abliterado ───────────────
    #
    # POR QUE HACE FALTA UN NOMBRE DE CAPACIDAD. `deepseek-v4-flash-0731-uncensored`
    # y `qwen38-27b-uncensored` son nombres de MODELO, y los dos perfiles son
    # fisicamente exclusivos en los Sparks, asi que uno de los dos backends esta
    # siempre a 0 replicas.
    #
    # CORRECCION 19-08 (auditoria): antes aqui decia que cada nombre "esta muerto la
    # mitad del tiempo". Es FALSO y ademas oculta el modo de fallo. Con
    # `store_model_in_db: false` el alias se declara en git, asi que **sigue
    # registrado y publicado en /v1/models aunque su backend no exista**: no esta
    # muerto, esta registrado y roto. Medido con la key del gateway de OpenClaw,
    # perfil llm-tp y Qwen a 0/0 replicas:
    #
    #   deepseek-v4-flash-0731-uncensored -> 200
    #   qwen38-27b-uncensored             -> HTTP 500 ... Connection error.
    #                                        No fallback model group found
    #
    # Correcto para MEDIR (falla fuerte en vez de contestar desde otro checkpoint) e
    # inservible para PINEAR: un agente de OpenClaw clavado a uno de los dos recibe
    # un 500 al cambiar el perfil, no un error que sepa reintentar.
    #
    # ESTA ENTRADA NO SE SIRVE NUNCA TAL CUAL. Igual que `tooling` y los otros
    # cinco de arriba, el hook la reescribe al nombre DIRECTO del residente vivo
    # antes de enrutar (TOOLING_UNCENSORED_MODE_TARGETS). Existe para que el alias
    # sea un modelo conocido por el router y aparezca en /v1/models; el
    # `api_base` al Service de pool es la red de seguridad si la reescritura no
    # ocurriera.
    #
    # SIN `extra_body` A PROPOSITO, y esto es lo unico delicado: la lambda NO es la
    # misma en los dos residentes (1.5 DeepSeek / 1.0 Qwen3.8, medidas y no
    # intercambiables — a 1.0 DeepSeek aun rechaza 5-7/10; a 1.5 Qwen pierde 26,8
    # puntos de MMLU-Pro). Un `cache_salt` fijo aqui seria el valor equivocado
    # para uno de los dos SIEMPRE. El sello viaja en la entrada del nombre directo
    # al que reescribe el hook, que es la unica que sabe de que backend habla.
    - model_name: tooling-uncensored
      litellm_params: *tooling_pool_params
      model_info: *tooling_pool_info
    # ── RETIRADOS 2026-08-10: `deepseek-v4-flash-openclaw` y `-opencode` ────────
    #
    # Eran dos entradas estaticas con el sampling de DeepSeek ya puesto, una por
    # cliente. Se construyeron con cuidado y NUNCA las pidio nadie: 0 consumidores
    # en todo ~/k8s. OpenClaw y opencode piden `tooling`. Codigo muerto que ademas
    # duplicaba, pinneado a
    # DeepSeek, lo que ya se resuelve solo:
    #
    #   temperature 1.0 / top_p 0.95  -> lo pone FAMILY_SAMPLING del hook, deducido
    #     de la FAMILIA del backend que sirve el alias ahora mismo. Funciona para
    #     todos los clientes y sobrevive al cambio de residente; una entrada
    #     estatica pinneada a DeepSeek habria mentido al volver a Qwen.
    #   chat_template_kwargs {thinking, reasoning_effort: low}  -> ya los trae el
    #     servidor vLLM como --default-chat-template-kwargs (visto en los args de
    #     arranque del head). No hacia falta repetirlos aqui.
    #   max_tokens 16384  -> ahora lo publica el sync como max_output_tokens en los
    #     alias del residente, y opencode lo declara en su propia config.
    #
    # Lo que documentaban estas entradas y merece sobrevivir al borrado: el model
    # card de DeepSeek recomienda temperature 1.0 / top_p 0.95 para escenarios
    # agenticos y de tool-calling. El instinto de "temp 0 para codigo" saca al
    # modelo del regimen para el que esta tuneado (los benchmarks de velocidad si
    # se midieron a temp 0, porque lo pedia el criterio de aceptacion: son dos
    # cosas distintas). Y reasoning_effort low no es tacaneria: con `high` o `max`
    # el bloque de pensamiento se dispara y el TTFT se va al garete -- medido a
    # low, TTFT mediana 0.209s. Todo eso vive ahora en FAMILY_SAMPLING.
    litellm_settings:
      success_callback:
      - db
      - prometheus
      - langfuse
      failure_callback:
      - prometheus
      - langfuse
      service_callback:
      - prometheus_system
      callbacks:
      - litellm_strip_params.proxy_handler_instance
      drop_params: true
      set_verbose: false
      require_auth_for_metrics_endpoint: false
      num_retries: 2
      request_timeout: 600
      # Content logging ENABLED (2026-07-09): full prompt/response text flows to Langfuse
      # traces AND the DB spend-logs — needed for prompt debugging + LLM-as-a-judge evals.
      # Langfuse is SSO-gated (Keycloak) + homelab, so the privacy risk is low. To redact
      # content again (traces keep latency/cost/tokens/tags; body -> "redacted-by-litellm"),
      # set this back to true.
      turn_off_message_logging: false
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      # 2026-08-18: a false. Esto estaba a true por UNA razon — que el controlador
      # `litellm-dgx-backend-sync` pudiera escribir modelos por /model/new y que las
      # 4 replicas compartieran ese catalogo. Muerto el controlador, nadie escribe
      # modelos, y el catalogo compartido lo da el ConfigMap: todas las replicas leen
      # el MISMO fichero.
      #
      # Lo que se gana, y es el motivo de fondo: un alias solo puede existir en git.
      # No hay que purgar las filas viejas de la DB — con esto dejan de cargarse, se
      # quedan inertes. Y LiteLLM arranca y enruta SIN postgres (que ya se cayo 9h el
      # 20-07 y se llevo la inferencia por delante); antes eso solo lo mitigaba
      # allow_requests_on_db_unavailable, mas abajo.
      #
      # OJO: esto es SOLO modelos. Keys, equipos, presupuesto y spend siguen en
      # postgres, y database_url se queda. Añadir un modelo pasa a ser un commit:
      # POST /models del panel y el boton «Add deployment» dejan de tener sentido y
      # se retiran en dgx-infra.
      store_model_in_db: false
      # 2026-07-21: prompts OFF in SpendLogs — full prompt/response duplication of
      # what Langfuse already stores had grown the table to 21 GB (~38 KB/row) and
      # made retention DELETEs time out. SpendLogs is accounting only.
      store_prompts_in_spend_logs: false
      # DB down must degrade auth (restricted internal token), not kill inference.
      # Incident 2026-07-20: postgres-shared out for 9h => litellm hard-down.
      allow_requests_on_db_unavailable: true
      # 2026-08-14: con 4 replicas, Prisma sin limite son ~98 conexiones por pod
      # = ~400, que es EXACTAMENTE el max_connections de postgres-shared.
      # 25 x 4 = 100 deja 300 al resto de tenants. Se fija aqui y no en el DSN a
      # proposito: el mismo parametro en la URL tumba el arranque de cualquier
      # consumidor psycopg que la herede.
      database_connection_pool_limit: 25
      database_connection_timeout: 60
      background_health_checks: true
      # 2026-08-19: el intervalo estaba IMPLICITO en el default de upstream
      # (DEFAULT_HEALTH_CHECK_INTERVAL = 300 s, litellm/constants.py) y el bucle
      # es por REPLICA: 4 replicas x 288 ciclos/dia x cada deployment. Con los
      # alias gemelos ya callados arriba, los dos pools bge quedaban aun en
      # ~4200 filas/dia de SpendLogs generadas por `litellm-internal-health-check`
      # -- sobre una tabla que ya llego a 21 GB y cuyos DELETE de retencion
      # expiraban (ver store_prompts_in_spend_logs, arriba). El coste de GPU es
      # calderilla (8010 prompt tokens en 30 h, 3 por llamada: el prompt es
      # "test from litellm"); lo que se compra aqui son filas y ruido de panel.
      # 900 s mantiene deteccion de un pool caido en <=15 min, que es de sobra
      # para un backend con `for: 5m` en Prometheus.
      #
      # NO se pone `health_check_skip_disabled_background_models`: se quiere que
      # un `GET /health` a mano SIGA sondeando los gemelos cuando un operador lo
      # pide expresamente. Solo se calla el bucle de fondo.
      #
      # `use_shared_health_check: true` es lo que upstream recomienda para el
      # factor x4 de replicas (un pod coge un lock en Redis y los demas leen
      # cache), pero EXIGE Redis y aqui no hay ninguno declarado -- no hay
      # `cache_params` en litellm_settings. Queda como la via para bajar de 384
      # a 96 llamadas/dia el dia que haya Redis; no se activa a ciegas porque
      # sin Redis el codigo cae a checks locales y el cambio seria un no-op
      # silencioso.
      health_check_interval: 900
      enable_passthrough_logging: false
      maximum_spend_logs_retention_period: 30d
      maximum_spend_logs_retention_interval: 1d
      proxy_batch_write_at: 60
    router_settings:
      routing_strategy: simple-shuffle
      timeout: 600
      num_retries: 1
      # 2026-06-22: a wedged vLLM backend (EngineCore deadlock; /health still 200)
      # used to keep eating ~50% of chat traffic because it took 20 fails before
      # any cooldown and the cooldown was only 30s. Eject faster and keep it out
      # longer; the vLLM engine-watchdog liveness probe restarts the wedged pod
      # (-> EndpointSlice NotReady -> litellm-dgx-backend-sync removes it) within
      # ~4 min, so this only has to cover that window.
      allowed_fails: 3
      cooldown_time: 120
      # These four aliases are four reasoning levels over the same dynamically
      # registered tooling resident. They are not four model choices.
      #
      # There are two failure modes with two different errors and layers:
      #   * alias REGISTERED but no healthy deployment (cooldown after allowed_fails,
      #     a wedged vLLM whose /health still answers 200) -> the Router raises from
      #     inside async_function_with_fallbacks' try, so THIS fallback fires.
      #   * alias DELETED from model_list (litellm-dgx-backend-sync calls
      #     /model/delete when the Service goes NotReady) -> the proxy raises
      #     ProxyModelNotFoundError in route_llm_request.py BEFORE the Router is
      #     invoked, so no entry here can ever fire. That mode is covered only by
      #     the smart-router hook's chain, which runs at pre_call_hook, ahead of the
      #     model-name gate.
      # Both layers are load-bearing. Neither one substitutes for the other.
      fallbacks:
      # En llm-tp, agent/high/max y deepseek-v4-flash-0731 son el MISMO backend.
      # `tooling` es distinto: siempre nombra al residente del perfil global
      # (`llm-tp` -> DeepSeek V4; `creative` -> Qwen3.6 27B) y, por decision del
      # owner del 15-08-2026, si ese residente sigue registrado pero deja de estar
      # sano cae a GPT-5.6 Luna. CloudBlue es la primera cuenta y su propia red de
      # abajo continua hacia e-dani; no se declara la vuelta y el grafo sigue siendo
      # un DAG.
      #
      # Parece que un fallback entre ellos no puede servir de nada. LO PARECE Y NO
      # ES ASI, y por poco lo borro entero el 14-08 creyendolo. El COOLDOWN es POR
      # GRUPO DE MODELO: con allowed_fails 3 y cooldown_time 120 (mas abajo),
      # `tooling` puede estar penalizado mientras `deepseek-v4-flash-0731` no lo
      # esta. Mismo backend, distinto contador. Ahi es donde esta red dispara.
      #
      # El otro modo de fallo —alias BORRADO del model_list por /model/delete— no lo
      # cubre ningun fallback: el proxy lanza ProxyModelNotFoundError antes de
      # llegar al Router. De ese se encarga la cadena del hook. Los dos modos estan
      # explicados en detalle en el comentario de router_settings, mas abajo.
      #
      # Historia de este bloque, que ha estado mal tres veces:
      #   1) cloudblue/gpt-5.6-luna: alias que el proceso ni tenia cargado. Cero red.
      #   2) e-dani/gpt-5.6-sol (13-08): mandaba las CUATRO rutas calientes a un
      #      backend externo con 12 reinicios en 18 h. Cuando el puente entro en
      #      CrashLoopBackOff, LiteLLM se paso la tarde reintentando contra un host
      #      muerto hasta que lo mato el OOM, dos veces.
      #   3) borrarlos (14-08): dejaba sin red el caso del cooldown, que es real.
      # Para agent/high/max el destino sigue siendo un alias DEL MISMO backend,
      # pero con OTRO contador de cooldown. `tooling` es la excepcion deliberada:
      # por la decision nueva cae a Luna cuando el residente no esta sano.
      - tooling: ["cloudblue/gpt-5.6-luna"]
