                request_tracker.start(
                    tracking_id,
                    trace_id=_litellm_trace_id(data),
                    key_alias=key_alias,
                    model=model,
                    call_type=call_type,
                    api_base=api_base,
                    refusal_lambda=await _refusal_lambda_for_async(model, api_base),
                )
            except Exception as e:
                log.debug("track_start error: %s", e)

