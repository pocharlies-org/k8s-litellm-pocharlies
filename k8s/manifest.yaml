    from __future__ import annotations

    import json
    import os
    import time
    from datetime import datetime, timezone
    from typing import Any

    ACTIVE_FILE = os.environ.get("LITELLM_ACTIVE_FILE", "/shared/tracking/active_requests.json")
    STALE_AFTER_SEC = int(os.environ.get("LITELLM_ACTIVE_STALE_AFTER_SEC", "900"))
    DRAIN_TIMEOUT_SEC = int(os.environ.get("LITELLM_DRAIN_TIMEOUT_SEC", "660"))
    POLL_SEC = int(os.environ.get("LITELLM_DRAIN_POLL_SEC", "5"))
    FINAL_SLEEP_SEC = int(os.environ.get("LITELLM_DRAIN_FINAL_SLEEP_SEC", "5"))


    def _started_sec(value: Any) -> float | None:
        if value is None:
            return None
        if isinstance(value, (int, float)):
            raw = float(value)
            return raw / 1000.0 if raw > 1e12 else raw
        if isinstance(value, str):
            raw = value.strip()
            if not raw:
                return None
            try:
                num = float(raw)
                return num / 1000.0 if num > 1e12 else num
            except ValueError:
                try:
                    dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                except ValueError:
                    return None
                if dt.tzinfo is None:
                    dt = dt.replace(tzinfo=timezone.utc)
                return dt.astimezone(timezone.utc).timestamp()
        return None


    def _iter_rows(payload: Any) -> list[dict[str, Any]]:
        if isinstance(payload, dict) and "active" in payload:
            payload = payload.get("active")
        if isinstance(payload, list):
            return [item for item in payload if isinstance(item, dict)]
        if isinstance(payload, dict):
            return [item for item in payload.values() if isinstance(item, dict)]
        return []


    def active_count() -> int:
        try:
            with open(ACTIVE_FILE, "r", encoding="utf-8") as f:
                payload = json.load(f)
        except FileNotFoundError:
            return 0
        except Exception as exc:
            print(f"litellm drain: could not read {ACTIVE_FILE}: {exc}; continuing shutdown", flush=True)
            return 0

        now = time.time()
        count = 0
        for row in _iter_rows(payload):
            started = _started_sec(row.get("ts") or row.get("started_at") or row.get("start_time"))
            if started is None or now - started <= STALE_AFTER_SEC:
                count += 1
        return count


    deadline = time.time() + DRAIN_TIMEOUT_SEC
    while True:
        active = active_count()
        if active <= 0:
            print("litellm drain: no active requests; shutdown can continue", flush=True)
            break
        remaining = int(deadline - time.time())
        if remaining <= 0:
            print(f"litellm drain: timed out with {active} active request(s); shutdown continuing", flush=True)
            break
        print(f"litellm drain: waiting for {active} active request(s), {remaining}s left", flush=True)
        time.sleep(min(POLL_SEC, max(1, remaining)))

    if FINAL_SLEEP_SEC > 0:
        time.sleep(FINAL_SLEEP_SEC)
