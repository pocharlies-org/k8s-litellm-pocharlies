---
apiVersion: v1
kind: Namespace
metadata:
  name: litellm
---
# ExternalSecret: litellm DB credentials in shared PostgreSQL
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-postgres-creds
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-postgres-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef: { key: secret/litellm, property: DB_USER }
    - secretKey: password
      remoteRef: { key: secret/litellm, property: DB_PASSWORD }
---
# LiteLLM Router — unified LLM API gateway
# Image: ghcr.io/berriai/litellm:main-stable (amd64/arm64)
# Router is stateless; state lives in the shared PostgreSQL cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
    # Chat aliases are registered by litellm-dgx-backend-sync only while each
    # vLLM Service has ready Kubernetes endpoints. This avoids routing local,
    # tooling, router, litellmrouter, or auto to a baseline pod that is still
    # pulling/starting.
    # 2026-08-14: los cuatro apuntaban a los Services `-cpu`, cuyos Deployments
    # llevan 0/0 replicas y no tienen ningun KEDA que los levante: LiteLLM daba
    # "Connect call failed" en /v1/embeddings y /v1/rerank teniendo los backends
    # sanos al lado. No era protocolo -- el embedder responde /v1/embeddings con
    # forma OpenAI y el reranker su /rerank nativo, que es lo que traduce el
    # provider `infinity/`. Los Services buenos seleccionan por la etiqueta
    # `bge-pool`, que es la que llevan los pods `-creative` vivos, y son los
    # mismos a los que el brain ya iba directo (TEI_DENSE_URL / TEI_RERANKER_URL).
    - model_name: bge-m3
      litellm_params:
        model: openai/bge-m3
        api_base: http://bge-m3-embedding.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: embedding
        max_tokens: 8192
    - model_name: bge-m3-embedding
      litellm_params:
        model: openai/bge-m3
        api_base: http://bge-m3-embedding.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: embedding
        max_tokens: 8192
        # 2026-08-19: gemelo EXACTO de `bge-m3` (mismo model + mismo api_base).
        # El bucle de background health checks deduplica por `model_info.id`
        # (health_check.py::filter_deployments_by_id), que es unico POR
        # DEPLOYMENT, no por api_base -- asi que los dos alias se sondean por
        # separado y cada sondeo es inferencia real contra el MISMO pool.
        # Medido en SpendLogs (30 h): `litellm-internal-health-check` = 2670
        # llamadas a bge-m3, ~2136/dia, y NINGUN otro consumidor con exito.
        # Cuadra con 4 replicas x 2 alias x 288 ciclos/dia = 2304.
        # Se calla el gemelo, no el original: la cobertura no baja (mismo
        # api_base) y `bge-m3` sigue sondeandose de verdad.
        disable_background_health_check: true
    - model_name: bge-reranker
      litellm_params:
        model: infinity/bge-reranker
        api_base: http://bge-reranker.llm.svc.cluster.local:8000
        api_key: not-used
      model_info:
        mode: rerank
        max_tokens: 8192
    - model_name: bge-reranker-v2-m3
      litellm_params:
        model: infinity/bge-reranker
        api_base: http://bge-reranker.llm.svc.cluster.local:8000
        api_key: not-used
      model_info:
        mode: rerank
        max_tokens: 8192
        # 2026-08-19: mismo caso que `bge-m3-embedding` -- gemelo exacto de
        # `bge-reranker`. Medido: 2626 llamadas en 30 h (~2101/dia), todas del
        # health check interno. `bge-reranker` conserva su sondeo.
        disable_background_health_check: true
    # ── Audio: Whisper STT + OmniVoice TTS (OSS passthrough; for CloudBlue & clients) ──
    # One LiteLLM key now covers chat + embeddings + STT + TTS. Backends are ClusterIP-only;
    # LiteLLM stays the single public, key-authed, budgeted front door (no separate exposure).
    - model_name: stt-turbo
      litellm_params:
        model: openai/whisper-large-v3
        api_base: http://stt-turbo.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: audio_transcription
    - model_name: whisper-1            # OpenAI-SDK-compatible alias -> same Whisper backend
      litellm_params:
        model: openai/whisper-large-v3
        api_base: http://stt-turbo.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: audio_transcription
    - model_name: omnivoice-tts
      litellm_params:
        model: openai/omnivoice
        api_base: http://omnivoice-tts.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: audio_speech
    - model_name: tts-1               # OpenAI-SDK-compatible alias -> same OmniVoice backend
      litellm_params:
        model: openai/omnivoice
        api_base: http://omnivoice-tts.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: audio_speech
    # ── Catálogo ChatGPT/Codex por cuenta ────────────────────────────────────
    # El ID público une cuenta y slug real: `cloudblue/<slug>` o
    # `e-dani/<slug>`. Así ambos catálogos pueden contener el mismo modelo sin
    # colisionar. OpenAI recibe únicamente el slug real de `litellm_params.model`.
    # Catálogo vivo consultado por cuenta el 2026-08-13: 9 (cloudblue) + 10
    # (e-dani) = 19.
    #
    # LOS 9 DE CLOUDBLUE SE RETIRARON Y SE REPUBLICAN EL MISMO DÍA. El motivo de
    # la retirada era que "sus 4 keys están bloqueadas a propósito", y eso NO
    # aplica a este camino: las keys bloqueadas son VIRTUALES de LiteLLM, y el
    # puente no las usa — habla con ChatGPT por su propia sesión OAuth
    # (Secret codex-bridge-auth). Comprobado llamando al puente directamente:
    #
    #   POST codex-bridge.litellm.svc:8080/v1/chat/completions {model: gpt-5.6-sol}
    #   -> 200 en 1 s
    #
    # O sea que los 9 alias SÍ pueden funcionar. Lo que no funcionaba era pedirlos
    # por LiteLLM mientras no estaban publicados (400 "Invalid model name").
    # Los modelos `visibility=hide` también se publican porque este catálogo es
    # completo; Codex decide su presentación mediante el catálogo sincronizado.
    # UNA EXCEPCIÓN, y no volver a añadirla al refrescar el catálogo (2026-08-13):
    # `gpt-5.6-sol-wm` NO se publica. Su descripción en el catálogo de la cuenta
    # es literal: "Work Mode routing alias for GPT-5.6 Sol" — mismos pesos que
    # `gpt-5.6-sol`, no otro modelo. Work es un MODO del cliente de ChatGPT (otro
    # prompt de sistema, otros conectores, otro formato de salida), y nada de ese
    # aparato viaja por `/backend-api/codex/responses`: el puente manda su propio
    # prompt y sus propias tools. Por aquí el alias era Sol repetido con un nombre
    # peor. Sigue en ALLOWED_MODELS de los dos puentes a propósito: la cuenta SÍ lo
    # sirve (probado, HTTP 200 pese a `supported_in_api: false`) y quitarlo de allí
    # abriría el fallback silencioso a UPSTREAM_MODEL en vez de un error.
    # ── Cuenta CLOUDBLUE (daniel.ibanez@cloudblue.com) ───────────────────────
    # Es la cuenta de CARGA: desvío de visión, último eslabón de `agent`, Aurora.
    # Cuota separada de la personal a propósito, para que lo automático no se
    # coma el cupo del Codex interactivo. Puente: codex-bridge.
    # `gpt-5.6-sol-wm` NO se publica (ver la excepción de arriba).
    # `gpt-daybreak-blue-latest` NO se publica en ninguna cuenta (2026-08-13,
    # decision del operador): solo existia en el catalogo de e-dani.
    - model_name: cloudblue/gpt-5.6-sol
      litellm_params: { model: openai/gpt-5.6-sol, api_base: "http://codex-bridge.litellm.svc.cluster.local:8080/v1", api_key: not-used }
      model_info: { mode: chat, supports_vision: true, supports_reasoning: true, supports_low_reasoning_effort: true, supports_xhigh_reasoning_effort: true, supports_max_reasoning_effort: true, supported_reasoning_efforts: [low, medium, high, xhigh, max, ultra], max_input_tokens: 272000 }
