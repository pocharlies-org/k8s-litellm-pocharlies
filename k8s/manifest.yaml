            # still comes from the backend that will really serve the request.
            _apply_thinking_tier(data, thinking_alias)
            key_alias = _resolve_key_label(user_api_key_dict)
            model = data.get("model", "unknown")
            api_base = (
                data.get("api_base")
                or (litellm_params or {}).get("api_base")
            )
            # `not vision_diverted` es OBLIGATORIO, no cosmetico:
            # _is_local_vllm_request mira tambien `proxy_model`, que sigue diciendo
            # `tooling` despues del desvio. Sin este guard, una imagen que sale a
            # ChatGPT pasaria por la admision de compute-mode (503 cuando el
