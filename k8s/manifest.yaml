                # decoding CAUSA degradacion y bucles de repeticion; ~11 servicios
                # de produccion lo hacen hoy). Los checkpoints ya aportan sus
                # propios defaults (temperature 1.0 / top_p 0.95 / top_k 20 via
                # --generation-config auto), asi que aqui NO hace falta rellenar
                # nada: solo medir.
                _log_sampling(data, resolved_model, key_alias=_resolve_key_label(user_api_key_dict))
                router_log.warning(
                    "router: %s -> %s | orig=%r reasons=%s tok~%d msgs=%d last_user=%r",
                    category,
                    resolved_model,
                    proxy_model or requested_model,
                    reasons or ["default"],
                    tok_est,
                    len(_message_entries(data)),
                    preview,
                )

            # Desvio de VISION, DESPUES de resolver: la pregunta no es que pidio el
            # cliente sino si el alias que ha quedado ve. Va aqui y no antes para no
            # duplicar la resolucion de cadenas ni la clasificacion por forma.
            vision_diverted = False
            vision_from = data.get("model", "")
            vision_target = _vision_target(
                data, requested_model, proxy_model, vision_from)
            if vision_target:
                data["model"] = vision_target
                data.pop("api_base", None)
                data.pop("api_key", None)
                data.setdefault("metadata", {})
                data["metadata"]["_vision_diverted_from"] = vision_from
                data["metadata"]["_router_resolved_model"] = vision_target
                vision_diverted = True
                router_log.warning(
                    "vision: %r no ve; imagen desviada a %r (pedido=%r, key=%s)",
                    vision_from,
                    vision_target,
                    proxy_model or requested_model,
                    _resolve_key_label(user_api_key_dict),
