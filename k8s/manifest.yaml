      - cloudblue/gpt-5.6-sol: ["e-dani/gpt-5.6-sol"]
      - cloudblue/gpt-5.6-terra: ["e-dani/gpt-5.6-terra"]
      - cloudblue/gpt-5.6-luna: ["e-dani/gpt-5.6-luna"]
