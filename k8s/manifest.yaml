    # ── RETIRADOS 2026-08-10: `deepseek-v4-flash-openclaw` y `-opencode` ────────
    #
    # Eran dos entradas estaticas con el sampling de DeepSeek ya puesto, una por
    # cliente. Se construyeron con cuidado y NUNCA las pidio nadie: 0 consumidores
    # en todo ~/k8s. OpenClaw y opencode piden `tooling`. Codigo muerto que ademas
    # duplicaba, pinneado a
    # DeepSeek, lo que ya se resuelve solo:
    #
    #   temperature 1.0 / top_p 0.95  -> lo pone FAMILY_SAMPLING del hook, deducido
    #     de la FAMILIA del backend que sirve el alias ahora mismo. Funciona para
    #     todos los clientes y sobrevive al cambio de residente; una entrada
    #     estatica pinneada a DeepSeek habria mentido al volver a Qwen.
    #   chat_template_kwargs {thinking, reasoning_effort: low}  -> ya los trae el
    #     servidor vLLM como --default-chat-template-kwargs (visto en los args de
    #     arranque del head). No hacia falta repetirlos aqui.
    #   max_tokens 16384  -> ahora lo publica el sync como max_output_tokens en los
    #     alias del residente, y opencode lo declara en su propia config.
    #
    # Lo que documentaban estas entradas y merece sobrevivir al borrado: el model
    # card de DeepSeek recomienda temperature 1.0 / top_p 0.95 para escenarios
    # agenticos y de tool-calling. El instinto de "temp 0 para codigo" saca al
    # modelo del regimen para el que esta tuneado (los benchmarks de velocidad si
    # se midieron a temp 0, porque lo pedia el criterio de aceptacion: son dos
    # cosas distintas). Y reasoning_effort low no es tacaneria: con `high` o `max`
    # el bloque de pensamiento se dispara y el TTFT se va al garete -- medido a
    # low, TTFT mediana 0.209s. Todo eso vive ahora en FAMILY_SAMPLING.
    litellm_settings:
      success_callback:
      - db
      - prometheus
      - langfuse
      failure_callback:
      - prometheus
      - langfuse
      service_callback:
      - prometheus_system
      callbacks:
      - litellm_strip_params.proxy_handler_instance
      drop_params: true
      set_verbose: false
      require_auth_for_metrics_endpoint: false
      num_retries: 2
      request_timeout: 600
      # Content logging ENABLED (2026-07-09): full prompt/response text flows to Langfuse
      # traces AND the DB spend-logs — needed for prompt debugging + LLM-as-a-judge evals.
      # Langfuse is SSO-gated (Keycloak) + homelab, so the privacy risk is low. To redact
      # content again (traces keep latency/cost/tokens/tags; body -> "redacted-by-litellm"),
      # set this back to true.
      turn_off_message_logging: false
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
      # 2026-07-21: prompts OFF in SpendLogs — full prompt/response duplication of
      # what Langfuse already stores had grown the table to 21 GB (~38 KB/row) and
      # made retention DELETEs time out. SpendLogs is accounting only.
