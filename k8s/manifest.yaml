            _apply_family_sampling(data, thinking_alias)
            # Explicit profiles follow the alias requested by the client. The
            # family still comes from the backend that will really serve the request.
            _apply_thinking_tier(data, thinking_alias)
            # El template de qwen38-flash-next exige los system AL PRINCIPIO;
            # va aqui abajo por lo mismo que el sampling por familia: solo con
            # el modelo resuelto sabemos si el backend real lo exige.
