    READY_GRACE_SECONDS = float(os.getenv("READY_GRACE_SECONDS", "20"))
    REQUEST_TIMEOUT_SECONDS = float(os.getenv("REQUEST_TIMEOUT_SECONDS", "10"))
    TEAM_RECONCILE_SECONDS = float(os.getenv("TEAM_RECONCILE_SECONDS", "300"))
