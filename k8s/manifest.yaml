    import json
    import logging
    import os
    import time

    import litellm
    from litellm._uuid import uuid
    from litellm.llms.infinity.rerank.transformation import InfinityRerankConfig
    from litellm.types.rerank import (
        RerankBilledUnits,
        RerankResponse,
        RerankResponseMeta,
        RerankResponseResult,
        RerankTokens,
    )

    log = logging.getLogger("litellm.active_tracking")
    router_log = logging.getLogger("litellm.smart_router")

    # Infinity/TEI rerank compatibility patches.
    _original_transform_request = InfinityRerankConfig.transform_rerank_request

    def _tei_transform_rerank_request(self, model, optional_rerank_params, headers, *args, **kwargs):
        return _original_transform_request(self, model, optional_rerank_params, headers, *args, **kwargs)

    def _tei_transform_rerank_response(
        self, model, raw_response, model_response, logging_obj,
        api_key=None, request_data={}, optional_params={}, litellm_params={},
    ):
        raw = raw_response.json()
        if isinstance(raw, list):
            raw = {
                "results": [
                    {
                        "index": r["index"],
                        "relevance_score": r.get("relevance_score", r.get("score", 0)),
                    }
                    for r in raw
                ]
            }
        results = raw.get("results", [])
        rerank_results = [
            RerankResponseResult(
                index=int(r["index"]),
                relevance_score=float(r.get("relevance_score", r.get("score", 0))),
            )
            for r in results
        ]
        usage = raw.get("usage", {})
        return RerankResponse(
            id=raw.get("id") or str(uuid.uuid4()),
            results=rerank_results,
            meta=RerankResponseMeta(
                billed_units=RerankBilledUnits(total_tokens=usage.get("total_tokens", 0)),
                tokens=RerankTokens(input_tokens=usage.get("prompt_tokens", 0)),
            ),
        )

    InfinityRerankConfig.transform_rerank_request = _tei_transform_rerank_request
    InfinityRerankConfig.transform_rerank_response = _tei_transform_rerank_response

    ACTIVE_FILE = os.environ.get("LITELLM_ACTIVE_FILE", "/shared/tracking/active_requests.json")
    STALE_THRESHOLD = int(os.environ.get("LITELLM_ACTIVE_STALE_AFTER_SEC", "600"))
    _active = {}

    def _flush_to_file():
        try:
            os.makedirs(os.path.dirname(ACTIVE_FILE), exist_ok=True)
            tmp = ACTIVE_FILE + ".tmp"
            with open(tmp, "w") as f:
                json.dump(_active, f)
            os.replace(tmp, ACTIVE_FILE)
        except Exception as e:
            log.debug("flush_to_file error: %s", e)

    def _track_start(request_id, key_alias, model, call_type):
        now = time.time()
        stale = [k for k, v in _active.items() if now - v.get("ts", 0) > STALE_THRESHOLD]
        for k in stale:
            del _active[k]
        _active[request_id] = {
            "alias": key_alias,
            "model": model,
            "call_type": call_type,
            "ts": now,
        }
        _flush_to_file()

    def _track_end(request_id):
        if request_id in _active:
            del _active[request_id]
            _flush_to_file()

    def _auth_field(user_api_key_dict, name):
        if isinstance(user_api_key_dict, dict):
            return user_api_key_dict.get(name)
        return getattr(user_api_key_dict, name, None)

    def _resolve_key_label(user_api_key_dict):
        for name in ("key_alias", "key_name"):
            value = _auth_field(user_api_key_dict, name)
            if value:
                return str(value)
        for name in ("token", "api_key"):
            value = _auth_field(user_api_key_dict, name)
            if value and str(value).startswith("litellm_proxy_master"):
                return "master"
        return "unknown"

    ROUTER_MODELS = {"router", "auto"}

    MODEL_MAP = {
        "SIMPLE": {
            "model": "fast",
        },
        "TOOLING": {
            "model": "tooling",
        },
        "REASONING": {
            "model": "local",
        },
    }

    FAST_CTX_LIMIT = 73000
    THINK_MARKERS = ("/think", "[think]")

    def _approx_input_tokens(data):
        total = 0
        for m in data.get("messages") or []:
            c = m.get("content", "")
            if isinstance(c, str):
                total += len(c)
            elif isinstance(c, list):
                for p in c:
                    if isinstance(p, dict):
                        total += len(p.get("text", ""))
        return total // 4

    def _last_user_message_index_and_text(data):
        messages = data.get("messages") or []
        for i in range(len(messages) - 1, -1, -1):
            m = messages[i]
            if m.get("role") == "user":
                c = m.get("content", "")
                if isinstance(c, str):
                    return i, c
                if isinstance(c, list):
                    texts = [
                        p.get("text", "")
                        for p in c
                        if isinstance(p, dict) and p.get("type") == "text"
                    ]
                    return i, " ".join(texts)
        return -1, ""

    def _has_tools(data):
        return bool(data.get("tools") or data.get("functions") or data.get("function_call"))

    def _wants_reasoning(data):
        if data.get("reasoning_effort"):
            return True
        r = data.get("reasoning")
        return isinstance(r, dict) and bool(r.get("effort"))

    def _has_part_type(data, names):
        for m in data.get("messages") or []:
            c = m.get("content")
            if isinstance(c, list):
                for p in c:
                    if isinstance(p, dict) and p.get("type") in names:
                        return True
        return False

    def _has_think_marker(text):
        if not text:
            return False
        low = text.lstrip().lower()
        return any(low.startswith(m) for m in THINK_MARKERS)

    def _strip_think_marker(text):
        if not text:
            return text
        lead_len = len(text) - len(text.lstrip())
        stripped = text[lead_len:]
        low = stripped.lower()
        for marker in THINK_MARKERS:
            if low.startswith(marker):
                rest = stripped[len(marker):].lstrip(" :\t\n")
                return text[:lead_len] + rest
        return text

    def _strip_think_from_last_user(data):
        idx, last = _last_user_message_index_and_text(data)
        if idx < 0 or not _has_think_marker(last):
            return
        msg = data["messages"][idx]
        c = msg.get("content")
        if isinstance(c, str):
            data["messages"][idx] = {**msg, "content": _strip_think_marker(c)}
        elif isinstance(c, list):
            new_parts = []
            stripped_once = False
            for p in c:
                if (
                    not stripped_once
                    and isinstance(p, dict)
                    and p.get("type") == "text"
                    and _has_think_marker(p.get("text", ""))
                ):
                    new_parts.append({**p, "text": _strip_think_marker(p.get("text", ""))})
                    stripped_once = True
                else:
                    new_parts.append(p)
            data["messages"][idx] = {**msg, "content": new_parts}

    def _classify_request_shape(data):
        _, last = _last_user_message_index_and_text(data)
        has_think = _has_think_marker(last)
        has_image = _has_part_type(data, {"image", "image_url"})
        has_video = _has_part_type(data, {"video", "video_url"})
        big_input = _approx_input_tokens(data) > FAST_CTX_LIMIT

        if has_think:
            return "REASONING", True
        if _wants_reasoning(data):
            return "REASONING", False
        if _has_tools(data) or has_image or has_video or big_input:
            return "TOOLING", False
        return "SIMPLE", False

    class StripUnsupportedParams(litellm.integrations.custom_logger.CustomLogger):
        STRIP_PARAMS = {"reasoningSummary", "reasoning_summary"}

        async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
            for p in self.STRIP_PARAMS:
                data.pop(p, None)

            requested_model = data.get("model", "")
            litellm_params = data.get("litellm_params", {})
            proxy_model = (
                litellm_params.get("proxy_server_request", {})
                .get("body", {})
                .get("model", "")
            )
            is_router_request = requested_model in ROUTER_MODELS or proxy_model in ROUTER_MODELS

            if is_router_request:
                category, marker_present = _classify_request_shape(data)
                if marker_present:
                    _strip_think_from_last_user(data)
                target = MODEL_MAP[category]
                data["model"] = target["model"]
                data.pop("api_base", None)
                data.pop("api_key", None)
                data.setdefault("metadata", {})
                data["metadata"]["_router_category"] = category
                data["metadata"]["_router_original_model"] = proxy_model or requested_model
                data["metadata"]["_router_resolved_model"] = target["model"]
                data["metadata"]["_router_resolved_base"] = "model_list"

                _, last_text = _last_user_message_index_and_text(data)
                preview = (last_text or "")[:120].replace("\n", " ")
                tok_est = _approx_input_tokens(data)
                reasons = []
                if marker_present:
                    reasons.append("think_marker")
                if _wants_reasoning(data):
                    reasons.append("reasoning_effort")
                if _has_tools(data):
                    reasons.append(f"tools={len(data.get('tools') or [])}")
                if tok_est > FAST_CTX_LIMIT:
                    reasons.append(f"ctx={tok_est}>{FAST_CTX_LIMIT}")
                if _has_part_type(data, {"image", "image_url"}):
                    reasons.append("image")
                if _has_part_type(data, {"video", "video_url"}):
                    reasons.append("video")
                router_log.warning(
                    "router: %s -> %s | orig=%r reasons=%s tok~%d msgs=%d last_user=%r",
                    category,
                    target["model"],
                    proxy_model or requested_model,
                    reasons or ["default"],
                    tok_est,
                    len(data.get("messages") or []),
                    preview,
                )

            key_alias = _resolve_key_label(user_api_key_dict)
            model = data.get("model", "unknown")
            tracking_id = str(uuid.uuid4())
            data.setdefault("metadata", {})
            data["metadata"]["_tracking_id"] = tracking_id
            try:
                _track_start(tracking_id, key_alias, model, call_type)
            except Exception as e:
                log.debug("track_start error: %s", e)

            return data

        def pre_call_hook(self, user_api_key_dict, cache, data, call_type):
            for p in self.STRIP_PARAMS:
                data.pop(p, None)
            return data

        async def async_log_success_event(self, kwargs, response_obj, start_time, end_time):
            metadata = (kwargs.get("litellm_params") or {}).get("metadata") or {}
            tracking_id = metadata.get("_tracking_id")
            if tracking_id:
                try:
                    _track_end(tracking_id)
                except Exception as e:
                    log.debug("track_end error: %s", e)

        async def async_log_failure_event(self, kwargs, response_obj, start_time, end_time):
            metadata = (kwargs.get("litellm_params") or {}).get("metadata") or {}
            tracking_id = metadata.get("_tracking_id")
            if tracking_id:
                try:
                    _track_end(tracking_id)
                except Exception as e:
                    log.debug("track_end error: %s", e)

    proxy_handler_instance = StripUnsupportedParams()
  active_requests_api.py: |
    from __future__ import annotations

    import json
    import os
    import time
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from typing import Any
    from urllib.parse import urlparse

    ACTIVE_FILE = os.environ.get("LITELLM_ACTIVE_FILE", "/shared/tracking/active_requests.json")
    MASTER_KEY = os.environ.get("LITELLM_MASTER_KEY", "").strip()
    PORT = int(os.environ.get("LITELLM_ACTIVE_PORT", "4001"))


    def _env_int(name: str, default: int) -> int:
        try:
            return int(os.environ.get(name, str(default)))
        except ValueError:
            return default


    STALE_AFTER_SEC = _env_int("LITELLM_ACTIVE_STALE_AFTER_SEC", 600)


    def _parse_started_at(value: Any) -> tuple[float | None, str | None]:
        if value is None:
            return None, None
        if isinstance(value, (int, float)):
            started_sec = float(value) / 1000.0 if value > 1e12 else float(value)
            return started_sec, datetime.fromtimestamp(started_sec, tz=timezone.utc).isoformat()
        if isinstance(value, str):
            raw = value.strip()
            if not raw:
                return None, None
            try:
                numeric = float(raw)
            except ValueError:
                try:
                    dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                except ValueError:
                    return None, None
                if dt.tzinfo is None:
                    dt = dt.replace(tzinfo=timezone.utc)
                dt = dt.astimezone(timezone.utc)
                return dt.timestamp(), dt.isoformat()
            started_sec = numeric / 1000.0 if numeric > 1e12 else numeric
            return started_sec, datetime.fromtimestamp(started_sec, tz=timezone.utc).isoformat()
        return None, None


    def _iter_raw_requests(payload: Any) -> list[dict[str, Any]]:
        if isinstance(payload, dict) and "active" in payload:
            payload = payload.get("active")
        if isinstance(payload, list):
            return [item for item in payload if isinstance(item, dict)]
        if isinstance(payload, dict):
            rows: list[dict[str, Any]] = []
            for request_id, info in payload.items():
                if isinstance(info, dict):
                    row = dict(info)
                    row.setdefault("request_id", request_id)
                    rows.append(row)
            return rows
        return []


    def _normalize_alias(value: Any) -> str:
        alias = str(value or "").strip()
        if not alias:
            return "unknown"
        if alias.startswith("litellm_proxy_master"):
            return "master"
        return alias


    def _normalize(payload: Any) -> list[dict[str, Any]]:
        now = time.time()
        items: list[dict[str, Any]] = []
        for raw in _iter_raw_requests(payload):
            request_id = raw.get("request_id") or raw.get("id")
            if request_id is None:
                continue
            started_raw = raw.get("ts")
            if started_raw is None:
                started_raw = raw.get("started_at")
            if started_raw is None:
                started_raw = raw.get("start_time")
            started_sec, started_iso = _parse_started_at(started_raw)
            age_seconds = int(max(0, now - started_sec)) if started_sec is not None else None
            if age_seconds is not None and age_seconds > STALE_AFTER_SEC:
                continue
            alias_raw = raw.get("key_alias")
            if alias_raw is None:
                alias_raw = raw.get("alias")
            if alias_raw is None:
                alias_raw = raw.get("key")
            alias = _normalize_alias(alias_raw)
            items.append(
                {
                    "request_id": str(request_id),
                    "key_alias": alias,
                    "alias": alias,
                    "model": raw.get("model"),
                    "call_type": raw.get("call_type"),
                    "started_at": started_iso,
                    "age_seconds": age_seconds,
                    "ts": started_sec,
                }
            )
        return items


    class Handler(BaseHTTPRequestHandler):
        server_version = "LiteLLMActiveRequests/1.0"

        def log_message(self, fmt: str, *args: Any) -> None:
            return

        def _send_json(self, status: int, payload: dict[str, Any]) -> None:
            body = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def _authorized(self) -> bool:
            if not MASTER_KEY:
                return True
            return self.headers.get("Authorization", "") == f"Bearer {MASTER_KEY}"

        def do_GET(self) -> None:
            path = urlparse(self.path).path
            if path == "/healthz":
                self._send_json(200, {"ok": True})
                return
            if path != "/internal/active-requests":
                self._send_json(404, {"error": "not_found"})
                return
            if not self._authorized():
                self._send_json(401, {"error": "unauthorized"})
                return

            try:
                with open(ACTIVE_FILE, "r", encoding="utf-8") as f:
                    payload = json.load(f)
            except FileNotFoundError:
                payload = {}
            except Exception as exc:
                self._send_json(
                    200,
                    {
                        "active": [],
                        "source": "litellm-active-api",
                        "stale_after_sec": STALE_AFTER_SEC,
                        "error": str(exc),
                    },
                )
                return

            self._send_json(
                200,
                {
                    "active": _normalize(payload),
                    "source": "litellm-active-api",
                    "stale_after_sec": STALE_AFTER_SEC,
                },
            )


    if __name__ == "__main__":
        server = ThreadingHTTPServer(("0.0.0.0", PORT), Handler)
        print(f"active-requests-api listening on :{PORT}", flush=True)
        server.serve_forever()
---
# Secrets via ExternalSecret (Vault path: secret/litellm)
# vault kv put secret/litellm \
#   LITELLM_MASTER_KEY=<random-32-char> \
#   DATABASE_URL="postgresql://litellm:<pwd>@postgres-shared-rw.databases.svc.cluster.local:5432/litellm"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef: { key: secret/litellm, property: LITELLM_MASTER_KEY }
    - secretKey: DATABASE_URL
      remoteRef: { key: secret/litellm, property: DATABASE_URL }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector: { matchLabels: { app: litellm } }
  template:
    metadata:
      labels: { app: litellm }
      annotations:
        config.k8s.e-dani.com/revision: local35-while-27b-disabled-20260613
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
        node-pool: ks5-nvme
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.85.1
          args:
            - --config=/config/config.yaml
            - --host=0.0.0.0
            - --port=4000
            - --detailed_debug
            - --use_v2_migration_resolver
            - --enforce_prisma_migration_check
          ports:
            - { name: http, containerPort: 4000, hostPort: 4000 }
          env:
            - { name: LITELLM_LOG, value: INFO }
            - { name: PYTHONPATH, value: /app }
            - { name: LITELLM_ACTIVE_FILE, value: /shared/tracking/active_requests.json }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
            - name: _DBUSER
              valueFrom: { secretKeyRef: { name: litellm-postgres-creds, key: username } }
            - name: _DBPASS
              valueFrom: { secretKeyRef: { name: litellm-postgres-creds, key: password } }
            - name: DATABASE_URL
              value: "postgresql://$(_DBUSER):$(_DBPASS)@postgres-shared-rw.databases.svc.cluster.local:5432/litellm"
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: config, mountPath: /app/litellm_strip_params.py, subPath: litellm_strip_params.py, readOnly: true }
            - { name: tracking, mountPath: /shared/tracking }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { memory: 3Gi }
          readinessProbe:
            httpGet: { path: /health/readiness, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 15
            # /health/readiness does a DB round-trip; under spend-aggregation
            # load it exceeds the 1s default and flaps the pod out of the
            # Service. 5s timeout + 5 failures tolerates the transient spikes.
            timeoutSeconds: 5
            failureThreshold: 5
        - name: active-requests-api
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/active-api/active_requests_api.py"]
          ports:
            - { name: active, containerPort: 4001 }
          env:
            - { name: LITELLM_ACTIVE_FILE, value: /shared/tracking/active_requests.json }
            - { name: LITELLM_ACTIVE_STALE_AFTER_SEC, value: "600" }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
          volumeMounts:
            - { name: config, mountPath: /active-api, readOnly: true }
            - { name: tracking, mountPath: /shared/tracking, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 4001 }
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: litellm-config }
        - name: tracking
          hostPath:
            path: /home/dibanez/dgx-tracking
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  selector: { app: litellm }
  ports:
    - { name: http, port: 4000, targetPort: 4000 }
    - { name: active, port: 4001, targetPort: 4001 }
