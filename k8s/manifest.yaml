        "dgx1-gemma4-26b-a4b-nvfp4-tooling",
        # 2026-08-13: los cinco alias de compatibilidad qwen36-35b* retirados de
        # ORNITH_ALIASES. Van por ID y no por prefijo porque comparten el prefijo
        # `ds4-flash-0731-tp2-` con los alias VIVOS de DeepSeek (tooling,
        # high, max...): purgar por prefijo se los llevaria por delante.
        # Sin esto, quitarlos de la tupla solo evita registros NUEVOS -- los ya
        # existentes en la BD de LiteLLM sobreviven para siempre, porque el
        # reconciler solo repara lo que declara.
        "ds4-flash-0731-tp2-qwen36-35b",
        "ds4-flash-0731-tp2-qwen36-35b-tooling",
        "ds4-flash-0731-tp2-qwen36-35b-reasoning",
        "ds4-flash-0731-tp2-qwen36-35b-nvfp4",
        "ds4-flash-0731-tp2-qwen-36-35b",
    )
    # 2026-08-15: de 8 prefijos a 1. Los siete que se van (gemma4 x2, qwen36-35b x2,
    # qwen36-27b-dense x2, qwen3coder) son de modelos borrados del cluster entre el
    # 26-07 y el 10-08: llevaban semanas recorriendose cada 10 s para purgar
    # registros que ya no puede crear nadie, porque sus backends no existen ni en
    # BACKENDS ni en disco. Una tumba solo hace falta mientras quede algo que
    # enterrar. La que se queda es la de HOY, que si tiene filas vivas que purgar.
    RETIRED_MANAGED_ID_PREFIXES = (
        # El 27B uncensored cambio su id_prefix de
        # `dgx2-qwen36-27b-uncensored-nvfp4` a `qwen38-27b` el 15-08. Sin esto sus
        # filas viejas quedan huerfanas: el ciclo solo reconoce como suyas las del
        # prefijo ACTIVO. Retirar esta entrada cuando /model/info confirme que no
        # queda ninguna.
        "dgx2-qwen36-27b-uncensored-nvfp4-",
    )

    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    K8S_HOST = os.getenv("KUBERNETES_SERVICE_HOST")
    K8S_PORT = os.getenv("KUBERNETES_SERVICE_PORT", "443")


    def _read_file(path: str) -> str:
        with open(path, "r", encoding="utf-8") as f:
            return f.read().strip()


    def _ssl_context() -> ssl.SSLContext:
        if os.path.exists(CA_PATH):
            return ssl.create_default_context(cafile=CA_PATH)
        return ssl.create_default_context()


    K8S_CONTEXT = _ssl_context()


    def _request_json(
        method: str,
        url: str,
        *,
        payload: dict[str, Any] | None = None,
        headers: dict[str, str] | None = None,
    ) -> Any:
        data = None
        req_headers = dict(headers or {})
        if payload is not None:
            data = json.dumps(payload).encode("utf-8")
            req_headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=data, headers=req_headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT_SECONDS) as resp:
                raw = resp.read().decode("utf-8", errors="replace")
        except urllib.error.HTTPError as exc:
            raw = exc.read().decode("utf-8", errors="replace")
            raise RuntimeError(f"{method} {url} -> HTTP {exc.code}: {raw[:500]}") from exc
        if not raw:
            return {}
        return json.loads(raw)


    def _k8s_get(path: str) -> Any:
        if not K8S_HOST:
            raise RuntimeError("KUBERNETES_SERVICE_HOST is not set")
        token = _read_file(TOKEN_PATH)
        url = f"https://{K8S_HOST}:{K8S_PORT}{path}"
        req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
        with urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT_SECONDS, context=K8S_CONTEXT) as resp:
            return json.loads(resp.read().decode("utf-8"))


    def _endpoint_condition_ready(endpoint: dict[str, Any]) -> bool:
        conditions = endpoint.get("conditions") or {}
        if conditions.get("terminating") is True:
            return False
        if conditions.get("ready") is False:
            return False
        if conditions.get("serving") is False:
            return False
        return bool(endpoint.get("addresses"))


    def _endpointslice_ready(service: str) -> bool:
        selector = urllib.parse.urlencode(
            {"labelSelector": f"kubernetes.io/service-name={service}"}
        )
        data = _k8s_get(
            f"/apis/discovery.k8s.io/v1/namespaces/{K8S_NAMESPACE}/endpointslices?{selector}"
        )
        ready_addresses: list[str] = []
        # NOTE: a scaled-to-zero Service still leaves an EndpointSlice whose
        # `endpoints` (and `ports`) fields are JSON null, not []. dict.get(k, [])
        # only substitutes the default when the key is ABSENT, so `null` slips
        # through and `for endpoint in None` raised TypeError every cycle,
        # wedging the controller into the `ready is None` skip-branch forever
        # (it never reconciled DGX2 in or out). Use `or []` to coerce null too.
        for item in data.get("items") or []:
            for endpoint in item.get("endpoints") or []:
                if _endpoint_condition_ready(endpoint):
                    ready_addresses.extend(endpoint.get("addresses") or [])
        if ready_addresses:
            log.debug("ready EndpointSlice addresses for %s: %s", service, ready_addresses)
            return True
        return False


    def _legacy_endpoints_ready(service: str) -> bool:
        data = _k8s_get(f"/api/v1/namespaces/{K8S_NAMESPACE}/endpoints/{service}")
        for subset in data.get("subsets", []) or []:
            if subset.get("addresses"):
                return True
        return False


    def endpoint_ready(service: str) -> bool | None:
        try:
            return _endpointslice_ready(service) or _legacy_endpoints_ready(service)
        except urllib.error.HTTPError as exc:
            if exc.code == 404:
                return False
            log.warning("Kubernetes readiness query failed for %s: HTTP %s", service, exc.code)
            return None
        except Exception as exc:
            log.warning("Kubernetes readiness query failed for %s: %s", service, exc)
            return None


    def _litellm_headers() -> dict[str, str]:
        if not LITELLM_MASTER_KEY:
            return {}
        return {"Authorization": f"Bearer {LITELLM_MASTER_KEY}"}


    def reconcile_required_team_models() -> None:
        """Keep fixed team permissions compatible with managed explicit aliases.

        This only widens one configured existing team by a fixed model list. It
        never creates teams, removes permissions, or accepts caller input.
        """
        if not OPENCLAW_TEAM_ID or not OPENCLAW_TEAM_REQUIRED_MODELS:
            return
        query = urllib.parse.urlencode({"team_id": OPENCLAW_TEAM_ID})
        data = _request_json(
            "GET",
            f"{LITELLM_BASE_URL}/team/info?{query}",
            headers=_litellm_headers(),
        )
        team = data.get("team_info", data) if isinstance(data, dict) else {}
        current = [str(model) for model in (team.get("models") or [])]
        desired = list(current)
        for model in OPENCLAW_TEAM_REQUIRED_MODELS:
            if model not in desired:
                desired.append(model)
        if desired != current:
            _request_json(
                "POST",
                f"{LITELLM_BASE_URL}/team/update",
                payload={"team_id": OPENCLAW_TEAM_ID, "models": desired},
                headers=_litellm_headers(),
            )
            log.info(
                "updated team %s model access with required models: %s",
                OPENCLAW_TEAM_ID,
                ",".join(OPENCLAW_TEAM_REQUIRED_MODELS),
            )

        # LiteLLM evaluates a virtual key's own allowlist before its team
        # allowlist, so a key can 403 even when its team is authorized.
        # Reconcile only the named keys, never every key of the team.
        team_keys = data.get("keys", []) if isinstance(data, dict) else []
        if OPENCLAW_KEY_ALIAS:
            _reconcile_key_models(
                OPENCLAW_KEY_ALIAS,
                OPENCLAW_TEAM_REQUIRED_MODELS,
                team_keys=team_keys,
            )
        if SAUVAGE_KEY_ALIAS and SAUVAGE_KEY_REQUIRED_MODELS:
            _reconcile_key_models(
                SAUVAGE_KEY_ALIAS,
                SAUVAGE_KEY_REQUIRED_MODELS,
                team_keys=team_keys,
            )


    def _reconcile_key_models(
        key_alias: str,
        required_models: tuple[str, ...],
        team_keys: list[dict[str, Any]] | None = None,
    ) -> None:
        """Additively union required_models onto one named key's own allowlist.

        The key is resolved from the latest /team/info payload when it is a
        member of that team; otherwise it is looked up by alias via /key/list,
        so a key outside the reconciled team (like sauvage-shield) is covered
        too. Only WIDENS: never creates keys and never removes models.
        """
        if not key_alias or not required_models:
            return
        key = None
        for candidate in team_keys or []:
            if isinstance(candidate, dict) and candidate.get("key_alias") == key_alias:
                key = candidate
                break
        if key is None:
            query = urllib.parse.urlencode(
                {"key_alias": key_alias, "return_full_object": "true"}
            )
            listed = _request_json(
                "GET",
                f"{LITELLM_BASE_URL}/key/list?{query}",
                headers=_litellm_headers(),
            )
            for candidate in (listed.get("keys") or []) if isinstance(listed, dict) else []:
                if isinstance(candidate, dict) and candidate.get("key_alias") == key_alias:
                    key = candidate
                    break
        if key is None:
            log.warning("key %s not found in team payload nor /key/list", key_alias)
            return
        key_token = str(key.get("token") or "")
        if not key_token:
            log.warning("key %s has no updatable token", key_alias)
            return
        key_current = [str(model) for model in (key.get("models") or [])]
        key_desired = list(key_current)
        for model in required_models:
            if model not in key_desired:
                key_desired.append(model)
        if key_desired == key_current:
            return
        _request_json(
            "POST",
            f"{LITELLM_BASE_URL}/key/update",
            payload={"key": key_token, "models": key_desired},
            headers=_litellm_headers(),
        )
        log.info(
            "updated key %s model access with required models: %s",
            key_alias,
            ",".join(required_models),
        )


    def managed_model_id(backend: dict[str, Any], alias: str) -> str:
        return f"{backend['id_prefix']}-{alias}"


    def extra_litellm_params(backend: dict[str, Any], alias: str) -> dict[str, Any]:
        # SE ACUMULA, no se devuelve al primer acierto. Antes el guard de Qwen
        # hacia `return` y cortaba: el dia que Qwen tenga lambda por peticion, su
        # alias `-uncensored` habria salido SIN sello y con el repeat guard puesto,
        # sin un solo aviso. Los dos ajustes son ortogonales y deben poder convivir.
        params: dict[str, Any] = {}
        base_model = str(backend.get("base_model") or "")
        # 15-08: era `openai/qwen36-`. Al renombrar el base_model a `openai/qwen38-27b`
        # este startswith dejaba de casar y el repetition_penalty 1.08 se apagaba EN
        # SILENCIO — Qwen documenta que sin ese guard degrada el tool-calling.
        if base_model.startswith("openai/qwen38-"):
            params.update(QWEN38_REPEAT_GUARD_PARAMS)
        if alias.endswith(UNCENSORED_SUFFIX):
            lam = UNCENSORED_ON_LAMBDA.get(base_model)
            if lam is None:
                # Alias `-uncensored` sobre un backend sin lambda declarado. Se
                # deja SIN sello a proposito: mejor un alias que se comporta como
                # el normal y lo dice el log, que uno que promete y no cumple.
                log.warning(
                    "alias %s pide sello -uncensored pero %s no tiene lambda en "
                    "UNCENSORED_ON_LAMBDA; se registra SIN cache_salt",
                    alias, base_model,
                )
                return params
            # `cache_salt` viaja en extra_body y NO lo toca nadie por el camino:
            # no esta en ningun `drop` de FAMILY_SAMPLING (comprobado 18-08), asi
            # que llega entero a vLLM. Alli lo parsea `parse_request_lambda` y el
            # runner lo expande a lambda por token del rol que toque.
            #
            # COSTE REAL, para que no sorprenda: cache_salt entra en la clave de
            # hash de bloque del prefix cache de vLLM, asi que este alias tiene su
            # PROPIO espacio de cache KV. Es lo correcto — no quieres que una
            # peticion sellada comparta bloques con una sin sellar — pero el hit
            # rate del alias es independiente del alias normal.
            params["extra_body"] = {"cache_salt": f"refusal:{lam}"}
        return params


    def desired_deployments(backend: dict[str, Any]) -> list[dict[str, Any]]:
        deployments = []
        for alias in backend["aliases"]:
            deployments.append(
                {
                    "model_name": alias,
                    "litellm_params": {
                        "model": backend["base_model"],
                        "api_base": backend["api_base"],
                        "api_key": "not-used",
                        "timeout": 600,
                        "max_parallel_requests": backend["max_parallel_requests"],
                        **extra_litellm_params(backend, alias),
                    },
                    # LOS NOMBRES DE LOS CAMPOS SON LOS DE LITELLM, NO LOS NUESTROS
                    # (2026-08-10). Hasta hoy esto declaraba `context_window`, que NO
                    # es un campo de ModelInfo:
                    #     'context_window' in get_type_hints(litellm...ModelInfo)
                    #     -> False
                    # Se guardaba como metadato suelto y no lo leia NADIE, asi que
                    # los 256k del modelo eran invisibles: `max_input_tokens` salia
                    # null y el unico numero que veia un cliente era `max_tokens`,
                    # que es el techo de SALIDA. De ahi que opencode se configurara
                    # con 16k de contexto y que el catalogo de Aurora tenga el
                    # "256K" hardcodeado en un parche del bundle del frontend.
                    #
                    # La convencion la fija litellm con los modelos que si conoce
                    # (gpt-5.6-sol): max_tokens == max_output_tokens, y
                    # max_input_tokens es la ventana. `max_tokens` se mantiene por
                    # ser el campo legacy que aun leen sitios como token_counter.
                    #
                    # Es informativo, no un gate: max_input_tokens solo se agrega en
                    # Router.get_model_group_info() para reportar. Declararlo no
                    # activa ningun rechazo pre-call.
                    "model_info": {
                        "id": managed_model_id(backend, alias),
                        "max_tokens": backend["max_output_tokens"],
                        "max_output_tokens": backend["max_output_tokens"],
                        "max_input_tokens": backend["max_input_tokens"],
                        "supports_function_calling": backend["supports_function_calling"],
                        "supports_vision": backend["supports_vision"],
                        "supports_reasoning": bool(backend.get("supports_reasoning", False)),
                        "supported_reasoning_efforts": list(
                            backend.get("supported_reasoning_efforts", ())
                        ),
                        "managed_by": "litellm-dgx-backend-sync",
                        "backend": backend["backend"],
                        "k8s_namespace": K8S_NAMESPACE,
                        "k8s_service": backend["service"],
                    },
                }
            )
        return deployments


    def current_models_by_id() -> dict[str, dict[str, Any]]:
        data = _request_json(
            "GET",
            f"{LITELLM_BASE_URL}/model/info",
            headers=_litellm_headers(),
        )
        items = data.get("data", data) if isinstance(data, dict) else data
        models: dict[str, dict[str, Any]] = {}
        for item in items or []:
            info = item.get("model_info") or {}
            model_id = info.get("id") or item.get("model_id") or item.get("id")
            if model_id:
                models[str(model_id)] = item
        return models


    def current_model_ids() -> set[str]:
        return set(current_models_by_id())


    def managed_model_contract(deployment: dict[str, Any]) -> dict[str, Any]:
        """Fields that must be refreshed even when the stable model ID exists.

        LiteLLM's `/model/new` is create-only. A controller restart therefore
        used to preserve stale context/capability metadata forever because the
        reconciler compared only IDs. Secrets and server-populated fields are
        deliberately excluded so they cannot create a delete/add loop.
        """
        info = deployment.get("model_info") or {}
        params = deployment.get("litellm_params") or {}
        return {
            "model_name": deployment.get("model_name"),
            "model": params.get("model"),
            "api_base": params.get("api_base"),
            "max_parallel_requests": params.get("max_parallel_requests"),
            "max_tokens": info.get("max_tokens"),
            "max_output_tokens": info.get("max_output_tokens"),
            "max_input_tokens": info.get("max_input_tokens"),
            "supports_function_calling": info.get("supports_function_calling"),
            "supports_vision": info.get("supports_vision"),
            "supports_reasoning": bool(info.get("supports_reasoning", False)),
            "supported_reasoning_efforts": list(
                info.get("supported_reasoning_efforts") or ()
            ),
            "backend": info.get("backend"),
            "k8s_namespace": info.get("k8s_namespace"),
            "k8s_service": info.get("k8s_service"),
        }


    def add_model(deployment: dict[str, Any]) -> None:
        model_id = deployment["model_info"]["id"]
        try:
            _request_json(
                "POST",
                f"{LITELLM_BASE_URL}/model/new",
                payload=deployment,
                headers=_litellm_headers(),
            )
            backend = (deployment.get("model_info") or {}).get("backend", "unknown").upper()
            log.info("enabled %s backend %s for alias %s", backend, model_id, deployment["model_name"])
        except RuntimeError as exc:
            msg = str(exc).lower()
            # 2026-08-15: la deteccion de duplicado solo miraba "already"+"exist",
            # y LiteLLM NO dice eso. Devuelve un 500 generico ("Failed to add model
            # to db") y deja el UniqueViolationError solo en SUS logs, asi que el
            # match nunca casaba y el reconcile fallaba cada 10 s en bucle.
            #
            # POR QUE se reintenta crear algo que ya existe: el sync escribe por el
            # Service de LiteLLM, que balancea entre 4 replicas. Crea en la replica
            # A y relee en la B, que aun no tiene la fila en su router en memoria;
            # como no la ve, vuelve a crear. Es read-after-write inconsistente, no
            # un fallo de logica del reconcile.
            #
            # Un choque de clave primaria SIGNIFICA que la fila existe, que es el
            # estado deseado. Se toma como exito y se avisa, en vez de repetir el
            # ciclo indefinidamente. Un fallo de BD real (conexion, permisos) no
            # lleva esta firma y sigue propagandose.
            if ("already" in msg and "exist" in msg) or "failed to add model to db" in msg:
                log.warning(
                    "backend %s ya existia al crearlo (read-after-write entre "
                    "replicas de litellm); se toma como exito", model_id
                )
                return
            raise


    def delete_model(model_id: str) -> None:
        try:
            _request_json(
                "POST",
                f"{LITELLM_BASE_URL}/model/delete",
                payload={"id": model_id},
                headers=_litellm_headers(),
            )
            log.info("disabled backend %s", model_id)
        except RuntimeError as exc:
            msg = str(exc).lower()
            if "not found" in msg or "does not exist" in msg:
                log.info("backend %s already absent", model_id)
                return
            raise


    def cleanup_retired_models(existing: set[str] | None = None) -> None:
        existing_ids = set(existing if existing is not None else current_model_ids())
        retired = {model_id for model_id in RETIRED_MANAGED_IDS if model_id in existing_ids}
        for prefix in RETIRED_MANAGED_ID_PREFIXES:
            retired.update(model_id for model_id in existing_ids if model_id.startswith(prefix))
        for model_id in sorted(retired):
            delete_model(model_id)


    def conflicting_managed_ids(backend: dict[str, Any]) -> set[str]:
        """Managed IDs of OTHER backends that claim an alias of this one.

        LiteLLM does not enforce alias uniqueness: `/model/new` happily accepts a
        second deployment under `tooling` with a different model_info.id and the
        router then load-balances across both. Until 2026-08-03 nothing in this
        controller relied on that -- every backend owned a disjoint alias set. The
        three DGX1 tooling candidates share one tuple, so the ONLY thing keeping
        `tooling` single-valued is that one physical GPU cannot make two of them
        Ready at once.

        That is a property of the hardware, not an invariant of this loop, and the
        loop can still double-register without it being violated: endpoint_ready()
        returns None on any non-404 Kubernetes error, and a None makes main() SKIP
        that backend entirely -- leaving the outgoing resident's IDs registered
        while the incoming one, which reads fine, registers its own. Half of
        `tooling` would then be routed to an api_base whose pod is gone.

        So enabling a backend explicitly evicts every sibling registration that
        claims one of its aliases, before adding its own. Last one Ready wins, and
        the overlap is bounded to the single cycle that observes it.
        """
        own_aliases = set(backend["aliases"])
        conflicting: set[str] = set()
        for other in BACKENDS:
            if other["name"] == backend["name"]:
                continue
            for alias in own_aliases & set(other["aliases"]):
                conflicting.add(managed_model_id(other, alias))
        return conflicting


    def reconcile_backend(backend: dict[str, Any], enable: bool) -> None:
        desired = desired_deployments(backend)
        managed_ids = {d["model_info"]["id"] for d in desired}
        current = current_models_by_id()
        existing = set(current)
        cleanup_retired_models(existing)
        current = current_models_by_id()
        existing = set(current)
        active_prefix = f"{backend['id_prefix']}-"
        stale_ids = {
            model_id
            for model_id in existing
            if model_id.startswith(active_prefix) and model_id not in managed_ids
        }
        for model_id in sorted(stale_ids):
            delete_model(model_id)
        existing -= stale_ids
        if enable:
            # Evict siblings BEFORE adding, so the alias is never briefly served by
            # two deployments within one cycle.
            for model_id in sorted(conflicting_managed_ids(backend) & existing):
                log.info(
                    "evicting conflicting registration %s: %s claims the same alias",
                    model_id,
                    backend["name"],
                )
                delete_model(model_id)
                existing.discard(model_id)
            for deployment in desired:
                model_id = deployment["model_info"]["id"]
                if (
                    model_id in current
                    and managed_model_contract(current[model_id])
                    != managed_model_contract(deployment)
                ):
                    log.info("refreshing changed model contract %s", model_id)
                    delete_model(model_id)
                    existing.discard(model_id)
                    current.pop(model_id, None)
                if model_id not in existing:
                    add_model(deployment)
        else:
            for model_id in sorted(managed_ids & existing):
                delete_model(model_id)


    def main() -> None:
        log.info(
            "starting sync: namespace=%s services=%s litellm=%s interval=%ss ready_grace=%ss",
            K8S_NAMESPACE,
            ",".join(f"{b['name']}={b['service']}" for b in BACKENDS),
            LITELLM_BASE_URL,
            INTERVAL_SECONDS,
            READY_GRACE_SECONDS,
        )
        ready_since: dict[str, float | None] = {b["name"]: None for b in BACKENDS}
        last_desired: dict[str, bool | None] = {b["name"]: None for b in BACKENDS}
        next_team_reconcile = 0.0
        while True:
            now = time.monotonic()
            if now >= next_team_reconcile:
                try:
                    reconcile_required_team_models()
                except Exception as exc:
                    log.warning("team model access reconcile failed: %s", exc)
                next_team_reconcile = now + TEAM_RECONCILE_SECONDS
            for backend in BACKENDS:
                name = backend["name"]
                service = backend["service"]
                ready = endpoint_ready(service)
                if ready is None:
                    continue
                if ready:
                    if ready_since[name] is None:
                        ready_since[name] = now
                    if now - (ready_since[name] or now) < READY_GRACE_SECONDS:
                        # A controller restart has no durable ready_since state. Keep
                        # the last known-good registrations through this warm-up
                        # interval instead of deleting every live alias and creating
                        # a transient routing outage on each restart.
                        continue
                    desired = True
                else:
                    ready_since[name] = None
                    desired = False
                try:
                    reconcile_backend(backend, desired)
                    if desired != last_desired[name]:
                        log.info("desired %s routing state changed: enabled=%s", name.upper(), desired)
                        last_desired[name] = desired
                except Exception as exc:
                    log.warning("reconcile failed for %s/%s: %s", K8S_NAMESPACE, service, exc)
            time.sleep(INTERVAL_SECONDS)


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-dgx-backend-sync
  namespace: litellm
spec:
  # ── RETIRADO 2026-08-18 ─────────────────────────────────────────────────────
  #
  # A 0 replicas, no borrado del fichero: esta Application lleva `prune: false`,
  # asi que quitarlo de git lo dejaria vivo en el cluster para siempre. `replicas:
  # 0` SI lo aplica selfHeal. El codigo se conserva a la vista porque documenta el
  # mecanismo que se sustituye y como se medio su dano.
  #
  # QUE HACIA Y POR QUE SOBRA: registraba en runtime, por HTTP contra /model/new,
  # los alias del residente vivo, y los borraba con /model/delete en cuanto el
  # Service pasaba a NotReady. Con /model/new create-only + store_model_in_db:
  # true, eso producia alias que aparecian y desaparecian solos y sobrevivian en
  # postgres a su propio autor. Medido en sus logs del 18-08: 11:43 desregistro los
  # nueve alias de DeepSeek uno a uno, 12:37 los volvio a crear.
  #
  # Ahora los alias son estaticos en el model_list de arriba y «quien esta arriba»
  # lo contesta el Service de pool `tooling` de Kubernetes, que es su competencia.
  #
  # LO QUE MUERE CON EL, a proposito: reconciliaba cada 300s el allowlist del
  # equipo/key de OpenClaw ENSANCHANDOLO con OPENCLAW_TEAM_REQUIRED_MODELS. Eso
  # habia acumulado 48 nombres, ~12 de ellos de modelos que ya no existen, y a la
  # vez dejaba fuera los alias nuevos (`deepseek-v4-flash-0731-uncensored` daba 403
  # el 18-08). El allowlist pasa a estar VACIO = todos: probado el 18-08 en las 4
  # replicas (403 antes, 200 despues). Autorizar deja de ser una lista y pasa a ser
  # «lo que declara este YAML».
  replicas: 0
  selector:
    matchLabels:
      app: litellm-dgx-backend-sync
  template:
    metadata:
      labels:
        app: litellm-dgx-backend-sync
      annotations:
        # HASH del contenido del ConfigMap sync.py, no una etiqueta a mano.
        #
        # Este pod NO relee su ConfigMap en caliente: main() es un `while True` +
        # sleep, sin importlib.reload ni watcher, asi que Python importa el
        # modulo al arrancar y ya no vuelve a mirarlo. Kubelet SI refresca el
        # fichero montado, con lo que el disco queda bien y el proceso mal, sin
        # un solo error en ningun log.
        #
        # Paso el 2026-08-13 con 7f8634f (retirada de los alias qwen36-35b*):
        # ArgoCD `Synced / Healthy`, fichero refrescado a las 11:08 — y los cinco
        # alias siguieron registrados DOCE HORAS, hasta un restart a mano.
        # `Synced` dice que el manifiesto coincide con git, no que el proceso
        # ejecute ese codigo.
        #
        # Antes esto era una etiqueta descriptiva que habia que acordarse de
        # bumpear. Ahora es el sha256 del `data` del ConfigMap: cualquier edicion
        # del sync cambia el hash, cambia la plantilla del pod y ArgoCD dispara
        # el rollout solo. Lo vigila
        # tests/test_configmap_revision_bump_contract.py, y se recalcula con
        #     python3 tests/test_configmap_revision_bump_contract.py --fix
        config.k8s.e-dani.com/revision: sync-67926820a976
    spec:
      serviceAccountName: litellm-dgx-backend-sync
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
        node-pool: ks5-nvme
      containers:
        - name: sync
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/sync.py"]
          env:
            - { name: LITELLM_BASE_URL, value: "http://litellm.litellm.svc.cluster.local:4000" }
            - { name: K8S_NAMESPACE, value: "llm" }
            # DGX1 tooling seat: three mutually exclusive candidates, one GPU. The
            # dashboard's DGX1 model-mode button scales exactly one of them to 1.
    # The Qwen3.6-35B, censored 27B F2 and Gemma-4 Services were DELETED on
    # 2026-07-26, so their backends and K8S_SERVICE_* envs were removed here on
    # 2026-07-27; there is no scale-to-zero rollback path left.
            # DGX1 permanent floor plus the optional DGX2 dense F2 twin.
            # Isolated explicit alias: one DGX2 backend, no fallback.
            # 15-08: estas dos PISAN los defaults de BACKENDS. Si se renombra alli
            # y aqui no, el rename es un no-op silencioso.
            - { name: K8S_SERVICE_QWEN38_27B, value: "vllm-qwen38-27b-uncensored" }
            - { name: QWEN38_27B_MODEL, value: "openai/qwen38-27b" }
            - { name: SYNC_INTERVAL_SECONDS, value: "10" }
            - { name: READY_GRACE_SECONDS, value: "20" }
            # Durable least-privilege reconciliation for the existing OpenClaw
            # team. The controller only unions this fixed explicit alias.
            - { name: OPENCLAW_TEAM_ID, value: "openclaw" }
            # Fixed explicit routes required during the canary. The reconciler
            # only unions these names; it never removes existing permissions.
            # El gate del EQUIPO es el que se olvida --
            # con la key abierta y el equipo no, los pods salen Healthy y TODA
            # inferencia da 403 team_model_access_denied. reconcile_required_team_models
            # es aditivo, asi que esto solo ensancha.
            #
            # 2026-08-13: +dense, +dense-reasoning, +tooling, +deepseek-v4-flash-0731
            # 2026-08-15: -dense, -dense-reasoning, -dense-uncensored (+qwen38-27b).
            #
            #   - Esto abre PERMISO, no uso: el modelo que corre cada agente sigue
            #     declarado en values.yaml del chart de OpenClaw.
            # Esto solo toca el EQUIPO `openclaw` y la key OPENCLAW_KEY_ALIAS. NO
            # tocar desde aqui `openclaw-codex-app-server` ni
            # `openclaw-operator-readonly`: sus bootstraps comparan igualdad EXACTA
            # de la lista de modelos y ensancharlas rompe el sync.
            # 24-08-2026: fuera `high` y `max` — retirados del model_list. El
            # reconciler es ADITIVO: lo que no se quita aqui se le vuelve a
            # escribir al equipo en cada ciclo aunque el modelo no exista.
            - { name: OPENCLAW_TEAM_REQUIRED_MODELS, value: "ornith-canary,ornith-1.0,qwen38-27b,tooling,deepseek-v4-flash-0731,qwen35-4b" }
            - { name: OPENCLAW_KEY_ALIAS, value: "openclaw-qwen36-prod" }
            # Key del bot sauvage-shield: su allowlist se declara AQUI (GitOps)
            # y _reconcile_key_models la re-aplica cada ciclo. Fuera del equipo
            # openclaw: se resuelve por /key/list en vez de por el payload del
            # team. Aditivo, como el de OpenClaw: nunca quita modelos.
            - { name: SAUVAGE_KEY_ALIAS, value: "sauvage-shield" }
            - { name: SAUVAGE_KEY_REQUIRED_MODELS, value: "tooling,qwen35-4b" }
            - { name: TEAM_RECONCILE_SECONDS, value: "300" }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
          volumeMounts:
            - { name: sync, mountPath: /app, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: sync
          configMap: { name: litellm-dgx-backend-sync }
---
# Un drain (los reinicios de Ansible de los ks5 son rutina) no debe poder dejar
# el proxy a cero.
#
# 2026-08-19: era `minAvailable: 2`, y con 2 replicas eso da allowedDisruptions=0
# -- o sea que CUALQUIER drenaje de nodo se queda colgado para siempre. Se pasa a
# maxUnavailable: 1, que expresa la misma intencion (nunca por debajo de 1 pod
# sirviendo) pero relativa al numero de replicas en vez de absoluta: con 2
# replicas deja drenar un nodo, y sigue siendo correcto si mañana se sube a 3.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  namespace: litellm
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app: litellm } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
spec:
  # 2026-08-14: de singleton a 4 replicas, una por nodo amd64 util (los tres
  # ks5-cp + ubuntu/x86). Motivo: dos OOMKill seguidos a 3Gi con ~74 req/min --
  # LiteLLM es hoy el proxy de TODO (residente local + ChatGPT) y un singleton
  # es un punto unico de fallo con cola. El registro dinamico de modelos vive en
  # postgres (store_model_in_db), asi que las replicas comparten catalogo; el
  # estado en proceso (cooldowns del router, active-requests) pasa a ser por-pod
  # y se asume: es telemetria y proteccion local, no correctness.
  #
  # 2026-08-19: de 4 a 2. Las 4 eran sobre-arquitectura y su precio era un rollout
  # de ~50 min (ver la aritmetica en progressDeadlineSeconds mas abajo). Medido
  # sobre 89.672 peticiones de 48h y `kubectl top`:
  #   - CPU por pod: 5-6m contra un request de 300m. LiteLLM es un proxy async
  #     I/O-bound: la concurrencia es espera al backend, no trabajo de CPU.
  #   - concurrencia real (sweep-line sobre startTime/endTime de LiteLLM_SpendLogs):
  #     media 6,68 / p99 37 / pico 77. Con p50 de 0,31s por peticion, esos picos son
  #     unos pocos streams largos solapados, no CPU. 38 en vuelo por pod en un
  #     event loop async es trivial.
  #   - memoria por pod: ~1,4-1,5Gi con limite de 6Gi, y practicamente CONSTANTE
  #     entre pods de 29 y 53 min de vida: es el catalogo de 54 modelos + runtime,
  #     no crece por peticion. El OOM que motivo las 4 replicas era de la era
  #     singleton con limite 3Gi, que ya no existe.
  # Y un argumento de correctness a favor de bajar: max_parallel_requests es un
  # limite POR PROCESO. Con 4 replicas un backend declarado a 4 veia hasta 16 en
  # paralelo; con 2 ve 8. Menos replicas acerca la proteccion a lo que dice el yaml.
  # 2 replicas siguen cubriendo lo unico que de verdad se pedia: que no haya punto
  # unico de fallo y que se pueda rodar sin downtime.
  replicas: 2
  # maxSurge 1 / maxUnavailable 0 (2026-08-19). Esto es EXACTAMENTE lo contrario de
  # lo que habia, y lo que antes lo mataba ya no aplica -- pero la razon por la que
  # murio en 08-14 sigue siendo verdad y hay que respetarla, asi que se anota:
  #
  #   El intento de 08-14 fallo porque pedia 4 replicas de 300m MAS una quinta de
  #   sobra sobre un pool al 93-99% de CPU pedida:
  #       0/7 nodes are available: ... 3 Insufficient cpu ...
  #   El pod nuevo se quedo 10 min en Pending mientras las 4 viejas servian la
  #   config antigua: un arreglo urgente de config no podia llegar.
  #
  # Ahora el surge es 2+1=3 pods de 160m (no 5 de 310m), y sobre todo el
  # topologySpread pasa a ScheduleAnyway, que es lo que quitaba el candado (ver el
  # comentario en topologySpreadConstraints). maxUnavailable 0 da rollout sin
  # perdida de capacidad: el pod nuevo esta Ready ANTES de que el viejo empiece a
  # drenar, en vez de servir con una replica menos durante 720s.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # 2026-08-19: vuelve al default de 600. Los 1200 existian para tapar el rollout
  # serializado que se acaba de eliminar, y conviene dejar escrito el porque, que
  # es LA causa raiz del rollout de ~50 min:
  #
  #   maxSurge 0 + topologySpread maxSkew 1 + DoNotSchedule sobre exactamente 4
  #   nodos: al bajar una replica el reparto quedaba 1,1,1,0 y el pod nuevo SOLO
  #   cabia en el nodo que se acababa de vaciar -- en cualquier otro el skew se
  #   iria a 2 y DoNotSchedule lo vetaba. Pero ese nodo no suelta la CPU hasta que
  #   el pod viejo termina de drenar sus 720s (un pod Terminating sigue contando
  #   su request), con los ks5 al 93-99% de CPU pedida. O sea: cada replica
  #   esperaba los 720s ENTEROS en Pending, y 4 x 720s ~= 48 min en serie.
  #   Medido el 15-08: 24 FailedScheduling en 12 min clavados antes de programarse.
  #   progressDeadline cuenta desde el ultimo progreso, asi que bastaba con que UNA
  #   replica pasara de 600 para marcar el rollout entero como fallido -- de ahi
  #   los 1200, y de ahi que CADA sync dejara la Application en Degraded y la
  #   operacion de Argo en Failed con las 4 replicas Available todo el rato.
  #
  # Con maxSurge 1 + ScheduleAnyway el pod nuevo ya no depende de que se libere un
  # nodo concreto: se programa de inmediato y llega a Ready en initialDelaySeconds
  # 20 + probe. 600s dejan un margen enorme sobre eso y devuelven una señal de
  # fallo util en vez de 20 min de silencio. terminationGracePeriodSeconds sigue
  # en 720 (el drenaje de streams es deliberado) pero ya no serializa nada: el pod
  # viejo drena EN PARALELO, con el nuevo ya sirviendo.
  progressDeadlineSeconds: 600
  selector: { matchLabels: { app: litellm } }
  template:
    metadata:
      labels: { app: litellm }
      annotations:
        # The request-policy hook lives in the mounted ConfigMap and is imported at
        # process start, so every material hook change must roll this pod.
        # HASH del ConfigMap litellm-config. LiteLLM carga model_list y el hook
        # al arrancar; que kubelet refresque los ficheros montados no actualiza el
        # router en memoria. El contrato y el --fix viven en
        # tests/test_configmap_revision_bump_contract.py.
        config.k8s.e-dani.com/revision: config-9d01eafaaf5a
        active-requests-api/revision: "20260726-request-history-trace"
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 720
      # 2026-08-21, decision del owner: TODO litellm corre EXCLUSIVAMENTE en
      # `ubuntu` (el x86 de la RTX). La lista pasa de cuatro nodos a uno.
      #
      # LO QUE SE PIERDE, escrito para que nadie lo descubra en un incidente:
      # con un solo nodo elegible las 2 replicas ya NO dan HA de nodo -- protegen
      # de la caida de un pod, no de la del host. Si `ubuntu` cae, cae el proxy de
      # TODO el trafico LLM. Y `ubuntu` deja de ser drenable sin corte: al
      # cordonarlo el pod desalojado no tiene donde reprogramarse, se queda
      # Pending, y el PDB (maxUnavailable 1) bloquea el desalojo del segundo. El
      # drain se cuelga. Es inherente a fijar a un nodo, no un fallo de config.
      #
      # `ubuntu` lleva un taint BLANDO pool=dev:PreferNoSchedule. Se sigue
      # tolerando: con un unico nodo elegible no puede bloquear, pero sin la
      # toleracion el scheduler lo penaliza en la puntuacion sin necesidad.
      tolerations:
        - { key: pool, operator: Equal, value: dev, effect: PreferNoSchedule }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [ubuntu]
      # 2026-08-21: con UN solo dominio esta restriccion es inerte -- todos los
      # pods caen en el mismo hostname, asi que el skew es siempre 0 y nunca puede
      # violarse. Se conserva a proposito: si algun dia se vuelve a ensanchar el
      # nodeAffinity, la maquinaria de reparto vuelve a funcionar sola, y los
      # contratos de tests/test_litellm_rollout_shape_contract.py la leen.
      #
      # ScheduleAnyway y NO DoNotSchedule (2026-08-19). Este es el cambio que de
      # verdad desserializa el rollout; bajar replicas por si solo NO bastaba.
      #
      # La aritmetica del skew con 2 replicas y maxSurge 1, sobre los 4 nodos que
      # deja el nodeAffinity:
      #   - regimen estable, 2 pods / 4 dominios -> 1,1,0,0 -> skew = 1-0 = 1 <= 1 OK
      #   - durante el rollout, 2+1 = 3 pods / 4 dominios -> 1,1,1,0 -> skew = 1 OK
      # O sea que en el papel maxSkew 1 se cumple. El problema es que en el papel
      # no se ve el pod Terminating: sigue contando en el recuento de topologia Y
      # sigue reservando su CPU durante los 720s del drenaje. Peor caso real:
      #     cp-1 = 1 (Terminating)   cp-2 = 0   cp-3 = 1 (viejo)   ubuntu = 1 (nuevo)
      # el UNICO dominio con cuenta 0 es cp-2, y cp-2 tiene 75m de CPU libre
      # (7925m pedidos de 8000m) contra los 160m que pide el pod. Con DoNotSchedule
      # eso es FailedScheduling y vuelve el candado de 720s, con 2 replicas igual
      # que con 4.
      #
      # ScheduleAnyway convierte el reparto en puntuacion en vez de filtro: el
      # scheduler SIGUE prefiriendo un pod por nodo (es lo que puntua), pero cuando
      # la unica casilla que respeta el skew no tiene CPU, dobla en otro nodo en vez
      # de quedarse en Pending. El reparto 1-por-nodo es una preferencia de HA, no
      # una condicion de correctness: no hay estado por-nodo que lo exija.
      # CPU libre medida para el pod de surge (150m + 10m del sidecar = 160m):
      # cp-1 520m OK, cp-3 540m OK, ubuntu 1645m OK, cp-2 75m NO -> 3 de 4 nodos
      # pueden aceptarlo en cualquier momento, asi que no hay deadlock posible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: litellm } }
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.96.0
          args:
            - --config=/config/config.yaml
            - --host=0.0.0.0
            - --port=4000
            - --use_v2_migration_resolver
            - --enforce_prisma_migration_check
          ports:
            - { name: http, containerPort: 4000 }
          env:
            - { name: LITELLM_LOG, value: INFO }
            - { name: PYTHONPATH, value: /app }
            - { name: LITELLM_ACTIVE_FILE, value: /shared/tracking/active_requests.json }
            - { name: LITELLM_ACTIVE_STALE_AFTER_SEC, value: "900" }
            - { name: LITELLM_DRAIN_TIMEOUT_SEC, value: "660" }
            - { name: COMPUTE_MODE_URL, value: "http://dgx-dashboard-backend.control-nexus.svc.cluster.local:9002/api/compute/mode" }
            - { name: COMPUTE_MODE_CACHE_SECONDS, value: "5" }
            - { name: COMPUTE_MODE_TIMEOUT_SECONDS, value: "10" }
            - { name: COMPUTE_MODE_RETRY_AFTER_SECONDS, value: "5" }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
            # Langfuse native callback (LLM tracing). Points at the in-cluster web
            # service directly (bypasses the SSO edge). Keys from litellm-secrets ESO.
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LANGFUSE_PUBLIC_KEY } }
            - name: LANGFUSE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LANGFUSE_SECRET_KEY } }
            - name: LANGFUSE_HOST
              value: "http://langfuse-web.langfuse.svc.cluster.local:3000"
            # Credencial hacia el puente `litellm-codex` (ver codex-bridge.yaml).
            - name: LITELLM_CODEX_BRIDGE_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_CODEX_BRIDGE_KEY } }
            # Keys autorizadas a pedir los alias del puente ChatGPT. Lista CERRADA:
            # a diferencia del gate abliterado, este falla CERRADO — si la variable
            # llega vacia se deniega a todo el mundo, incluida la master. Es lo
            # pedido: «solo la key de CODEX, deny a todo lo demas».
            # 26-08-2026: entra `opencode-20260630-local`. Decision del owner con el
            # riesgo sobre la mesa: es el puente de los dos baneos del 20/21-08. Lo
            # que lo acota es que el default de opencode sigue siendo `tooling`
            # (local), asi que estos modelos hay que elegirlos A MANO por sesion y no
            # reciben trafico de fondo. Vigilar el consumo de la cuenta en spend logs.
            - { name: LITELLM_CODEX_ALLOWED_KEYS, value: "codex,opencode-20260630-local" }
            # Credencial de la cuenta de OpenRouter. Primer upstream del gateway que
            # sale a Internet; el model_list lo consume como `os.environ/`.
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: OPENROUTER_API_KEY } }
            # Keys autorizadas a pedir los alias `or-*`. Misma forma que el gate del
            # puente y por el mismo motivo: falla CERRADO. Si la variable llega vacia
            # se deniega a todo el mundo, incluida la master. Hace falta porque el
            # allowlist de la key NO puede cerrar nada — `models: []` = todos, y 7 de
            # 10 keys lo tienen asi, luego publicar el alias lo concede a ocho keys.
            - { name: LITELLM_OPENROUTER_ALLOWED_KEYS, value: "opencode-20260630-local" }
            - name: _DBUSER
              valueFrom: { secretKeyRef: { name: litellm-postgres-creds, key: username } }
            - name: _DBPASS
              valueFrom: { secretKeyRef: { name: litellm-postgres-creds, key: password } }
            - name: DATABASE_URL
              value: "postgresql://$(_DBUSER):$(_DBPASS)@postgres-shared-rw.databases.svc.cluster.local:5432/litellm"
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: config, mountPath: /app/litellm_strip_params.py, subPath: litellm_strip_params.py, readOnly: true }
            - { name: config, mountPath: /app/active_request_tracking.py, subPath: active_request_tracking.py, readOnly: true }
            - { name: tracking, mountPath: /shared/tracking }
          resources:
            # 2026-08-14: 512Mi/3Gi eran de la era singleton y el OOM lo probo.
            # CPU request 300m y no mas: los ks5 estan al 86-97% de CPU PEDIDA
            # (comprometida de verdad, no sobre-pedida -- finding del 07-08) y
            # con "1" el scheduler no encontraba hueco y el rollout se quedo en
            # Pending. Sin limite de CPU, el pod burstea sobre lo libre real.
            #
            # 2026-08-19: 300m -> 150m, misma direccion que el 14-08 y por el mismo
            # motivo, ahora con la medida delante. `kubectl top pod` con las 4
            # replicas sirviendo: 5m, 6m, 5m, 6m. El request de 300m estaba usado al
            # 2% y era justo lo que dejaba el pool en 93-99% de CPU PEDIDA con un uso
            # real del 15-56%: reserva que nadie consume pero que bloquea al
            # scheduler. 150m siguen siendo ~25x el consumo medido, y como NO hay
            # limite de CPU el pod burstea igual sobre lo libre real -- el request
            # solo decide donde cabe y el reparto de shares bajo contienda.
            # Efecto en el pool: 4x310m = 1240m comprometidos pasan a 2x160m = 320m,
            # 920m devueltos, que es lo que hace que el surge quepa de sobra.
            # La memoria NO se toca: 1,4-1,5Gi medidos es baseline real (catalogo de
            # 54 modelos), y el limite de 6Gi es lo que cerro los OOMKill.
            requests: { cpu: 150m, memory: 2Gi }
            limits:   { memory: 6Gi }
          lifecycle:
            preStop:
              exec:
                command: ["python", "/config/litellm_drain.py"]
          readinessProbe:
            # /health/liveliness (always 200 while the server loop is alive), NOT
            # /health/readiness: readiness does a DB round-trip and returns 503
            # when postgres is down, which pulled litellm out of the Service for
            # 9h on 2026-07-20 while inference itself was fine. With
            # allow_requests_on_db_unavailable the proxy serves through DB
            # outages; DB health is alerted via SharedDatastoreUnreachable
            # (k8s-observability) instead of endpoint removal.
            httpGet: { path: /health/liveliness, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
        - name: active-requests-api
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/active-api/active_requests_api.py"]
          ports:
            - { name: active, containerPort: 4001 }
          env:
            - { name: LITELLM_ACTIVE_FILE, value: /shared/tracking/active_requests.json }
            - { name: LITELLM_ACTIVE_STALE_AFTER_SEC, value: "900" }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
          volumeMounts:
            - { name: config, mountPath: /active-api, readOnly: true }
            - { name: tracking, mountPath: /shared/tracking, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 4001 }
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: litellm-config }
        - name: tracking
          hostPath:
            path: /home/dibanez/dgx-tracking
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  selector: { app: litellm }
  ports:
    - { name: http, port: 4000, targetPort: 4000 }
    - { name: active, port: 4001, targetPort: 4001 }
---
# Internal access only: LAN and Tailscale clients use the LAN Traefik instance
# (no SSO middleware — LiteLLM's API key remains the application gate).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm-lan
  namespace: litellm
  annotations:
    external-dns.alpha.kubernetes.io/hostname: litellm.lan.e-dani.com
    external-dns.alpha.kubernetes.io/target: 192.168.50.240
spec:
  entryPoints: [websecure]
  routes:
    # Legacy alias only. The canonical litellm.e-dani.com LAN route now lives
    # in k8s-infra-pocharlies and public DNS points DNS-only at traefik-edge,
    # avoiding Cloudflare's ~100s origin timeout while preserving API-key auth.
    - match: Host(`litellm.lan.e-dani.com`)
      kind: Rule
      services:
        - name: litellm
          port: 4000
  tls:
    store: { name: default, namespace: traefik-lan }
