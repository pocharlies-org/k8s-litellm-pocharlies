---
apiVersion: v1
kind: Namespace
metadata:
  name: litellm
---
# ExternalSecret: litellm DB credentials in shared PostgreSQL
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-postgres-creds
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-postgres-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef: { key: secret/litellm, property: DB_USER }
    - secretKey: password
      remoteRef: { key: secret/litellm, property: DB_PASSWORD }
---
# LiteLLM Router — unified LLM API gateway
# Image: ghcr.io/berriai/litellm:main-stable (amd64/arm64)
# Router is stateless; state lives in the shared PostgreSQL cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
    # Chat aliases are registered by litellm-dgx-backend-sync only while each
    # vLLM Service has ready Kubernetes endpoints. This avoids routing local,
    # tooling, router, litellmrouter, or auto to a baseline pod that is still
    # pulling/starting.
    - model_name: bge-m3
      litellm_params:
        model: openai/bge-m3
        api_base: http://bge-m3-embedding.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: embedding
        max_tokens: 8192
    - model_name: bge-m3-embedding
      litellm_params:
        model: openai/bge-m3
        api_base: http://bge-m3-embedding.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: embedding
        max_tokens: 8192
    - model_name: bge-reranker
      litellm_params:
        model: infinity/bge-reranker
        api_base: http://bge-reranker.llm.svc.cluster.local:8000
        api_key: not-used
      model_info:
        mode: rerank
        max_tokens: 8192
    - model_name: bge-reranker-v2-m3
      litellm_params:
        model: infinity/bge-reranker
        api_base: http://bge-reranker.llm.svc.cluster.local:8000
        api_key: not-used
      model_info:
        mode: rerank
        max_tokens: 8192
    # ── Audio: Whisper STT + OmniVoice TTS (OSS passthrough; for CloudBlue & clients) ──
    # One LiteLLM key now covers chat + embeddings + STT + TTS. Backends are ClusterIP-only;
    # LiteLLM stays the single public, key-authed, budgeted front door (no separate exposure).
    - model_name: stt-turbo
      litellm_params:
        model: openai/whisper-large-v3
        api_base: http://stt-turbo.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: audio_transcription
    - model_name: whisper-1            # OpenAI-SDK-compatible alias -> same Whisper backend
      litellm_params:
        model: openai/whisper-large-v3
        api_base: http://stt-turbo.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: audio_transcription
    - model_name: omnivoice-tts
      litellm_params:
        model: openai/omnivoice
        api_base: http://omnivoice-tts-dgx2-static.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: audio_speech
    - model_name: tts-1               # OpenAI-SDK-compatible alias -> same OmniVoice backend
      litellm_params:
        model: openai/omnivoice
        api_base: http://omnivoice-tts-dgx2-static.llm.svc.cluster.local:8000/v1
        api_key: not-used
      model_info:
        mode: audio_speech
    litellm_settings:
      success_callback:
      - db
      - prometheus
      - langfuse
      failure_callback:
      - prometheus
      - langfuse
      service_callback:
      - prometheus_system
      callbacks:
      - litellm_strip_params.proxy_handler_instance
      drop_params: true
      set_verbose: false
      require_auth_for_metrics_endpoint: false
      num_retries: 2
      request_timeout: 600
      # Content logging ENABLED (2026-07-09): full prompt/response text flows to Langfuse
      # traces AND the DB spend-logs — needed for prompt debugging + LLM-as-a-judge evals.
      # Langfuse is SSO-gated (Keycloak) + homelab, so the privacy risk is low. To redact
      # content again (traces keep latency/cost/tokens/tags; body -> "redacted-by-litellm"),
      # set this back to true.
      turn_off_message_logging: false
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
      # 2026-07-21: prompts OFF in SpendLogs — full prompt/response duplication of
      # what Langfuse already stores had grown the table to 21 GB (~38 KB/row) and
      # made retention DELETEs time out. SpendLogs is accounting only.
      store_prompts_in_spend_logs: false
      # DB down must degrade auth (restricted internal token), not kill inference.
      # Incident 2026-07-20: postgres-shared out for 9h => litellm hard-down.
      allow_requests_on_db_unavailable: true
      background_health_checks: true
      enable_passthrough_logging: false
      maximum_spend_logs_retention_period: 30d
      maximum_spend_logs_retention_interval: 1d
      proxy_batch_write_at: 60
    router_settings:
      routing_strategy: simple-shuffle
      timeout: 600
      num_retries: 1
      # 2026-06-22: a wedged vLLM backend (EngineCore deadlock; /health still 200)
      # used to keep eating ~50% of chat traffic because it took 20 fails before
      # any cooldown and the cooldown was only 30s. Eject faster and keep it out
      # longer; the vLLM engine-watchdog liveness probe restarts the wedged pod
      # (-> EndpointSlice NotReady -> litellm-dgx-backend-sync removes it) within
      # ~4 min, so this only has to cover that window.
      allowed_fails: 3
      cooldown_time: 120
      # 2026-07-27: the chat aliases are registered dynamically by
      # litellm-dgx-backend-sync onto exactly TWO deployments, one per node:
      #   tooling/router/auto/litellmrouter/qwen36-35b*   -> Ornith 35B-A3B (DGX1)
      #   dense/dense-reasoning/dense-uncensored/taxonomy -> uncensored 27B (DGX2)
      # There is no shared pool and no load-balancing between them: each alias has
      # exactly one backend. Cross-alias fallback is deliberately NOT configured
      # here -- the smart-router hook already degrades dense<->tooling when an alias
      # has no live deployments, and adding a LiteLLM-level fallback on top would
      # create alias-to-alias retry loops while the only backend is unhealthy.
      # 2026-07-03: removed bge-*-cpu fallbacks (and the -cpu model_list entries).
      # Embedding+reranker are HA across both GPU nodes via the `bge-pool` label +
      # KEDA scale-to-zero, and the -cpu Services no longer exist (dead fallback).
  litellm_strip_params.py: |
    import logging
    import os

    import litellm
    from litellm._uuid import uuid
    from litellm.litellm_core_utils.streaming_handler import CustomStreamWrapper
    from litellm.llms.infinity.rerank.transformation import InfinityRerankConfig
    from litellm.types.rerank import (
        RerankBilledUnits,
        RerankResponse,
        RerankResponseMeta,
        RerankResponseResult,
        RerankTokens,
    )
    from active_request_tracking import (
        ActiveRequestTracker,
        enable_continuous_usage,
        resolve_server_id,
        usage_from_response,
    )

    log = logging.getLogger("litellm.active_tracking")
    router_log = logging.getLogger("litellm.smart_router")
    # Sampling telemetry (Fase 6): solo observa, nunca modifica valores.
    sampling_log = logging.getLogger("litellm.sampling")

    def _usage_snapshot(usage):
        if isinstance(usage, dict):
            return dict(usage)
        if hasattr(usage, "model_dump"):
            return usage.model_dump()
        return {
            name: getattr(usage, name)
            for name in (
                "prompt_tokens",
                "completion_tokens",
                "input_tokens",
                "output_tokens",
            )
            if getattr(usage, name, None) is not None
        }

    def _preserve_live_usage_chunks():
        """Keep provider usage across LiteLLM 1.85 chunk sanitization."""
        original = CustomStreamWrapper.chunk_creator
        if getattr(original, "_active_request_usage_patch", False):
            return

        def wrapped(self, *args, **kwargs):
            chunk = original(self, *args, **kwargs)
            if chunk is None:
                return None
            usage = getattr(chunk, "usage", None)
            hidden_params = getattr(chunk, "_hidden_params", None)
            if usage is not None and isinstance(hidden_params, dict):
                hidden_params["live_usage"] = _usage_snapshot(usage)
            return chunk

        wrapped._active_request_usage_patch = True
        CustomStreamWrapper.chunk_creator = wrapped

    _preserve_live_usage_chunks()

    # Infinity/TEI rerank compatibility patches.
    _original_transform_request = InfinityRerankConfig.transform_rerank_request

    def _tei_transform_rerank_request(self, model, optional_rerank_params, headers, *args, **kwargs):
        return _original_transform_request(self, model, optional_rerank_params, headers, *args, **kwargs)

    def _tei_transform_rerank_response(
        self, model, raw_response, model_response, logging_obj,
        api_key=None, request_data={}, optional_params={}, litellm_params={},
    ):
        raw = raw_response.json()
        if isinstance(raw, list):
            raw = {
                "results": [
                    {
                        "index": r["index"],
                        "relevance_score": r.get("relevance_score", r.get("score", 0)),
                    }
                    for r in raw
                ]
            }
        results = raw.get("results", [])
        rerank_results = [
            RerankResponseResult(
                index=int(r["index"]),
                relevance_score=float(r.get("relevance_score", r.get("score", 0))),
            )
            for r in results
        ]
        usage = raw.get("usage", {})
        return RerankResponse(
            id=raw.get("id") or str(uuid.uuid4()),
            results=rerank_results,
            meta=RerankResponseMeta(
                billed_units=RerankBilledUnits(total_tokens=usage.get("total_tokens", 0)),
                tokens=RerankTokens(input_tokens=usage.get("prompt_tokens", 0)),
            ),
        )

    InfinityRerankConfig.transform_rerank_request = _tei_transform_rerank_request
    InfinityRerankConfig.transform_rerank_response = _tei_transform_rerank_response

    ACTIVE_FILE = os.environ.get("LITELLM_ACTIVE_FILE", "/shared/tracking/active_requests.json")
    STALE_THRESHOLD = int(os.environ.get("LITELLM_ACTIVE_STALE_AFTER_SEC", "900"))
    request_tracker = ActiveRequestTracker(
        ACTIVE_FILE,
        stale_threshold=STALE_THRESHOLD,
    )

    def _track_end(request_id):
        request_tracker.end(request_id)

    def _litellm_trace_id(data):
        logging_obj = data.get("litellm_logging_obj")
        candidates = [getattr(logging_obj, "litellm_trace_id", None)]
        model_call_details = getattr(logging_obj, "model_call_details", None)
        if isinstance(model_call_details, dict):
            candidates.append(model_call_details.get("litellm_trace_id"))
            details_metadata = model_call_details.get("metadata")
            if isinstance(details_metadata, dict):
                candidates.append(details_metadata.get("litellm_trace_id"))
        for candidate in candidates:
            value = str(candidate or "").strip()
            if value:
                return value
        return None

    def _metadata_candidates(payload):
        if not isinstance(payload, dict):
            return []

        candidates = [
            payload.get("metadata"),
            payload.get("litellm_metadata"),
        ]

        litellm_params = payload.get("litellm_params")
        if isinstance(litellm_params, dict):
            candidates.extend(
                [
                    litellm_params.get("metadata"),
                    litellm_params.get("litellm_metadata"),
                ]
            )

        return [m for m in candidates if isinstance(m, dict)]

    def _tracking_id_candidates(payload, max_depth=5):
        seen = set()

        def walk(obj, depth):
            if depth > max_depth:
                return
            obj_id = id(obj)
            if obj_id in seen:
                return
            seen.add(obj_id)

            if isinstance(obj, dict):
                tracking_id = obj.get("_tracking_id")
                if tracking_id:
                    yield tracking_id
                for metadata in _metadata_candidates(obj):
                    tracking_id = metadata.get("_tracking_id")
                    if tracking_id:
                        yield tracking_id
                for value in obj.values():
                    if isinstance(value, (dict, list, tuple)):
                        yield from walk(value, depth + 1)
            elif isinstance(obj, (list, tuple)):
                for value in obj:
                    if isinstance(value, (dict, list, tuple)):
                        yield from walk(value, depth + 1)

        yield from walk(payload, 0)

    def _tracking_id_from_payload(payload):
        for tracking_id in _tracking_id_candidates(payload):
            return tracking_id
        return None

    def _backend_from_payload(payload, max_depth=6):
        """Find the exact vLLM deployment selected by LiteLLM."""
        seen = set()

        def walk(value, depth, inherited_model=None):
            if depth > max_depth:
                return None
            value_id = id(value)
            if value_id in seen:
                return None
            seen.add(value_id)

            if isinstance(value, dict):
                model = (
                    value.get("model")
                    or value.get("model_name")
                    or inherited_model
                )
                for name in ("api_base", "base_url"):
                    api_base = value.get(name)
                    if resolve_server_id(model, api_base):
                        return model, api_base
                for nested in value.values():
                    if isinstance(nested, (dict, list, tuple)):
                        found = walk(nested, depth + 1, model)
                        if found:
                            return found
            elif isinstance(value, (list, tuple)):
                for nested in value:
                    if isinstance(nested, (dict, list, tuple)):
                        found = walk(nested, depth + 1, inherited_model)
                        if found:
                            return found
            return None

        return walk(payload, 0)

    def _update_tracking_from_payload(
        payload,
        response_obj=None,
        *,
        force_flush=False,
    ):
        tracking_id = _tracking_id_from_payload(payload)
        if not tracking_id:
            return None

        backend = _backend_from_payload(payload)
        if backend:
            model, api_base = backend
            request_tracker.update_backend(
                tracking_id,
                model=model,
                api_base=api_base,
            )

        prompt_tokens, completion_tokens = usage_from_response(response_obj)
        if prompt_tokens is not None or completion_tokens is not None:
            request_tracker.update_usage(
                tracking_id,
                prompt_tokens=prompt_tokens,
                completion_tokens=completion_tokens,
                force_flush=force_flush,
            )
        return tracking_id

    def _track_end_from_payload(payload, source):
        for tracking_id in _tracking_id_candidates(payload):
            try:
                _track_end(tracking_id)
            except Exception as e:
                log.debug("track_end %s error: %s", source, e)
            return

    def _auth_field(user_api_key_dict, name):
        if isinstance(user_api_key_dict, dict):
            return user_api_key_dict.get(name)
        return getattr(user_api_key_dict, name, None)

    def _resolve_key_label(user_api_key_dict):
        for name in ("key_alias", "key_name"):
            value = _auth_field(user_api_key_dict, name)
            if value:
                return str(value)
        for name in ("token", "api_key"):
            value = _auth_field(user_api_key_dict, name)
            if value and str(value).startswith("litellm_proxy_master"):
                return "master"
        return "unknown"

    # ── Routing policy (2026-07-27, Daniel) ──────────────────────────────────────
    # Only the AUTO-ROUTED aliases are re-pointed by request shape. Everything else
    # -- `dense`, `dense-reasoning`, `dense-uncensored`, `taxonomy`, `tooling` and
    # the `qwen36-35b*` compat names -- is EXPLICIT client intent and passes through
    # untouched to whichever backend the sync registered it on.
    #
    # The rule itself:
    #     request carries a tool  ->  dense           (the uncensored 27B DENSE)
    #     no tool                 ->  tooling         (Ornith 35B-A3B MoE, DGX1)
    #
    # Rationale and the honest caveat: the 27B dense out-scored the old Qwen3.6-35B
    # on tool calls when it was benchmarked (2026-07-02: 5/5 vs 3/5 single calls,
    # 3/3 vs 2/3 agentic loops), which is where this rule comes from. Note both
    # sides of that comparison have since been replaced -- `tooling` is now Ornith
    # (an RL agentic-coding fine-tune, SWE-bench Verified 75.6 / Terminal-Bench 2.1
    # 64.2, ~170 tok/s) and `dense` is the abliterated uncensored 27B (~41 tok/s, no
    # published tool-calling numbers). So this rule trades ~4x decode latency on
    # agentic loops for the dense model's per-token quality, and is pending
    # measurement against Ornith's 346/370 internal tooling battery. Reverting is a
    # two-line swap in ROUTE below.
    AUTO_ROUTED_MODELS = {"router", "auto", "litellmrouter"}

    # Where each shape goes. `fallback` is used only when the primary alias has no
    # live deployments (see _alias_has_deployments): DGX2 is evictable, so `dense`
    # degrades to Ornith rather than failing, and vice versa. Fallbacks are spelled
    # with the canonical names -- they used to say `qwen36-35b-tooling`, which only
    # worked by way of the compat aliases also being registered on Ornith.
    ROUTE = {
        "TOOLS": {"model": "dense", "fallback": "tooling"},
        "TOOLS_REASONING": {"model": "dense-reasoning", "fallback": "tooling"},
        "NO_TOOLS": {"model": "tooling", "fallback": "dense"},
    }

    # Hard limit escape: the uncensored 27B serves --max-model-len 229376 while
    # Ornith serves 262144, so a tool-bearing request longer than this goes to
    # Ornith instead of 400-ing on length. Deliberately below 229376 because
    # _approx_input_tokens is a chars/4 estimate that does NOT count image tokens.
    # (No multimodal escape is needed: Ornith's --limit-mm-per-prompt was raised to
    # {"image":64} on 2026-07-27 to match the uncensored.)
    DENSE_CTX_ESCAPE = 200000

    FAST_CTX_LIMIT = 73000
    THINK_MARKERS = ("/think", "[think]")
    # Codex/agent clients attach a reasoning effort to EVERY call; only a
    # deliberate medium+ effort counts as a reasoning signal so that ambient
    # minimal/low efforts still route by request shape.
    REASONING_EFFORT_SIGNAL = {"medium", "high", "xhigh"}
    # Content part types across Chat Completions and Responses API payloads.
    TEXT_PART_TYPES = {"text", "input_text", "output_text"}
    IMAGE_PART_TYPES = {"image", "image_url", "input_image"}
    VIDEO_PART_TYPES = {"video", "video_url", "input_video"}

    def _message_entries(data):
        """Chat `messages` and Responses-API `input` normalized to one list.

        Responses `input` can be a bare string (implicit user message) or a
        list of items where only message items carry a role; non-message items
        (function_call, reasoning, item_reference, ...) are skipped here.
        """
        entries = []
        msgs = data.get("messages")
        if isinstance(msgs, list):
            entries.extend(m for m in msgs if isinstance(m, dict))
        inp = data.get("input")
        if isinstance(inp, str):
            entries.append({"role": "user", "content": inp})
        elif isinstance(inp, list):
            entries.extend(
                item for item in inp if isinstance(item, dict) and item.get("role")
            )
        return entries

    def _entry_text(entry):
        if not isinstance(entry, dict):
            return ""
        c = entry.get("content", "")
        if isinstance(c, str):
            return c
        if isinstance(c, list):
            return " ".join(
                p.get("text") or ""
                for p in c
                if isinstance(p, dict) and p.get("type") in TEXT_PART_TYPES
            )
        return ""

    def _last_user_entry(data):
        for entry in reversed(_message_entries(data)):
            if entry.get("role") == "user":
                return entry
        return None

    def _approx_input_tokens(data):
        total = 0
        for entry in _message_entries(data):
            c = entry.get("content", "")
            if isinstance(c, str):
                total += len(c)
            elif isinstance(c, list):
                for p in c:
                    if isinstance(p, dict):
                        total += len(p.get("text") or "")
        return total // 4

    # Item types that mean "this turn is tool-shaped" in the Responses API. The
    # `function_call` prefix covers function_call and function_call_output; MCP and
    # custom-tool turns use their own names and were previously invisible here,
    # which now matters because the whole route hinges on this predicate.
    TOOL_ITEM_TYPES = ("function_call", "mcp_call", "mcp_list_tools",
                       "custom_tool_call", "tool_call")


    def _has_tools(data):
        if data.get("tools") or data.get("functions") or data.get("function_call"):
            return True
        # tool_choice pins a tool even if the declaration lives elsewhere in the
        # payload; "none"/"auto" carry no such intent.
        tc = data.get("tool_choice")
        if isinstance(tc, str):
            if tc not in ("none", "auto"):
                return True
        elif tc:
            return True
        inp = data.get("input")
        if isinstance(inp, list):
            for item in inp:
                if isinstance(item, dict):
                    t = str(item.get("type") or "")
                    if any(t.startswith(p) for p in TOOL_ITEM_TYPES):
                        return True
        for m in data.get("messages") or []:
            if isinstance(m, dict) and (m.get("tool_calls") or m.get("role") == "tool"):
                return True
        return False

    def _reasoning_effort_value(data):
        effort = data.get("reasoning_effort")
        if not effort:
            r = data.get("reasoning")
            if isinstance(r, dict):
                effort = r.get("effort")
        return str(effort).lower() if effort else ""

    def _wants_reasoning(data):
        thinking = data.get("thinking")
        if isinstance(thinking, dict) and thinking.get("type") == "enabled":
            return True
        return _reasoning_effort_value(data) in REASONING_EFFORT_SIGNAL

    def _has_part_type(data, names):
        for entry in _message_entries(data):
            c = entry.get("content")
            if isinstance(c, list):
                for p in c:
                    if isinstance(p, dict) and p.get("type") in names:
                        return True
        return False

    def _has_think_marker(text):
        # A marker only counts at a word boundary: "/think" / "/think: x" yes,
        # "/thinking about it" no (would otherwise misroute AND mutate text).
        if not text:
            return False
        low = text.lstrip().lower()
        for m in THINK_MARKERS:
            if low.startswith(m):
                rest = low[len(m):]
                if not rest or not rest[0].isalnum():
                    return True
        return False

    def _strip_think_marker(text):
        if not text:
            return text
        lead_len = len(text) - len(text.lstrip())
        stripped = text[lead_len:]
        low = stripped.lower()
        for marker in THINK_MARKERS:
            if low.startswith(marker):
                rest = stripped[len(marker):]
                if rest and rest[:1].isalnum():
                    continue
                return text[:lead_len] + rest.lstrip(" :\t\n")
        return text

    def _strip_think_from_last_user(data):
        inp = data.get("input")
        if isinstance(inp, str):
            if _has_think_marker(inp):
                data["input"] = _strip_think_marker(inp)
            return
        entry = _last_user_entry(data)
        if entry is None or not _has_think_marker(_entry_text(entry)):
            return
        c = entry.get("content")
        if isinstance(c, str):
            entry["content"] = _strip_think_marker(c)
        elif isinstance(c, list):
            for p in c:
                if (
                    isinstance(p, dict)
                    and p.get("type") in TEXT_PART_TYPES
                    and _has_think_marker(p.get("text") or "")
                ):
                    p["text"] = _strip_think_marker(p.get("text") or "")
                    break

    def _alias_has_deployments(alias):
        """Whether the proxy router currently has deployments for the alias.

        Fails open (True) so a litellm-internals change can never take the
        route down: the request then behaves exactly like a direct call to
        the mapped alias.
        """
        try:
            from litellm.proxy.proxy_server import llm_router
        except Exception:
            return True
        if llm_router is None:
            return True
        try:
            return bool(llm_router.get_model_list(model_name=alias))
        except Exception:
            return True

    def _classify_route(data):
        """Devuelve (route_key, rule, think_marker_present) para las peticiones
        auto-enrutadas (router/auto/litellmrouter).

        La regla es deliberadamente simple: manda la presencia de tool. Solo hay un
        escape, por limite fisico de contexto del dense. La intencion de reasoning
        (marcador [think] o reasoning_effort medium+) elige la variante -reasoning
        del dense; Ornith sirve todas sus formas bajo el mismo alias `tooling`.
        """
        has_think = _has_think_marker(_entry_text(_last_user_entry(data)))
        wants_reasoning = has_think or _wants_reasoning(data)
        if _has_tools(data):
            if _approx_input_tokens(data) > DENSE_CTX_ESCAPE:
                return "NO_TOOLS", "ctx-escape", has_think
            if wants_reasoning:
                return "TOOLS_REASONING", "tools+reasoning", has_think
            return "TOOLS", "tools", has_think
        return "NO_TOOLS", "no-tools", has_think


    SAMPLING_KEYS = ("temperature", "top_p", "top_k", "min_p",
                     "presence_penalty", "frequency_penalty", "repetition_penalty")
    GREEDY_TEMPERATURE = 0.1


    def _log_sampling(data, resolved_model, key_alias="unknown"):
        """Registra el sampling que llega, sin modificarlo (solo lectura).

        `greedy=True` marca el caso que Qwen prohibe explicitamente: temperature
        casi cero no hace el tool-calling mas determinista, lo degrada y provoca
        repeticion. Se emite tambien cuando falta presence_penalty para poder medir
        la dispersion real de configuraciones entre clientes.
        """
        try:
            body = data.get("extra_body")
            present = {}
            for k in SAMPLING_KEYS:
                v = data.get(k)
                if v is None and isinstance(body, dict):
                    v = body.get(k)
                if v is not None:
                    present[k] = v
            temp = present.get("temperature")
            greedy = isinstance(temp, (int, float)) and temp <= GREEDY_TEMPERATURE
            sampling_log.warning(
                "sampling: model=%s key=%s greedy=%s params=%s",
                resolved_model, key_alias, greedy,
                present or "none(server defaults apply)",
            )
        except Exception as e:  # nunca romper una peticion por telemetria
            log.debug("_log_sampling error: %s", e)


