    """Exact, best-effort telemetry for requests currently handled by LiteLLM."""
    from __future__ import annotations

    import copy
    import json
    import os
    import re
    import threading
    import time
    from collections import deque
    from typing import Any, Callable, Deque, Dict, Optional, Tuple
    from urllib.parse import urlparse


    SERVER_BY_MODEL_AND_BASE = {
        (
            "local",
            "http://192.168.50.140:8200/v1",
        ): "vllm-122b",
        (
            "qwen35-122b",
            "http://192.168.50.140:8200/v1",
        ): "vllm-122b",
        (
            "openai/qwen35-122b",
            "http://192.168.50.140:8200/v1",
        ): "vllm-122b",
        (
            "tooling",
            "http://192.168.50.141:8200/v1",
        ): "vllm-35b",
        (
            "dense-uncensored",
            "http://192.168.50.141:8200/v1",
        ): "vllm-35b",
        (
            "openai/Qwen/Qwen3.6-35B-A3B-FP8",
            "http://192.168.50.141:8200/v1",
        ): "vllm-35b",
        (
            "fast",
            "http://192.168.50.142:8210/v1",
        ): "vllm-9b",
        (
            "openai/qwen35-9b",
            "http://192.168.50.142:8210/v1",
        ): "vllm-9b",
    }


    def _normalise_api_base(api_base: Any) -> str:
        return str(api_base or "").rstrip("/")


    def resolve_server_id(model: Any, api_base: Any) -> Optional[str]:
        """Return the dashboard ID for an exact known vLLM backend."""
        normalized_base = _normalise_api_base(api_base)
        try:
            host = urlparse(normalized_base).hostname or ""
        except (TypeError, ValueError):
            host = ""
        service_name = host.split(".", 1)[0].lower()
        if re.fullmatch(r"vllm-[a-z0-9-]+", service_name):
            return service_name
        return SERVER_BY_MODEL_AND_BASE.get(
            (str(model or ""), normalized_base)
        )


    def enable_continuous_usage(data: Dict[str, Any]) -> Dict[str, Any]:
        """Ask compatible streaming backends for cumulative usage per chunk."""
        if data.get("stream") is not True:
            return data
        options = dict(data.get("stream_options") or {})
        options["include_usage"] = True
        options["continuous_usage_stats"] = True
        data["stream_options"] = options
        return data


    def _usage_value(usage: Any, *names: str) -> Optional[int]:
        for name in names:
            if isinstance(usage, dict):
                value = usage.get(name)
            else:
                value = getattr(usage, name, None)
            if value is not None:
                try:
                    return int(value)
                except (TypeError, ValueError):
                    return None
        return None


    def usage_from_response(
        response_obj: Any,
    ) -> Tuple[Optional[int], Optional[int]]:
        """Extract cumulative input/output token counts from a response."""
        if isinstance(response_obj, dict):
            usage = response_obj.get("usage")
            hidden_params = response_obj.get("_hidden_params")
        else:
            usage = getattr(response_obj, "usage", None)
            hidden_params = getattr(response_obj, "_hidden_params", None)
        if usage is None and isinstance(hidden_params, dict):
            usage = hidden_params.get("live_usage")
        if usage is None:
            return None, None
        return (
            _usage_value(usage, "prompt_tokens", "input_tokens"),
            _usage_value(usage, "completion_tokens", "output_tokens"),
        )


    class ActiveRequestTracker:
        """Thread-safe active-request registry persisted as atomic JSON."""

        def __init__(
            self,
            active_file: str,
            *,
            stale_threshold: float = 600,
            flush_interval_s: float = 0.25,
            speed_window_s: float = 2.0,
            clock: Callable[[], float] = time.time,
        ):
            self.active_file = active_file
            self.stale_threshold = stale_threshold
            self.flush_interval_s = flush_interval_s
            self.speed_window_s = speed_window_s
            self.clock = clock
            self._records: Dict[str, Dict[str, Any]] = {}
            self._samples: Dict[str, Deque[Tuple[float, int]]] = {}
            self._last_flush_at: Optional[float] = None
            self._lock = threading.RLock()

        def start(
            self,
            request_id: str,
            *,
            trace_id: Any = None,
            key_alias: Any,
            model: Any,
            call_type: Any,
            api_base: Any,
        ) -> Dict[str, Any]:
            now = self.clock()
            with self._lock:
                self._discard_stale_locked(now)
                self._records[request_id] = {
                    "request_id": request_id,
                    "trace_id": str(trace_id).strip() if trace_id else None,
                    "source": "litellm",
                    "alias": str(key_alias or "unknown"),
                    "model": str(model or "unknown"),
                    "call_type": str(call_type or "unknown"),
                    "server_id": resolve_server_id(model, api_base),
                    "ts": now,
                    "first_token_ts": None,
                    "last_sample_ts": None,
                    "prompt_tokens": None,
                    "completion_tokens": None,
                    "output_speed_tps": None,
                    "ttft_ms": None,
                }
                self._samples[request_id] = deque()
                self._flush_locked(now, force=True)
                return copy.deepcopy(self._records[request_id])

        def update_usage(
            self,
            request_id: str,
            *,
            prompt_tokens: Optional[int],
            completion_tokens: Optional[int],
            force_flush: bool = False,
        ) -> Optional[Dict[str, Any]]:
            now = self.clock()
            with self._lock:
                record = self._records.get(request_id)
                if record is None:
                    return None

                first_usage = (
                    record["prompt_tokens"] is None
                    and record["completion_tokens"] is None
                )
                if prompt_tokens is not None:
                    prompt_tokens = max(0, int(prompt_tokens))
                    previous_prompt = record["prompt_tokens"]
                    if previous_prompt is None or prompt_tokens > previous_prompt:
                        record["prompt_tokens"] = prompt_tokens

                if completion_tokens is not None:
                    completion_tokens = max(0, int(completion_tokens))
                    previous_completion = record["completion_tokens"]
                    if (
                        previous_completion is not None
                        and completion_tokens < previous_completion
                    ):
                        completion_tokens = previous_completion
                    record["completion_tokens"] = completion_tokens
                    record["last_sample_ts"] = now

                    if (
                        completion_tokens > 0
                        and record["first_token_ts"] is None
                    ):
                        record["first_token_ts"] = now
                        record["ttft_ms"] = max(
                            0,
                            int(round((now - record["ts"]) * 1000)),
                        )

                    samples = self._samples.setdefault(request_id, deque())
                    samples.append((now, completion_tokens))
                    while (
                        len(samples) > 1
                        and now - samples[0][0] > self.speed_window_s
                    ):
                        samples.popleft()
                    if len(samples) >= 2:
                        oldest_ts, oldest_tokens = samples[0]
                        newest_ts, newest_tokens = samples[-1]
                        duration = newest_ts - oldest_ts
                        if duration > 0:
                            record["output_speed_tps"] = round(
                                max(
                                    0,
                                    newest_tokens - oldest_tokens,
                                )
                                / duration,
                                2,
                            )

                self._flush_locked(
                    now,
                    force=force_flush or first_usage,
                )
                return copy.deepcopy(record)

        def update_backend(
            self,
            request_id: str,
            *,
            model: Any,
            api_base: Any,
        ) -> Optional[Dict[str, Any]]:
            server_id = resolve_server_id(model, api_base)
            now = self.clock()
            with self._lock:
                record = self._records.get(request_id)
                if record is None:
                    return None

                changed = False
                if server_id and record.get("server_id") != server_id:
                    record["server_id"] = server_id
                    changed = True
                if model and str(model) != record.get("model"):
                    record["model"] = str(model)
                    changed = True
                if changed:
                    self._flush_locked(now, force=True)
                return copy.deepcopy(record)

        def end(self, request_id: str) -> None:
            now = self.clock()
            with self._lock:
                removed = self._records.pop(request_id, None)
                self._samples.pop(request_id, None)
                if removed is not None:
                    self._flush_locked(now, force=True)

        def snapshot(self) -> Dict[str, Dict[str, Any]]:
            now = self.clock()
            with self._lock:
                removed = self._discard_stale_locked(now)
                if removed:
                    self._flush_locked(now, force=True)
                return copy.deepcopy(self._records)

        def _discard_stale_locked(self, now: float) -> bool:
            stale = [
                request_id
                for request_id, record in self._records.items()
                if (
                    now - float(record.get("ts", 0))
                    > self.stale_threshold
                )
            ]
            for request_id in stale:
                self._records.pop(request_id, None)
                self._samples.pop(request_id, None)
            return bool(stale)

        def _flush_locked(self, now: float, *, force: bool) -> None:
            if (
                not force
                and self._last_flush_at is not None
                and now - self._last_flush_at < self.flush_interval_s
            ):
                return

            directory = os.path.dirname(self.active_file) or "."
            os.makedirs(directory, exist_ok=True)
            temporary = "{}.{}.tmp".format(
                self.active_file,
                os.getpid(),
            )
            try:
                with open(
                    temporary,
                    "w",
                    encoding="utf-8",
                ) as handle:
                    json.dump(
                        self._records,
                        handle,
                        separators=(",", ":"),
                    )
                os.replace(temporary, self.active_file)
                self._last_flush_at = now
            finally:
                try:
                    if os.path.exists(temporary):
                        os.unlink(temporary)
                except OSError:
                    pass
