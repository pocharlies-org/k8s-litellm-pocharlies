    # LOS 9 DE CLOUDBLUE SE RETIRARON Y SE REPUBLICAN EL MISMO DÍA. El motivo de
    # la retirada era que "sus 4 keys están bloqueadas a propósito", y eso NO
    # aplica a este camino: las keys bloqueadas son VIRTUALES de LiteLLM, y el
    # puente no las usa — habla con ChatGPT por su propia sesión OAuth
    # (Secret codex-bridge-auth). Comprobado llamando al puente directamente:
    #
    #   POST codex-bridge.litellm.svc:8080/v1/chat/completions {model: gpt-5.6-sol}
    #   -> 200 en 1 s
    #
    # O sea que los 9 alias SÍ pueden funcionar. Lo que no funcionaba era pedirlos
    # por LiteLLM mientras no estaban publicados (400 "Invalid model name").
    # Los modelos `visibility=hide` también se publican porque este catálogo es
    # completo; Codex decide su presentación mediante el catálogo sincronizado.
    # UNA EXCEPCIÓN, y no volver a añadirla al refrescar el catálogo (2026-08-13):
    # `gpt-5.6-sol-wm` NO se publica. Su descripción en el catálogo de la cuenta
    # es literal: "Work Mode routing alias for GPT-5.6 Sol" — mismos pesos que
    # `gpt-5.6-sol`, no otro modelo. Work es un MODO del cliente de ChatGPT (otro
    # prompt de sistema, otros conectores, otro formato de salida), y nada de ese
    # aparato viaja por `/backend-api/codex/responses`: el puente manda su propio
    # prompt y sus propias tools. Por aquí el alias era Sol repetido con un nombre
    # peor. Sigue en ALLOWED_MODELS de los dos puentes a propósito: la cuenta SÍ lo
    # sirve (probado, HTTP 200 pese a `supported_in_api: false`) y quitarlo de allí
    # abriría el fallback silencioso a UPSTREAM_MODEL en vez de un error.
    # ── Cuenta CLOUDBLUE (daniel.ibanez@cloudblue.com) ───────────────────────
    # Es la cuenta de CARGA: desvío de visión, último eslabón de `agent`, Aurora.
    # Cuota separada de la personal a propósito, para que lo automático no se
    # coma el cupo del Codex interactivo. Puente: codex-bridge.
    # `gpt-5.6-sol-wm` NO se publica (ver la excepción de arriba).
    # `gpt-daybreak-blue-latest` NO se publica en ninguna cuenta (2026-08-13,
