            return None, None
        if isinstance(value, (int, float)):
            started_sec = float(value) / 1000.0 if value > 1e12 else float(value)
            return started_sec, datetime.fromtimestamp(started_sec, tz=timezone.utc).isoformat()
        if isinstance(value, str):
            raw = value.strip()
            if not raw:
                return None, None
            try:
                numeric = float(raw)
            except ValueError:
                try:
                    dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                except ValueError:
                    return None, None
                if dt.tzinfo is None:
                    dt = dt.replace(tzinfo=timezone.utc)
                dt = dt.astimezone(timezone.utc)
                return dt.timestamp(), dt.isoformat()
            started_sec = numeric / 1000.0 if numeric > 1e12 else numeric
            return started_sec, datetime.fromtimestamp(started_sec, tz=timezone.utc).isoformat()
        return None, None


    def _iter_raw_requests(payload: Any) -> list[dict[str, Any]]:
        if isinstance(payload, dict) and "active" in payload:
            payload = payload.get("active")
        if isinstance(payload, list):
            return [item for item in payload if isinstance(item, dict)]
        if isinstance(payload, dict):
            rows: list[dict[str, Any]] = []
            for request_id, info in payload.items():
                if isinstance(info, dict):
                    row = dict(info)
                    row.setdefault("request_id", request_id)
                    rows.append(row)
            return rows
        return []


    def _normalize_alias(value: Any) -> str:
        alias = str(value or "").strip()
        if not alias:
            return "unknown"
        if alias.startswith("litellm_proxy_master"):
            return "master"
        return alias


    def _normalize(payload: Any) -> list[dict[str, Any]]:
        now = time.time()
        items: list[dict[str, Any]] = []
        for raw in _iter_raw_requests(payload):
            request_id = raw.get("request_id") or raw.get("id")
            if request_id is None:
                continue
            started_raw = raw.get("ts")
            if started_raw is None:
                started_raw = raw.get("started_at")
            if started_raw is None:
                started_raw = raw.get("start_time")
            started_sec, started_iso = _parse_started_at(started_raw)
            age_seconds = int(max(0, now - started_sec)) if started_sec is not None else None
            if age_seconds is not None and age_seconds > STALE_AFTER_SEC:
                continue
            alias_raw = raw.get("key_alias")
            if alias_raw is None:
                alias_raw = raw.get("alias")
            if alias_raw is None:
                alias_raw = raw.get("key")
            alias = _normalize_alias(alias_raw)
            items.append(
                {
                    "request_id": str(request_id),
                    "trace_id": str(raw.get("trace_id") or "").strip() or None,
                    "key_alias": alias,
                    "alias": alias,
                    "model": raw.get("model"),
                    "call_type": raw.get("call_type"),
                    "server_id": raw.get("server_id"),
                    "prompt_tokens": raw.get("prompt_tokens"),
                    "completion_tokens": raw.get("completion_tokens"),
                    "output_speed_tps": raw.get("output_speed_tps"),
                    "ttft_ms": raw.get("ttft_ms"),
                    "started_at": started_iso,
                    "age_seconds": age_seconds,
                    "ts": started_sec,
                }
            )
        return items


    class Handler(BaseHTTPRequestHandler):
        server_version = "LiteLLMActiveRequests/1.0"

        def log_message(self, fmt: str, *args: Any) -> None:
            return

        def _send_json(self, status: int, payload: dict[str, Any]) -> None:
            body = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def _authorized(self) -> bool:
            if not MASTER_KEY:
                return True
            return self.headers.get("Authorization", "") == f"Bearer {MASTER_KEY}"

        def do_GET(self) -> None:
            path = urlparse(self.path).path
            if path == "/healthz":
                self._send_json(200, {"ok": True})
                return
            if path != "/internal/active-requests":
                self._send_json(404, {"error": "not_found"})
                return
            if not self._authorized():
                self._send_json(401, {"error": "unauthorized"})
                return

            try:
                with open(ACTIVE_FILE, "r", encoding="utf-8") as f:
                    payload = json.load(f)
            except FileNotFoundError:
                payload = {}
            except Exception as exc:
                self._send_json(
                    200,
                    {
                        "active": [],
                        "source": "litellm-active-api",
                        "stale_after_sec": STALE_AFTER_SEC,
                        "error": str(exc),
                    },
                )
                return

            self._send_json(
                200,
                {
                    "active": _normalize(payload),
                    "source": "litellm-active-api",
                    "stale_after_sec": STALE_AFTER_SEC,
                },
            )


    if __name__ == "__main__":
        server = ThreadingHTTPServer(("0.0.0.0", PORT), Handler)
        print(f"active-requests-api listening on :{PORT}", flush=True)
        server.serve_forever()
---
# Secrets via ExternalSecret (Vault path: secret/litellm)
# vault kv put secret/litellm \
#   LITELLM_MASTER_KEY=<random-32-char> \
#   DATABASE_URL="postgresql://litellm:<pwd>@postgres-shared-rw.databases.svc.cluster.local:5432/litellm"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef: { key: secret/litellm, property: LITELLM_MASTER_KEY }
    - secretKey: DATABASE_URL
      remoteRef: { key: secret/litellm, property: DATABASE_URL }
    # Langfuse project keys (pk-lf-/sk-lf-) — the SAME pair Langfuse bootstraps
    # head-lessly (secret/langfuse INIT_PROJECT_*). Add to Vault: vault kv patch
    # secret/litellm LANGFUSE_PUBLIC_KEY=pk-lf-... LANGFUSE_SECRET_KEY=sk-lf-...
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef: { key: secret/litellm, property: LANGFUSE_PUBLIC_KEY }
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef: { key: secret/litellm, property: LANGFUSE_SECRET_KEY }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-dgx-backend-sync
  namespace: litellm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-dgx-backend-sync
  namespace: llm
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-dgx-backend-sync
  namespace: llm
subjects:
  - kind: ServiceAccount
    name: litellm-dgx-backend-sync
    namespace: litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-dgx-backend-sync
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-dgx-backend-sync
  namespace: litellm
data:
  sync.py: |
    from __future__ import annotations

    import json
    import logging
    import os
    import ssl
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from typing import Any

    logging.basicConfig(
        level=os.getenv("LOG_LEVEL", "INFO"),
        format="%(asctime)s %(levelname)s %(message)s",
    )
    log = logging.getLogger("litellm-dgx-backend-sync")

    K8S_NAMESPACE = os.getenv("K8S_NAMESPACE", "llm")
    LITELLM_BASE_URL = os.getenv(
        "LITELLM_BASE_URL",
        "http://litellm.litellm.svc.cluster.local:4000",
    ).rstrip("/")
    LITELLM_MASTER_KEY = os.getenv("LITELLM_MASTER_KEY", "").strip()
    INTERVAL_SECONDS = float(os.getenv("SYNC_INTERVAL_SECONDS", "10"))
    READY_GRACE_SECONDS = float(os.getenv("READY_GRACE_SECONDS", "20"))
    REQUEST_TIMEOUT_SECONDS = float(os.getenv("REQUEST_TIMEOUT_SECONDS", "10"))
    TEAM_RECONCILE_SECONDS = float(os.getenv("TEAM_RECONCILE_SECONDS", "300"))
    OPENCLAW_TEAM_ID = os.getenv("OPENCLAW_TEAM_ID", "").strip()
    OPENCLAW_KEY_ALIAS = os.getenv("OPENCLAW_KEY_ALIAS", "").strip()
    OPENCLAW_TEAM_REQUIRED_MODELS = tuple(
        model.strip()
        for model in os.getenv("OPENCLAW_TEAM_REQUIRED_MODELS", "").split(",")
        if model.strip()
    )

    # Direct aliases for the Ornith deployment.
    ORNITH_CANARY_ALIASES = (
        "ornith-canary",
        "ornith-1.0",
    )
    QWEN36_COMPAT_ALIASES = (
        "tooling",
        "router",
        "auto",
        # Codex-facing smart-router alias (profile `litellmrouter`). The
        # strip-params hook re-points it per request shape; registering it on
        # Ornith keeps the alias servable even if the hook rewrite is ever
        # disabled.
        "litellmrouter",
        "qwen36-35b",
        # Contractual alias: explicit model+purpose name kept for clients that
        # pinned the old Qwen3.6-35B tooling route. It now resolves to Ornith,
        # which owns every name in this tuple.
        "qwen36-35b-tooling",
        "qwen36-35b-reasoning",
        "qwen36-35b-nvfp4",
        "qwen-36-35b",
    )
    # 2026-07-22 cutover (Daniel): the compatibility aliases are owned by the
    # DGX1 Ornith backend (gates passed: parser/tooling battery 370, speed
    # 170 tok/s @8K).
    ORNITH_ALIASES = ORNITH_CANARY_ALIASES + QWEN36_COMPAT_ALIASES
    # The DGX2 uncensored 27B is the ONLY dense model in the cluster, so it owns
    # every dense-shaped name. `taxonomy` was added here on 2026-07-27: it used to
    # be registered solely by the censored 27B deployments (deleted 2026-07-26), so
    # it survived only because the strip-params hook rewrote it before routing --
    # it would have broken the moment the hook was disabled. Registering it makes
    # it a real alias again.
    # `dense-uncensored` is the explicit, un-fallbacked name: it is never rewritten
    # by the hook, so a direct call fails hard if DGX2 is down instead of silently
    # answering from Ornith.
    QWEN36_27B_UNCENSORED_ALIASES = (
        "dense-uncensored",
        "dense",
        "dense-reasoning",
        "taxonomy",
    )
    QWEN36_REPEAT_GUARD_PARAMS = {
        "repetition_penalty": float(os.getenv("QWEN36_REPETITION_PENALTY", "1.08")),
    }
    # Cluster topology (2026-07-26): exactly TWO chat models remain, one per node,
    # each on its own set of aliases -- there is no shared-alias pool and no
    # load-balancing between them any more.
    #   - `ornith-dgx1`  (DGX1, nvidia-dgx): Ornith 1.0 35B-A3B MoE + grafted MTP.
    #     Owns tooling/router/auto/litellmrouter and the qwen36-35b* compat names.
    #   - `qwen36-27b-uncensored-dgx2` (DGX2, gx10-ec3d): the uncensored 27B DENSE.
    #     Owns dense/dense-reasoning/dense-uncensored/taxonomy. Evictable: the GPU
    #     arbiter can hand DGX2 to image/video work, which takes its EndpointSlice
    #     NotReady; reconcile_backend(enable=False) then deletes its model IDs and
    #     the hook's `_alias_has_deployments` guard degrades `dense` to Ornith.
    # The Qwen3.6-35B (`vllm-35b-nvfp4*`), censored 27B F2 (`...-v024-f2-*`) and
    # Gemma-4 deployments were DELETED on 2026-07-26 -- not scaled to zero -- so
    # their backends were removed from this controller on 2026-07-27.
    BACKENDS = (
        {
            # DGX1 Ornith production resident: owns tooling/router/auto and
            # the qwen36-35b* compatibility aliases (2026-07-22 cutover).
            "name": "ornith-dgx1",
            "label": "DGX1_ORNITH_35B",
            "backend": "dgx1",
            "base_model": "openai/ornith-1.0-35b-nvfp4-mtp",
            "aliases": ORNITH_ALIASES,
            "service": os.getenv(
                "K8S_SERVICE_ORNITH_DGX1",
                "vllm-ornith-35b-nvfp4-mtp-dgx1",
            ),
            "api_base": os.getenv(
                "ORNITH_DGX1_API_BASE",
                "http://vllm-ornith-35b-nvfp4-mtp-dgx1.llm.svc.cluster.local:8000/v1",
            ),
            "id_prefix": "dgx1-ornith-35b-nvfp4-mtp",
            "max_parallel_requests": 4,
            "max_tokens": 16384,
            "context_window": 262144,
            "supports_function_calling": True,
            "supports_vision": True,
        },
        {
            # DGX2 resident and the cluster's only DENSE model: the uncensored
            # 27B (heretic-v2 + NVFP4 lm_head, ~41 tok/s). Owns every dense-shaped
            # alias including `taxonomy`. Evictable by the GPU arbiter; when its
            # EndpointSlice goes NotReady the hook degrades `dense` to Ornith.
            "name": "qwen36-27b-uncensored-dgx2",
            "label": "DGX2_QWEN36_27B_UNCENSORED",
            "backend": "dgx2",
            "base_model": os.getenv(
                "QWEN36_27B_UNCENSORED_MODEL",
                "openai/qwen36-27b-uncensored-nvfp4",
            ),
            "aliases": QWEN36_27B_UNCENSORED_ALIASES,
            "service": os.getenv(
                "K8S_SERVICE_QWEN36_27B_UNCENSORED_DGX2",
                "vllm-qwen36-27b-uncensored-dgx2",
            ),
            "api_base": os.getenv(
                "QWEN36_27B_UNCENSORED_DGX2_API_BASE",
                "http://vllm-qwen36-27b-uncensored-dgx2.llm.svc.cluster.local:8000/v1",
            ),
            "id_prefix": "dgx2-qwen36-27b-uncensored-nvfp4",
            "max_parallel_requests": 8,
            "supports_function_calling": True,
            "supports_vision": True,
        },
    )
    # Model IDs managed by earlier versions of this controller. They are deleted
    # every cycle so a leftover registration can never serve traffic on a route it
    # no longer owns. Since 2026-07-26 the Gemma-4, Qwen3.6-35B and censored 27B F2
    # deployments are GONE, so their whole ID prefixes are purged below (previously
    # only three dgx1 Gemma IDs were listed explicitly, because gemma-dgx1 was still
    # an active backend -- it no longer is).
    RETIRED_MANAGED_IDS = (
        "dgx1-gemma4-26b-a4b-nvfp4-tooling",
        "dgx1-gemma4-26b-a4b-nvfp4-router",
        "dgx1-gemma4-26b-a4b-nvfp4-auto",
    )
    RETIRED_MANAGED_ID_PREFIXES = (
        # Every deployment behind these prefixes was deleted on 2026-07-26, so the
        # whole prefix is safe to purge -- there is no live backend left to clobber.
        "dgx1-gemma4-26b-a4b-nvfp4-",
        "dgx2-gemma4-26b-a4b-nvfp4-",
        "dgx1-qwen36-35b-nvfp4-",
        "dgx2-qwen36-35b-nvfp4-",
        "dgx1-qwen36-27b-dense-nvfp4-",
        "dgx2-qwen36-27b-dense-nvfp4-",
    )

    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    K8S_HOST = os.getenv("KUBERNETES_SERVICE_HOST")
    K8S_PORT = os.getenv("KUBERNETES_SERVICE_PORT", "443")


    def _read_file(path: str) -> str:
        with open(path, "r", encoding="utf-8") as f:
            return f.read().strip()


    def _ssl_context() -> ssl.SSLContext:
        if os.path.exists(CA_PATH):
            return ssl.create_default_context(cafile=CA_PATH)
        return ssl.create_default_context()


    K8S_CONTEXT = _ssl_context()


    def _request_json(
        method: str,
        url: str,
        *,
        payload: dict[str, Any] | None = None,
        headers: dict[str, str] | None = None,
    ) -> Any:
        data = None
        req_headers = dict(headers or {})
        if payload is not None:
            data = json.dumps(payload).encode("utf-8")
            req_headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=data, headers=req_headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT_SECONDS) as resp:
                raw = resp.read().decode("utf-8", errors="replace")
        except urllib.error.HTTPError as exc:
            raw = exc.read().decode("utf-8", errors="replace")
            raise RuntimeError(f"{method} {url} -> HTTP {exc.code}: {raw[:500]}") from exc
        if not raw:
            return {}
        return json.loads(raw)


    def _k8s_get(path: str) -> Any:
        if not K8S_HOST:
            raise RuntimeError("KUBERNETES_SERVICE_HOST is not set")
        token = _read_file(TOKEN_PATH)
        url = f"https://{K8S_HOST}:{K8S_PORT}{path}"
        req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
        with urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT_SECONDS, context=K8S_CONTEXT) as resp:
            return json.loads(resp.read().decode("utf-8"))


    def _endpoint_condition_ready(endpoint: dict[str, Any]) -> bool:
        conditions = endpoint.get("conditions") or {}
        if conditions.get("terminating") is True:
            return False
        if conditions.get("ready") is False:
            return False
        if conditions.get("serving") is False:
            return False
        return bool(endpoint.get("addresses"))


    def _endpointslice_ready(service: str) -> bool:
        selector = urllib.parse.urlencode(
            {"labelSelector": f"kubernetes.io/service-name={service}"}
        )
        data = _k8s_get(
            f"/apis/discovery.k8s.io/v1/namespaces/{K8S_NAMESPACE}/endpointslices?{selector}"
        )
        ready_addresses: list[str] = []
        # NOTE: a scaled-to-zero Service still leaves an EndpointSlice whose
        # `endpoints` (and `ports`) fields are JSON null, not []. dict.get(k, [])
        # only substitutes the default when the key is ABSENT, so `null` slips
        # through and `for endpoint in None` raised TypeError every cycle,
        # wedging the controller into the `ready is None` skip-branch forever
        # (it never reconciled DGX2 in or out). Use `or []` to coerce null too.
        for item in data.get("items") or []:
            for endpoint in item.get("endpoints") or []:
                if _endpoint_condition_ready(endpoint):
                    ready_addresses.extend(endpoint.get("addresses") or [])
        if ready_addresses:
            log.debug("ready EndpointSlice addresses for %s: %s", service, ready_addresses)
            return True
        return False


    def _legacy_endpoints_ready(service: str) -> bool:
        data = _k8s_get(f"/api/v1/namespaces/{K8S_NAMESPACE}/endpoints/{service}")
        for subset in data.get("subsets", []) or []:
            if subset.get("addresses"):
                return True
        return False


    def endpoint_ready(service: str) -> bool | None:
        try:
            return _endpointslice_ready(service) or _legacy_endpoints_ready(service)
        except urllib.error.HTTPError as exc:
            if exc.code == 404:
                return False
            log.warning("Kubernetes readiness query failed for %s: HTTP %s", service, exc.code)
            return None
        except Exception as exc:
            log.warning("Kubernetes readiness query failed for %s: %s", service, exc)
            return None


    def _litellm_headers() -> dict[str, str]:
        if not LITELLM_MASTER_KEY:
            return {}
        return {"Authorization": f"Bearer {LITELLM_MASTER_KEY}"}


    def reconcile_required_team_models() -> None:
        """Keep fixed team permissions compatible with managed explicit aliases.

        This only widens one configured existing team by a fixed model list. It
        never creates teams, removes permissions, or accepts caller input.
        """
        if not OPENCLAW_TEAM_ID or not OPENCLAW_TEAM_REQUIRED_MODELS:
            return
        query = urllib.parse.urlencode({"team_id": OPENCLAW_TEAM_ID})
        data = _request_json(
            "GET",
            f"{LITELLM_BASE_URL}/team/info?{query}",
            headers=_litellm_headers(),
        )
        team = data.get("team_info", data) if isinstance(data, dict) else {}
        current = [str(model) for model in (team.get("models") or [])]
        desired = list(current)
        for model in OPENCLAW_TEAM_REQUIRED_MODELS:
            if model not in desired:
                desired.append(model)
        if desired != current:
            _request_json(
                "POST",
                f"{LITELLM_BASE_URL}/team/update",
                payload={"team_id": OPENCLAW_TEAM_ID, "models": desired},
                headers=_litellm_headers(),
            )
            log.info(
                "updated team %s model access with required models: %s",
                OPENCLAW_TEAM_ID,
                ",".join(OPENCLAW_TEAM_REQUIRED_MODELS),
            )

        # LiteLLM evaluates a virtual key's own allowlist before its team
        # allowlist. Reconcile only the named OpenClaw production key, never
        # every key belonging to the team.
        if not OPENCLAW_KEY_ALIAS:
            return
        for key in data.get("keys", []) if isinstance(data, dict) else []:
            if key.get("key_alias") != OPENCLAW_KEY_ALIAS:
                continue
            key_token = str(key.get("token") or "")
            if not key_token:
                log.warning("OpenClaw key %s has no updatable token", OPENCLAW_KEY_ALIAS)
                continue
            key_current = [str(model) for model in (key.get("models") or [])]
            key_desired = list(key_current)
            for model in OPENCLAW_TEAM_REQUIRED_MODELS:
                if model not in key_desired:
                    key_desired.append(model)
            if key_desired == key_current:
                continue
            _request_json(
                "POST",
                f"{LITELLM_BASE_URL}/key/update",
                payload={"key": key_token, "models": key_desired},
                headers=_litellm_headers(),
            )
            log.info(
                "updated OpenClaw key %s model access with required models: %s",
                OPENCLAW_KEY_ALIAS,
                ",".join(OPENCLAW_TEAM_REQUIRED_MODELS),
            )


    def managed_model_id(backend: dict[str, Any], alias: str) -> str:
        return f"{backend['id_prefix']}-{alias}"


    def extra_litellm_params(backend: dict[str, Any], alias: str) -> dict[str, Any]:
        base_model = str(backend.get("base_model") or "")
        if base_model.startswith("openai/qwen36-"):
            return dict(QWEN36_REPEAT_GUARD_PARAMS)
        return {}


    def desired_deployments(backend: dict[str, Any]) -> list[dict[str, Any]]:
        deployments = []
        for alias in backend["aliases"]:
            deployments.append(
                {
                    "model_name": alias,
                    "litellm_params": {
                        "model": backend["base_model"],
                        "api_base": backend["api_base"],
                        "api_key": "not-used",
                        "timeout": 600,
                        "max_parallel_requests": backend["max_parallel_requests"],
                        **extra_litellm_params(backend, alias),
                    },
                    "model_info": {
                        "id": managed_model_id(backend, alias),
                        "max_tokens": backend.get("max_tokens", 32768),
                        "supports_function_calling": backend["supports_function_calling"],
                        "supports_vision": backend["supports_vision"],
                        "context_window": backend.get("context_window", 262144),
                        "managed_by": "litellm-dgx-backend-sync",
                        "backend": backend["backend"],
                        "k8s_namespace": K8S_NAMESPACE,
                        "k8s_service": backend["service"],
                    },
                }
            )
        return deployments


    def current_model_ids() -> set[str]:
        data = _request_json(
            "GET",
            f"{LITELLM_BASE_URL}/model/info",
            headers=_litellm_headers(),
        )
        items = data.get("data", data) if isinstance(data, dict) else data
        ids: set[str] = set()
        for item in items or []:
            info = item.get("model_info") or {}
            model_id = info.get("id") or item.get("model_id") or item.get("id")
            if model_id:
                ids.add(str(model_id))
        return ids


    def add_model(deployment: dict[str, Any]) -> None:
        model_id = deployment["model_info"]["id"]
        try:
            _request_json(
                "POST",
                f"{LITELLM_BASE_URL}/model/new",
                payload=deployment,
                headers=_litellm_headers(),
            )
            backend = (deployment.get("model_info") or {}).get("backend", "unknown").upper()
            log.info("enabled %s backend %s for alias %s", backend, model_id, deployment["model_name"])
        except RuntimeError as exc:
            msg = str(exc).lower()
            if "already" in msg and "exist" in msg:
                log.info("backend %s already exists", model_id)
                return
            raise


    def delete_model(model_id: str) -> None:
        try:
            _request_json(
                "POST",
                f"{LITELLM_BASE_URL}/model/delete",
                payload={"id": model_id},
                headers=_litellm_headers(),
            )
            log.info("disabled backend %s", model_id)
        except RuntimeError as exc:
            msg = str(exc).lower()
            if "not found" in msg or "does not exist" in msg:
                log.info("backend %s already absent", model_id)
                return
            raise


    def cleanup_retired_models(existing: set[str] | None = None) -> None:
        existing_ids = set(existing if existing is not None else current_model_ids())
        retired = {model_id for model_id in RETIRED_MANAGED_IDS if model_id in existing_ids}
        for prefix in RETIRED_MANAGED_ID_PREFIXES:
            retired.update(model_id for model_id in existing_ids if model_id.startswith(prefix))
        for model_id in sorted(retired):
            delete_model(model_id)


    def reconcile_backend(backend: dict[str, Any], enable: bool) -> None:
        desired = desired_deployments(backend)
        managed_ids = {d["model_info"]["id"] for d in desired}
        existing = current_model_ids()
        cleanup_retired_models(existing)
        existing = current_model_ids()
        active_prefix = f"{backend['id_prefix']}-"
        stale_ids = {
            model_id
            for model_id in existing
            if model_id.startswith(active_prefix) and model_id not in managed_ids
        }
        for model_id in sorted(stale_ids):
            delete_model(model_id)
        existing -= stale_ids
        if enable:
            for deployment in desired:
                if deployment["model_info"]["id"] not in existing:
                    add_model(deployment)
        else:
            for model_id in sorted(managed_ids & existing):
                delete_model(model_id)


    def main() -> None:
        log.info(
            "starting sync: namespace=%s services=%s litellm=%s interval=%ss ready_grace=%ss",
            K8S_NAMESPACE,
            ",".join(f"{b['name']}={b['service']}" for b in BACKENDS),
            LITELLM_BASE_URL,
            INTERVAL_SECONDS,
            READY_GRACE_SECONDS,
        )
        ready_since: dict[str, float | None] = {b["name"]: None for b in BACKENDS}
        last_desired: dict[str, bool | None] = {b["name"]: None for b in BACKENDS}
        next_team_reconcile = 0.0
        while True:
            now = time.monotonic()
            if now >= next_team_reconcile:
                try:
                    reconcile_required_team_models()
                except Exception as exc:
                    log.warning("team model access reconcile failed: %s", exc)
                next_team_reconcile = now + TEAM_RECONCILE_SECONDS
            for backend in BACKENDS:
                name = backend["name"]
                service = backend["service"]
                ready = endpoint_ready(service)
                if ready is None:
                    continue
                if ready:
                    if ready_since[name] is None:
                        ready_since[name] = now
                    if now - (ready_since[name] or now) < READY_GRACE_SECONDS:
                        # A controller restart has no durable ready_since state. Keep
                        # the last known-good registrations through this warm-up
                        # interval instead of deleting every live alias and creating
                        # a transient routing outage on each restart.
                        continue
                    desired = True
                else:
                    ready_since[name] = None
                    desired = False
                try:
                    reconcile_backend(backend, desired)
                    if desired != last_desired[name]:
                        log.info("desired %s routing state changed: enabled=%s", name.upper(), desired)
                        last_desired[name] = desired
                except Exception as exc:
                    log.warning("reconcile failed for %s/%s: %s", K8S_NAMESPACE, service, exc)
            time.sleep(INTERVAL_SECONDS)


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-dgx-backend-sync
  namespace: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-dgx-backend-sync
  template:
    metadata:
      labels:
        app: litellm-dgx-backend-sync
      annotations:
        config.k8s.e-dani.com/revision: router-tools-rule-20260727
    spec:
      serviceAccountName: litellm-dgx-backend-sync
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
        node-pool: ks5-nvme
      containers:
        - name: sync
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/sync.py"]
          env:
            - { name: LITELLM_BASE_URL, value: "http://litellm.litellm.svc.cluster.local:4000" }
            - { name: K8S_NAMESPACE, value: "llm" }
            - { name: K8S_SERVICE_ORNITH_DGX1, value: "vllm-ornith-35b-nvfp4-mtp-dgx1" }
    # The Qwen3.6-35B, censored 27B F2 and Gemma-4 Services were DELETED on
    # 2026-07-26, so their backends and K8S_SERVICE_* envs were removed here on
    # 2026-07-27; there is no scale-to-zero rollback path left.
            # DGX1 permanent floor plus the optional DGX2 dense F2 twin.
            # Isolated explicit alias: one DGX2 backend, no fallback.
            - { name: K8S_SERVICE_QWEN36_27B_UNCENSORED_DGX2, value: "vllm-qwen36-27b-uncensored-dgx2" }
            - { name: QWEN36_27B_UNCENSORED_MODEL, value: "openai/qwen36-27b-uncensored-nvfp4" }
            - { name: SYNC_INTERVAL_SECONDS, value: "10" }
            - { name: READY_GRACE_SECONDS, value: "20" }
            # Durable least-privilege reconciliation for the existing OpenClaw
            # team. The controller only unions this fixed explicit alias.
            - { name: OPENCLAW_TEAM_ID, value: "openclaw" }
            # Fixed explicit routes required during the canary. The reconciler
            # only unions these names; it never removes existing permissions.
            - { name: OPENCLAW_TEAM_REQUIRED_MODELS, value: "ornith-canary,ornith-1.0,dense-uncensored" }
            - { name: OPENCLAW_KEY_ALIAS, value: "openclaw-qwen36-prod" }
            - { name: TEAM_RECONCILE_SECONDS, value: "300" }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
          volumeMounts:
            - { name: sync, mountPath: /app, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: sync
          configMap: { name: litellm-dgx-backend-sync }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector: { matchLabels: { app: litellm } }
  template:
    metadata:
      labels: { app: litellm }
      annotations:
        config.k8s.e-dani.com/revision: router-tools-rule-20260727
        active-requests-api/revision: "20260726-request-history-trace"
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 720
      nodeSelector:
        kubernetes.io/arch: amd64
        node-pool: ks5-nvme
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.85.1
          args:
            - --config=/config/config.yaml
            - --host=0.0.0.0
            - --port=4000
            - --detailed_debug
            - --use_v2_migration_resolver
            - --enforce_prisma_migration_check
          ports:
            - { name: http, containerPort: 4000 }
          env:
            - { name: LITELLM_LOG, value: INFO }
            - { name: PYTHONPATH, value: /app }
            - { name: LITELLM_ACTIVE_FILE, value: /shared/tracking/active_requests.json }
            - { name: LITELLM_ACTIVE_STALE_AFTER_SEC, value: "900" }
            - { name: LITELLM_DRAIN_TIMEOUT_SEC, value: "660" }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
            # Langfuse native callback (LLM tracing). Points at the in-cluster web
            # service directly (bypasses the SSO edge). Keys from litellm-secrets ESO.
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LANGFUSE_PUBLIC_KEY } }
            - name: LANGFUSE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LANGFUSE_SECRET_KEY } }
            - name: LANGFUSE_HOST
              value: "http://langfuse-web.langfuse.svc.cluster.local:3000"
            - name: _DBUSER
              valueFrom: { secretKeyRef: { name: litellm-postgres-creds, key: username } }
            - name: _DBPASS
              valueFrom: { secretKeyRef: { name: litellm-postgres-creds, key: password } }
            - name: DATABASE_URL
              value: "postgresql://$(_DBUSER):$(_DBPASS)@postgres-shared-rw.databases.svc.cluster.local:5432/litellm"
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: config, mountPath: /app/litellm_strip_params.py, subPath: litellm_strip_params.py, readOnly: true }
            - { name: config, mountPath: /app/active_request_tracking.py, subPath: active_request_tracking.py, readOnly: true }
            - { name: tracking, mountPath: /shared/tracking }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { memory: 3Gi }
          lifecycle:
            preStop:
              exec:
                command: ["python", "/config/litellm_drain.py"]
          readinessProbe:
            # /health/liveliness (always 200 while the server loop is alive), NOT
            # /health/readiness: readiness does a DB round-trip and returns 503
            # when postgres is down, which pulled litellm out of the Service for
            # 9h on 2026-07-20 while inference itself was fine. With
            # allow_requests_on_db_unavailable the proxy serves through DB
            # outages; DB health is alerted via SharedDatastoreUnreachable
            # (k8s-observability) instead of endpoint removal.
            httpGet: { path: /health/liveliness, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
        - name: active-requests-api
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/active-api/active_requests_api.py"]
          ports:
            - { name: active, containerPort: 4001 }
          env:
            - { name: LITELLM_ACTIVE_FILE, value: /shared/tracking/active_requests.json }
            - { name: LITELLM_ACTIVE_STALE_AFTER_SEC, value: "900" }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
          volumeMounts:
            - { name: config, mountPath: /active-api, readOnly: true }
            - { name: tracking, mountPath: /shared/tracking, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 4001 }
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: litellm-config }
        - name: tracking
          hostPath:
            path: /home/dibanez/dgx-tracking
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  selector: { app: litellm }
  ports:
    - { name: http, port: 4000, targetPort: 4000 }
    - { name: active, port: 4001, targetPort: 4001 }
---
# Public access for external callers. Internal services must use the LAN route below.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm-public
  namespace: litellm
  annotations:
    external-dns.alpha.kubernetes.io/hostname: litellm.e-dani.com
    external-dns.alpha.kubernetes.io/target: 57.129.17.172
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints: [websecure]
  ingressClassName: traefik-edge
  routes:
    - match: Host(`litellm.e-dani.com`)
      kind: Rule
      services:
        - name: litellm
          port: 4000
  tls:
    store: { name: default, namespace: traefik-edge }
---
# LAN access for internal services (no SSO middleware — API key protected)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm-lan
  namespace: litellm
  annotations:
    external-dns.alpha.kubernetes.io/hostname: litellm.lan.e-dani.com
    external-dns.alpha.kubernetes.io/target: 192.168.50.240
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`litellm.lan.e-dani.com`)
      kind: Rule
      services:
        - name: litellm
          port: 4000
  tls:
    store: { name: default, namespace: traefik-lan }
