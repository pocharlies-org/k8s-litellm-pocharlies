    litellm_settings:
      success_callback:
      - db
      - prometheus
      failure_callback:
      - prometheus
      service_callback:
      - prometheus_system
      callbacks:
      - litellm_strip_params.proxy_handler_instance
      - langfuse_otel
      drop_params: true
      set_verbose: false
      require_auth_for_metrics_endpoint: false
      num_retries: 2
      request_timeout: 600
      # Content logging ENABLED (2026-07-09): full prompt/response text flows to Langfuse
      # traces AND the DB spend-logs — needed for prompt debugging + LLM-as-a-judge evals.
      # Langfuse is SSO-gated (Keycloak) + homelab, so the privacy risk is low. To redact
      # content again (traces keep latency/cost/tokens/tags; body -> "redacted-by-litellm"),
      # set this back to true.
      turn_off_message_logging: false
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      # 2026-08-18: a false. Esto estaba a true por UNA razon — que el controlador
      # `litellm-dgx-backend-sync` pudiera escribir modelos por /model/new y que las
      # 4 replicas compartieran ese catalogo. Muerto el controlador, nadie escribe
      # modelos, y el catalogo compartido lo da el ConfigMap: todas las replicas leen
      # el MISMO fichero.
      #
      # Lo que se gana, y es el motivo de fondo: un alias solo puede existir en git.
      # No hay que purgar las filas viejas de la DB — con esto dejan de cargarse, se
      # quedan inertes. Y LiteLLM arranca y enruta SIN postgres (que ya se cayo 9h el
      # 20-07 y se llevo la inferencia por delante); antes eso solo lo mitigaba
      # allow_requests_on_db_unavailable, mas abajo.
      #
      # OJO: esto es SOLO modelos. Keys, equipos, presupuesto y spend siguen en
      # postgres, y database_url se queda. Añadir un modelo pasa a ser un commit:
      # POST /models del panel y el boton «Add deployment» dejan de tener sentido y
      # se retiran en dgx-infra.
      store_model_in_db: false
      # 2026-07-21: prompts OFF in SpendLogs — full prompt/response duplication of
      # what Langfuse already stores had grown the table to 21 GB (~38 KB/row) and
      # made retention DELETEs time out. SpendLogs is accounting only.
      store_prompts_in_spend_logs: false
      # DB down must degrade auth (restricted internal token), not kill inference.
      # Incident 2026-07-20: postgres-shared out for 9h => litellm hard-down.
      allow_requests_on_db_unavailable: true
      # 2026-08-14: con 4 replicas, Prisma sin limite son ~98 conexiones por pod
      # = ~400, que es EXACTAMENTE el max_connections de postgres-shared.
      # 25 x 4 = 100 deja 300 al resto de tenants. Se fija aqui y no en el DSN a
      # proposito: el mismo parametro en la URL tumba el arranque de cualquier
      # consumidor psycopg que la herede.
      database_connection_pool_limit: 25
      database_connection_timeout: 60
      background_health_checks: true
      # 2026-08-19: el intervalo estaba IMPLICITO en el default de upstream
      # (DEFAULT_HEALTH_CHECK_INTERVAL = 300 s, litellm/constants.py) y el bucle
      # es por REPLICA: 4 replicas x 288 ciclos/dia x cada deployment. Con los
      # alias gemelos ya callados arriba, los dos pools bge quedaban aun en
      # ~4200 filas/dia de SpendLogs generadas por `litellm-internal-health-check`
      # -- sobre una tabla que ya llego a 21 GB y cuyos DELETE de retencion
      # expiraban (ver store_prompts_in_spend_logs, arriba). El coste de GPU es
      # calderilla (8010 prompt tokens en 30 h, 3 por llamada: el prompt es
      # "test from litellm"); lo que se compra aqui son filas y ruido de panel.
      # 900 s mantiene deteccion de un pool caido en <=15 min, que es de sobra
      # para un backend con `for: 5m` en Prometheus.
      #
      # NO se pone `health_check_skip_disabled_background_models`: se quiere que
      # un `GET /health` a mano SIGA sondeando los gemelos cuando un operador lo
      # pide expresamente. Solo se calla el bucle de fondo.
      #
      # `use_shared_health_check: true` es lo que upstream recomienda para el
      # factor x4 de replicas (un pod coge un lock en Redis y los demas leen
      # cache), pero EXIGE Redis y aqui no hay ninguno declarado -- no hay
      # `cache_params` en litellm_settings. Queda como la via para bajar de 384
      # a 96 llamadas/dia el dia que haya Redis; no se activa a ciegas porque
      # sin Redis el codigo cae a checks locales y el cambio seria un no-op
      # silencioso.
      health_check_interval: 900
      enable_passthrough_logging: false
      maximum_spend_logs_retention_period: 30d
      maximum_spend_logs_retention_interval: 1d
      proxy_batch_write_at: 60
    router_settings:
      routing_strategy: simple-shuffle
      timeout: 600
      num_retries: 1
      # 2026-06-22: a wedged vLLM backend (EngineCore deadlock; /health still 200)
      # used to keep eating ~50% of chat traffic because it took 20 fails before
      # any cooldown and the cooldown was only 30s. Eject faster and keep it out
      # longer; the vLLM engine-watchdog liveness probe restarts the wedged pod
      # (-> EndpointSlice NotReady -> litellm-dgx-backend-sync removes it) within
      # ~4 min, so this only has to cover that window.
      allowed_fails: 3
      cooldown_time: 120
      # Compatibilidad del nombre puntuado del 4B sin ocupar linea en el picker:
      # `hidden` lo deja fuera de /v1/models, que es de donde OpenClaw siembra el
      # menu, y el router lo sigue resolviendo al grupo `qwen35-4b`. Es una
      # deprecacion, no una entrada nueva: cuando el consumidor de cada ~16 min
      # este identificado y repuntado, esta clave se cae.
      model_group_alias:
        "qwen3.5-4b":
          model: qwen35-4b
          hidden: true
      # There are two failure modes with two different errors and layers:
      #   * alias REGISTERED but no healthy deployment (cooldown after allowed_fails,
      #     a wedged vLLM whose /health still answers 200) -> the Router raises from
      #     inside async_function_with_fallbacks' try, so THIS fallback fires.
      #   * alias DELETED from model_list (litellm-dgx-backend-sync calls
      #     /model/delete when the Service goes NotReady) -> the proxy raises
      #     ProxyModelNotFoundError in route_llm_request.py BEFORE the Router is
      #     invoked, so no entry here can ever fire. That mode is covered only by
      #     capability hook's chain, which runs at pre_call_hook, ahead of the
      #     model-name gate.
      # Both layers are load-bearing. Neither one substitutes for the other.
      # 24-08-2026: la clave `fallbacks` desaparece entera. Sus dos unicas
      # entradas eran `high` y `max`, que se retiran del model_list —no eran
      # modelos, eran niveles de pensamiento—, y un `fallbacks:` sin lista se
      # carga como null. `tooling` nunca tuvo fallback a proposito: representa al
      # residente del perfil global y tiene que fallar de forma VISIBLE cuando no
      # hay residente utilizable. La segunda capa (la cadena del hook de
      # capacidad, que corre en pre_call_hook) sigue intacta y es la que cubre el
      # modo "alias borrado del model_list" que se describe arriba.
      # 2026-07-03: removed bge-*-cpu fallbacks (and the -cpu model_list entries).
      # Embedding+reranker are HA across both GPU nodes via the `bge-pool` label +
      # KEDA scale-to-zero, and the -cpu Services no longer exist (dead fallback).
  litellm_strip_params.py: |
