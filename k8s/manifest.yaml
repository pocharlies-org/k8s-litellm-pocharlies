    tool_gate_log = logging.getLogger("litellm.tool_gate")

    COMPUTE_MODE_URL = os.environ.get(
        "COMPUTE_MODE_URL",
        "http://dgx-dashboard-backend.control-nexus.svc.cluster.local:9002/api/compute/mode",
    ).strip()
    COMPUTE_MODE_CACHE_SECONDS = float(
        os.environ.get("COMPUTE_MODE_CACHE_SECONDS", "5")
    )
    COMPUTE_MODE_TIMEOUT_SECONDS = float(
        os.environ.get("COMPUTE_MODE_TIMEOUT_SECONDS", "10")
    )
    COMPUTE_MODE_RETRY_AFTER_SECONDS = max(
        1, int(os.environ.get("COMPUTE_MODE_RETRY_AFTER_SECONDS", "5"))
    )
    _compute_mode_cache = {"expires": 0.0, "state": None}
    _compute_mode_lock = asyncio.Lock()

    def _compute_mode_allows_local(state):
        if not isinstance(state, dict):
            return False, "compute_mode_unavailable"
        if state.get("phase") != "ready":
            return False, "compute_mode_transition"
        effective = state.get("effective_mode")
        if effective not in {"llm-tp", "creative"}:
            return False, "compute_mode_invalid"
        if state.get("desired_mode") != effective:
            return False, "compute_mode_inconsistent"
        return True, None

    # 2026-08-18: los dos valores eran "tooling" porque el alias `tooling` lo
    # REGISTRABA en runtime el controlador sobre el residente que estuviera arriba,
    # asi que resolverlo era un no-op. Muerto el controlador, `tooling` es una
    # entrada estatica al Service de pool y esta reescritura es la que hace el
    # trabajo: manda la peticion al NOMBRE DIRECTO del residente vivo.
    #
    # Por que importa reescribir y no dejar que vaya al pool: el nombre directo es
    # el que lleva la metadata real del backend (ventana 393216 vs 262144), el
    # sampling correcto por familia (_family_of_alias lee litellm_params.model) y,
    # en Qwen, el repetition_penalty 1.08. Una entrada al pool no puede llevar eso
    # porque no sabe quien va a contestar.
    TOOLING_MODE_TARGETS = {
        "llm-tp": "deepseek-v4-flash-0731",
        "creative": "qwen38-27b",
    }
    TOOLING_LUNA_FALLBACKS = (
        "cloudblue/gpt-5.6-luna",
        "e-dani/gpt-5.6-luna",
    )
    # Alias que significan «el residente del perfil vivo» y por eso se reescriben al
    # nombre directo antes de enrutar. `tooling` = sin pensar; agent/high/max = el
    # MISMO backend con otro nivel de pensamiento. router/auto/litellmrouter NO estan
    # aqui: esos eligen primero uno de estos cuatro (AUTO_ROUTED_MODELS) y la
    # reescritura ocurre despues, sobre el elegido.
    TOOLING_PROFILE_ALIASES = frozenset({"tooling", "agent", "high", "max"})

    # `tooling-uncensored` significa lo mismo que `tooling` —el residente del perfil
    # vivo— pero con la proyeccion rank-1 encendida. Se resuelve al nombre DIRECTO
    # abliterado, no al del residente normal, porque el sello (`cache_salt`) vive en
    # la entrada del nombre directo y la lambda NO es la misma en los dos:
    # 1.5 DeepSeek / 1.0 Qwen3.8, medidas y no intercambiables.
    TOOLING_UNCENSORED_MODE_TARGETS = {
        "llm-tp": "deepseek-v4-flash-0731-uncensored",
        "creative": "qwen38-27b-uncensored",
    }
    TOOLING_UNCENSORED_ALIASES = frozenset({"tooling-uncensored"})

    # ── Quien puede pedir la ruta abliterada (19-08, tras auditoria) ─────────────
    #
    # EL PROBLEMA QUE CIERRA. Hasta hoy cualquier key del proxy podia pedir un alias
    # `-uncensored`, porque la key del gateway de OpenClaw tiene `models: []` (sin
    # restriccion) y el equipo `openclaw` tambien. Lo unico que mantenia censurado el
    # trafico normal era que nadie pedia el alias por su nombre: una CONVENCION, no
    # un control. La model card publicada de este proyecto pide justo lo contrario:
    # "λ>0 should not share credentials with write-capable tools".
    #
    # Esto no arregla del todo esa recomendacion —la key sigue siendo la del agente
    # con escritura— pero convierte "cualquiera" en "los que estan escritos en git",
    # que es auditable y revocable con un commit. El paso que falta es una key
    # dedicada, y ese es del owner: en cuanto exista, se quita de aqui la del
    # gateway y se pone la nueva.
    #
    # `master` entra porque es la key con la que se mide desde dentro del cluster.
    # `playground` entra (2026-08-20) porque es la key de prueba/sonda del playground
    # del dashboard DGX: es de SOLO LECTURA (no una herramienta con escritura), y el
    # owner quiere explicitamente que la superficie de prueba del playground pueda
    # mandar peticiones a la ruta abliterada para comparar (A/B) censurado vs
    # no-censurado. El paso de la key dedicada sigue siendo del owner: en cuanto
    # exista, se quita de aqui la del gateway y se pone la nueva.
    # Vacio = sin restriccion, y es DELIBERADO que el default NO sea vacio.
    UNCENSORED_ALLOWED_KEY_ALIASES = frozenset(
        alias.strip()
        for alias in os.environ.get(
            "LITELLM_UNCENSORED_ALLOWED_KEYS",
            "openclaw-qwen36-prod,master,playground",
        ).split(",")
        if alias.strip()
    )

    # Todo alias que sirva la ruta abliterada, no solo el de capacidad: el control
    # tiene que cubrir tambien los nombres directos, o se rodea pidiendo el directo.
    UNCENSORED_GATED_ALIASES = TOOLING_UNCENSORED_ALIASES | frozenset(
        TOOLING_UNCENSORED_MODE_TARGETS.values()
    )

    def _uncensored_access_denied(requested, key_label):
        """(bool, detalle) si esta key NO puede pedir la ruta abliterada."""
        if requested not in UNCENSORED_GATED_ALIASES:
            return False, None
        if not UNCENSORED_ALLOWED_KEY_ALIASES:
            return False, None
        if key_label in UNCENSORED_ALLOWED_KEY_ALIASES:
            return False, None
        return True, {
            "error": "this key may not request the abliterated route",
            "requested": requested,
            "key": key_label,
            "allowed": sorted(UNCENSORED_ALLOWED_KEY_ALIASES),
        }

    def _tooling_uncensored_target(state):
        allowed, reason = _compute_mode_allows_local(state)
        if not allowed:
            return None, reason
        target = TOOLING_UNCENSORED_MODE_TARGETS.get(state.get("effective_mode"))
        if not target:
            return None, "compute_mode_invalid"
        return target, None

    def _tooling_target_for_compute_mode(state):
        allowed, reason = _compute_mode_allows_local(state)
        if not allowed:
            return None, reason
        effective = state.get("effective_mode")
        target = TOOLING_MODE_TARGETS.get(effective)
        if not target:
            return None, "compute_mode_invalid"
        return target, None

    def _tooling_route_for_state(state, alias_live, disable_fallbacks=False):
        """Choose the profile resident, then the two independent Luna accounts.

        The local head is considered only while the global profile is coherent and
        Ready. During a transition a stale ``tooling`` registration must not win:
        an ordinary request goes straight to Luna instead of hitting the outgoing
        resident. Keys with ``disable_fallbacks`` fail closed before that cloud hop.
        """
        target, reason = _tooling_target_for_compute_mode(state)
        if target and alias_live(target):
            return target, "primary", reason
        if not disable_fallbacks:
            for fallback in TOOLING_LUNA_FALLBACKS:
                if alias_live(fallback):
                    return fallback, "degraded", reason or "compute_profile_target_unavailable"
        return None, "dry", reason or "compute_profile_target_unavailable"

    async def _compute_mode_state():
        now = time.monotonic()
        if now < _compute_mode_cache["expires"]:
            return _compute_mode_cache["state"]
        async with _compute_mode_lock:
            now = time.monotonic()
            if now < _compute_mode_cache["expires"]:
                return _compute_mode_cache["state"]
            state = None
            try:
                async with httpx.AsyncClient(timeout=COMPUTE_MODE_TIMEOUT_SECONDS) as client:
                    response = await client.get(COMPUTE_MODE_URL)
                response.raise_for_status()
                candidate = response.json()
                if isinstance(candidate, dict):
                    state = candidate
            except Exception as exc:
                log.error("compute-mode admission observation failed: %s", exc)
            _compute_mode_cache["state"] = state
            _compute_mode_cache["expires"] = now + COMPUTE_MODE_CACHE_SECONDS
            return state

    async def _enforce_compute_mode_admission(model, proxy_model, api_base):
        if not _is_local_vllm_request(model, proxy_model, api_base):
            return
        state = await _compute_mode_state()
        allowed, reason = _compute_mode_allows_local(state)
        if allowed:
            return
        raise HTTPException(
            status_code=503,
            headers={"Retry-After": str(COMPUTE_MODE_RETRY_AFTER_SECONDS)},
            detail={
                "error": "local LLM admission is closed during compute profile transition",
                "blocked": reason,
                "desired_mode": (state or {}).get("desired_mode"),
                "effective_mode": (state or {}).get("effective_mode"),
                "phase": (state or {}).get("phase"),
            },
        )

    async def _resolve_tooling_profile(disable_fallbacks=False):
        """Resolve tooling to the active resident, then to GPT-5.6 Luna.

        Both compute profiles dynamically register ``tooling`` on their own local
        resident. If the profile is transitioning, its target is missing, or its
        alias was deleted by backend-sync, ordinary keys use CloudBlue Luna and then
        e-dani Luna. A key with fallbacks disabled receives 503 as soon as the local
        target is unavailable.
        """
        state = await _compute_mode_state()
        resolved, route_state, reason = _tooling_route_for_state(
            state, _alias_has_deployments, disable_fallbacks=disable_fallbacks
        )
        if resolved:
            return resolved, route_state
        raise HTTPException(
            status_code=503,
            headers={"Retry-After": str(COMPUTE_MODE_RETRY_AFTER_SECONDS)},
            detail={
                "error": "tooling profile target is unavailable",
                "blocked": reason,
                "target": _tooling_target_for_compute_mode(state)[0],
                "fallbacks": [] if disable_fallbacks else list(TOOLING_LUNA_FALLBACKS),
                "fallbacks_disabled": disable_fallbacks,
                "desired_mode": (state or {}).get("desired_mode"),
                "effective_mode": (state or {}).get("effective_mode"),
                "phase": (state or {}).get("phase"),
            },
        )

    # Health de los backends abliterados, en cache y FAIL-CLOSED.
    #
    # POR QUE NO VALE `_alias_has_deployments`: pregunta por el REGISTRO en el router
    # y falla abierto. Con `store_model_in_db: false` el registro viene de git, asi
    # que un alias declarado responde "si" incluso con su Deployment a 0 replicas.
    # Para `tooling` eso da igual -- tiene `fallbacks` a Luna a nivel de router, que
    # atrapan el error. La ruta abliterada NO tiene esa red a proposito, asi que su
    # unica alternativa a un health real es un 500.
    #
    # FAIL-CLOSED, al contrario que todo lo demas de este hook: si no se puede
    # confirmar que el backend abliterado esta arriba, se responde 503 con
    # `Retry-After`. Un 503 es reintentable y dice la verdad; un 500 no, y contestar
    # desde otro sitio seria servir censurado a quien pidio lo contrario.
    ABLITERATED_HEALTH_URLS = {
        "deepseek-v4-flash-0731-uncensored":
            "http://deepseek-v4-flash-0731.llm.svc.cluster.local:8000/health",
        "qwen38-27b-uncensored":
            "http://vllm-qwen38-27b-uncensored.llm.svc.cluster.local:8000/health",
    }
    ABLITERATED_HEALTH_TIMEOUT_SECONDS = float(
        os.environ.get("LITELLM_ABLITERATED_HEALTH_TIMEOUT_SECONDS", "2.0")
    )
    # TTL corto: la ventana de un cambio de perfil se mide en minutos, y una entrada
    # rancia aqui significa 500 en vez de 503 durante ese hueco.
    ABLITERATED_HEALTH_CACHE_SECONDS = float(
        os.environ.get("LITELLM_ABLITERATED_HEALTH_CACHE_SECONDS", "10.0")
    )
    _abliterated_health_cache: dict[str, tuple[float, bool]] = {}
    _abliterated_health_lock = asyncio.Lock()

    async def _abliterated_target_ready(target):
        """(ready, reason) del backend abliterado `target`. Cacheado, fail-closed."""
        url = ABLITERATED_HEALTH_URLS.get(target)
        if not url:
            # Un destino nuevo sin URL de health declarada NO se sirve a ciegas: es
            # justo el descuido que este bloque existe para cazar.
            return False, "abliterated_health_url_missing"

        now = time.monotonic()
        cached = _abliterated_health_cache.get(target)
        if cached and now < cached[0]:
            return cached[1], None if cached[1] else "abliterated_backend_not_ready"

        async with _abliterated_health_lock:
            cached = _abliterated_health_cache.get(target)
            now = time.monotonic()
            if cached and now < cached[0]:
                return cached[1], None if cached[1] else "abliterated_backend_not_ready"
            ready = False
            try:
                async with httpx.AsyncClient(
                    timeout=ABLITERATED_HEALTH_TIMEOUT_SECONDS
                ) as client:
                    response = await client.get(url)
                ready = response.status_code < 400
            except Exception as exc:
                log.warning("abliterated health probe failed for %s: %s", target, exc)
            _abliterated_health_cache[target] = (
                now + ABLITERATED_HEALTH_CACHE_SECONDS,
                ready,
            )
            return ready, None if ready else "abliterated_backend_not_ready"

    async def _resolve_tooling_uncensored():
        """Resolve `tooling-uncensored` to the live resident's abliterated name.

        DELIBERATELY WITHOUT THE LUNA NET that `_resolve_tooling_profile` has. Luna
        is a cloud model WITH its guardrails on: degrading here would answer a
        request that explicitly asked for no refusal from a censored model, HTTP 200
        and no warning. The whole point of this alias is the seal, and a fallback
        that cannot carry it must not be reached. A 503 is the correct answer.
        """
        state = await _compute_mode_state()
        target, reason = _tooling_uncensored_target(state)
        if target:
            # NO se usa `_alias_has_deployments` aqui, y es el arreglo del 19-08.
            # Esa funcion pregunta si el alias esta REGISTRADO en el router y ademas
            # falla ABIERTO. Con `store_model_in_db: false` el registro sale de git,
            # asi que un alias declarado esta siempre registrado -- tambien cuando su
            # backend esta a 0 replicas. Resultado medido: la rama del 503 no se
            # alcanzaba nunca y la peticion salia a un Service que rechaza conexiones,
            # devolviendo **HTTP 500** en vez del 503 con Retry-After que este
            # docstring prometia. Aqui hace falta SALUD, no registro.
            ready, reason = await _abliterated_target_ready(target)
            if ready:
                return target, "primary"
        raise HTTPException(
            status_code=503,
            headers={"Retry-After": str(COMPUTE_MODE_RETRY_AFTER_SECONDS)},
            detail={
                "error": "tooling-uncensored profile target is unavailable",
                "blocked": reason or "compute_profile_target_unavailable",
                "target": target,
                # Sin fallbacks a proposito: ver el docstring.
                "fallbacks": [],
                "desired_mode": (state or {}).get("desired_mode"),
                "effective_mode": (state or {}).get("effective_mode"),
                "phase": (state or {}).get("phase"),
            },
        )

    def _usage_snapshot(usage):
        if isinstance(usage, dict):
            return dict(usage)
        if hasattr(usage, "model_dump"):
            return usage.model_dump()
        return {
            name: getattr(usage, name)
            for name in (
                "prompt_tokens",
                "completion_tokens",
                "input_tokens",
                "output_tokens",
            )
            if getattr(usage, name, None) is not None
        }

    def _preserve_live_usage_chunks():
        """Keep provider usage across LiteLLM 1.85 chunk sanitization."""
        original = CustomStreamWrapper.chunk_creator
        if getattr(original, "_active_request_usage_patch", False):
            return

        def wrapped(self, *args, **kwargs):
            chunk = original(self, *args, **kwargs)
            if chunk is None:
                return None
            usage = getattr(chunk, "usage", None)
            hidden_params = getattr(chunk, "_hidden_params", None)
            if usage is not None and isinstance(hidden_params, dict):
                hidden_params["live_usage"] = _usage_snapshot(usage)
            return chunk

        wrapped._active_request_usage_patch = True
        CustomStreamWrapper.chunk_creator = wrapped

    _preserve_live_usage_chunks()

    # Infinity/TEI rerank compatibility patches.
    _original_transform_request = InfinityRerankConfig.transform_rerank_request

    def _tei_transform_rerank_request(self, model, optional_rerank_params, headers, *args, **kwargs):
        return _original_transform_request(self, model, optional_rerank_params, headers, *args, **kwargs)

    def _tei_transform_rerank_response(
        self, model, raw_response, model_response, logging_obj,
        api_key=None, request_data={}, optional_params={}, litellm_params={},
    ):
        raw = raw_response.json()
        if isinstance(raw, list):
            raw = {
                "results": [
                    {
                        "index": r["index"],
                        "relevance_score": r.get("relevance_score", r.get("score", 0)),
                    }
                    for r in raw
                ]
            }
        results = raw.get("results", [])
        rerank_results = [
            RerankResponseResult(
                index=int(r["index"]),
                relevance_score=float(r.get("relevance_score", r.get("score", 0))),
            )
            for r in results
        ]
        usage = raw.get("usage", {})
        return RerankResponse(
            id=raw.get("id") or str(uuid.uuid4()),
            results=rerank_results,
            meta=RerankResponseMeta(
                billed_units=RerankBilledUnits(total_tokens=usage.get("total_tokens", 0)),
                tokens=RerankTokens(input_tokens=usage.get("prompt_tokens", 0)),
            ),
        )

    InfinityRerankConfig.transform_rerank_request = _tei_transform_rerank_request
    InfinityRerankConfig.transform_rerank_response = _tei_transform_rerank_response

    ACTIVE_FILE = os.environ.get("LITELLM_ACTIVE_FILE", "/shared/tracking/active_requests.json")
    STALE_THRESHOLD = int(os.environ.get("LITELLM_ACTIVE_STALE_AFTER_SEC", "900"))
    request_tracker = ActiveRequestTracker(
        ACTIVE_FILE,
        stale_threshold=STALE_THRESHOLD,
    )

    # ── Dial de la proyeccion rank-1: AQUI vive la configuracion ────────────────
    #
    # El vLLM sigue siendo quien APLICA la proyeccion: es su competencia y no se
    # puede mover. Lo que vive AQUI es la CONFIGURACION — que runtimes tienen dial,
    # en que URL admin se ajusta cada uno, y cual es su lambda de referencia medida.
    # LiteLLM es quien enruta los alias a esos heads y quien sella cada
    # peticion, asi que es el unico proceso donde ese mapa esta completo. El panel
    # DGX lo lee y lo escribe por /admin/refusal-state y /admin/refusal-dial; ya no
    # habla con los heads ni repite la lista por su cuenta.
    #
    # LOS DOS RUNTIMES NO COMPARTEN EL VALOR DE ENCENDIDO. Ese es el motivo de que
    # esto sea una LISTA y no el escalar unico que habia antes:
    #
    #   deepseek-v4-flash-0731  on=1.5  Medido sobre 10 disparadores de rechazo + 4
    #                                   controles: lambda=1 todavia rechaza 5-7/10
    #                                   — NO es "sin censura"; 1.5 rechaza 0/10 y no
    #                                   cuesta calidad (acceptance 0,5647 frente a
    #                                   0,5661 del base).
    #   qwen38-27b-nvfp4        on=1.0  1.0 reproduce el perfil POR CAPA del
    #                                   checkpoint Ektome horneado. Ni el mismo
    #                                   numero ni la misma escala que el de arriba.
    #
    # Un escalar global degradaria DeepSeek de 1.5 a 1.0 en silencio, que es el peor
    # fallo posible aqui: el panel diria "uncensored" y el modelo seguiria
    # rechazando la mitad de las veces.
    REFUSAL_RUNTIMES_DEFAULT = [
        {
            "key": "deepseek-v4-flash-0731",
            "label": "DeepSeek-V4-Flash (TP=2)",
            "admin_url": "http://deepseek-v4-flash-0731.llm.svc.cluster.local:8000"
                         "/admin/refusal_lambda",
            # Se compara contra el api_base VIVO del router, en minusculas y por
            # subcadena: asi los alias que inyecta el sync dinamico entran solos.
            "api_base_match": "deepseek-v4-flash",
            "on_lambda": 1.5,
        },
        {
            "key": "qwen38-27b-nvfp4",
            "label": "Qwen3.8-27B NVFP4 (dense)",
            # El Service publica 8000 aunque el contenedor sirva en 8888: la URL
            # es la del Service, no la del pod.
            "admin_url": "http://vllm-qwen38-27b-uncensored.llm.svc.cluster.local:8000"
                         "/admin/refusal_lambda",
            "api_base_match": "vllm-qwen38-27b-uncensored",
            "on_lambda": 1.0,
        },
    ]


    def _load_refusal_runtimes():
        """Registro efectivo. El env override es JSON con la MISMA forma."""
        raw = os.environ.get("LITELLM_REFUSAL_RUNTIMES", "").strip()
        if not raw:
            return list(REFUSAL_RUNTIMES_DEFAULT)
        try:
            parsed = json.loads(raw)
            out = []
            for item in parsed:
                # key y admin_url son obligatorios: sin ellos la entrada no puede
                # ni sellar ni conmutar. on_lambda tiene default 1.0, pero una
                # entrada SIN on_lambda explicito es sospechosa — se avisa.
                if not (item.get("key") and item.get("admin_url")):
                    log.warning("refusal runtime sin key/admin_url, ignorada: %s", item)
                    continue
                if "on_lambda" not in item:
                    log.warning("refusal runtime %s sin on_lambda: se asume 1.0",
                                item.get("key"))
                out.append({
                    "key": str(item["key"]),
                    "label": str(item.get("label") or item["key"]),
                    "admin_url": str(item["admin_url"]),
                    "api_base_match": str(item.get("api_base_match") or "").lower(),
                    "on_lambda": float(item.get("on_lambda", 1.0)),
                })
            # Una lista vacia apagaria el sellado ENTERO sin decirlo. Se prefiere el
            # default horneado a quedarse sin dial por un JSON mal escrito.
            if out:
                return out
            log.warning("LITELLM_REFUSAL_RUNTIMES no dejo ninguna entrada valida")
        except Exception as exc:  # noqa: BLE001
            log.warning("LITELLM_REFUSAL_RUNTIMES ilegible (%s): se usa el default",
                        type(exc).__name__)
        return list(REFUSAL_RUNTIMES_DEFAULT)


    REFUSAL_RUNTIMES = _load_refusal_runtimes()
    REFUSAL_RUNTIMES_BY_KEY = {r["key"]: r for r in REFUSAL_RUNTIMES}

    # El modo es GLOBAL por runtime y conmutable en caliente, asi que "esta activado
    # ahora" no dice nada sobre una peticion de hace un rato. Se sella al empezar.
    #
    # Cacheado con TTL corto: leerlo por peticion metria una llamada HTTP en el
    # camino critico de CADA request. El TTL es la ventana de ambiguedad — si el
    # modo cambia justo dentro de ella, alguna peticion queda sellada con el valor
    # anterior. 5 s es despreciable frente a lo que dura una peticion de estos
    # modelos.
    REFUSAL_TTL_S = float(os.environ.get("LITELLM_REFUSAL_TTL_S", "5"))
    # 8 s, no 1.5. Este endpoint NO es como /health (0,11 s): consulta a TODOS los
    # ranks TP y se pone a la cola detras del trabajo del motor, asi que con trafico
    # real tarda 3,7-7,0 s (medido 13-08-2026 con 2 peticiones corriendo y 2
    # esperando). Con 1.5 s NUNCA respondia a tiempo y el sellado quedaba
    # permanentemente a None sin que nada lo delatara — justo el modo de fallo
    # silencioso que se intentaba evitar. El coste esta acotado por el TTL: como
    # mucho una espera por ventana de 5 s, y en el camino de la peticion es `await`,
    # asi que no bloquea a nadie mas.
    REFUSAL_TIMEOUT_S = float(os.environ.get("LITELLM_REFUSAL_TIMEOUT_S", "8"))
    # UNA ENTRADA DE CACHE POR RUNTIME. Con un solo dict compartido (lo que habia
    # cuando solo DeepSeek tenia dial) la primera lectura ganaba el TTL y las
    # peticiones del OTRO modelo se sellaban con SU lambda: un numero equivocado en
    # la tarjeta, que es peor que no tener numero.
    #
    # `reason` explica POR QUE no hay valor. Sin el, una peticion sin sellar y un
    # head caido son indistinguibles desde fuera, que es justo la duda que aparece
    # cuando en el panel falta la insignia de lambda.
    _refusal_cache = {
        r["key"]: {"ts": 0.0, "value": None, "reason": "never_read"}
        for r in REFUSAL_RUNTIMES
    }
    _refusal_lock = threading.Lock()


    def _refusal_slot(rt_key):
        """Entrada de cache del runtime. Se crea al vuelo si el registro cambio."""
        slot = _refusal_cache.get(rt_key)
        if slot is None:
            slot = {"ts": 0.0, "value": None, "reason": "never_read"}
            _refusal_cache[rt_key] = slot
        return slot


    def _refusal_lambda_now(rt):
        """Lambda actual de ESE head, o None si no se pudo leer. NUNCA lanza."""
        now = time.time()
        with _refusal_lock:
            slot = _refusal_slot(rt["key"])
            if now - slot["ts"] < REFUSAL_TTL_S:
                return slot["value"]
            slot["ts"] = now
        try:
            # httpx y no urllib: ya esta importado y es el cliente que usa el resto
            # del hook. Version SINCRONA: solo para la ruta de diagnostico
            # /admin/refusal-state, que corre en el threadpool de FastAPI. El camino
            # de la peticion usa _refusal_lambda_now_async.
            body = httpx.get(rt["admin_url"], timeout=REFUSAL_TIMEOUT_S).json()
            return _apply_refusal_cache(
                rt["key"], *_parse_refusal_body(body), raw=body
            )
        except Exception as exc:  # noqa: BLE001
            return _apply_refusal_cache(
                rt["key"], None, "head_unreachable: {}".format(type(exc).__name__)
            )


    def _apply_refusal_cache(rt_key, value, reason, raw=None):
        with _refusal_lock:
            slot = _refusal_slot(rt_key)
            slot["value"] = value
            slot["reason"] = reason
            # El cuerpo entero: `consistent` y `per_rank` los quiere el panel y no
            # se pueden reconstruir desde el numero. En un fallo se deja el ultimo
            # cuerpo bueno fuera — mejor sin datos que con datos de otra lectura.
            slot["raw"] = raw if isinstance(raw, dict) else None
        return value


    def _invalidate_refusal_cache(rt_key):
        """Tras conmutar el dial, la entrada cacheada ya no vale."""
        with _refusal_lock:
            _refusal_slot(rt_key)["ts"] = 0.0


    def _parse_refusal_body(body):
        """(value, reason) a partir del cuerpo del endpoint admin. No lanza."""
        v = body.get("lambda")
        # consistent:false = los ranks TP no coinciden. Sellar un numero ahi seria
        # mentir sobre como se sirvio: se deja sin sellar. En un runtime de un solo
        # rank el campo no viene y None NO es False: eso no bloquea el sellado.
        if body.get("consistent") is False:
            return None, "tp_inconsistent"
        if v is None:
            return None, "no_lambda_field"
        return float(v), None


    async def _refusal_lambda_now_async(rt):
        """Igual que _refusal_lambda_now pero SIN bloquear el event loop.

        Esto lo llama async_pre_call_hook, que es `async def`: un httpx.get sincrono
        ahi congela el proxy ENTERO durante lo que tarde la respuesta — y este
        endpoint tarda segundos bajo carga. Mismo patron que _compute_mode_state.
        """
        now = time.time()
        with _refusal_lock:
            slot = _refusal_slot(rt["key"])
            if now - slot["ts"] < REFUSAL_TTL_S:
                return slot["value"]
            slot["ts"] = now
        try:
            async with httpx.AsyncClient(timeout=REFUSAL_TIMEOUT_S) as client:
                body = (await client.get(rt["admin_url"])).json()
            return _apply_refusal_cache(
                rt["key"], *_parse_refusal_body(body), raw=body
            )
        except Exception as exc:  # noqa: BLE001
            return _apply_refusal_cache(
                rt["key"], None, "head_unreachable: {}".format(type(exc).__name__)
            )


    # Que alias sirve HOY cada head con dial. Se pregunta al router EN MEMORIA (es
    # el mismo proceso, no hay HTTP) y se cachea: la lista solo cambia cuando el sync
    # dinamico reescribe el model_list.
    _alias_runtime_cache = {"ts": 0.0, "map": {}}
    _ALIAS_RUNTIME_TTL_S = 60.0


    def _alias_runtime_map():
        """alias -> key de runtime con dial, segun el api_base VIVO. Nunca lanza."""
        now = time.time()
        if now - _alias_runtime_cache["ts"] >= _ALIAS_RUNTIME_TTL_S:
            try:
                from litellm.proxy.proxy_server import llm_router
                mapping = {}
                for d in (getattr(llm_router, "model_list", None) or []):
                    name = str(d.get("model_name") or "")
                    if not name:
                        continue
                    api_base = str(
                        (d.get("litellm_params") or {}).get("api_base") or ""
                    ).lower()
                    for rt in REFUSAL_RUNTIMES:
                        match = rt.get("api_base_match")
                        if match and match in api_base:
                            mapping[name] = rt["key"]
                            break
                # Mapa vacio = el router aun no esta listo. Se conserva lo ultimo
                # conocido en vez de vaciarlo, que apagaria el sellado entero.
                if mapping:
                    _alias_runtime_cache["map"] = mapping
            except Exception:  # noqa: BLE001
                pass
            _alias_runtime_cache["ts"] = now
        return _alias_runtime_cache["map"]


    def _refusal_runtime_for(model, api_base):
        """Runtime con dial que atiende ese alias, o None. Nunca lanza.

        Se mira el MODELO y no solo el api_base: en el pre_call_hook `api_base`
        viene None salvo que lo mande el cliente (lo resuelve el router, DESPUES).
        Filtrar por api_base ahi dejaba el sello a None SIEMPRE — y el fallo era mudo
        porque "no sellar" es la salida prevista cuando no se puede leer el estado.
        """
        haystack = "{} {}".format(model or "", api_base or "").lower()
        for rt in REFUSAL_RUNTIMES:
            match = rt.get("api_base_match")
            if match and match in haystack:
                return rt
        # El nombre tampoco basta: `agent`, `high`, `max`, `tooling`, `dense`...
        # los sirven estos heads y no los mencionan. Filtrar solo por nombre sellaba
        # unicamente a quien pedia el alias literal: 8 de 723 filas, todas de
        # pruebas. El trafico real usa alias.
        #
        # Y por eso NO vale una lista fija de nombres: `tooling`/`dense` cambian de
        # head con el perfil de computo (creative -> Qwen3.8, llm-tp -> DeepSeek).
        # Sellar por lista seria mentir sobre que modelo contesto en cuanto el
        # arbitro conmuta. Se resuelve por el api_base vivo del router.
        return REFUSAL_RUNTIMES_BY_KEY.get(_alias_runtime_map().get(str(model or "")))


    async def _refusal_lambda_for_async(model, api_base):
        """(lambda, key del runtime) para esa peticion. (None, None) si no aplica."""
        rt = _refusal_runtime_for(model, api_base)
        if rt is None:
            return None, None
        return await _refusal_lambda_now_async(rt), rt["key"]


    # ── El dial por el propio proxy: leer Y CONMUTAR ─────────────────────────────
    #
    # Dos rutas. La de lectura no contesta "que hay en el vLLM" sino la pregunta que
    # el panel necesita de verdad: QUE VA A SELLAR LiteLLM y SOBRE QUE ALIAS. Si un
    # head no responde, sus alias dejan de sellarse mientras los del otro runtime
    # siguen — sin esto esa asimetria no se ve por ningun lado.
    #
    # La de escritura existe para que el panel NO tenga que hablar con los heads:
    # el mapa de runtimes, el valor de encendido de cada uno y el tope viven aqui,
    # en un sitio solo. El panel manda `enabled` y ni siquiera necesita saber si el
    # encendido de ese modelo es 1.0 o 1.5.
    #
    # SOLO MASTER KEY / PROXY_ADMIN, y no es configurable desde aqui: LiteLLM
    # clasifica las rutas por pertenencia EXPLICITA a sus listas (openai_routes,
    # info_routes, management_routes...). Una ruta que no esta en ninguna cae al
    # default-deny final de `non_proxy_admin_allowed_routes_check` -> 403 para
    # cualquier key virtual. Renombrar el path no lo arregla (no va por prefijo);
    # habria que inyectarlo en las listas internas de litellm, que no compensa. El
    # dashboard ya llama con la master key (LITELLM_MASTER_KEY), como en
    # /internal/active-requests.
    REFUSAL_STATE_PATH = "/admin/refusal-state"
    REFUSAL_DIAL_PATH = "/admin/refusal-dial"
    # Rango experimental expuesto por el panel. 0 = checkpoint base; los valores
    # de `on_lambda` siguen siendo las referencias medidas, no presets forzosos.
    # Por encima de 1.5 DeepSeek entra en una zona no validada y puede degradar,
    # pero 2.5 permite barrer alrededor del checkpoint horneado (~2.43) sin abrir
    # el control hasta el limite interno mas amplio del runtime (4.0).
    REFUSAL_MIN_LAMBDA = 0.0
    REFUSAL_MAX_LAMBDA = float(os.environ.get("LITELLM_REFUSAL_MAX_LAMBDA", "2.5"))


    def _refusal_fleet_name(rt):
        """Nombre con el que el panel conoce a ese runtime en la flota.

        Se DERIVA del host del admin_url (`vllm-qwen38-27b-uncensored.llm.svc...`
        -> `vllm-qwen38-27b-uncensored`) en vez de repetirlo a mano: si alguien
        repunta un runtime a otro head, la chapa del panel se mueve con el. Es la
        regla que ya usaba el dashboard cuando el dial era de un solo modelo.
        """
        host = rt["admin_url"].split("//", 1)[-1].split("/", 1)[0].split(":", 1)[0]
        return host.split(".")[0]


    def _refusal_aliases_by_runtime():
        """key de runtime -> alias que enruta ahi AHORA, para que el panel lo diga."""
        out = {r["key"]: [] for r in REFUSAL_RUNTIMES}
        for alias, key in _alias_runtime_map().items():
            out.setdefault(key, []).append(alias)
        for key in out:
            out[key] = sorted(out[key])
        return out


    def _refusal_runtime_state(rt, aliases):
        """Estado publicado de un runtime. Lee de la cache; no toca la red."""
        # Los campos, en la MISMA toma del lock: leerlos por separado podria mezclar
        # dos refrescos y dar un motivo que no corresponde al valor.
        with _refusal_lock:
            slot = _refusal_slot(rt["key"])
            lam = slot["value"]
            reason = slot["reason"]
            ts = slot["ts"]
            raw = slot.get("raw") or {}
        return {
            "key": rt["key"],
            "label": rt["label"],
            # Nombre EXACTO del runtime en la flota: el panel casa por igualdad, no
            # por prefijo — con substring, `deepseek-v4-flash-0731-unc` casaria con
            # `deepseek-v4-flash-0731`.
            "fleet_name": _refusal_fleet_name(rt),
            "lambda": lam,
            # None NO es False: es "no se pudo leer".
            "enabled": None if lam is None else lam > 0,
            # Valor de encendido de ESTE runtime. No es global: DeepSeek necesita
            # 1.5 y Qwen3.8 se enciende con 1.0.
            "on_lambda": rt["on_lambda"],
            "min_lambda": REFUSAL_MIN_LAMBDA,
            "max_lambda": REFUSAL_MAX_LAMBDA,
            # lo que de verdad se pregunta: ¿las peticiones llevaran sello?
            "stamping": lam is not None,
            "reason": reason,
            # `consistent` = todos los ranks TP reportan el mismo valor. En un
            # runtime de UN SOLO rank el campo no viene: None es "no aplica", no
            # es un fallo, y el panel no puede exigirlo.
            "consistent": raw.get("consistent"),
            "per_rank": raw.get("per_rank"),
            # Los alias que hoy enrutan a este head. Es la respuesta a "y esto a
            # que afecta", que con `tooling`/`dense` cambiando de head segun el
            # perfil de computo no se puede adivinar desde fuera.
            "aliases": aliases.get(rt["key"], []),
            "admin_url": rt["admin_url"],
            "cache_age_s": round(time.time() - ts, 2),
            "ttl_s": REFUSAL_TTL_S,
            "source": "litellm-hook-cache",
        }


    def _refusal_lambda_from_payload(payload, rt):
        """Normaliza el dial numerico; `enabled` queda solo para rollouts mixtos."""
        if payload.get("lambda") is not None:
            raw = payload["lambda"]
        elif "enabled" in payload:
            # Compatibilidad de despliegue: una UI antigua puede convivir unos
            # minutos con este backend nuevo. Los clientes nuevos nunca usan esto.
            raw = rt["on_lambda"] if payload.get("enabled") else 0.0
        else:
            raise ValueError("falta `lambda` (numero)")
        try:
            lam = float(raw)
        except (TypeError, ValueError) as exc:
            raise ValueError("lambda no es un numero") from exc
        # Esta forma tambien rechaza NaN: ambas comparaciones serian falsas.
        if not (REFUSAL_MIN_LAMBDA <= lam <= REFUSAL_MAX_LAMBDA):
            raise ValueError("lambda fuera de rango [{}, {}]".format(
                REFUSAL_MIN_LAMBDA, REFUSAL_MAX_LAMBDA))
        return lam


    def _register_refusal_routes():
        from fastapi import Body, Depends, HTTPException as _HTTPException
        from litellm.proxy.proxy_server import app
        from litellm.proxy.auth.user_api_key_auth import user_api_key_auth

        # Starlette NO deduplica rutas: si el config recarga y este modulo se
        # reimporta, se apilaria una segunda copia identica.
        existing = {getattr(r, "path", None) for r in app.router.routes}

        if REFUSAL_STATE_PATH not in existing:
            # `def` y NO `async def` a proposito: _refusal_lambda_now hace un
            # httpx.get BLOQUEANTE. FastAPI corre las rutas sincronas en su
            # threadpool, asi que una consulta de estado no puede parar el event
            # loop del proxy.
            @app.get(REFUSAL_STATE_PATH, tags=["admin"],
                     dependencies=[Depends(user_api_key_auth)])
            def _refusal_state():
                aliases = _refusal_aliases_by_runtime()
                runtimes = []
                for rt in REFUSAL_RUNTIMES:
                    # refresca si vencio el TTL; el valor se lee de la cache abajo
                    _refusal_lambda_now(rt)
                    runtimes.append(_refusal_runtime_state(rt, aliases))
                return {
                    "runtimes": runtimes,
                    # Un head caido NO es un fallo de esta ruta: DeepSeek vive a 0
                    # replicas fuera del perfil llm-tp. Se reporta cuantos hablan.
                    "reachable": sum(1 for r in runtimes if r["stamping"]),
                    "total": len(runtimes),
                    "source": "litellm-hook-cache",
                }

        if REFUSAL_DIAL_PATH not in existing:
            @app.post(REFUSAL_DIAL_PATH, tags=["admin"],
                      dependencies=[Depends(user_api_key_auth)])
            async def _refusal_dial(payload: dict = Body(...)):
                key = str(payload.get("runtime") or "").strip()
                rt = REFUSAL_RUNTIMES_BY_KEY.get(key)
                if rt is None:
                    raise _HTTPException(status_code=404, detail={
                        "error": "runtime desconocido: {!r}".format(key),
                        "known": sorted(REFUSAL_RUNTIMES_BY_KEY),
                    })
                try:
                    lam = _refusal_lambda_from_payload(payload, rt)
                except ValueError as exc:
                    raise _HTTPException(status_code=400, detail={
                        "error": str(exc),
                        "requested": payload.get("lambda"),
                    })

                try:
                    async with httpx.AsyncClient(timeout=REFUSAL_TIMEOUT_S) as client:
                        r = await client.post(rt["admin_url"], json={"lambda": lam})
                        r.raise_for_status()
                        # Releer en vez de fiarse del POST: el endpoint de vLLM
                        # confirma que TODOS los ranks aplicaron el valor, y esa es
                        # la garantia que importa.
                        g = await client.get(rt["admin_url"])
                        g.raise_for_status()
                        body = g.json()
                except Exception as exc:  # noqa: BLE001
                    # El head cae con cada cambio de modo del arbitro de GPU y tarda
                    # ~8 min en cargar. Eso NO es un error del proxy: 503.
                    _invalidate_refusal_cache(rt["key"])
                    raise _HTTPException(status_code=503, detail={
                        "error": "{}: {}".format(type(exc).__name__, exc),
                        "runtime": rt["key"],
                        "hint": "el head no responde: puede estar cargando (~8 min) "
                                "o el perfil de computo no incluirlo",
                    })

                _apply_refusal_cache(rt["key"], *_parse_refusal_body(body), raw=body)
                with _refusal_lock:
                    _refusal_slot(rt["key"])["ts"] = time.time()
                state = _refusal_runtime_state(rt, _refusal_aliases_by_runtime())
                if state.get("consistent") is False:
                    raise _HTTPException(status_code=500, detail={
                        "error": "los ranks TP no aplicaron el mismo lambda",
                        "per_rank": state.get("per_rank"),
                    })
                return state


    # Envuelto entero: esto corre en el modulo del hook, que esta en el camino de
    # TODAS las peticiones. Unas rutas de control no pueden impedir que arranque el
    # proxy.
    try:
        _register_refusal_routes()
    except Exception as exc:  # noqa: BLE001
        log.warning("no se pudieron registrar las rutas del dial: %s", exc)


    # LiteLLM 1.96 valida `model_info` contra su propio ModelInfo al construir la
    # respuesta de /model/info. Eso elimina campos nuevos del catalogo y, ademas,
    # vuelve a calcular algunos flags con su base de datos interna. El router SI
    # conserva el model_info original: lo reponemos en la respuesta existente para
    # que el catalogo configurado siga siendo la fuente de verdad. No hay tabla de
    # modelos ni conocimiento de OpenCode aqui; futuras capacidades de effort se
    # publican con la misma convencion sin cambiar este hook.
    MODEL_INFO_PATHS = frozenset({"/model/info", "/v1/model/info"})


    def _reasoning_effort_capabilities(model_info):
        if not isinstance(model_info, dict):
            return {}
        return {
            key: value
            for key, value in model_info.items()
            if key == "supported_reasoning_efforts"
            or (key.startswith("supports_") and "reasoning_effort" in key)
        }


    def _merge_catalog_reasoning_capabilities(payload, model_list):
        catalog = {}
        for deployment in model_list or ():
            if not isinstance(deployment, dict):
                continue
            name = deployment.get("model_name")
            capabilities = _reasoning_effort_capabilities(
                deployment.get("model_info")
            )
            if name and capabilities:
                catalog.setdefault(str(name), {}).update(capabilities)

        items = payload.get("data") if isinstance(payload, dict) else payload
        if not isinstance(items, list):
            return payload
        for item in items:
            if not isinstance(item, dict):
                continue
            capabilities = catalog.get(str(item.get("model_name") or ""))
            if not capabilities:
                continue
            info = item.get("model_info")
            if not isinstance(info, dict):
                info = {}
                item["model_info"] = info
            info.update(capabilities)
        return payload


    def _register_model_info_capabilities_middleware():
        from litellm.proxy.proxy_server import app, llm_router
        from starlette.responses import Response

        # El modulo puede reimportarse si se recarga la configuracion. Una sola
        # capa basta y evita consumir/recrear dos veces el mismo body.
        state_key = "catalog_reasoning_capabilities_middleware"
        if getattr(app.state, state_key, False):
            return
        setattr(app.state, state_key, True)

        @app.middleware("http")
        async def _preserve_catalog_reasoning_capabilities(request, call_next):
            response = await call_next(request)
            if (
                request.url.path not in MODEL_INFO_PATHS
                or response.status_code != 200
                or "application/json" not in response.headers.get("content-type", "")
            ):
                return response
            try:
                body = b"".join([chunk async for chunk in response.body_iterator])
                payload = json.loads(body)
                _merge_catalog_reasoning_capabilities(
                    payload, getattr(llm_router, "model_list", None)
                )
                encoded = json.dumps(payload, separators=(",", ":")).encode()
                headers = dict(response.headers)
                headers.pop("content-length", None)
                return Response(
                    content=encoded,
                    status_code=response.status_code,
                    headers=headers,
                    background=response.background,
                )
            except Exception as exc:  # noqa: BLE001
                # No convertir una respuesta valida en un 500 por metadatos. Si
                # alguna version futura cambia el response, devolvemos el body
                # original y dejamos evidencia clara en el log.
                log.warning("no se pudo completar /model/info: %s", exc)
                return Response(
                    content=locals().get("body", b""),
                    status_code=response.status_code,
                    headers=dict(response.headers),
                    background=response.background,
                )


    try:
        _register_model_info_capabilities_middleware()
    except Exception as exc:  # noqa: BLE001
        log.warning("no se pudo preservar el catalogo de /model/info: %s", exc)


    def _track_end(request_id):
        request_tracker.end(request_id)

    def _litellm_trace_id(data):
        logging_obj = data.get("litellm_logging_obj")
        candidates = [getattr(logging_obj, "litellm_trace_id", None)]
        model_call_details = getattr(logging_obj, "model_call_details", None)
        if isinstance(model_call_details, dict):
            candidates.append(model_call_details.get("litellm_trace_id"))
            details_metadata = model_call_details.get("metadata")
            if isinstance(details_metadata, dict):
                candidates.append(details_metadata.get("litellm_trace_id"))
        for candidate in candidates:
            value = str(candidate or "").strip()
            if value:
                return value
        return None

    def _metadata_candidates(payload):
        if not isinstance(payload, dict):
            return []

        candidates = [
            payload.get("metadata"),
            payload.get("litellm_metadata"),
        ]

        litellm_params = payload.get("litellm_params")
        if isinstance(litellm_params, dict):
            candidates.extend(
                [
                    litellm_params.get("metadata"),
                    litellm_params.get("litellm_metadata"),
                ]
            )

        return [m for m in candidates if isinstance(m, dict)]

    def _tracking_id_candidates(payload, max_depth=5):
        seen = set()

        def walk(obj, depth):
            if depth > max_depth:
                return
            obj_id = id(obj)
            if obj_id in seen:
                return
            seen.add(obj_id)

            if isinstance(obj, dict):
                tracking_id = obj.get("_tracking_id")
                if tracking_id:
                    yield tracking_id
                for metadata in _metadata_candidates(obj):
                    tracking_id = metadata.get("_tracking_id")
                    if tracking_id:
                        yield tracking_id
                for value in obj.values():
                    if isinstance(value, (dict, list, tuple)):
                        yield from walk(value, depth + 1)
            elif isinstance(obj, (list, tuple)):
                for value in obj:
                    if isinstance(value, (dict, list, tuple)):
                        yield from walk(value, depth + 1)

        yield from walk(payload, 0)

    def _tracking_id_from_payload(payload):
        for tracking_id in _tracking_id_candidates(payload):
            return tracking_id
        return None

    def _backend_from_payload(payload, max_depth=6):
        """Find the exact vLLM deployment selected by LiteLLM."""
        seen = set()

        def walk(value, depth, inherited_model=None):
            if depth > max_depth:
                return None
            value_id = id(value)
            if value_id in seen:
                return None
            seen.add(value_id)

            if isinstance(value, dict):
                model = (
                    value.get("model")
                    or value.get("model_name")
                    or inherited_model
                )
                for name in ("api_base", "base_url"):
                    api_base = value.get(name)
                    if resolve_server_id(model, api_base):
                        return model, api_base
                for nested in value.values():
                    if isinstance(nested, (dict, list, tuple)):
                        found = walk(nested, depth + 1, model)
                        if found:
                            return found
            elif isinstance(value, (list, tuple)):
                for nested in value:
                    if isinstance(nested, (dict, list, tuple)):
                        found = walk(nested, depth + 1, inherited_model)
                        if found:
                            return found
            return None

        return walk(payload, 0)

    def _update_tracking_from_payload(
        payload,
        response_obj=None,
        *,
        force_flush=False,
    ):
        tracking_id = _tracking_id_from_payload(payload)
        if not tracking_id:
            return None

        backend = _backend_from_payload(payload)
        if backend:
            model, api_base = backend
            request_tracker.update_backend(
                tracking_id,
                model=model,
                api_base=api_base,
            )

        prompt_tokens, completion_tokens = usage_from_response(response_obj)
        if prompt_tokens is not None or completion_tokens is not None:
            request_tracker.update_usage(
                tracking_id,
                prompt_tokens=prompt_tokens,
                completion_tokens=completion_tokens,
                force_flush=force_flush,
            )
        return tracking_id

    def _track_end_from_payload(payload, source):
        for tracking_id in _tracking_id_candidates(payload):
            try:
                _track_end(tracking_id)
            except Exception as e:
                log.debug("track_end %s error: %s", source, e)
            return

    def _auth_field(user_api_key_dict, name):
        if isinstance(user_api_key_dict, dict):
            return user_api_key_dict.get(name)
        return getattr(user_api_key_dict, name, None)

    def _resolve_key_label(user_api_key_dict):
        for name in ("key_alias", "key_name"):
            value = _auth_field(user_api_key_dict, name)
            if value:
                return str(value)
        for name in ("token", "api_key"):
            value = _auth_field(user_api_key_dict, name)
            if value and str(value).startswith("litellm_proxy_master"):
                return "master"
        return "unknown"

    # Aurora is intentionally local-only. Its incident loop is expendable when the
    # resident is unavailable and must not consume either ChatGPT account as a
    # transparent replacement. This has to cover BOTH fallback layers:
    #
    #   * the hook's own alias-missing path (handled by the boolean returned here);
    #   * LiteLLM Router's registered-but-unhealthy path (handled by the top-level
    #     ``disable_fallbacks`` request kwarg).
    #
    # LiteLLM v1.96.0 pops that kwarg in Router.async_function_with_fallbacks and
    # re-raises the original error when it is true. It is deliberately overwritten,
    # not setdefault: this policy cannot be undone by a client body containing false.
    NO_FALLBACK_KEY_ALIASES = frozenset({"aurora-rca"})

    def _apply_key_fallback_policy(data, user_api_key_dict):
        """Stamp the Router kill switch and return the effective per-request policy."""
        if _resolve_key_label(user_api_key_dict) in NO_FALLBACK_KEY_ALIASES:
            data["disable_fallbacks"] = True
        return data.get("disable_fallbacks") is True

    # ── Routing policy (2026-08-13, Daniel) ──────────────────────────────────────
    # `router` does NOT choose a model family. It chooses how much the current
    # tooling resident should think: off / low / high / max. This matters for
    # OpenClaw, which attaches hundreds of tool definitions even to a trivial
    # question; using "has tools" as a proxy for complexity routed every chat to
    # `dense`, including "que modelo eres?", and made the automatic profile depend
    # on a backend that cannot coexist with DeepSeek TP=2.
    #
    # The four targets already are public capability aliases and carry the family
    # translation in THINKING_TIERS. `router` only selects one of them. Explicit
    # model names (`dense`, `ornith-1.0`, `deepseek-v4-flash-0731`...) still pass
    # through untouched so benchmark intent remains exact.
    AUTO_ROUTED_MODELS = {"router", "auto", "litellmrouter"}

    # All four routes point at the SAME resident; only their thinking tier differs.
    # The names deliberately match THINKING_TIERS so the selected alias can be fed
    # to _apply_thinking_tier after the request model has been rewritten.
    ROUTE = {
        # OFF is the tooling profile itself. Its backend is selected from the
        # effective compute mode. If that resident is unavailable it follows the
        # tooling fallback policy: CloudBlue Luna and then e-dani Luna.
        "OFF": {"model": "tooling", "fallbacks": ()},
        "LOW": {"model": "agent", "fallbacks": ("cloudblue/gpt-5.6-luna",)},
        "HIGH": {"model": "high", "fallbacks": ("cloudblue/gpt-5.6-luna",)},
        "MAX": {"model": "max", "fallbacks": ("cloudblue/gpt-5.6-luna",)},
    }

    # Deterministic hints for the automatic depth selector. The classifier remains
    # local and cheap: no second LLM call just to decide whether the first may run.
    # Explicit client effort / [think] markers win over lexical heuristics.
    ROUTER_MAX_HINTS = (
        "razonamiento maximo", "razonamiento máximo", "maximo razonamiento",
        "máximo razonamiento", "piensa al maximo", "piensa al máximo",
        "exhaustivo", "exhaustiva", "exhaustive", "deepest reasoning",
        "prove rigorously", "máxima profundidad", "maxima profundidad",
    )
    ROUTER_HIGH_HINTS = (
        "audita", "auditoria", "auditoría", "diagnostica", "diagnóstico",
        "root cause", "causa raiz", "causa raíz", "investiga", "debug",
        "depura", "arquitectura", "migra", "migración", "seguridad",
        "vulnerabilidad", "incidente", "produccion", "producción",
        "despliega", "deploy", "implementa", "arregla", "soluciona", "fix",
        "refactoriza", "optimiza",
        "compara opciones", "trade-off", "tradeoff", "plan detallado",
    )
    ROUTER_LOW_HINTS = (
        "explica", "analiza", "resume", "resumen", "revisa", "evalua",
        "evalúa", "recomienda", "planifica", "por que", "por qué",
        "como funciona", "cómo funciona", "ayudame", "ayúdame",
    )
    ROUTER_OFF_HINTS = (
        "exactamente", "solo responde", "responde solo", "sin explicar",
        "traduce", "reescribe", "corrige el texto", "formatea", "extrae",
        "lista ", "dime la hora", "que modelo eres", "qué modelo eres",
    )
    ROUTER_HIGH_CONTEXT_TOKENS = 12000
    ROUTER_MAX_CONTEXT_TOKENS = 48000

    # ── Fallback de los alias de capacidad del residente ────────────────────────
    #
    # RETIRADOS 2026-08-10: `tooling-ha` y `agentic-ha`. Eran nombres de mas.
    #
    # `tooling-ha` nacio el 2026-08-05 tras el outage de Aurora para significar
    # «prefiero el residente de tooling, pero prefiero vivo», con el argumento de que
    # degradar `tooling` corromperia las mediciones. Ese argumento se cae por dos
    # motivos:
    #   1. TODO el que pedia `tooling` queria exactamente eso -- Aurora, Keep,
    #      k8sgpt, OpenClaw, el bot de Studio, opencode. Dos nombres para una sola
    #      intencion, y el que no llevaba sufijo era una trampa.
    #   2. Las mediciones no se hacen contra `tooling`, se hacen contra nombres de
    #      MODELO: `ornith-1.0`, `ornith-canary`, `qwen3-coder`, `qwen36-35b-nvfp4`,
    #      `qwen38-27b`. Esos NO degradan y siguen dando 400 cuando su modelo
    #      no esta, que es justo lo que protege las medidas. `tooling` es un nombre
    #      de CAPACIDAD, y una capacidad que devuelve 400 en vez de degradar no
    #      protege nada.
    #
    # `agentic-ha` (qwen3-coder -> tooling -> dense) se retiro con el, y el modelo que
    # encabezaba esa cadena TAMBIEN esta fuera desde el 2026-08-10: Qwen3-Coder se
    # retiro del cluster entero por decision del owner. Asi que ya no hay nada que
    # optar: quien conduce agentes es el residente de tooling.
    #
    # NO se apoya nada en el test de opencode que comparaba los cuatro modelos: esta
    # DESCARTADO por malo (owner, 2026-08-10) y sus cifras no valen. Lo que si esta
    # medido y en pie es la matriz de tool-calling de 370 casos, donde los cuatro
    # puntuan 91-95% y devuelven tool_calls correctos por LiteLLM. Si algun dia hace
    # falta comparar modelos pilotando un CLI agentico, hay que disenar la medida de
    # cero.
    #
    # QUE HACE ESTO. Los perfiles con razonamiento conservan su alias como cabeza
    # y usan cloudblue/gpt-5.6-luna como red independiente. Cubre el modo
    # "alias DESREGISTRADO" (el sync llama a /model/delete cuando el Service se cae),
    # que el proxy rechaza en route_llm_request ANTES de que corra el Router, asi que
    # `router_settings.fallbacks` no puede salvarlo. El otro modo -- "registrado pero
    # sin deployment sano", que es el que de verdad tumbo a Aurora -- lo cubre
    # `router_settings.fallbacks`. Las dos capas siguen siendo
    # necesarias y ninguna sustituye a la otra.
    #
    # Funciona porque pre_call_hook reescribe data["model"] ANTES del gate de nombre
    # del proxy (proxy_server.py:8691 vs route_request en :8698).
    # `tooling` representa el perfil local, no un checkpoint: backend-sync lo
    # registra sobre DeepSeek V4 en `llm-tp` y sobre Qwen3.6 27B en `creative`.
    # Desde el 15-08-2026 tiene salida explicita a las dos cuentas Luna. Este
    # mismo orden cubre el alias DESREGISTRADO; router_settings cubre el alias aun
    # registrado cuyo deployment ya no esta sano.
    CAPABILITY_CHAINS = {
        "tooling": {"model": "tooling", "fallbacks": TOOLING_LUNA_FALLBACKS},
        # Los perfiles con razonamiento conservan la red independiente anterior.
        "agent": {"model": "agent", "fallbacks": ("cloudblue/gpt-5.6-luna",)},
        "high": {"model": "high", "fallbacks": ("cloudblue/gpt-5.6-luna",)},
        "max": {"model": "max", "fallbacks": ("cloudblue/gpt-5.6-luna",)},
        # 19-08-2026: SIN esta entrada la reescritura de `tooling-uncensored` no
        # ocurre NUNCA. `cap_alias` solo se fija si el modelo pedido esta en este
        # dict, asi que la rama de TOOLING_UNCENSORED_ALIASES quedaba muerta y la
        # peticion salia al Service de pool SIN el `cache_salt`: servia el residente
        # CENSURADO bajo un nombre que dice lo contrario. Cazado MIDIENDO el
        # comportamiento (3/3 rechazos identicos a `tooling`), no leyendo el codigo.
        #
        # `fallbacks` VACIO, no las cuentas Luna: son un modelo de nube con sus
        # barreras puestas y no pueden llevar el sello. La resolucion real la hace
        # _resolve_tooling_uncensored, que da 503 antes que degradar.
        "tooling-uncensored": {"model": "tooling-uncensored", "fallbacks": ()},
    }
    # ── Desvio de VISION (2026-08-11) ───────────────────────────────────────────
    #
    # DeepSeekV4ForCausalLM es SOLO TEXTO (lo declara su backend con
    # supports_vision: False). Mientras sea el residente, una peticion con imagen a
    # `router`/`tooling`/... llega a un modelo que no ve: el backend la rechaza, y
    # cuando no la rechaza es peor -- contesta a ciegas sobre lo que diga el texto.
    #
    # El unico modelo del gateway que ve hoy es la cuenta ChatGPT Pro por
    # codex-bridge. VERIFICADO contra el upstream real el 2026-08-11: un
    # `input_image` con `image_url` STRING (data: URI vale) se responde bien
    # (imagen azul de 64x64 -> "Azul"); con `image_url` objeto devuelve 400
    # "expected an image URL, but got an object instead". El puente lo traduce.
    #
    # OJO CON LA CUOTA: luna comparte limites con el Codex interactivo del usuario,
    # y desde el 2026-08-11 TODO lo que lleve imagen sale por aqui salvo que el
    # backend que iba a servir declare que ve (decision del owner). Se apaga entero
    # con LITELLM_VISION_FALLBACK_MODEL="".
    VISION_FALLBACK_MODEL = os.environ.get(
        "LITELLM_VISION_FALLBACK_MODEL", "cloudblue/gpt-5.6-luna"
    )
    # Nombres de CAPACIDAD, los unicos que se desvian. Un nombre de MODELO
    # (`deepseek-v4-flash-0731`, `dense`, `ornith-1.0`...) NO se desvia jamas, por
    # la misma razon por la que no degrada: quien lo nombra sabe a que habla, y las
    # mediciones se hacen contra esos nombres.
    VISION_DIVERTIBLE = AUTO_ROUTED_MODELS | frozenset(CAPABILITY_CHAINS)
    THINK_MARKERS = ("/think", "[think]")
    # Codex/agent clients attach a reasoning effort to EVERY call; only a
    # deliberate medium+ effort counts as a reasoning signal so that ambient
    # minimal/low efforts still route by request shape.
    REASONING_EFFORT_SIGNAL = {"medium", "high", "xhigh"}
    # Content part types across Chat Completions and Responses API payloads.
    TEXT_PART_TYPES = {"text", "input_text", "output_text"}
    IMAGE_PART_TYPES = {"image", "image_url", "input_image"}
    VIDEO_PART_TYPES = {"video", "video_url", "input_video"}

    def _message_entries(data):
        """Chat `messages` and Responses-API `input` normalized to one list.

        Responses `input` can be a bare string (implicit user message) or a
        list of items where only message items carry a role; non-message items
        (function_call, reasoning, item_reference, ...) are skipped here.
        """
        entries = []
        msgs = data.get("messages")
        if isinstance(msgs, list):
            entries.extend(m for m in msgs if isinstance(m, dict))
        inp = data.get("input")
        if isinstance(inp, str):
            entries.append({"role": "user", "content": inp})
        elif isinstance(inp, list):
            entries.extend(
                item for item in inp if isinstance(item, dict) and item.get("role")
            )
        return entries

    def _entry_text(entry):
        if not isinstance(entry, dict):
            return ""
        c = entry.get("content", "")
        if isinstance(c, str):
            return c
        if isinstance(c, list):
            return " ".join(
                p.get("text") or ""
                for p in c
                if isinstance(p, dict) and p.get("type") in TEXT_PART_TYPES
            )
        return ""

    def _last_user_entry(data):
        for entry in reversed(_message_entries(data)):
            if entry.get("role") == "user":
                return entry
        return None

    def _approx_input_tokens(data):
        total = 0
        for entry in _message_entries(data):
            c = entry.get("content", "")
            if isinstance(c, str):
                total += len(c)
            elif isinstance(c, list):
                for p in c:
                    if isinstance(p, dict):
                        total += len(p.get("text") or "")
        return total // 4

    # Item types that prove a tool was actually executed in the current Responses
    # cycle. Declarations live in `tools` and are deliberately ignored by the
    # depth selector.
    TOOL_ITEM_TYPES = ("function_call", "mcp_call", "mcp_list_tools",
                       "custom_tool_call", "tool_call")


    def _has_tools(data):
        if data.get("tools") or data.get("functions") or data.get("function_call"):
            return True
        # tool_choice pins a tool even if the declaration lives elsewhere in the
        # payload; "none"/"auto" carry no such intent.
        tc = data.get("tool_choice")
        if isinstance(tc, str):
            if tc not in ("none", "auto"):
                return True
        elif tc:
            return True
        inp = data.get("input")
        if isinstance(inp, list):
            for item in inp:
                if isinstance(item, dict):
                    t = str(item.get("type") or "")
                    if any(t.startswith(p) for p in TOOL_ITEM_TYPES):
                        return True
        for m in data.get("messages") or []:
            if isinstance(m, dict) and (m.get("tool_calls") or m.get("role") == "tool"):
                return True
        return False

    def _reasoning_effort_value(data):
        effort = data.get("reasoning_effort")
        if not effort:
            r = data.get("reasoning")
            if isinstance(r, dict):
                effort = r.get("effort")
        return str(effort).lower() if effort else ""

    def _wants_reasoning(data):
        thinking = data.get("thinking")
        if isinstance(thinking, dict) and thinking.get("type") == "enabled":
            return True
        return _reasoning_effort_value(data) in REASONING_EFFORT_SIGNAL

    def _has_part_type(data, names):
        for entry in _message_entries(data):
            c = entry.get("content")
            if isinstance(c, list):
                for p in c:
                    if isinstance(p, dict) and p.get("type") in names:
                        return True
        return False

    def _has_think_marker(text):
        # A marker only counts at a word boundary: "/think" / "/think: x" yes,
        # "/thinking about it" no (would otherwise misroute AND mutate text).
        if not text:
            return False
        low = text.lstrip().lower()
        for m in THINK_MARKERS:
            if low.startswith(m):
                rest = low[len(m):]
                if not rest or not rest[0].isalnum():
                    return True
        return False

    def _strip_think_marker(text):
        if not text:
            return text
        lead_len = len(text) - len(text.lstrip())
        stripped = text[lead_len:]
        low = stripped.lower()
        for marker in THINK_MARKERS:
            if low.startswith(marker):
                rest = stripped[len(marker):]
                if rest and rest[:1].isalnum():
                    continue
                return text[:lead_len] + rest.lstrip(" :\t\n")
        return text

    def _strip_think_from_last_user(data):
        inp = data.get("input")
        if isinstance(inp, str):
            if _has_think_marker(inp):
                data["input"] = _strip_think_marker(inp)
            return
        entry = _last_user_entry(data)
        if entry is None or not _has_think_marker(_entry_text(entry)):
            return
        c = entry.get("content")
        if isinstance(c, str):
            entry["content"] = _strip_think_marker(c)
        elif isinstance(c, list):
            for p in c:
                if (
                    isinstance(p, dict)
                    and p.get("type") in TEXT_PART_TYPES
                    and _has_think_marker(p.get("text") or "")
                ):
                    p["text"] = _strip_think_marker(p.get("text") or "")
                    break

    def _alias_has_deployments(alias):
        """Whether the proxy router currently has deployments for the alias.

        Fails open (True) so a litellm-internals change can never take the
        route down: the request then behaves exactly like a direct call to
        the mapped alias.
        """
        try:
            from litellm.proxy.proxy_server import llm_router
        except Exception:
            return True
        if llm_router is None:
            return True
        try:
            return bool(llm_router.get_model_list(model_name=alias))
        except Exception:
            return True

    # ── perfil de sampling por FAMILIA del backend ───────────────────────────
    # Los alias compartidos (`tooling`, `router`, `dense`...) los sirve quien sea
    # el residente del momento, y cada familia quiere un sampling distinto. El
    # cliente no puede saberlo: OpenClaw lleva los valores de Qwen HARDCODEADOS
    # por alias en ~8 agentes de su runtime config, asi que al poner DeepSeek
    # seguian llegando los de Qwen.
    #
    # Se resuelve aqui y no en el cliente porque es UN sitio en vez de 40+, y
    # porque cubre a TODOS los clientes (OpenClaw, opencode, playground, brain),
    # no solo al que te acuerdes de tocar.
    #
    # La familia se deduce del backend REAL que sirve el alias AHORA MISMO, no de
    # una tabla de alias: al intercambiar el residente el perfil cambia solo.
    FAMILY_SAMPLING = {
        "deepseek-v4": {
            # El model card de DeepSeek documenta esto para agentico/tool-calling.
            "set": {"temperature": 1.0, "top_p": 0.95},
            # NO documenta top_k/min_p/penalties, y los de Qwen le sientan mal:
            # presence_penalty 1.5 le alarga las respuestas y le hace divagar.
            "drop": ("top_k", "min_p", "presence_penalty",
                     "frequency_penalty", "repetition_penalty"),
        },
        "qwen": {
            # Los de siempre. Qwen documenta que temperature casi-cero degrada el
            # tool-calling, de ahi 0.7 y no 0.
            "set": {"temperature": 0.7, "top_p": 0.8},
            "drop": (),
        },
    }
    # Solo se pisan los alias cuyo backend PUEDE cambiar. Un alias que ya nombra
    # un modelo concreto (deepseek-v4-flash-opencode, ornith-1.0...) se respeta
    # tal cual: quien lo pide sabe a que habla.
    SWAPPABLE_ALIASES = frozenset({
        "tooling", "router", "auto", "litellmrouter",
        "agent", "high", "max",
        # 2026-08-15: fuera `dense`, `dense-reasoning`, `dense-uncensored` y
        # `taxonomy`. `qwen38-27b` NO entra aqui a proposito: es un nombre de
        # MODELO, y esos se respetan tal cual igual que deepseek-v4-flash-0731.
    })

    # ── Nivel de pensamiento por ALIAS (2026-08-10) ─────────────────────────────
    #
    # Cuatro nombres para el mismo residente, que solo se diferencian en cuanto
    # piensa antes de contestar. Existen porque la mayoria de clientes NO pueden
    # mandar extra_body: k8sgpt, Aurora y los ~15 adapters de Synapse solo tienen
    # un campo `model` en un YAML. Elegir el nivel por NOMBRE es lo unico que les
    # queda, y ademas sobrevive al cambio de residente.
    #
    #   tooling -> sin pensar. Redaccion y extraccion: borradores, traducciones,
    #              gmail, messaging, expenses, document-intake. Es tambien lo que
    #              exige la salida estructurada (ver abajo).
    #   agent   -> effort low. El arranque del servidor (DEFAULT_THINKING=low) y
    #              el regimen agentico del model card. TTFT mediana 0.209 s.
    #   high    -> effort high. Lo que recomienda la guia de opencode para codigo.
    #   max     -> effort max. El nivel con el que DeepSeek evalua sus benchmarks
    #              de code-agent. Piensa MUCHO: con 16384 de salida se trunca.
    #
    # En una llamada explicita manda el alias que pidio el cliente. En `router`,
    # `auto` o `litellmrouter` manda el alias de profundidad elegido por el hook;
    # asi OFF/LOW/HIGH/MAX se convierten de verdad en off/low/high/max.
    THINKING_TIERS = {
        "tooling": "off",
        "agent": "low",
        "high": "high",
        "max": "max",
        # `tooling-uncensored` NO entra aqui, y se intento: esta tabla son los
        # CUATRO tiers de pensamiento que el router puede elegir (lo comprueban
        # ROUTE == THINKING_TIERS y SWAPPABLE_ALIASES). La ablacion no es un nivel de
        # pensamiento, asi que meterlo convertia un alias abliterado en un destino
        # del clasificador del router — cualquier peticion podria acabar sin censura
        # sin haberla pedido. Es capability chain sin ser tier, y esa es justo la
        # diferencia que el test de invariantes ahora declara.
    }
    # `/effort` de OpenClaw, que viaja como `reasoning_effort` de primer nivel.
    #
    # SOLO ESTAN LOS DELIBERADOS, y es la parte que importa. Vale la misma regla
    # que REASONING_EFFORT_SIGNAL de arriba: los clientes agente adjuntan un
    # effort a TODAS las llamadas, asi que un `low` no significa "quiero low",
    # significa "no he tocado nada". Meterlo aqui convertiria el ambiente en una
    # orden y `tooling` -- etiquetado "sin pensar" -- se pondria a pensar en cada
    # turno. Un effort ambiente cae fuera de la tabla, devuelve None, y sigue
    # decidiendo el alias o el clasificador del router.
    #
    # `medium` tampoco esta, por otro motivo: DeepSeek no tiene ese nivel y el
    # tokenizer parcheado del launch.sh hace caer lo desconocido a "low", asi que
    # traducirlo seria un nombre que miente. Por eso se quita del menu que
    # publica OpenClaw.
    CLIENT_EFFORT_TIERS = {
        "none": "off",
        "off": "off",
        "high": "high",
        "max": "max",
    }
    # Cada familia dice lo mismo con otras palabras. DeepSeek lee `thinking` (bool)
    # + `reasoning_effort`; Qwen solo tiene `enable_thinking`, no gradua, asi que
    # low/high/max colapsan a "piensa". Un alias sin traduccion para la familia viva
    # se queda sin tocar y manda el default del servidor.
    #
    # Valores que acepta DeepSeek: low / high / max. El tokenizer viene parcheado en
    # el launch.sh para que lo desconocido caiga a "low" en vez de a "high", asi que
    # NO metas "medium" aqui: se comportaria como low y el nombre mentiria.
    THINKING_KWARGS = {
        "deepseek-v4": {
            "off": {"thinking": False},
            "low": {"thinking": True, "reasoning_effort": "low"},
            "high": {"thinking": True, "reasoning_effort": "high"},
            "max": {"thinking": True, "reasoning_effort": "max"},
        },
        "qwen": {
            "off": {"enable_thinking": False},
            "low": {"enable_thinking": True},
            "high": {"enable_thinking": True},
            "max": {"enable_thinking": True},
        },
    }

    def _family_of_alias(alias):
        """Familia del backend que sirve `alias` ahora mismo, o None.

        Se lee de litellm_params.model de la deployment que registro
        litellm-dgx-backend-sync. Falla a None (no tocar nada) ante cualquier
        cambio de internals de litellm: preferimos no aplicar perfil a aplicar
        uno equivocado.
        """
        try:
            from litellm.proxy.proxy_server import llm_router
            if llm_router is None:
                return None
            for dep in (llm_router.get_model_list(model_name=alias) or ()):
                mid = ((dep.get("litellm_params") or {}).get("model") or "").lower()
                for fam in FAMILY_SAMPLING:
                    if fam in mid:
                        return fam
                if "qwen" in mid or "ornith" in mid:
                    return "qwen"
        except Exception as e:
            log.debug("_family_of_alias(%s): %s", alias, e)
        return None

    def _alias_supports_vision(alias):
        """Si el alias declara VISION. True, False, o None cuando no se sabe.

        Lo publica litellm-dgx-backend-sync en model_info.supports_vision de cada
        deployment (lo lee del propio BACKENDS, donde es obligatorio). None no es
        lo mismo que False: significa que no se pudo leer el registro, o que la
        entrada no lo declara -- las estaticas de config.yaml lo dicen a mano.

        Basta con que UNA deployment del alias vea para que el alias vea: el router
        puede mandar la peticion a cualquiera de ellas.
        """
        try:
            from litellm.proxy.proxy_server import llm_router
            if llm_router is None:
                return None
            declared = None
            for dep in (llm_router.get_model_list(model_name=alias) or ()):
                value = (dep.get("model_info") or {}).get("supports_vision")
                if value is None:
                    continue
                if value:
                    return True
                declared = False
            return declared
        except Exception as e:
            log.debug("_alias_supports_vision(%s): %s", alias, e)
            return None

    def _vision_target(data, requested, proxy, served,
                       supports_vision=_alias_supports_vision,
                       alias_live=_alias_has_deployments):
        """El alias al que desviar una peticion CON IMAGEN, o None.

        LA REGLA (decision del owner, 2026-08-11): lo que pida vision en LiteLLM
        sale por aqui. Se desvia SALVO que el alias que iba a servir declare que
        ve, con una sola excepcion -- ver abajo.

        La primera version invertia esto: solo desviaba con un
        `supports_vision: False` EXPLICITO, y si no se sabia (None) dejaba pasar la
        peticion para no gastar cuota de ChatGPT en silencio. Medido en produccion
        el mismo dia contra el cluster real: con el plano local en transicion NO
        HAY NINGUN alias registrado, `get_model_list("tooling")` devuelve vacio y
        eso es None -- o sea que la vision se caia (503 de la admision de
        compute-mode, 400 de "no healthy deployments") exactamente en el momento en
        que el desvio era la unica forma de contestar. Un criterio que solo
        funciona cuando el DGX esta sano no sirve de red.

        Truco de lectura: `ve is True` significa "lo declara y ve". None es "no se
        sabe", y no saber ya no protege nada -- ahora manda el desvio.

        LA EXCEPCION: un nombre de MODELO (`ornith-1.0`, `qwen38-27b`,
        `deepseek-v4-flash-0731`...) solo se desvia si SABEMOS que no ve
        (`ve is False`), porque ahi el desvio no puede estropear ninguna medida:
        la peticion iba a fallar seguro. Con None se respeta el nombre. Quien
        nombra un modelo sabe a que habla, y las mediciones se hacen contra esos
        nombres, no contra las capacidades.
        """
        if not VISION_FALLBACK_MODEL:
            return None
        if not _has_part_type(data, IMAGE_PART_TYPES):
            return None
        if served == VISION_FALLBACK_MODEL:
            return None
        ve = supports_vision(served)
        if ve is True:
            return None
        por_capacidad = requested in VISION_DIVERTIBLE or proxy in VISION_DIVERTIBLE
        if not por_capacidad and ve is not False:
            return None
        if not alias_live(VISION_FALLBACK_MODEL):
            return None
        return VISION_FALLBACK_MODEL

    def _is_structured_output(data):
        """La peticion exige una forma de salida (json_schema / json_object)."""
        rf = data.get("response_format")
        return isinstance(rf, dict) and rf.get("type") in ("json_schema", "json_object")


    def _disable_thinking(data):
        """Apaga el bloque de pensamiento de DeepSeek para ESTA peticion."""
        body = data.get("extra_body")
        if not isinstance(body, dict):
            body = {}
            data["extra_body"] = body
        kwargs = body.get("chat_template_kwargs")
        if not isinstance(kwargs, dict):
            kwargs = {}
            body["chat_template_kwargs"] = kwargs
        if kwargs.get("thinking") is False:
            return False
        kwargs["thinking"] = False
        return True


    def _apply_family_sampling(data):
        """Ajusta el sampling al backend que de verdad va a atender la peticion.

        SALIDA ESTRUCTURADA (2026-08-10). Una peticion con `response_format` recibe
        dos tratos distintos, y los dos por el mismo motivo: quien pide un esquema
        quiere un dato, no una redaccion.

        1. Se le APAGA el bloque de pensamiento cuando el backend es DeepSeek. No es
           una preferencia: con `thinking` activo (y lo esta por defecto, el servidor
           arranca con --default-chat-template-kwargs thinking=True) el contenido
           vuelve CORRUPTO -- se cuela un `{` suelto del razonamiento delante del JSON
           guiado y `JSON.parse` revienta. Reproducido 3/3 el 2026-08-10 contra
           `qwen36-35b`; con thinking off, 2/2 correcto. Lo sufria la extraccion
           fiscal de skirmbooks, que ante el parse fallido cae a heuristicas de regex
           en un `catch` que solo escribe un console.warn: degradaba en silencio
           desde el corte a DeepSeek.

        2. NO se le pisa la temperatura. El perfil de familia sube DeepSeek a 1.0
           porque su model card lo recomienda para agentico y tool-calling, pero eso
           es justo lo contrario de lo que quiere una extraccion determinista: el
           esquema fija la FORMA, no los VALORES, y a temperatura 1.0 los numeros
           bailan. Si el cliente mando `temperature: 0`, se respeta.

        Los `drop` si se aplican siempre: los penalties de Qwen le sientan mal a
        DeepSeek con esquema o sin el.
        """
        try:
            alias = (data.get("model") or "").strip()
            if alias not in SWAPPABLE_ALIASES:
                return
            fam = _family_of_alias(alias)
            if not fam:
                return
            prof = FAMILY_SAMPLING[fam]
            structured = _is_structured_output(data)
            body = data.get("extra_body") if isinstance(data.get("extra_body"), dict) else None
            changed = []
            for k in prof["drop"]:
                for c in (data, body):
                    if isinstance(c, dict) and c.pop(k, None) is not None:
                        changed.append("-" + k)
            if not structured:
                for k, v in prof["set"].items():
                    if data.get(k) != v:
                        changed.append("%s=%s" % (k, v))
                    data[k] = v
                    if body is not None:
                        body.pop(k, None)   # que no lo pise por detras
            else:
                changed.append("estructurada:sampling-del-cliente")
                if fam == "deepseek-v4" and _disable_thinking(data):
                    changed.append("estructurada:thinking=off")
            if changed:
                sampling_log.info("sampling: alias=%s familia=%s ajustes=%s",
                                  alias, fam, ",".join(changed))
        except Exception as e:  # nunca romper una peticion por esto
            log.debug("_apply_family_sampling error: %s", e)

    def _client_thinking_tier(data):
        """El nivel que pidio el cliente por `reasoning_effort`, o None.

        None significa dos cosas distintas a proposito: que no vino nada, o que
        vino algo que no sabemos traducir. En los dos casos la respuesta correcta
        es la misma -- no inventarse un nivel y dejar que mande el alias.
        """
        effort = _reasoning_effort_value(data)
        if not effort:
            return None
        tier = CLIENT_EFFORT_TIERS.get(effort)
        if tier is None:
            sampling_log.debug(
                "thinking: effort=%s no es deliberado; decide el alias", effort)
        return tier

    def _apply_thinking_tier(data, requested_alias):
        """Fija el nivel de pensamiento: `reasoning_effort` o, si no, el alias.

        Un `reasoning_effort` DELIBERADO (high/max, o none para apagar) gana al
        nombre del alias. Es la mitad de servidor del `/effort` de OpenClaw: el
        residente es uno solo y el nivel se pide, no se elige cambiando de
        modelo. Un effort ambiente no cuenta -- ver CLIENT_EFFORT_TIERS.

        `requested_alias` es el alias explicito del cliente o, para una llamada
        automatica, el alias de profundidad que eligio el clasificador. No tiene
        por que coincidir con data["model"] si entro una red de disponibilidad.

        TRES COSAS QUE NO HACE, y las tres a proposito:

        1. NO pisa lo que el cliente ya haya puesto en chat_template_kwargs. Quien
           sabe mandar extra_body no necesita que le elijan el nivel -- es lo que
           hacen los perfiles del playground, y si el alias ganara no habria forma
           de probar `max` contra un alias que no se llame `max`.
        2. NO toca los alias que no estan en la tabla. Los nombres de modelo como
           `dense` siguen con el default del servidor; los automaticos se traducen
           a un alias de la tabla antes de llegar aqui.
        3. NO piensa nunca con salida estructurada. El motivo esta medido: con
           thinking activo se cuela una llave suelta del razonamiento delante del
           JSON guiado y el parse revienta (3/3 reproducido el 2026-08-10). El
           esquema manda sobre el nombre del alias, y por eso este caso corta antes
           incluso de mirar el tier: pedir `max` y un json_schema a la vez no es
           una peticion de mas pensamiento, es una contradiccion.
        """
        try:
            requested_tier = _client_thinking_tier(data)
            tier = requested_tier or THINKING_TIERS.get((requested_alias or "").strip())
            if not tier:
                return
            if _is_structured_output(data):
                # El esquema manda incluso sobre un effort explicito: pedir `max`
                # y un json_schema a la vez sigue siendo una contradiccion, no
                # una peticion de mas pensamiento (medido 3/3 el 2026-08-10).
                tier = "off"
            fam = _family_of_alias((data.get("model") or "").strip())
            kwargs = (THINKING_KWARGS.get(fam) or {}).get(tier)
            if not kwargs:
                return
            body = data.get("extra_body")
            if not isinstance(body, dict):
                body = {}
                data["extra_body"] = body
            ctk = body.get("chat_template_kwargs")
            if not isinstance(ctk, dict):
                ctk = {}
                body["chat_template_kwargs"] = ctk
            applied = []
            for k, v in kwargs.items():
                if k in ctk:          # el cliente ya opino: manda el cliente
                    continue
                ctk[k] = v
                applied.append("%s=%s" % (k, v))
            if applied:
                sampling_log.info("thinking: origen=%s alias=%s tier=%s familia=%s -> %s",
                                  "effort" if requested_tier else "alias",
                                  requested_alias, tier, fam, ",".join(applied))
        except Exception as e:  # nunca romper una peticion por esto
            log.debug("_apply_thinking_tier error: %s", e)

    def _chain_of(entry):
        """The ordered aliases of a chain entry, primary first."""
        return (entry["model"],) + tuple(entry.get("fallbacks") or ())

    def _walk_chain(entry, alias_live=_alias_has_deployments):
        """Walk one chain entry and return (alias, state).

        state is "primary" when the head served, "degraded" when a later hop did,
        and "dry" when NO alias in the chain is registered. One membership check
        per alias, single pass, no retry.

        On "dry" we return the head: there is nothing better to choose, and a 400
        from the primary is the honest signal. It also preserves the fail-open
        contract of _alias_has_deployments -- when it cannot introspect litellm it
        answers True, so a dry verdict means the aliases really are deregistered,
        not that the guard broke.

        WHAT THIS DOES *NOT* COVER (2026-08-05). It asks whether the alias is
        REGISTERED, not whether its deployment is HEALTHY. Those are two distinct
        failure modes with two distinct errors, and each needs a different layer:

          alias deleted from model_list (the sync's /model/delete)
            -> proxy raises ProxyModelNotFoundError "Invalid model name passed in"
               in route_llm_request.py BEFORE the Router runs, so no Router-level
               fallback can ever fire. THIS layer is the only one that can rescue
               it, because pre_call_hook runs before that gate
               (proxy_server.py:8691 vs :8698).
          alias registered but no healthy deployment (cooldown after allowed_fails,
          a wedged vLLM still answering /health)
            -> the Router raises BadRequestError "no healthy deployments for this
               model" from INSIDE async_function_with_fallbacks' try, so the
               `fallbacks:` in config.yaml DO fire. This layer is blind to it: the
               alias is registered, so we hand the request over unchanged.

        Aurora's real outage on 2026-08-04 19:11 was the second kind. Both layers
        are load-bearing; neither substitutes for the other.
        """
        chain = _chain_of(entry)
        for position, alias in enumerate(chain):
            if alias_live(alias):
                return alias, ("primary" if position == 0 else "degraded")
        return chain[0], "dry"

    def _degrade(category, alias_live=_alias_has_deployments):
        """_walk_chain for one of the shape-classified ROUTE categories."""
        return _walk_chain(ROUTE[category], alias_live=alias_live)

    def _contains_router_hint(text, hints):
        return any(hint in text for hint in hints)

    def _has_executed_tool_history(data):
        """Whether the current user/agent cycle already executed a tool.

        Only inspect items after the latest user message. An execution from an
        older turn must not pin every later question in the conversation to HIGH.
        With no user item, inspect the whole payload because Responses continuations
        may contain only function/MCP items.
        """
        inp = data.get("input")
        if isinstance(inp, list):
            last_user = max(
                (i for i, item in enumerate(inp)
                 if isinstance(item, dict) and item.get("role") == "user"),
                default=-1,
            )
            for item in inp[last_user + 1:]:
                if not isinstance(item, dict):
                    continue
                kind = str(item.get("type") or "")
                if any(kind.startswith(prefix) for prefix in TOOL_ITEM_TYPES):
                    return True
        messages = data.get("messages") or ()
        last_user = max(
            (i for i, message in enumerate(messages)
             if isinstance(message, dict) and message.get("role") == "user"),
            default=-1,
        )
        for message in messages[last_user + 1:]:
            if not isinstance(message, dict):
                continue
            if message.get("role") == "tool" or message.get("tool_calls"):
                return True
        return False

    def _classify_route(data):
        """Choose OFF/LOW/HIGH/MAX for router/auto/litellmrouter.

        This classifier intentionally ignores declared tools. OpenClaw sends its
        entire tool catalogue on ordinary conversation turns, so declarations say
        nothing about the depth the user's request deserves. Explicit depth wins;
        otherwise current intent, real execution history and context size decide.
        """
        last_text = _entry_text(_last_user_entry(data))
        normalized = " ".join(last_text.lower().split())
        has_think = _has_think_marker(last_text)
        effort = _reasoning_effort_value(data)
        # Complexity belongs to the current request, not to accumulated session
        # history. Otherwise every old OpenClaw chat would eventually become MAX.
        current_tokens = len(last_text) // 4

        # A schema is an extraction contract. Thinking corrupts guided JSON on the
        # current DeepSeek template, so this invariant outranks every depth hint.
        if _is_structured_output(data):
            return "OFF", "structured-output", has_think
        if effort in {"xhigh", "max"} or _contains_router_hint(
                normalized, ROUTER_MAX_HINTS):
            return "MAX", "explicit-max", has_think
        if effort in {"medium", "high"}:
            return "HIGH", "explicit-high", has_think
        if has_think:
            return "HIGH", "think-marker", has_think
        if current_tokens >= ROUTER_MAX_CONTEXT_TOKENS:
            return "MAX", "context-max", has_think
        if _contains_router_hint(normalized, ROUTER_HIGH_HINTS):
            return "HIGH", "complex-intent", has_think
        if _has_executed_tool_history(data):
            return "HIGH", "execution-history", has_think
        if current_tokens >= ROUTER_HIGH_CONTEXT_TOKENS:
            return "HIGH", "context-high", has_think
        if _contains_router_hint(normalized, ROUTER_LOW_HINTS):
            return "LOW", "reasoned-intent", has_think
        if _contains_router_hint(normalized, ROUTER_OFF_HINTS):
            return "OFF", "direct-intent", has_think
        if len(normalized) <= 80:
            return "OFF", "short-simple", has_think
        return "LOW", "default-low", has_think


    # ── Gate de validacion de args de tool (2026-07-27) ──────────────────────────
    # PROBLEMA MEDIDO: la bateria de 370 casos mostro que el 27B uncensored viola el
    # enum del schema en 10 casos (`negative-invalidarg`: el prompt exige
    # mode="write" y el enum solo admite [audit, dry_run, read_only]); ornith falla 6
    # de los mismos. Es la abliteracion asomando: obedece al prompt por encima del
    # schema. Consecuencia practica: args invalidos -> la tool falla -> el cliente
    # reintenta la MISMA llamada -> bucle.
    #
    # POR QUE AQUI Y NO VALIDANDO LA RESPUESTA: vLLM ya sabe restringir la
    # decodificacion a la gramatica del schema (xgrammar), pero la SALTA cuando la
    # peticion usa `tool_choice: "auto"` y ninguna tool declara `strict`:
    #     vllm/tool_parsers/structural_tag_registry.py:
    #         if tool_choice == "auto" and not _any_tool_strict(tools):
    #             return None
    # `auto` es justo lo que mandan los agentes. Marcando las tools como strict, la
    # violacion pasa a ser IMPOSIBLE en generacion en vez de detectarse a posteriori.
    #
    # VERIFICADO contra el caso real negative-invalidarg-000 en el 27B uncensored:
    #   sin strict -> mode='write' 3/3 (viola el enum)
    #   con strict -> mode='read_only' 3/3 (lo respeta)
    #
    # Solo se aplica a NUESTROS backends vLLM y solo si el cliente no dijo nada:
    # un `strict` explicito del cliente (incluido `false`) se respeta siempre.
    STRICT_GATE_ENABLED = os.environ.get("LITELLM_TOOL_STRICT_GATE", "1") not in ("0", "false", "")


    def _enforce_tool_strict(data, resolved_model="?"):
        """Marca strict=True en las tools para que vLLM aplique la gramatica.

        No toca una tool que ya traiga `strict` (ni True ni False): la intencion
        explicita del cliente manda. Devuelve cuantas ha marcado.
        """
        if not STRICT_GATE_ENABLED:
            return 0
        tools = data.get("tools")
        if not isinstance(tools, list):
            return 0
        marked = []
        for tool in tools:
            if not isinstance(tool, dict):
                continue
            # Chat Completions: {"type":"function","function":{...}}
            fn = tool.get("function")
            target = fn if isinstance(fn, dict) else (tool if tool.get("name") else None)
            if target is None:
                continue
            if "strict" in target or "strict" in tool:
                continue                      # el cliente decidio: no lo pisamos
            params = target.get("parameters")
            if not isinstance(params, dict) or not params.get("properties"):
                continue                      # sin schema no hay nada que restringir
            target["strict"] = True
            marked.append(target.get("name") or "?")
        if marked:
            tool_gate_log.warning(
                "tool-strict-gate: model=%s marked=%d tools=%s",
                resolved_model, len(marked), marked[:6],
            )
        return len(marked)


    SAMPLING_KEYS = ("temperature", "top_p", "top_k", "min_p",
                     "presence_penalty", "frequency_penalty", "repetition_penalty")
    GREEDY_TEMPERATURE = 0.1


    def _sanitize_sampling(data, resolved_model="unknown"):
        """Corrige valores de sampling FUERA DE RANGO antes de mandarlos al backend.

        Motivo concreto (2026-08-09, playground contra `tooling`):
            litellm.BadRequestError: OpenAIException -
            top_p must be in (0, 1], got 0.0
        vLLM valida top_p en el intervalo ABIERTO por abajo: 0.0 es invalido, no
        "greedy". Varios clientes (el playground entre ellos) mandan 0.0 como si
        fuera "desactivado" y se llevan un 400 en duro. `drop_params` de LiteLLM
        no cubre esto: solo quita parametros NO SOPORTADOS, y top_p lo esta —
        lo que no vale es el valor.

        Se quitan en vez de recortarse a un epsilon: sin la clave, manda el
        default del servidor, que es lo que el cliente queria decir con "0".
        """
        try:
            for container in (data, data.get("extra_body")):
                if not isinstance(container, dict):
                    continue
                tp = container.get("top_p")
                if isinstance(tp, (int, float)) and not (0 < tp <= 1):
                    container.pop("top_p", None)
                    log.warning(
                        "sampling: top_p=%s fuera de (0,1] en model=%s -> retirado, "
                        "aplica el default del servidor", tp, resolved_model)
                tk = container.get("top_k")
                if isinstance(tk, int) and tk == 0:
                    container.pop("top_k", None)
                    log.warning("sampling: top_k=0 en model=%s -> retirado", resolved_model)
        except Exception as e:  # nunca romper una peticion por sanear
            log.debug("_sanitize_sampling error: %s", e)


    def _log_sampling(data, resolved_model, key_alias="unknown"):
        """Registra el sampling que llega, sin modificarlo (solo lectura).

        `greedy=True` marca el caso que Qwen prohibe explicitamente: temperature
        casi cero no hace el tool-calling mas determinista, lo degrada y provoca
        repeticion. Se emite tambien cuando falta presence_penalty para poder medir
        la dispersion real de configuraciones entre clientes.
        """
        try:
            body = data.get("extra_body")
            present = {}
            for k in SAMPLING_KEYS:
                v = data.get(k)
                if v is None and isinstance(body, dict):
                    v = body.get(k)
                if v is not None:
                    present[k] = v
            temp = present.get("temperature")
            greedy = isinstance(temp, (int, float)) and temp <= GREEDY_TEMPERATURE
            sampling_log.warning(
                "sampling: model=%s key=%s greedy=%s params=%s",
                resolved_model, key_alias, greedy,
                present or "none(server defaults apply)",
            )
        except Exception as e:  # nunca romper una peticion por telemetria
            log.debug("_log_sampling error: %s", e)


    class StripUnsupportedParams(litellm.integrations.custom_logger.CustomLogger):
        STRIP_PARAMS = {"reasoningSummary", "reasoning_summary"}

        async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
            for p in self.STRIP_PARAMS:
                data.pop(p, None)

            requested_model = data.get("model", "")

            # Gate de la ruta ABLITERADA, lo primero de todo y a proposito: antes de
            # sanear sampling, de reescribir alias y de cualquier llamada al backend.
            # Si esta key no puede pedirla, no se toca nada mas y se devuelve 403.
            # Cubre el alias de capacidad Y los dos nombres directos: si solo cubriera
            # el primero, se rodearia pidiendo el directo.
            _denied, _detail = _uncensored_access_denied(
                requested_model, _resolve_key_label(user_api_key_dict)
            )
            if _denied:
                router_log.warning(
                    "uncensored: key %r pidio %r y no esta en la lista",
                    _detail["key"], _detail["requested"])
                raise HTTPException(status_code=403, detail=_detail)

            # Antes de resolver el alias: si el residente ha desaparecido, esta
            # misma politica impide que el hook lo reescriba a Luna. La marca queda
            # en ``data`` para que el Router cubra tambien el caso distinto en que
            # el alias existe pero todos sus deployments estan unhealthy/cooldown.
            fallbacks_disabled = _apply_key_fallback_policy(data, user_api_key_dict)

            # AQUI ARRIBA a proposito, no dentro de `if is_router_request`: los
            # valores invalidos de sampling los rechaza el backend para CUALQUIER
            # alias. La primera version de esto se colgo del bloque del router y
            # por eso no saltaba con model="tooling" directo, que es justo como
            # pega el playground.
            _sanitize_sampling(data, requested_model)
            # El sampling por familia se aplica MAS ABAJO, ya resuelto el modelo
            # (ver la llamada junto a `key_alias`). Estuvo aqui arriba hasta
            # 2026-08-10 y era un bug latente: con `litellmrouter` (o cualquier
            # alias que se reescriba)
            # el alias que llega NO es el que sirve, asi que la familia se
            # calculaba del alias equivocado — o de ninguno, porque los `-ha` no
            # estan en SWAPPABLE_ALIASES y salia por el return temprano.
            litellm_params = data.get("litellm_params", {})
            proxy_model = (
                litellm_params.get("proxy_server_request", {})
                .get("body", {})
                .get("model", "")
            )
            # Cadena del alias de capacidad: se resuelve ANTES de is_router_request.
            # `tooling` es disjunto de AUTO_ROUTED_MODELS, asi que tras reescribir el
            # modelo el flujo continua como una peticion explicita normal -- y el gate
            # de tools de mas abajo se aplica al modelo que de verdad va a servir,
            # porque relee data["model"].
            #
            # Cuando `tooling` esta registrado (el caso normal) _walk_chain devuelve
            # ("tooling", "primary") y esto es un no-op: no se toca nada. Solo actua
            # cuando el alias NO esta, que es el hueco que dejaba el 400 duro.
            cap_alias = (
                requested_model if requested_model in CAPABILITY_CHAINS
                else proxy_model if proxy_model in CAPABILITY_CHAINS
                else None
            )
            if cap_alias is not None:
                cap_entry = CAPABILITY_CHAINS[cap_alias]
                # 2026-08-18: los CUATRO alias de capacidad se resuelven igual, no
                # solo `tooling`. Antes agent/high/max iban por _walk_chain porque
                # el controlador los registraba sobre el residente vivo; ahora son
                # entradas estaticas al Service de pool, asi que _walk_chain los
                # encontraria «primary» y no reescribiria nada — la peticion saldria
                # al pool sin la metadata ni el sampling del backend real.
                #
                # Son el MISMO backend por diseño (lo dice TOOLING_RESIDENT_ALIASES:
                # no son modelos distintos, es el mismo con otro nivel de
                # pensamiento). El nivel lo sigue poniendo THINKING_TIERS a partir
                # del alias PEDIDO (`thinking_alias`), que no se toca aqui.
                #
                # Efecto lateral querido: agent/high/max heredan la red de las DOS
                # cuentas Luna (TOOLING_LUNA_FALLBACKS) en vez de solo cloudblue.
                if cap_alias in TOOLING_UNCENSORED_ALIASES:
                    # Mismo mecanismo que los cuatro de abajo, otro destino y sin
                    # red a Luna: degradar a la nube devolveria un modelo censurado
                    # a quien pidio explicitamente que no lo estuviera.
                    cap_resolved, cap_state = await _resolve_tooling_uncensored()
                elif cap_alias in TOOLING_PROFILE_ALIASES:
                    cap_resolved, cap_state = await _resolve_tooling_profile(
                        disable_fallbacks=fallbacks_disabled
                    )
                else:
                    cap_resolved, cap_state = _walk_chain(cap_entry)
                if cap_state == "degraded":
                    router_log.warning(
                        "capability: %s no esta registrado; degradado a %r",
                        cap_alias,
                        cap_resolved,
                    )
                elif cap_state == "dry":
                    router_log.error(
                        "capability: ningun alias de la cadena %s %r esta registrado; "
                        "se despacha a %r, que va a fallar",
                        cap_alias,
                        _chain_of(cap_entry),
                        cap_resolved,
                    )
                if cap_resolved != cap_alias:
                    data["model"] = cap_resolved
                    data.setdefault("metadata", {})
                    data["metadata"]["_router_original_model"] = cap_alias
                    data["metadata"]["_router_resolved_model"] = cap_resolved
                    data["metadata"]["_router_route_state"] = cap_state

            thinking_alias = requested_model
            is_router_request = (
                requested_model in AUTO_ROUTED_MODELS
                or proxy_model in AUTO_ROUTED_MODELS
            )

            if is_router_request:
                category, rule, marker_present = _classify_route(data)
                if marker_present:
                    _strip_think_from_last_user(data)
                target = ROUTE[category]
                # Mismo motivo que arriba: los cuatro destinos de ROUTE (tooling,
                # agent, high, max) son el residente del perfil vivo, asi que los
                # cuatro se resuelven al nombre directo. El nivel de pensamiento
                # viaja aparte en _router_thinking_alias.
                if target["model"] in TOOLING_PROFILE_ALIASES:
                    resolved_model, route_state = await _resolve_tooling_profile(
                        disable_fallbacks=fallbacks_disabled
                    )
                else:
                    resolved_model, route_state = _degrade(category)
                if route_state == "degraded":
                    router_log.warning(
                        "router: %s primary %r has no live deployments; degraded to %r",
                        category,
                        target["model"],
                        resolved_model,
                    )
                elif route_state == "dry":
                    # Both DGX nodes down or mid-swap. Logged at error so it is
                    # distinguishable from an ordinary degrade: this one WILL 400,
                    # and the cause is capacity, not the request.
                    router_log.error(
                        "router: no alias in the %s chain %r is registered; "
                        "dispatching to %r, which will fail",
                        category,
                        (target["model"],) + tuple(target.get("fallbacks") or ()),
                        resolved_model,
                    )
                data["model"] = resolved_model
                data.pop("api_base", None)
                data.pop("api_key", None)
                data.setdefault("metadata", {})
                data["metadata"]["_router_category"] = category
                data["metadata"]["_router_rule"] = rule
                data["metadata"]["_router_original_model"] = proxy_model or requested_model
                data["metadata"]["_router_resolved_model"] = resolved_model
                data["metadata"]["_router_thinking_alias"] = target["model"]
                data["metadata"]["_router_resolved_base"] = "model_list"
                # primary / degraded / dry -- makes "was this request served by the
                # model the rule chose?" answerable per request instead of only by
                # correlating log lines against deployment state after the fact.
                data["metadata"]["_router_route_state"] = route_state
                thinking_alias = target["model"]

                preview = _entry_text(_last_user_entry(data))[:120].replace("\n", " ")
                tok_est = _approx_input_tokens(data)
                reasons = [f"rule={rule}"]
                if marker_present:
                    reasons.append("think_marker")
                effort = _reasoning_effort_value(data)
                if effort:
                    reasons.append(f"effort={effort}")
                if _has_tools(data):
                    reasons.append(f"tools={len(data.get('tools') or [])}")
                current_tok_est = len(_entry_text(_last_user_entry(data))) // 4
                if current_tok_est >= ROUTER_HIGH_CONTEXT_TOKENS:
                    reasons.append(
                        f"current_ctx={current_tok_est}>={ROUTER_HIGH_CONTEXT_TOKENS}")
                if _has_part_type(data, IMAGE_PART_TYPES):
                    reasons.append("image")
                if _has_part_type(data, VIDEO_PART_TYPES):
                    reasons.append("video")
                # Fase 6 (2026-07-27): observabilidad de sampling. NO se toca ningun
                # valor -- solo se registra que manda cada cliente y a que modelo,
                # para localizar y arreglar en ORIGEN a los clientes que envian
                # temperature<=0.1 a un backend Qwen (Qwen documenta que el greedy
                # decoding CAUSA degradacion y bucles de repeticion; ~11 servicios
                # de produccion lo hacen hoy). Los checkpoints ya aportan sus
                # propios defaults (temperature 1.0 / top_p 0.95 / top_k 20 via
                # --generation-config auto), asi que aqui NO hace falta rellenar
                # nada: solo medir.
                _log_sampling(data, resolved_model, key_alias=_resolve_key_label(user_api_key_dict))
                router_log.warning(
                    "router: %s -> %s | orig=%r reasons=%s tok~%d msgs=%d last_user=%r",
                    category,
                    resolved_model,
                    proxy_model or requested_model,
                    reasons or ["default"],
                    tok_est,
                    len(_message_entries(data)),
                    preview,
                )

            # Desvio de VISION, DESPUES de resolver: la pregunta no es que pidio el
            # cliente sino si el alias que ha quedado ve. Va aqui y no antes para no
            # duplicar la resolucion de cadenas ni la clasificacion por forma.
            vision_diverted = False
            vision_from = data.get("model", "")
            vision_target = _vision_target(
                data, requested_model, proxy_model, vision_from)
            if vision_target:
                data["model"] = vision_target
                data.pop("api_base", None)
                data.pop("api_key", None)
                data.setdefault("metadata", {})
                data["metadata"]["_vision_diverted_from"] = vision_from
                data["metadata"]["_router_resolved_model"] = vision_target
                vision_diverted = True
                router_log.warning(
                    "vision: %r no ve; imagen desviada a %r (pedido=%r, key=%s)",
                    vision_from,
                    vision_target,
                    proxy_model or requested_model,
                    _resolve_key_label(user_api_key_dict),
                )

            # Sampling por FAMILIA del backend, con el modelo YA resuelto: aqui
            # data["model"] es el alias que de verdad va a atender (tras el salto
            # de CAPABILITY_CHAINS y tras el re-apuntado del router), no el que pidio el
            # cliente. Es la unica posicion en la que el perfil corresponde al
            # checkpoint real -- calcularlo antes de las bifurcaciones daba el
            # perfil de un alias que no servia la peticion.
            _apply_family_sampling(data)
            # Explicit profiles follow the alias requested by the client. The
            # automatic router follows the depth alias selected above. The family
            # still comes from the backend that will really serve the request.
            _apply_thinking_tier(data, thinking_alias)
            key_alias = _resolve_key_label(user_api_key_dict)
            model = data.get("model", "unknown")
            api_base = (
                data.get("api_base")
                or (litellm_params or {}).get("api_base")
            )
            # `not vision_diverted` es OBLIGATORIO, no cosmetico:
            # _is_local_vllm_request mira tambien `proxy_model`, que sigue diciendo
            # `tooling` despues del desvio. Sin este guard, una imagen que sale a
            # ChatGPT pasaria por la admision de compute-mode (503 cuando el
            # computo local esta apagado, que es justo cuando mas falta hace la
            # nube) y se le marcarian las tools como strict para una gramatica de
            # vLLM que no la va a atender ningun vLLM.
            if not vision_diverted and _is_local_vllm_request(model, proxy_model, api_base):
                await _enforce_compute_mode_admission(model, proxy_model, api_base)
                enable_continuous_usage(data)
                # Gate de args: que la gramatica del schema sea obligatoria en
                # NUESTROS modelos (ver _enforce_tool_strict). Se hace despues de
                # resolver el modelo para que el log diga a donde iba de verdad.
                _enforce_tool_strict(data, resolved_model=model)
            tracking_id = str(uuid.uuid4())
            data.setdefault("metadata", {})
            data["metadata"]["_tracking_id"] = tracking_id
            if isinstance(litellm_params, dict):
                litellm_params.setdefault("metadata", {})
                if isinstance(litellm_params["metadata"], dict):
                    litellm_params["metadata"]["_tracking_id"] = tracking_id
            logging_obj = data.get("litellm_logging_obj")
            model_call_details = getattr(logging_obj, "model_call_details", None)
            if isinstance(model_call_details, dict):
                model_call_details.setdefault("metadata", {})
                if isinstance(model_call_details["metadata"], dict):
                    model_call_details["metadata"]["_tracking_id"] = tracking_id
                model_call_details.setdefault("litellm_params", {})
                if isinstance(model_call_details["litellm_params"], dict):
                    model_call_details["litellm_params"].setdefault("metadata", {})
                    if isinstance(model_call_details["litellm_params"]["metadata"], dict):
                        model_call_details["litellm_params"]["metadata"]["_tracking_id"] = tracking_id

            # ── Sello de lambda para el HISTORICO (LiteLLM_SpendLogs) ─────────────
            #
            # Se escribe en `data`, que es lo que el proxy propaga, NO en el
            # logging_obj: probado que por ahi no llega (dos intentos, filas con
            # spend_logs_metadata=null teniendo el head accesible y stamping=true).
            # Este es el MISMO sitio donde LiteLLM mete el spend_logs_metadata que
            # llega por la cabecera x-litellm-spend-logs-metadata —
            # `data[_metadata_variable_name].update(metadata_from_headers)` en
            # litellm_pre_call_utils.py — y esa via esta verificada de punta a punta.
            #
            # Y TIENE que ir dentro de `spend_logs_metadata`, no como clave plana:
            # `_get_spend_logs_metadata` filtra con
            # `{k: metadata.get(k) for k in SpendLogsMetadata.__annotations__}` —
            # una allowlist, lo que no es campo declarado del TypedDict se tira EN
            # SILENCIO. La doc marca esto como "enterprise", pero este build no
            # tiene gate de premium_user (verificado con premium_user=False y un
            # sello real persistido en SQL).
            # Fuera del try: el tracker de abajo los reusa, y si el sellado fallara
            # antes de asignarlos el arranque del tracking moriria por NameError —
            # perdiendo la peticion entera del panel por un fallo del sello.
            _rl = None
            _rt_key = None
            try:
                _rl, _rt_key = await _refusal_lambda_for_async(model, api_base)
                if _rl is not None:
                    # "metadata" en chat/completions; "litellm_metadata" en
                    # threads/assistants. Se respeta el que ya traiga la peticion.
                    _mvar = "litellm_metadata" if "litellm_metadata" in data else "metadata"
                    _meta = data.get(_mvar)
                    if not isinstance(_meta, dict):
                        _meta = {}
                        data[_mvar] = _meta
                    _slm = _meta.get("spend_logs_metadata")
                    if not isinstance(_slm, dict):
                        _slm = {}
                        _meta["spend_logs_metadata"] = _slm
                    # str(): LiteLLM serializa este dict a JSON tal cual, y un float
                    # 1.5 vs "1.5" complica el filtrado en SQL.
                    _slm["refusal_lambda"] = str(_rl)
                    # QUE runtime lo sello. Con dos modelos con dial, el numero solo
                    # ya no identifica nada: 1.0 es "encendido" en Qwen3.8 y
                    # "encendido a medias" en DeepSeek. Va DENTRO de
                    # spend_logs_metadata, que es un dict libre; una clave nueva
                    # fuera de ahi la tira la allowlist de SpendLogsMetadata en
                    # silencio. Se AÑADE: `refusal_lambda` no se renombra, lo
                    # consume el historico del panel por SQL.
                    _slm["refusal_runtime"] = str(_rt_key)
            except Exception as e:
                log.warning("refusal stamp error: %s", e)
            try:
                request_tracker.start(
                    tracking_id,
                    trace_id=_litellm_trace_id(data),
                    key_alias=key_alias,
                    model=model,
                    call_type=call_type,
                    api_base=api_base,
                    # Cacheado: esta es la MISMA lectura que la del sello de arriba,
                    # dentro de la misma ventana de TTL. No hay segunda llamada HTTP.
                    refusal_lambda=_rl,
                    refusal_runtime=_rt_key,
                )
            except Exception as e:
                log.debug("track_start error: %s", e)

            return data

        def pre_call_hook(self, user_api_key_dict, cache, data, call_type):
            for p in self.STRIP_PARAMS:
                data.pop(p, None)
            return data

        async def async_log_success_event(self, kwargs, response_obj, start_time, end_time):
            try:
                _update_tracking_from_payload(
                    kwargs,
                    response_obj,
                    force_flush=True,
                )
            except Exception as e:
                log.debug("track_success_usage error: %s", e)
            _track_end_from_payload(kwargs, "log_success")

        async def async_log_stream_event(self, kwargs, response_obj, start_time, end_time):
            try:
                _update_tracking_from_payload(kwargs, response_obj)
            except Exception as e:
                log.debug("track_stream error: %s", e)

        async def async_log_failure_event(self, kwargs, response_obj, start_time, end_time):
            _track_end_from_payload(kwargs, "log_failure")

        async def async_post_call_success_hook(self, data, user_api_key_dict, response):
            try:
                _update_tracking_from_payload(
                    data,
                    response,
                    force_flush=True,
                )
            except Exception as e:
                log.debug("track_proxy_success_usage error: %s", e)
            _track_end_from_payload(data, "proxy_success")
            return None

        async def async_post_call_streaming_iterator_hook(self, user_api_key_dict, response, request_data):
            try:
                async for chunk in response:
                    try:
                        _update_tracking_from_payload(request_data, chunk)
                    except Exception as e:
                        log.debug("track_iterator_chunk error: %s", e)
                    yield chunk
            finally:
                _track_end_from_payload(request_data, "streaming_iterator")

        async def async_post_call_failure_hook(
            self,
            request_data,
            original_exception,
            user_api_key_dict,
            traceback_str=None,
        ):
            _track_end_from_payload(request_data, "proxy_failure")
            return None

        async def async_post_call_success_deployment_hook(
            self,
            request_data,
            response,
            call_type,
        ):
            try:
                _update_tracking_from_payload(
                    request_data,
                    response,
                    force_flush=True,
                )
            except Exception as e:
                log.debug("track_deployment_success_usage error: %s", e)
            _track_end_from_payload(request_data, "deployment_success")
            return response

    # Every alias served by our own vLLM deployments. `local` and the v024-f2
    # names were dropped on 2026-07-27: their deployments were deleted on 07-26.
    LOCAL_VLLM_ALIASES = AUTO_ROUTED_MODELS | {
        # 2026-08-15: retirados dense/dense-reasoning/dense-uncensored/taxonomy.
        # Queda un solo alias local para el 27B.
        "tooling",
        # Los cuatro perfiles de pensamiento: mismo backend residente, asi que la
        # telemetria de vLLM local tiene que contarlos igual.
        "agent",
        "high",
        "max",
        "ornith",
        "ornith-1.0",
        "ornith-canary",
        "deepseek-v4-flash-0731",
        "qwen38-27b",
    }

    HOSTED_MODEL_PREFIXES = ("cloudblue/", "e-dani/")

    def _is_local_vllm_request(model, proxy_model, api_base):
        # The hook may have rewritten an originally local `tooling` request to a
        # hosted Luna fallback. The resolved model wins over proxy_model here;
        # otherwise compute-mode admission would turn that valid fallback back
        # into a 503 merely because the original body still says `tooling`.
