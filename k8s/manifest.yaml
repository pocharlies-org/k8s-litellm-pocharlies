      model_info: { mode: chat, supports_vision: true, supports_reasoning: true, supports_low_reasoning_effort: true, supports_xhigh_reasoning_effort: true, supports_max_reasoning_effort: true, supported_reasoning_efforts: [low, medium, high, xhigh, max], max_input_tokens: 272000 }
