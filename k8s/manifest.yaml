    # nada mas completar el login de pocharlies (account 3684972b-...):
    #   gpt-5.6-terra, gpt-5.6-luna, gpt-5.5, gpt-5.4-mini  (+ codex-auto-review, hide)
    # `gpt-5.6-sol` NO lo sirve esta cuenta. El primer despliegue lo publicaba por
    # analogia con la cuenta anterior y devolvia un 403 con una PAGINA HTML de
    # ChatGPT — no un JSON de error, asi que ni se parece a un modelo desconocido.
    #
    # OJO CON `gpt-5.6-luna`: la key `sauvage-shield` lo lleva en su allowlist
    # explicito desde antes de la purga del 21-08 (['tooling','gpt-5.6-luna',
    # 'qwen35-4b']). Era una entrada MUERTA mientras el alias no existia; al
    # republicarlo, esa key lo hereda SOLA sin que nadie la toque. Lo unico que lo
    # impide es que `luna` este en CODEX_ONLY_MODELS. Si algun dia se quita de ahi,
    # se le esta dando una cuenta ChatGPT a sauvage-shield sin quererlo.
    - model_name: gpt-5.6-terra
      litellm_params: &codex_bridge_params
        model: openai/gpt-5.6-terra
        api_base: http://litellm-codex.litellm.svc.cluster.local:4000/v1
        api_key: os.environ/LITELLM_CODEX_BRIDGE_KEY
        timeout: 600
        # Sin reintentos: el volumen que llega a OpenAI es el que pide el cliente.
        num_retries: 0
      model_info: &codex_bridge_info
        mode: chat
        backend: codex-bridge-pocharlies
        max_input_tokens: 272000
        max_output_tokens: 128000
        supports_function_calling: true
        # La cuenta declara text+image en los cuatro. Esto es POLITICA, no un limite
        # del modelo: el desvio de vision a ChatGPT es la via por la que el catalogo
        # de airsoft provoco los baneos del 20/21-08.
        supports_vision: false
        supports_reasoning: true
        # 96 llamadas/dia por replica contra la cuenta serian trafico plano 24/7 con
