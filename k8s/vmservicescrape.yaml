apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: litellm
  namespace: litellm
spec:
  # INFRA-882: `selector: {}` atrapaba TODOS los Services del namespace, incluido
  # `plan-gateway` (puerto http=4002), cuyo /metrics responde 404 -> TargetDown y
  # TooManyScrapeErrors permanentes. Los LiteLLM proxy (litellm, litellm-alibaba,
  # litellm-openrouter) comparten el selector `app: litellm`; plan-gateway usa
  # `app: plan-gateway`. Acotar aqui deja fuera plan-gateway (y litellm-valkey, que
  # ademas no tiene puerto http) sin perder ningun target de LiteLLM.
  selector:
    matchLabels:
      app: litellm
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
