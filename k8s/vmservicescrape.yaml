apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: litellm
  namespace: litellm
spec:
  # INFRA-882: `selector: {}` atrapaba TODOS los Services del namespace, incluido
  # `plan-gateway` (puerto http=4002), cuyo /metrics responde 404 -> TargetDown y
  # TooManyScrapeErrors permanentes. El selector mira las etiquetas del SERVICE (no
  # su spec.selector de pods): solo los tres proxies (litellm, litellm-alibaba,
  # litellm-openrouter) llevan `app: litellm` en metadata (k8s/manifest.yaml); asi
  # quedan fuera plan-gateway, litellm-active-peers y litellm-valkey.
  selector:
    matchLabels:
      app: litellm
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
