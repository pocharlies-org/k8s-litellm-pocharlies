  - id: dgx.litellm.openrouter-account-upstream.v1
    kind: http-route
    value: /admin/openrouter-account
    role: publisher
    files:
      - k8s/manifest.yaml
    status: active
    note: >-
      Ruta del saldo/cupo de OpenRouter que publica el hook de litellm-config y
      llama el panel (dgx-infra, services/dashboard/api/routes_openrouter.py,
      ACCOUNT_PATH; contrato gemelo dgx.litellm.openrouter-account.v1). Nace bajo
