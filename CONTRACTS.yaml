# CONTRACTS.yaml — superficie de contrato de k8s-litellm-pocharlies.
#
# Formato común de la casa (ver ~/k8s/synapse/CONTRACTS.yaml y el checker
# genérico k8s-gitops-pocharlies/scripts/check-contracts.py). Reglas y vía de
# excepción: skill `synapse-contracts`. Lo existente NO muta: breaking =
# entrada nueva `.vN+1` + deprecación de la vieja; retirar = `status: removed`
# (tombstone), nunca borrar. Un commit que toca superficie lleva el trailer
# `Contract-Change: <accion> <id>` y actualiza este fichero en el mismo push.
version: 1
registry: synapse:libs/synapse-contracts/registry.yaml
contracts:
  - id: dgx.claude.class-header.v1
    # kind 'schema' y no 'http-header': el checker (k8s-gitops-pocharlies
    # scripts/check-contracts.py) solo admite allowlist|cloudevent|http-route|
    # queue|routing-key|schema|workflow-file. Una cabecera con valor cerrado
    # es convencion de datos entre procesos -- el mismo kind que
    # bus.routing_key_format en synapse.
    kind: schema
    value: x-claude-class
    role: consumer
    files:
      - dev/session_router.py
      - k8s/manifest.yaml
    status: active
    note: >-
      Session-class request header stamped by the x86 claude-local-router
      wrapper for company-launched (supervisor/headless) sessions — the
      publisher lives in x86-host-runtime (separate PR); this repo consumes
      it in the LiteLLM session-routing hook. Value "company" takes the
      session out of the global instant_reject valve and puts it under the
      company Alibaba switch (company.alibaba of dgx.model-routing.config.v1,
      2026-09-23, superseding the 2026-09-21 "company never overflows"):
      switch on, it overflows to Alibaba once local_slots are in flight at
      the resident (all resident names counted as one budget) or the vLLM
      queue has not emptied for SESSION_ROUTER_WAIT_TOLERANCE_S (default 5 s),
      whatever instant_reject says; the overflow moves the whole session
      (sticky, TTL renewed on every request = 10 min of inactivity) so its
      prefix cache stays warm on one side; switch off, it is sealed.
      The header cannot bypass sealed requests, uncensored aliases, explicit
      panel plans or admission; it is forgeable by any keyed client, whose
      only effect is to get the company's overflow policy. Absent or any
      other value keeps the instant_reject behavior; any read error is
      fail-open.
      Since 2026-09-23 the value "company" also gates the company Alibaba
      switch (field company.alibaba of dgx.model-routing.config.v1): when it
      is false, company requests are sealed with disable_fallbacks and an
      explicit alibaba-* model is rejected with 403. Forging the header only
      restricts the forger. The hook reads the header from headers,
      metadata.headers AND litellm_metadata.headers: on LiteLLM's
      LITELLM_METADATA_ROUTES (/v1/messages, i.e. all of Claude Code) the
      request headers land in litellm_metadata, measured live 2026-09-23.
  - id: dgx.model-routing.config.v1
    kind: http-route
    value: /api/model-routing/config
    role: consumer
    files:
      - dev/session_router.py
      - k8s/manifest.yaml
    status: active
    note: >-
      Consumer side of the dashboard contract (publisher: dgx-infra
      services/dashboard/routes_model_routing.py). session_router.py pulls it
      with a 5 s TTL, stale-while-revalidate and last-known-good; every field
      is re-sanitised and unknown keys are ignored. Reads sticky,
      instant_reject, local_slots, default_plan, session_plans and, since
      2026-09-23, the additive company = {claude, alibaba} (only an explicit
      false switches anything off).
  - id: dgx.litellm.service-alias.alibaba.v1
    kind: http-route
    value: litellm-alibaba
    role: provider
    files:
      - k8s/manifest.yaml
    status: active
    note: >-
      Service alias of `litellm` (same selector and port 4000) consumed by
      Hermes (k8s-openclaw-qwen36-pocharlies helm/hermes/values.yaml,
      extraProviders[alibaba].baseUrl) so its /model picker renders the
      `alibaba-*` aliases in their own row, separate from the DGX Spark
      resident. Hermes groups picker rows by (base_url, credential,
      api_mode), so the distinct host is the whole point. Not a backend:
      routing stays by model name.

  - id: litellm.reasoning-effort.v1
    kind: schema
    # `supported_reasoning_efforts` es el literal que comparten las dos mitades
    # del contrato: el menu que el proxy publica (model_info del model_list) y
    # la tabla `THINKING_KWARGS` del hook que lo honra. Ambos viven en el mismo
    # fichero; el marcador `# CONTRACT:` esta sobre THINKING_KWARGS.
    value: supported_reasoning_efforts
    role: provider
    files:
      - k8s/manifest.yaml
    status: active
    note: >-
      Cross-process contract between this proxy and its LLM clients (opencode,
      OpenClaw, Claude Code). The proxy publishes a reasoning-effort vocabulary
      in `supported_reasoning_efforts`; clients read it, paint a menu, and send
      `reasoning_effort` (OpenAI) or `thinking` (Anthropic) back. The hook's
      THINKING_KWARGS must translate EVERY advertised level into a value the
      resident backend actually honors — otherwise the client silently gets a
      different model. This is exactly what broke on 2026-09-22: commit 8022440
      removed the `high` clamp and sent `high` raw to qwen38-flash-next, whose
      chat template rejects it (400); the router fallback then served every
      "high" session from Alibaba under a different model id, with no repo test
      failing. Repaired by translating `high`->`xhigh` (the template's real
      ceiling). Any future edit to the advertised levels or to THINKING_KWARGS
      is a change to this contract: keep both sides consistent, and remember the
      backend's accepted set is a property of the model's Jinja, not of vLLM.
      The guarantee is TOTAL, not just over the advertised set: once the hook has
      translated a level into chat_template_kwargs for a local grading model it
      strips ANY client-supplied reasoning_effort/thinking carrier, so a value
      OUTSIDE the vocabulary (another provider's `minimal`, `auto`, a typo, the
      empty string) can never travel raw and 400 either — it falls back to the
      alias default level. Guarded by
      tests/test_messages_thinking_contract.py::test_esfuerzo_no_reconocido_no_viaja_crudo.
      Since 2026-09-23 `qwen38-flash-next` and `qwen38-flash-next-uncensored`
      ADVERTISE only the model's official recipe [none, low, medium, xhigh]:
      `high`/`max` both landed on `xhigh`, so the menu showed three identical
      options. They are withdrawn from the menu only — clients that still SEND
      high/max keep being translated (CLIENT_EFFORT_TIERS), so no sender breaks.
      Same recipe for `tooling`/`tooling-uncensored` since 2026-09-23. The
      thinking-off aliases `qwen38-off`/`qwen38-u-off` advertise only [none]
      and the hook forces them off whatever effort the client sends.
