# CONTRACTS.yaml — superficie de contrato de k8s-litellm-pocharlies.
#
# Formato común de la casa (ver ~/k8s/synapse/CONTRACTS.yaml y el checker
# genérico k8s-gitops-pocharlies/scripts/check-contracts.py). Reglas y vía de
# excepción: skill `synapse-contracts`. Lo existente NO muta: breaking =
# entrada nueva `.vN+1` + deprecación de la vieja; retirar = `status: removed`
# (tombstone), nunca borrar. Un commit que toca superficie lleva el trailer
# `Contract-Change: <accion> <id>` y actualiza este fichero en el mismo push.
version: 1
registry: synapse:libs/synapse-contracts/registry.yaml
contracts:
  - id: dgx.claude.class-header.v1
    # kind 'schema' y no 'http-header': el checker (k8s-gitops-pocharlies
    # scripts/check-contracts.py) solo admite allowlist|cloudevent|http-route|
    # queue|routing-key|schema|workflow-file. Una cabecera con valor cerrado
    # es convencion de datos entre procesos -- el mismo kind que
    # bus.routing_key_format en synapse.
    kind: schema
    value: x-claude-class
    role: consumer
    files:
      - dev/session_router.py
      - k8s/manifest.yaml
    status: active
    note: >-
      Session-class request header stamped by the x86 claude-local-router
      wrapper for company-launched (supervisor/headless) sessions — the
      publisher lives in x86-host-runtime (separate PR); this repo consumes
      it in the LiteLLM session-routing hook. Value "company" takes the
      session out of the global instant_reject valve and puts it under the
      company Alibaba switch (company.alibaba of dgx.model-routing.config.v1,
      2026-09-23, superseding the 2026-09-21 "company never overflows"):
      switch on, it overflows to Alibaba once local_slots are in flight at
      the resident (all resident names counted as one budget) or the vLLM
      queue has not emptied for SESSION_ROUTER_WAIT_TOLERANCE_S, whatever
      instant_reject says. Deployed tolerance since 2026-09-27 is 20 s via
      that env on the litellm Deployment; the code default is still 5 s, so a
      pod without the env would use 5. Measured 2026-09-27 21:11: the valve
      diverted a session with en_vuelo=5 of slots=12 and cola_vllm=4.0 — with
      MAX_NUM_SEQS=16 and MAX_MODEL_LEN=262144 a ~20-28k-token agent context
      takes more than 5 s per batch to prefill, so a non-empty queue is normal
      operation and 5 s diverted sessions on noise, worst right after a
      resident rollout (cold engine, empty prefix cache). What the knob does
      NOT do: _queue_stuck measures "queue continuously non-empty for T", not
      "this request has waited T", so under sustained load raising T delays
      the diversion instead of preventing it — keeping an interactive session
      on the resident is overflow_exempt's job, not T's. The overflow moves the whole session
      (sticky, TTL renewed on every request: since 2026-09-26 30 min of
      inactivity bound local, 5 min bound to Alibaba; since 2026-09-27 60 min
      bound to Alibaba — the return became a rule of the KV token-budget
      valve, not a TTL expiry) so its
      prefix cache stays warm on one side; switch off, it is sealed.
      The header cannot bypass sealed requests, uncensored aliases, explicit
      panel plans or admission; it is forgeable by any keyed client, whose
      only effect is to get the company's overflow policy. Absent or any
      other value keeps the instant_reject behavior; any read error is
      fail-open.
      DGX-1066 (2026-10-18, Dani): both valves (company overflow and
      instant_reject) only move a conversation with no prior assistant
      turn; one that already has context queues on the resident.
      Since 2026-09-23 the value "company" also gates the company Alibaba
      switch (field company.alibaba of dgx.model-routing.config.v1): when it
      is false, company requests are sealed with disable_fallbacks and an
      explicit alibaba-* model is rejected with 403. Forging the header only
      restricts the forger. The hook reads the header from headers,
      metadata.headers AND litellm_metadata.headers: on LiteLLM's
      LITELLM_METADATA_ROUTES (/v1/messages, i.e. all of Claude Code) the
      request headers land in litellm_metadata, measured live 2026-09-23.
      SC-2504 (2026-10-16, Dani): the switch is for the company's work (stories, epics, Requests), not for its
      supervisor: a company request whose x-hermes-profile is in ALIBABA_SIEMPRE (today {"cto"}) is neither sealed nor
      rejected, so the CTO of Hermes keeps its alibaba-* fallback with the switch off. Read from the same three header
      sources; forging it only costs Alibaba spend, attributed to the forger's key.
  - id: dgx.session-router.sticky-key.v1
    kind: schema
    value: session-router:sticky:<sid>
    anchor: "session-router:sticky:"
    role: publisher
    files:
      - dev/session_router.py
      - k8s/manifest.yaml
    status: active
    note: >-
      Publisher side (consumer: dgx-infra services/dashboard/api/
      session_routing_stats.py, read-only SCAN + GET/TTL). Valkey
      litellm-valkey db 0, value local|alibaba, only for default-plan
      sessions. Since 2026-09-23 the TTL is of INACTIVITY (renewed on every
      request of the session); since 2026-09-26 it depends on the value:
      local 1800 s, alibaba 300 s (was 600 s for both); since 2026-09-27
      alibaba 3600 s — the KV token-budget valve (dgx.session-router.sessions-hash.v1)
      made the return from Alibaba a RULE (compacted and fits, or born at
      least alibaba_return_after_s ago and fits) instead of a TTL expiry:
      a 5-minute pause must not drag a 150k-token session back cold
      mid-conversation. <sid> is the client session id when
      there is one, or pfx-<24 hex> — a hash of api-key alias + system + first
      user message — for clients that send none (opencode, hermes), so a
      whole conversation keeps its affinity. Values unchanged. The pfx- hash
      is computed AFTER the hook strips Claude Code's x-anthropic-billing-header
      system block (2026-09-23), so it no longer carries that per-conversation
      suffix.
      Since 2026-10-18 (DGX-1076) it is also computed after the hook moves
      Claude Code's project memory path out of the system into the first
      user message: the hash input still holds it, so conversations of
      different directories keep distinct keys; a client without session id
      that sends that path gets a new key once, on deploy.
  - id: dgx.session-router.sessions-hash.v1
    kind: schema
    value: session-router:sessions
    anchor: "session-router:sessions"
    role: publisher
    files:
      - dev/session_router.py
      - k8s/manifest.yaml
    status: active
    note: >-
      KV token-budget ledger (2026-09-27, precedence 4b/4c). Valkey
      litellm-valkey db 0, one HASH: field <sid> -> json {"t": estimated
      prompt tokens, "ts": epoch}. Written (HSET, fire-and-forget) by every
      request the router sends to the resident — default-plan sessions and
      explicit local-plan sessions (they occupy cache alike); read by a
      background poller (HGETALL + prune-on-read HDEL) that sums the LIVE
      sessions (activity within session_idle_s) across all LiteLLM replicas.
      A NEW session whose estimate plus that sum exceeds kv_budget_pct of the
      engine's KV capacity is bound to Alibaba instead of cold-evicting an
      idle session's prefix; capacity is discovered at runtime from
      vllm:cache_config_info (the exact kv_cache_size_tokens label, which on
      the hybrid resident equals the startup log's "GPU KV cache size"; the
      num_gpu_blocks x block_size product overestimates ~14% there and is the
      fallback for older vLLM) — the budget is a
      PERCENTAGE, never a fixed token count, because it changes with the
      resident model. Companion key session-router:albind:<sid> (SETNX, TTL
      24 h, deleted on return to local): epoch when the session was born in
      Alibaba, the clock for the return rule alibaba_return_after_s. No
      INCR/DECR/ZSET anywhere (mandate 1 stands): each pod rewrites its own
      session's entry idempotently and the total is a read-time sum; an
      empty or lost Valkey rebuilds itself from the next requests
      (fail-open). Consumer today: this module only (the dashboard reads
      sticky keys, not this hash).
  - id: dgx.session-router.alibaba-account-pin.v1
    kind: schema
    value: alibaba_account_pin:v1:<api-key-hash>:<sid>
    anchor: "alibaba_account_pin:v1:"
    role: publisher
    files:
      - dev/session_router.py
      - k8s/manifest.yaml
    status: active
    note: >-
      Una sesion vive en UNA cuenta de Alibaba en TODOS los grupos alibaba-*.
      Publisher y lector: session_router.alibaba_account_filter, llamado por el
      Router en cada eleccion de deployment a traves de
      StripUnsupportedParams.async_filter_deployments. Valkey del session router
      (litellm-valkey, db de REDIS_URL); valor "k1" | "k2" (sufijo del
      model_info.id estable `<grupo>-kN`); SET NX = gana el primero. <api-key-hash>
      = user_api_key_hash (sha256).

      TTL DE INACTIVIDAD ALIBABA_ACCOUNT_PIN_TTL_SECONDS, default
      STICKY_TTL_ALIBABA_SECONDS (1 h) y keepalive (`EXPIRE`) en cada acierto: el
      pin defiende la caché de prefijo de la cuenta, y esa caché no aguanta pausas
      largas — el mismo instante en que el vinculo de plan a Alibaba da el prefijo
      por perdido. Desde ese hueco la sesion se re-sortea, y como el prefill frio ya
      se paga en la cuenta vieja, mudar es gratis. (Antes del 2026-10-05 eran 30
      dias = el ciclo del plan: el pin sobrevivía al prefijo y el reparto por cupo
      nunca reasignaba nada; DGX-592.) La memoria local del pod
      (`_account_pins_local`) caduca por tiempo igual que el pin y solo se consulta
      cuando la lectura de Valkey FALLA: un GET correcto que devuelve None es un pin
      caducado, no una lectura fallida.

      Cuenta de una sesion nueva o caducada = sha256(api-key-hash:sid:epoca) sobre los
      tramos de `alibaba_account_weights` = {"kN": peso >= 0} (cupo diario restante
      de cada cuenta, lo proyecta el dashboard en /api/model-routing/config desde
      2026-09-29): el hash se lee como un punto de [0,1) y cae en la cuenta cuyo
      tramo acumulado lo contiene, asi que las sesiones se reparten en proporcion al
      cupo. Ausente, invalido o sin cubrir todas las cuentas = pesos IGUALES, y el
      uniforme y el ponderado son la MISMA formula de tramos (sin pesos = tramos de
      1), no dos lecturas del hash — con dos lecturas un pod con la caché de config
      en frio elegia otra cuenta que un pod caliente y las sesiones se mezclaban
      entre replicas. La eleccion es determinista: las replicas coinciden sin hablar
      entre si y sin Valkey.

      Cambios de cuenta a mitad de vida del pin: la suya sin deployment sano en el
      grupo pedido (cooldown/retirada) -> mudanza ENTERA y el pin se reescribe (sin
      vuelta), y el re-sorteo al caducar el TTL. Tests:
      tests/test_alibaba_account_affinity.py (unitarios) y
      tests/integration/run_alibaba_account_affinity.sh (Router real de la imagen
      pineada + Valkey real + dos pods, job de CI).

      ADITIVO (DGX-619, 2026-10-06): una peticion SIN sid (ni cabecera ni prefijo)
      ya no pasa intacta: el filtro sortea la cuenta con `draw_account` — la MISMA
      formula de tramos sobre `alibaba_account_weights` que una sesion nueva, sobre
      un id aleatorio — entre las cuentas con deployment sano, SIN escribir pin ni
      tocar Valkey, fail-open a la lista completa ante cualquier excepcion. La
      clave, el valor y el TTL del pin estan intactos: el 50/50 que gastaba la
      cuenta sin cupo era efecto del simple-shuffle del Router, no promesa de este
      contrato (precedente de parrafos ADITIVO: dgx.litellm.priority-field.v1; sin
      .v2). `draw_account` y `warm_config` son el seam publico unico del selector:
      el futuro gateway de media del plan (DGX-621) los llama literalmente,
      prohibida cualquier formula propia.

      ADITIVO (DGX-639, 2026-10-07): la cuenta de una sesion nueva o caducada se
      sortea con la epoca de ventana `floor(time.time() /
      ALIBABA_ACCOUNT_PIN_TTL_SECONDS)` dentro del hash: el re-sorteo tras caducar el
      pin es independiente del anterior (antes el hash daba SIEMPRE el mismo punto y
      una sesion pesada con sid estable, p. ej. hermes-batch, caia en la misma cuenta
      en cada re-sorteo). Dentro del TTL el pin manda y no se re-sortea; las replicas
      coinciden sin hablar entre si (mismo reloj de pared; en el borde de ventana
      manda el SET NX); clave, valor y TTL intactos; `draw_account` sin cambios (sin
      .v2: es la entrada del hash que ya describe esta nota, no la superficie).

      ADITIVO (DGX-1036, 2026-10-17, Dani): una cuenta con peso 0 en
      `alibaba_account_weights` sale de `by_account` ANTES de consultar el pin, asi
      que una sesion clavada en ella MUDA en su primer intento en vez de pagar un 429
      en cada vuelta (el cooldown de Alibaba dura 60 s: la cuenta muerta volvia a la
      rotacion un minuto despues y el pin la reclamaba). Peso 0 es senal de cupo, no
      de precio: `pesos_cuentas_alibaba` lo saca del % restante de la ventana mensual,
      por debajo de su suelo. Un peso bajo NO mueve a nadie —la afinidad de arriba
      sigue igual—, y si la unica cuenta sana es la del 0 la lista se queda intacta
      (mejor intentarlo que un grupo sin deployment). Clave, valor, TTL y formula de
      tramos intactos; sin .v2 por el mismo motivo que DGX-619: «el pin manda sobre el
      peso» no era promesa de este contrato — la mudanza solo estaba descrita por
      falta de deployment sano.
  - id: dgx.session-router.resident-backend-pin.v1
    kind: schema
    value: resident_backend_pin:v1:<api-key-hash>:<sid>
    anchor: "resident_backend_pin:v1:"
    role: publisher
    files:
      - dev/session_router.py
      - k8s/manifest.yaml
    status: active
    note: >-
      DGX-852 (2026-10-14, Dani): una conversacion vive en UN motor del residente.
      Desde el 2+1 `qwen38-flash-next` lo sirven DOS vLLM independientes con el
      MISMO modelo (par TP=2 en dgx2+dgx1, ~3,2M de tokens KV y 16 secuencias;
      TP=1 en dgx3, ~1,0M y 8) y sus cachés de prefijo NO se comparten: un turno
      que cambia de motor re-prefría el contexto entero (25-30 s medidos a 64K).
      Criterio de Dani: un solo pool, cada conversacion clavada a un backend y las
      nuevas repartidas por capacidad.

      DGX-955h (2026-10-18, Dani): capacidades medidas y recortadas — TP=2 16->8
      secuencias (prefill x2,8 mas lento de 8 a 16 en vuelo, 16.100->5.700 tok/s) y
      TP=1 8->5. Afecta a `least_loaded_backend` (plazas = slots - en marcha/cola) y a
      la valvula de desborde (SESSION_ROUTER_VLLM_SLOTS default 16,8 -> 8,5).
      Tras el corte de luz del mismo dia: un backend cuyo /metrics no contesta
      mientras otro si sale del reparto (`live_backends`) y su sesion ligada muda;
      la admision llm-tp acepta el TP=1 de dgx3 (`qwen38-worker-dgx3`) como
      alternativa al par TP=2. Clave y valor del pin sin cambios.

      DGX-1103 (2026-10-18, Dani): un timeout ya no aparca a un gemelo en el Router
      (`model_info.allowed_fails_policy.TimeoutErrorAllowedFails` sin techo en los
      cuatro `-tpN`), asi que la mudanza de sesiones queda para el motor caido (500 o
      /metrics mudo), no para el saturado. Clave y valor del pin sin cambios.

      DGX-1146 (2026-10-20, Dani): `model_info.cooldown_time` de los gemelos del residente
      de 900 a 360 s. El OOM del 20-10 tumbo el TP=2, que volvio solo en ~220 s, y el pin
      lo dejo aparcado 15 min con Alibaba en 429. Cuanto dura la expulsion, no cuando se
      dispara ni a donde se muda. Clave y valor del pin sin cambios.

      Publisher y lector: session_router.resident_backend_filter, llamado por el
      Router en cada eleccion de deployment a traves de
      StripUnsupportedParams.async_filter_deployments, DESPUES del filtro de cuenta
      de Alibaba y cada uno fail-open por su cuenta. Valkey del session router
      (litellm-valkey, db de REDIS_URL); valor "tpN" = sufijo del model_info.id
      estable `<alias>-tpN` del deployment (los ids son explicitos en el
      model_list: son a la vez la clave del pin, la del cooldown del Router y la
      del filtro); SET NX = gana el primero. <api-key-hash> = user_api_key_hash
      (sha256), igual que en Alibaba, pero es OTRA familia de claves: la misma sid
      puede estar clavada a la cuenta k1 de Alibaba y al backend tp2 del
      residente, y los dos pines se leen y se escriben por separado.

      TTL DE INACTIVIDAD RESIDENT_BACKEND_PIN_TTL_SECONDS, default
      STICKY_TTL_LOCAL_SECONDS (30 min) y keepalive (`EXPIRE`) en cada acierto: lo
      que defiende es la caché de prefijo del MOTOR y el vinculo de la sesion a
      local caduca a la vez. La memoria local del pod (`_backend_pins_local`,
      tope compartido `_PINS_LOCAL_MAX`) caduca igual y solo se consulta cuando la
      lectura de Valkey FALLA.

      Backend de una sesion nueva o caducada (DGX-974, 16-10): el que tenga MAS
      plazas libres en ese momento, `--max-num-seqs` (SESSION_ROUTER_VLLM_SLOTS)
      menos en marcha y en cola de la ultima lectura fresca de SU /metrics (el
      sondeo de la valvula; cada deployment se casa con su /metrics por su
      api_base), menos lo que ese pod ya le dio desde la lectura. Solo con Valkey,
      cuyo SET NX hace coincidir a las dos replicas. Con empate, sin lectura fresca
      o sin Valkey: sha256(api-key-hash:sid:epoca)
      sobre los tramos de `SESSION_ROUTER_RESIDENT_WEIGHTS` (env, default
      "tp2=3,tp1=1" desde DGX-950, decision de Dani del 16-10: con "tp2=2,tp1=1"
      (DGX-897, 14-10) el TP=1 se llenaba y hacia cola con plazas libres en el TP=2;
      antes de DGX-897 ya era 3:1 y el TP=1 se quedaba casi sin trabajo; NO
      `alibaba_account_weights`, que es cupo gastado y otra decision). Pesos que
      no cubren todos los backends o que suman 0 = reparto uniforme, la MISMA
      formula de tramos que Alibaba. Determinista: las dos replicas coinciden sin
      Valkey. Peticion sin sid (ni cabecera ni prefijo de conversacion): el motor
      con mas plazas libres, o si no el sorteo ponderado de `preferred_backend`,
      SIN escribir pin.

      Mudanza: el backend clavado se queda; si el Router lo dejo sin deployment
      sano (cooldown) la sesion MUDA ENTERA, el pin se reescribe y no vuelve. Sin
      pin y con UN solo backend en la lista la lista pasa INTACTA (`is`, no copia)
      y NO se escribe pin: una sesion que nace durante una caida no hereda una
      ligadura que no eligio nadie, y vuelve a sortearse cuando el gemelo vuelve.
      Cualquier excepcion = lista intacta.

      ADITIVO en esta misma entrada (no .v2): el sid tiene que llegar al filtro,
      que solo ve `request_kwargs`; `stamp_resident_session_affinity` lo estampa
      en `metadata["session_id"]` en el pre_call_hook para los alias de
      `RESIDENT_FAMILY`, con el mismo extractor que el vinculo sesion->plan.
      Tests: tests/test_resident_backend_affinity.py (unitarios, valkey de pega) y
      los contratos del model_list gemelo en tests/test_dense_uncensored_contract.py
      y tests/test_model_limits_contract.py.
  - id: dgx.session-router.deployment-affinity-key.v1
    kind: schema
    value: deployment_affinity:v1:session:<grupo>:<api-key-hash>:<sid>
    anchor: "deployment_affinity:v1:"
    role: consumer
    files:
      - dev/session_router.py
      - k8s/manifest.yaml
    status: deprecated
    replaced_by: dgx.session-router.alibaba-account-pin.v1
    remove_after: "2026-10-31"
    note: >-
      DEPRECATED 2026-09-28: sustituido por dgx.session-router.alibaba-account-pin.v1.
      El session_affinity nativo por grupo quedo retirado (auditoria: pin por
      GRUPO, soltaba la sesion a la otra cuenta en un cooldown y volvia, TTL
      de 1 h; con el Router real v1.100.0, 100 de 100 sesiones que usaban
      varios grupos acababan en las dos cuentas). Estas claves ya no las
      escribe nadie; session_router solo las LEE para sembrar la cuenta de
      las sesiones que ya tenian pin (expiran solas en 1 h). Historia:
      2026-09-26 (segunda cuenta de Alibaba). Clava cada sesion a UN
      deployment (cuenta) dentro de un grupo alibaba-*: el cache de contexto
      de Model Studio es por cuenta y partir una conversacion entre las dos
      pagaria el prefijo en cada salto. Publisher y lector: el
      DeploymentAffinityCheck de litellm v1.100.0 (proceso del proxy) —
      nuestro hook NO escribe estas claves; solo alimenta el
      metadata["session_id"] que las indexa (pisando el id inestable que
      manda el cliente) y monta la Valkey sobre el DualCache del Router
      (ensure_affinity_redis), sin lo cual el pin vive solo por pod.
      Valkey litellm-valkey db 0; valor {"model_id": "<grupo>-k1|<grupo>-k2"}
      — ids explicitos y estables del manifiesto, vigentes por
      test_alibaba_second_key_affinity_contract; TTL =
      deployment_affinity_ttl_seconds (3600 s de inactividad, renovado en
      cada peticion, claim first-writer-wins). Los -k2 nacen con `order: 2`
      (inertes): el hook los sube a order 1 en memoria SOLO si
      DASHSCOPE_API_KEY_2 existe (ensure_alibaba_key2_active); sin la key
      el hook RETIRA los -k2 del Router y no estampa sid (la afinidad corre
      antes que el filtro de order: un pin nacido en un cooldown del -k1
      atrapaba la sesion en un -k2 sin key, 401 en bucle). Si el hook no
      carga, el order: 2 del YAML es la inercia.
      La Valkey (litellm-valkey) lleva la MISMA afinidad que el proxy: el
      claim se paga en cada peticion y el RTT del overlay entre nodos es
      ~27 ms p50 (medido 26-09). Desde 2026-10-18 (DGX-1090) esa afinidad es
      solo ubuntu, sin failover a sauvage: valor, Service y puerto no
      cambian. El minimo de
      orders se calcula solo entre declarados, por eso el -k1 declara 1.
  - id: dgx.model-routing.config.v1
    kind: http-route
    value: /api/model-routing/config
    role: consumer
    files:
      - dev/session_router.py
      - k8s/manifest.yaml
    status: deprecated
    replaced_by: dgx.model-routing.config.v2
    remove_after: "2026-10-31"
    note: >-
      DEPRECATED 2026-09-30 (DGX-454, C7 de DGX-451): sustituido por
      dgx.model-routing.config.v2 — misma ruta y mismos campos; cambia solo el
      default de bot_keys ([hermes-batch, aurora-rca] en vez de
      [hermes, aurora-rca]). Lo que sigue describe la superficie tal como era.
      Consumer side of the dashboard contract (publisher: dgx-infra
      services/dashboard/routes_model_routing.py). session_router.py pulls it
      with a 5 s TTL, stale-while-revalidate and last-known-good; every field
      is re-sanitised and unknown keys are ignored. Reads sticky,
      instant_reject, local_slots, default_plan, session_plans and, since
      2026-09-23, the additive company = {claude, alibaba} (only an explicit
      false switches anything off).
      Since 2026-09-25 it also reads the ADDITIVE field alibaba =
      {router_fallback, tooling_fallback, demos_fallback, overflow} (bools,
      only an explicit false switches one off): overflow=false stops every
      session_router rewrite to Alibaba, and alibaba_switches() hands the
      other three to litellm_strip_params.py (fallbacks:[] per request,
      TOOLING_FALLBACKS and KEY_TOOLING_FALLBACKS emptied).
      Since 2026-09-26 it also reads the ADDITIVE field overflow_exempt =
      {classes: [x-claude-class values], keys: [virtual key aliases]}: an
      exempt request skips the capacity valve (queues on the resident) and a
      non-operator sticky binding to Alibaba is released back to the
      resident. Absent or malformed = {classes: [company], keys: []}; an
      empty list saved from the panel = nobody exempt.
      Since 2026-09-27 it also reads the ADDITIVE KV-budget fields
      (precedence 4b/4c, defaults in the module so an old dashboard is fine):
      kv_budget_pct (int 1-100, 85) and bot_budget_pct (int 1-100, 60) — the
      percentage of the resident's discovered KV capacity that live local
      sessions may occupy, bots (x-claude-class company or key alias listed
      in bot_keys) held to the lower threshold; session_idle_s (int 30-86400,
      600) — a session counts as live while it shows activity inside this
      window; return_max_tokens (int 1000-1000000, 30000) and
      alibaba_return_after_s (int 60-86400, 600 since 2026-10-17 DGX-1028, 3600 before) — the rules that let an
      Alibaba-bound session come back (compacted and fits / born long enough
      ago and fits); bot_keys (list of lower-cased key aliases, default
      [hermes, aurora-rca]) — which keys are bots for the threshold. Unknown
      or malformed field = module default; the valve additionally stays off
      until KV capacity is discovered and the sessions hash has a fresh read
      (fail-open).
