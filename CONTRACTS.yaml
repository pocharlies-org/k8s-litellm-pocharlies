  - id: dgx.litellm.tool-call-arguments-json.v1
    kind: schema
    # El `value` es el campo del wire de OpenAI que el hook garantiza, no un
    # nombre nuestro: `arguments` del `function` de cada `tool_calls` de
    # `messages`. Se pone como literal `function.arguments` porque el checker
    # exige que el value aparezca tal cual en los ficheros listados.
    value: function.arguments
    role: publisher
    files:
      - k8s/manifest.yaml
      - tests/test_tool_call_arguments_json_contract.py
      - tests/test_alibaba_400_retry_policy_contract.py
    status: active
    note: >-
      2026-09-27. El hook (`litellm_strip_params.py`, `async_pre_call_hook`)
      GARANTIZA que todo `function.arguments` de un `tool_calls` del historial
      sale hacia el backend como cadena con un OBJETO JSON. Lo que no lo es se
      reescribe a `{"_raw": <texto original>}` y se loguea con el prefijo
      `tool_arguments:` (WARNING: el proceso proxy filtra INFO). Medido ese dia
      con el mismo historial contra los dos backends: `'{"path": ...}'`, `''` y
      `'{}'` dan 200 en ambos; `'no-es-json'`, `'"no-es-json"'` y `'[1,2]'`
      fallan en los DOS (residente 500, Alibaba 400) con el mismo texto
      `The "function.arguments" parameter of the code model must be in JSON
      format`. De ahi que la garantia sea INDEPENDIENTE del backend y del alias
      resuelto, y que ni un fallback `alibaba-q38-flash` -> residente ni dejar
      de declarar `tools` arreglen el caso: el valor viaja en `messages` y el
      otro backend lo rechaza igual. La reescritura es deliberadamente minima y
      eso es parte del contrato: NO toca cadena vacia, dict real, `None`, ni
      ninguna cadena que empiece por `{` (incluido JSON truncado, que Alibaba
      acepta medido), de modo que una peticion que hoy funciona sale byte a byte
      igual; el contrato de CI fija esa propiedad de no-regresion y fija ademas
      que el helper este LLAMADO desde `async_pre_call_hook`. El log
      `tool_arguments:` es superficie tambien: es la unica atribucion del origen
      del valor roto, porque el `failure_callback` de Langfuse NO traza estos
      400 (medido: 258 trazas a Alibaba, ninguna con error registrado). El sid
      de ese log sale de `session_router._session_id(data)`, NO de
      `metadata["session_id"]`: esa clave la estampa el propio hook mas tarde y
      el aviso salia `sid=None` (medido en el pod el 2026-09-28). 2026-09-28:
      se midio que los 400 de `alibaba-q38-flash` NO venian de un valor roto en
      el request (2424 `input` almacenados de las 6 sesiones afectadas, todos
      dict; 5252 tool_calls trazados, todos objeto; y el fallo es transitorio:
      la misma sesion sirve bien 7 s despues con el mismo historial). Lo que
      cuadra es que Model Studio invalide los arguments que GENERA su modelo,
      de ahi el `model_group_retry_policy` del manifest
      (`alibaba-q38-flash: BadRequestErrorRetries: 2`), que da tres
      generaciones nuevas por turno SOLO en ese grupo; lo fija
      tests/test_alibaba_400_retry_policy_contract.py. 2026-10-18 (DGX-1075):
      el mismo mapa lleva `qwen38-flash-next: TimeoutErrorRetries: 0` (un
      Timeout de 240 s del residente va directo a su fallback a Alibaba); el
      fichero de test fija los dos grupos y nada mas.
  - id: dgx.litellm.priority-field.v1
    kind: schema
    value: priority
    role: publisher
    files:
      - dev/session_router.py
      - k8s/manifest.yaml
    status: active
    note: >-
      ADITIVO (DGX-453, 2026-09-29): el hook `async_pre_call_hook` inyecta el
      campo `priority` (int) dentro de `extra_body` de las peticiones cuyo
      destino RESUELTO (`data["model"]` tras la red final) es el residente —
      deployment cuyo `litellm_params.api_base` contiene
      `.llm.svc.cluster.local`. vLLM lo interpreta como prioridad de cola
      (menor = mas urgente, default 0). NUNCA se inyecta hacia Alibaba ni
      OpenRouter: no conocen el campo y devolverian 400. La decision vive en
      el mapa top-level `priority_by_alias` del ConfigMap `litellm-config`
      (config.yaml) y NO en codigo: alias sin mapa, alias no mappeado o
      prioridad 0 => no se añade el campo; el fallo de lectura del config es
      fail-open (no inyecta, nunca lanza). Consumidor del valor: el vLLM del
      residente (queue_sort por prioridad). Productor: session_router.apply_priority
      llamado desde litellm_strip_params.py. Verificado contra el parser real
      del proxy litellm 1.100.0 que una clave top-level desconocida en
      config.yaml se ignora sin error, por eso el mapa es top-level. ADITIVO (INFRA-364, 2026-10-01): alias `brain: 20`, la prioridad mas
      baja de todas (detras de hermes-batch: 10); `brain` entra tambien en
      DEFAULT_BOT_KEYS y en NO_FALLBACK_KEY_ALIASES (no degrada a Alibaba). ADITIVO (DGX-589, 2026-10-05): el valor inyectado se sella tambien en la fila de /internal/active-requests (`priority`, dgx.litellm.active-requests.v1), para que el panel /inferencia ordene la cola estimada sin copiar `priority_by_alias`. ADITIVO (DGX-601, 2026-10-06): el valor del mapa puede ser ENTERO (como siempre) o MAPA por clase de sesion (`{default: int, "<x-claude-class>": int}`), y el config gana una clave top-level `priority_uncensored` que manda sobre el mapa cuando el destino resuelto es uncensored (`_is_uncensored`). El campo que sale hacia vLLM es el mismo `priority` (int) y el gate del residente no cambia; `claude-local` pasa a `{default: -5, company: 5}` y lo uncensored a -20. Forma rara en un valor => ese alias no inyecta (fail-open de siempre). ADITIVO (INFRA-940, 2026-10-18): alias `hindsight: 20` (Hindsight, que sustituye al brain), la misma prioridad que `brain`; el campo y el gate no cambian.
  - id: dgx.litellm.stream-options-guard.v1
    kind: schema
    value: stream_options
    role: provider
    files:
      - k8s/manifest.yaml
    status: active
    note: >-
      Regla de alambre (SC-1517, 2026-10-01): `stream_options` NUNCA sale hacia
      un backend que no va a recibir `stream: true` en el body final, por
      ninguno de los dos caminos: la clave top-level y la que vive dentro de
      `extra_body` (el SDK de OpenAI funde extra_body en el body, y el
      adaptador Anthropic->OpenAI de la v1.100 lo reenvia tal cual pase lo que
      pase con `stream`). Si no se cumple, vLLM responde 400 "Stream options
      can only be defined when stream=True" y DashScope "'stream' and
      'stream_options' must be set together", el 400 se repite en reintentos y
      saltos de fallback (las kwargs viajan intactas) y el turno muere con
      "No fallback model group found". Productores del valor: el hook
      `enable_continuous_usage` (uso continuo del panel) y, en origen del bug,
      `websearch_interception`, que flipa `stream` True->False dentro de
      litellm.anthropic_messages cuando la peticion trae una tool de busqueda
      web y deja los restos en extra_body. Consumidores que no deben ver nunca
      la combinacion invalida: el vLLM del residente y el compatible-mode de
      Alibaba. Tres guardas: el hook no escribe extra_body en peticiones con
      tool de busqueda; `_strip_stream_options_without_stream` corta al final
      del pre-call; `stream_guard_instance` (async_pre_request_hook,
      registrado en callbacks DESPUES de websearch_interception) quita los
      restos en cada intento, reintento y salto de fallback. Lo fija
      tests/test_stream_options_without_stream_contract.py.
  - id: dgx.alibaba.plan-gateway.v1
    kind: http-route
    value: plan-gateway
    role: provider
    files:
      - k8s/manifest.yaml
    status: active
    note: >-
      DGX-621 (plan DGX-619, 2026-10-06). Sitio UNICO por el que pasa la media
      (imagen, video, voz) del Token Plan de Alibaba: Service `plan-gateway`
      :4002 en ns `litellm`, ClusterIP y SIN IngressRoute (consumidores: Studio,
      omnivoice, y openmontage desde el nodo x86 por el ClusterIP — mismo patrón
      que el MinIO de `upload_render.py`). Deployment propio, etiqueta
      `app: plan-gateway` (nunca `app: litellm`), codigo inline en el ConfigMap
      `plan-gateway-config` (`plan_gateway.py`). URL para los consumidores (espejo
      en dgx-infra y k8s-ai, DGX-619 P2/P4):
      `http://plan-gateway.litellm.svc.cluster.local:4002`.

      ALLOWLIST EXACTA, todo lo demas 404: POST
      /api/v1/services/aigc/multimodal-generation/generation (imagen, ASR),
      POST /api/v1/services/aigc/video-generation/video-synthesis (video,
      asincrono), POST /api/v1/services/audio/tts/SpeechSynthesizer (TTS) y GET
      /api/v1/tasks/{id}. Host upstream fijo por env PLAN_UPSTREAM_BASE (default
      el del token-plan). No hay ruta de salud: las sondas son tcpSocket.

      AUTH: `Authorization: Bearer <token>`, UN token por consumidor
      (PLAN_GATEWAY_TOKEN_STUDIO, PLAN_GATEWAY_TOKEN_OMNIVOICE,
      PLAN_GATEWAY_TOKEN_OPENMONTAGE (SC-2498, x86 OpenMontage por ClusterIP);
      ExternalSecret `plan-gateway-tokens`, items 1Password `plan-gateway-studio`,
      `plan-gateway-omnivoice` y `plan-gateway-openmontage`), comparado con hmac.compare_digest; sin token o
      con uno malo, 401. El nombre del consumidor es el `caller` del ledger. El
      Authorization y el X-Plan-Account que entran se descartan y el gateway pone
      la key de la cuenta elegida; hop-by-hop fuera; X-DashScope-Async y
      X-DashScope-SSE pasan. Un consumidor nuevo = una variable
      PLAN_GATEWAY_TOKEN_<NOMBRE> mas (aditivo).

      CUENTA: la elige `session_router.draw_account` (la MISMA formula por pesos
      del cupo, `alibaba_account_weights`, que una sesion nueva de chat; el
      gateway no define formula propia, lo fija tests/test_plan_gateway_contract.py).
      Toda respuesta proxied lleva `X-Plan-Account: k1|k2`. Sin estado: el
      cliente guarda la cabecera del POST de video y la reenvia en
      `GET /api/v1/tasks/{id}`; con cabecera va SOLO a esa cuenta (valor
      desconocido, 400), sin ella prueba las dos en el orden del sorteo y devuelve
      la primera 2xx (si ninguna, la ultima respuesta).

      FAILOVER, un solo reintento a la otra cuenta cuando: (a) 429, (b) cuerpo
      JSON con `code` (o `error.code`) que empiece por un valor de CODIGOS_CUOTA
      (plan_gateway.py), (c) error de conexion ANTES de enviar. Un POST NUNCA se
      reintenta tras ReadTimeout (la tarea pudo crearse y cobrarse): 504. Si
      fallan las dos, se devuelve la ultima respuesta real del upstream tal cual
      (status, cuerpo, X-Plan-Account); sin respuesta de ninguna, 502
      `upstream_unreachable`. HIPOTESIS: CODIGOS_CUOTA no esta capturada de una
      respuesta real de cuota agotada (la medicion P0 de k2,
      nota-devops-k2-medicion, hizo cinco llamadas sin error); el reintento de 429
      si esta fundado. Se sustituye por el codigo real cuando el ledger registre
      un `quota_error`. Solo se bufferiza la respuesta application/json (y los 429
      y errores de tarea) para inspeccionarla; el resto va en streaming. Request
      siempre bufferizado, tope 32 MiB (413) y 8 llamadas simultaneas por replica.

      LEDGER: una linea JSON por INTENTO en stdout (empieza por `{`): ts, caller,
      method, path, model, attempt, account, status (null sin respuesta),
      quota_error, ms; `error` (nombre de la excepcion) solo cuando no hubo
      respuesta. Nunca keys ni tokens.

      NO prometido: mapa de tareas, reparto por modelo (k2 acepta los cuatro
      modelos, medido), ruta de salud, IngressRoute.

      DGX-1035 (2026-10-17): el runtime pasa a ghcr.io/berriai/litellm:v1.105.1
      (el mismo pin que el proxy); `plan_gateway.py` solo usa stdlib, httpx y
      session_router, e importa limpio en esa imagen (medido).
      Después, la misma historia lo pasa a la imagen de casa
      harbor.lan.e-dani.com/homelab/litellm (v1.105.1 + Codex del fork
      pocharlies-org/litellm, rama pocharlies-codex), que se descarga con
      imagePullSecrets harbor-pull; el job de integración del CI importa
      `plan_gateway.py` dentro de esa imagen antes del merge.
